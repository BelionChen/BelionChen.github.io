**正确率（✅）** | **26.3%** | +1.3pp | +8.1pp |\n| **可用率（✅+🟡）** | **57.9%** | -4.6pp | -23.9pp |\n\n### 三周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 趋势 |\n|------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 📈 缓慢改善 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 📉 持续下降 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 📈 恶化后持平 |\n\n### 本周核心发现\n\n1. **\"不确定性消除\"≠\"利好兑现\"：** 这是本周最重要的发现。美伊停火是持续3个月的最大不确定性被系统性解除，市场反应是风险偏好跳升而非利好出尽。预测框架需要区分这两种完全不同的市场反应模式。\n2. **正确率与可用率背离：** 正确率在缓慢改善（18.2%→25.0%→26.3%），但可用率持续恶化（81.8%→62.5%→57.9%）。方向性错误（走势形态、消费ETF、沃什假设）在增加，说明框架在\"避免大错\"上反而退步。\n3. **科技虹吸效应是最大盲区：** 连续3周，所有非科技方向的预测都因科技虹吸而偏离。消费ETF、红利ETF被科技全面压制。预测框架需要将\"科技虹吸强度\"作为独立变量。\n4. **\"大涨次日\"假设需要修正：** 默认\"大涨次日=回调\"，但实际\"大涨次日=高位窄幅震荡\"同样常见。两种模式应并列为等概率情景。\n5. **区间偏差在扩大而非收敛：** 三周区间偏差：35点→53点→94点。自适应校准机制尚未生效。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势形态方向完全错误 | 🔴 方向性 | 美伊停火\"不确定性消除\"的爆发力被系统性低估 | 🟡 可部分预见 |\n| 上证核心区间偏悲观94点 | 🔴 大幅偏差 | 同上 | 🟡 可改进 |\n| 沃什偏鸽假设失效 | 🔴 关键假设 | \"新人首秀需展示鹰派姿态\"的政治逻辑被忽略 | 🟡 可改进 |\n| 消费ETF方向完全错误 | 🔴 方向性 | 资金面结构性挤压效应（科技虹吸→消费失血）被忽略 | 🟡 可改进 |\n| 6/15日预测严重偏低 | 🔴 大幅偏差 | 四重利好共振的叠加效应被低估 | 🟡 可改进 |\n| 6/16日预测区间完全偏离 | 🔴 区间错误 | \"大涨次日=回调\"默认假设被打破 | 🟢 可预见 |\n| 置信度连续第3周偏高 | 🟡 系统性 | 缺乏\"不确定性校准\"机制 | 🟢 可改进 |\n\n### 2026年6月第3周（6/15-6/18）复盘摘要\n\n> 📅 生成时间：2026-06-22 08:00 CST\n\n#### 📈 本周预测亮点\n\n1. **科创50ETF方向判断精准：** 全周最强指数，连续第3周在科技主线上判断正确。\n2. **能源/油气ETF风险判断准确：** 美伊停火→油价暴跌-13.4%的逻辑链完整兑现。\n3. **美伊签署时间判断准确：** 预测\"本周内签署\"，6/18正式签署。\n4. **FOMC不加息判断准确：** 利率不变。\n\n#### 📉 本周预测不足\n\n1. **走势形态方向完全错误：** 预测\"前低后高\"→实际\"前高后低\"。美伊停火确认的爆发力被系统性低估。\n2. **上证核心区间偏悲观94点：** 连续第3周区间偏差，且偏差在扩大（35→53→94）。\n3. **沃什偏鸽假设完全失效：** 对\"新人首秀\"的政治约束缺乏分析。\n4. **消费ETF方向完全错误：** 科技虹吸效应覆盖了所有非科技方向。\n5. **置信度连续第3周偏高：** \"中高\"置信度与26.3%正确率严重不匹配。\n\n#### 🔑 关键教训\n\n1. **\"不确定性消除\"≠\"利好兑现\"：** 持续3个月的最大不确定性被系统性解除→市场反应是风险偏好跳升，而非利好出尽。\n2. **\"新人首秀\"的政治约束：** 沃什首场FOMC必须展示抗通胀决心，即使个人倾向偏鸽。\n3. **科技虹吸效应已成为预测框架最大盲区：** 所有非科技方向的预测都因此偏离。\n4. **区间预测偏差在扩大而非收敛：** 自适应校准机制需要立即建立。\n\n#### 🔧 模型优化建议\n\n1. **新增\"不确定性消除溢价\"假设：** 当持续>30天的不确定性被正式解除时，切换到\"风险偏好跳升\"模型。\n2. **新增\"科技虹吸强度指数\"：** 当科技成交占比>40%时，所有非科技方向预测自动降级。\n3. **新增\"多催化共振系数\"：** ≥3个独立催化叠加时，市场反应幅度放大30-50%。\n4. **置信度与历史准确率动态挂钩：** 正确率<30%时置信度上限为\"中\"。\n5. **区间预测增加\"自适应校准\"：** 基于前三周偏差方向和幅度，自动修正下周区间。\n6. **证伪信号升级为\"价格+结构\"双维度：** 增加结构性证伪信号（如科技成交占比>50%）。\n\n---\n\n### 第11周：2026年7月27日—7月31日（超级周复盘摘要）\n\n> 📅 生成时间：2026-08-03 08:30 CST\n\n#### 📈 本周预测亮点\n\n1. **证伪条件设计持续精准（3/3全部命中）：** 上证3750-3900证伪区间与实际3767-3858高度吻合，连续11周保持高可靠性。\n2. **银行/高股息防御方向判断准确：** 上证50全周抗跌，在超级周巨震中发挥防御价值。防御方向判断连续多周有效。\n3. **中证1000/券商风险警示准确：** 中小盘全周跑输，券商在超级IPO周未受益。\n4. **H1（中方温和回应）假设成立：** 商务部措辞温和，关税博弈短期稳定。\n\n#### 📉 本周预测不足\n\n1. **周一走势方向完全错误：** 预测\"缩量窄幅震荡\"→实际暴涨+1.02%（科创50+6.79%）。长鑫科技IPO首日465%暴涨效应被完全忽略。\n2. **科创50方向错误（机会→领跌-8.46%）：** 半导体从\"本周机会\"变为\"本周最大风险\"，全周四天收于预测区间下方。\n3. **科创50区间严重偏乐观（下沿偏差131.59点）：** 超级周波动率是常规周2-3倍，区间参数未调整。\n4. **H2（沃什偏鸽）和H3（3800支撑）两个关键假设失效：** 3票反对票+3800关口被击穿两次。\n5. **7/31偏差修正全部恶化（0%有效）：** P0-5规则建立时间晚于预测生成时间，所有修正朝偏空方向调整。\n\n#### 🔑 关键教训\n\n1. **\"事件日历优先级\" > \"单一叙事\"：** 预测框架将\"超级周\"等同于\"FOMC周\"，忽略了长鑫科技IPO同样是超级事件。未来需建立多事件日历，每天标注独立事件驱动情景。\n2. **\"偏差修正方向一致性\"警报：** 7/31的6条修正全朝偏空方向→应触发\"系统性偏差\"警报。P0-5规则如果提前建立，可避免此次0%有效。\n3. **\"超级周波动率参数\"需独立建模：** 科创50区间预测连续第3周偏乐观，根因是超级周波动率是常规周2-3倍。\n4. **\"整数关口在事件周无效\"虽已建模但未应用：** P2-5规则已建立但7/27周一预测中未强制应用。规则存在但执行缺失。\n5. **\"IPO首日效应\"是独立于FOMC的重要变量：** 长鑫科技1411亿成交虹吸+全市场4884家上涨的正面效应，完全覆盖了FOMC前避险。\n\n#### 🔧 模型优化建议\n\n1. **新增\"事件日历优先级\"检查：** 每周一预测前强制列出本周所有重大事件，按冲击力排序。\n2. **H2修改为\"FOMC反对票敏感度\"：** 新人首秀场景反对票概率从5%上调至25-40%。\n3. **IPO首日效应量化模型：** 募资>500亿+科技龙头→首日全市场普涨概率>70%。\n4. **超级周波动率参数：** 科创50区间宽度从±5%扩大至±10-12%。\n5. **偏差修正\"方向一致性\"检查：** 当≥4条修正朝同一方向时触发警报。\n6. **P0-5（PMI<50宽松预期）升级为P0级并前置应用。**\n\n---\n\n## 📊 长期模型迭代建议\n\n> 📅 首次更新：2026-06-08（第1周复盘后）\n> 📅 第二次更新：2026-06-15（第2周复盘后）\n> 📅 第三次更新：2026-06-22（第3周复盘后）\n> 📅 第四次更新：2026-07-01（月度复盘后）\n> 📅 第五次更新：2026-07-06（第5周复盘后）\n> ⚠️ 数据积累5周（75项预测），结论置信度逐步提升。\n\n### 基于首月数据（4周，59项预测）的迭代建议\n\n#### 🔴 最可靠维度（应加大权重）\n\n| 排名 | 维度 | 准确率 | 建议 |\n|:---:|------|:-----:|------|\n| 1 | **极端区间设计** | 4周全中 ✅ | 核心区间持续偏差时，极端区间可作为替代参考区间 |\n| 2 | **证伪条件设计** | 4周全有效 ✅ | 维持\"价格+结构\"双维度，新增\"证伪触发后情景\" |\n| 3 | **核心假设判断** | 月度50%正确 ✅ | 宏观假设（美伊、FOMC、中报）方向判断准确，应保持 |\n| 4 | **黄金ETF方向** | 4/5周正确 ✅ | 降息+避险双驱动逻辑稳定，是当前框架中最可靠的方向判断。第5周再次精准命中 |\n| 5 | **高溢价风险** | 3/3周可验证 ✅ | 持续关注，月末/暴跌日溢价回归风险高 |\n| 6 | **核心假设判断** | 第5周4/4全部成立 ✅ | 宏观假设（美伊、PMI、整数关口）底线思维框架有效。但需区分\"假设成立\"与\"预测精准\" |\n\n#### 🟡 中等可靠维度（需优化）\n\n| 排名 | 维度 | 问题 | 优化方向 |\n|:---:|------|------|---------|\n| 6 | **行业机会判断** | 方向对但时点/幅度偏差大 | 增加\"催化强度评分\"，区分\"主线\"和\"脉冲\" |\n| 7 | **月度三段式节奏** | 方向框架对但时间划分不精确 | 增加\"外部事件扰动系数\"，允许节奏偏移1-3天 |\n| 8 | **行业风险判断** | 1项方向错误，1项时效有限 | 建立\"风险窗口期\"概念，标注时间约束 |\n\n#### 🔴 最不可靠维度（需降权或改进）\n\n| 排名 | 维度 | 准确率 | 问题 | 建议 |\n|:---:|------|:-----:|------|------|\n| 9 | **核心区间预测** | 4周全偏差 ❌ | 方向不稳定，偏差35-94点 | ①降低置信度权重 ②引入自适应校准 ③极端区间作主要参考 |\n| 10 | **置信度标注** | 4周偏高 ❌ | 与实际正确率差10-20pp | ①与历史正确率动态挂钩 ②正确率<30%时上限\"低-中\" ③>50%方可标\"高\" |\n| 11 | **趋势转换识别** | 第4周重大失误 ❌ | 无法识别科技从强势到暴跌的转换 | 建立\"趋势转换预警\"机制（科技成交占比>40%且上涨>3天→自动触发） |\n\n#### 💡 假设调整\n\n| 假设 | 当前状态 | 调整建议 | 优先级 |\n|------|---------|---------|:-----:|\n| H1: 整数关口有支撑 | 失效2次（4000击穿） | 区分\"有序回调\"和\"跳空低开\"，后者支撑力降为0 | 🔴 高 |\n| H2: 周末情绪仅消化40% | 失效（实际发酵60-80%） | 建立\"周末情绪发酵系数\"0.5-0.8x | 🔴 高 |\n| H3: \"高位=风险\" | 失效（AI催化覆盖） | 建立\"催化强度评分\"，超阈值时切换为趋势延续模型 | 🔴 高 |\n| H4: 利好出尽立即兑现 | 失效（延迟3-5天） | 建立\"催化衰减曲线\"——利好出尽效应可持续3-5天 | 🟡 中 |\n| H5: 科技虹吸→防御弱 | 部分有效 | 科技虹吸双向性——科技强时防御弱但科技暴跌时防御也跟跌 | 🟡 中 |\n| H6: 月度区间=周区间合成 | 偏差累积 | 月度区间=周区间最大最小值+缓冲带（±50-80点） | 🟡 中 |\n\n#### 📊 置信度校准规则（基于5周数据）\n\n- ✅ 正确率>50% → 标\"高\"\n- 🟡 正确率30-50% → 标\"中高\"\n- ⚠️ 正确率20-30% → 标\"中\"\n- ❌ 正确率<20% → 标\"低\"\n- ⚠️ **第5周新增规则：** 当预测中包含≥3项\"假设/证伪类\"判断时，置信度自动下调5-10pp（假设类判断拉高正确率但不代表预测精准）\n- ⚠️ **第5周新增规则：** 区分\"表面正确率\"和\"实际判断正确率\"——复盘时单独统计扣除假设类后的方向判断正确率\n\n#### 🔧 框架结构性调整\n\n1. **增加\"催化强度评分\"模块** — ≥3个重大催化同时出现时，自动从\"均值回归\"切换为\"趋势延续\"模型\n2. **建立\"趋势转换预警\"机制** — 科技成交占比>40%且上涨天数>3天时触发预警\n3. **核心区间预测引入\"自适应校准\"** — 基于上月偏差方向和幅度自动修正本月区间\n4. **P2-4（周五+月末共振）升级至P0级** — 月末最后一周必须应用此规则\n5. **置信度与历史准确率动态挂钩** — 每次预测前检查近4周正确率，动态调整置信度上限\n6. **建立\"脉冲vs主线\"区分标准** — 行业预测中标注\"脉冲式机会\"和\"持续性主线\"\n7. **证伪信号增加\"二次确认\"机制** — 单一价格阈值触发后，等待24小时结构指标确认再执行切换\n8. **【第5周新增】1周预测新增\"时间节奏\"字段** — 将5天分为前2天+后3天，分别标注方向预期。解决\"超卖修复vs风险警示\"在同一时间窗口内矛盾的问题\n9. **【第5周新增】半导体子板块独立建模（P1-9）** — 不再将\"半导体/电子\"与\"科创50/科技\"混为一谈。半导体恐慌惯性可独立于科创50整体超跌反弹\n10. **【第5周新增】宏观数据超预期→事件风险约束自动下调（P2-6）** — PMI>50.3或非农<8万时，听证会/FOMC避险约束权重从默认30-40%降至15-20%\n11. **【第5周新增】行业预测增加数据闭环** — 每日早间简报增加行业ETF涨跌排名表，覆盖预测中提到的行业，确保复盘时可精确验证\n12. **【第5周新增】正确率统计分类细化** — 区分\"假设/证伪类\"与\"方向判断类\"的正确率，避免假设类判断拉高表面正确率\n\n> 首次有效迭代建议将在积累至少3个月数据后（约2026年9月1日）提供更可靠的校准参数。\n> 当前（1个月数据）已可提供方向性建议，但具体参数（发酵系数、虹吸阈值等）仍需更多数据校准。\n\n---\n\n### 第4周：2026年6月22日—6月26日\n\n> 📋 复盘日期：2026-06-30 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-06-22.md` → 一、1周预测（6/22 ~ 6/28）\n> ⚠️ 本周5个交易日（6/22-6/26）。6/29已进入新一周。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 核心走势（基准60%） | 高开1-2%后震荡消化，科技延续强势，上证冲高回落 | 6/22高开仅0.08-0.48%（远低于1-2%）；全周：周一V形(+0.18%)→周二科技杀跌(-0.37%)→周三震荡修复(-0.25%)→周四美光催化大涨(+0.36%)→周五三杀暴跌(-2.26%) | ❌ 方向错误 | 高开幅度严重高估；节前已部分price in假期利好；6月末资金面压制机构追高意愿；周五科技三杀终结了科技强势的延续性 |\n| 2 | 强势情景（25%） | 科技暴力高开3%+，上证站稳4150 | 未触发。全周上证最高约4175（6/23盘中），但未站稳4150 | ❌ 未触发 | 节前透支涨幅，外盘映射效果弱于预期 |\n| 3 | 弱势情景（15%） | 利好出尽高开低走 | 6/22当天V形非高开低走，但全周看6/26暴跌最终兑现弱势方向 | 🟡 部分正确 | 弱势方向最终正确但时点偏差——弱势延迟至周五而非周一 |\n| 4 | 上证核心区间 | 4050-4180 | 实际约4000-4175，下沿偏差50点，上沿偏差5点 | 🟡 部分正确 | 极端区间（4000-4220）完全覆盖；核心区间方向对但下沿偏差大 |\n| 5 | 机会：半导体/科创板ETF | 科技延续强势 | 创业板全周：+0.74%→-2.27%→+0.42%→+2.01%→-4.07%（全周累计约-2%） | ❌ 错误 | 科技前半周分化、周五暴跌，全周整体下跌；6月末资金考核压制+科技获利了结 |\n| 6 | 机会：AI算力/通信ETF | 科技主线延续 | 周中（6/22-6/25）有脉冲但6/26暴跌中领跌 | 🟡 部分正确 | 方向对但时机差；全周冲高回落最终收跌 |\n| 7 | 机会：消费电子ETF | 机会方向 | 全周表现平平，未成为主线 | 🟡 部分正确 | 方向合理但缺乏催化剂驱动 |\n| 8 | 机会：汽车ETF | 机会方向 | 全周表现一般 | 🟡 部分正确 | 方向合理但非本周主线 |\n| 9 | 风险：保险/银行ETF | 风险方向 | 6/23权重护盘（上证仅-0.37%），6/26权重跟跌但跌幅小于科技 | ✅ 部分防御有效 | 在科技杀跌日体现防御价值，但全周未出现保险/银行大跌 |\n| 10 | 风险：黄金ETF | 风险方向 | 6/26黄金承压，但从6/27起被重新列为机会行业 | 🟡 不确定 | 黄金判断在周中出现反转，全周表现中性 |\n| 11 | 风险：高溢价科技ETF | 溢价回归风险 | 6/26科技暴跌→溢价大幅回归 | ✅ 准确 | 溢价回归逻辑在周五暴跌中完全兑现 |\n| 12 ** | +17.9pp | +15.1pp |\n\n### 五周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 第4周 | 第5周 | 趋势 |\n|------|-------|-------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 📈 创历史新高 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 📈 回到第1周水平 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 📉 创历史新低 |\n\n### ⚠️ 正确率\"虚高\"警示\n\n本周正确率43.8%看似大幅改善，但7项✅中4项是\"假设成立+证伪未触发\"类判断——这类判断正确是因为市场未走到极端，而非预测精准。扣除假设/证伪类后，实际方向判断正确率仅33.3%（3/9）。\n\n### 本周核心发现\n\n1. **超卖修复与风险警示不能在同一个时间窗口共存：** 6/29预测同时判断\"科技超卖修复\"和\"电子为风险行业\"，导致前半周方向完全错误。需在1周预测中标注时间分段（前2天修复→后3天转风险）。\n2. **PMI超预期可覆盖事件风险约束：** PMI 50.3三重扩张后，市场完全忽略\"听证会前避险\"连涨两天。需建立\"宏观数据超预期→事件风险约束自动下调\"规则（新增P2-6）。\n3. **半导体子板块需要独立建模：** 7/3科创50反弹+1.05%但半导体ETF仅+0.15%，恐慌惯性独立于整体超跌反弹。需新增P1-9偏差模式。\n4. **黄金ETF连续多周判断准确：** 黄金是当前框架中最可靠的方向判断，降息+避险双驱动逻辑稳定。\n5. **行业预测缺乏系统性验证数据：** 7个行业判断中5个无法精确验证。需在每日简报中增加行业ETF排名表。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 半导体风险前半周方向错误 | 🔴 方向性 | \"超卖修复\"与\"风险行业\"内在矛盾 | 🟢 可预见（框架逻辑冲突） |\n| 走势形态严重低估波动 | 🔴 幅度偏差 | PMI超预期+费城恐慌两个极端均被低估 | 🟡 费城不可预见，PMI可改进 |\n| 置信度65%偏高 | 🟡 系统性 | 含假设类判断时未下调置信度 | 🟢 可改进 |\n| 上证区间上沿偏保守39点 | 🟡 幅度偏差 | PMI超预期冲击力缺乏量化 | 🟢 可改进（P2-6规则） |\n\n\n\n---\n\n### 第2周：2026年6月8日—6月12日\n\n> 📋 复盘日期：2026-06-15 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-06-08.md` → 一、1周预测（6/8 ~ 6/14）\n> ⚠️ 本周是预测体系第2周运行，数据积累仍有限。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 上证核心区间 | 3980-4080 | 实际3927-4060，核心区间下沿偏差53点，上沿偏差20点 | ❌ 错误 | 非农冲击周末48小时发酵→周一跳空击穿4000至3927；低估周末恐慌积累的放大效应 |\n| 2 | 上证极端区间 | 3930-4120 | 实际最低3927.85，差2.15点 | 🟡 部分正确 | 极端区间下沿差2点，基本命中，证明极端区间设计合理 |\n| 3 | 走势判断 | 非农冲击低开→4000争夺→SpaceX定价前震荡→上市后反弹 | 周一暴跌→周二强反弹→周三回调→周四地缘冲击→周五反弹 | 🟡 部分正确 | 框架方向正确但过程更剧烈；4000点争夺判断完全错误（直接击穿无争夺） |\n| 4 | 量能趋势 | 缩量至2.3-2.6万亿 | 实际持续放量：6/8约1万亿→6/11 3.2万亿→6/12约3.2万亿 | ❌ 错误 | 方向完全相反。恐慌抛售+抄底博弈+地缘冲击三重驱动持续放量 |\n| 5 | 风格方向 | 红利+电力+半导体强，出口链+概念科技弱 | 红利/电力/能源防御有效；半导体波动极大（6/9+3.93%→6/10-2.70%）；出口链持续走弱 | 🟡 部分正确 | 方向框架正确但半导体双向弹性被低估，未预判到极端波动 |\n| 6 | 机会：红利低波ETF 年6月第2周（6/8-6/12）复盘摘要\n\n> 📅 生成时间：2026-06-15 08:00 CST\n\n#### 📈 本周预测亮点\n\n1. **防御方向选择精准：** 红利低波ETF、电力/煤炭ETF全周表现突出，防御配置在震荡市中发挥价值。出口链ETF风险判断持续有效。\n2. **框架方向正确：** \"非农冲击低开→SpaceX定价前震荡→上市后反弹\"的核心叙事框架基本成立（除4000点争夺细节错误），说明宏观叙事驱动框架有效。\n3. **证伪信号触发后的应对有效：** 3950放量跌破的证伪条件被触发后，6/9早间简报及时将区间下修至3930-4050，6/10进一步下修至3920-4050，滚动修正机制运行正常。\n\n#### 📉 本周预测不足\n\n1. **上证核心区间偏乐观53点：** 预测3980-4080，实际最低3927。根因：非农超预期的\"二次传导\"（周末48小时发酵+情绪放大）被系统性低估。这是连续两周出现区间偏乐观问题（第1周偏35点，第2周偏53点）。\n2. **量能方向完全错误：** \"缩量\"→实际持续放量。根因：恐慌抛售+抄底博弈+地缘冲击三重放量驱动，正常\"事件冲击→情绪稳定→缩量\"模型被打破。\n3. **SpaceX抽血效应时点误判：** 预测6/12上市日才是关键，实际6/10（机构订单截止日）已提前反映。IPO事件链分析需覆盖完整链条。\n4. **4000点支撑判断完全错误：** 直接跳空击穿，毫无抵抗。跳空行情中整数关口几乎无支撑力，仅在有序回调中有效。\n5. **黄金ETF超跌反弹逻辑失败：** 非农→美元走强→黄金承压的传导链在早间模型中缺失。\n\n#### 🔑 关键教训\n\n1. **\"明牌利空≠利空\"效应在第2周得到验证：** 6/12的四重冲击（SpaceX+美伊+指数调样+世界杯）全部是已知事件，市场在低开后选择提前定价后的反弹。\"已知利空出尽\"的交易逻辑在弱势市中同样有效。\n2. **美伊冲突从\"对峙\"到\"全面冲突\"的升级速度远超预期：** 6/10-6/11两天内从停火破裂→美军空袭伊朗本土→霍尔木兹海峡关闭。地缘风险预测需要在框架中设计\"情景升级路径\"而非固定假设。\n3. **IPO事件链分析需要完整覆盖：** 定价日→机构截止日→上市日→解禁日，每个节点都可能产生实质性影响。仅关注上市日过于片面。\n4. **整数关口有效性取决于到达方式：** 有序回调中4000是有效支撑，跳空低开中4000瞬间击穿。需要区分\"到达方式\"对支撑有效性的影响。\n\n#### 🔧 模型优化建议\n\n1. **建立\"周末情绪发酵系数\"：** 事件驱动的缺口幅度 = 当日已有反应的幅度 × (1 + 周末发酵系数)。首日发酵系数设为0.5-0.8x（周一跳空常态化校正）。\n2. **增加\"美元-黄金-A股权重\"传导链监控：** 非农→美元指数→黄金价格→A股权重资源股（中石油/紫金矿业等）→指数影响。该链在6/8-6/9完整演绎了一次。\n3. **IPO事件链分析框架标准化：** 将IPO事件分解为定价日×机构截止日×上市日×解禁日的完整时间轴，标注每个节点的资金面影响方向。\n4. **证伪信号升级为\"价格+结构\"双维度：** 单一价格阈值（如放量跌破3950）会因抄底资金介入而失效。需叠加结构指标（如ETF资金流向、北向资金、涨跌比趋势）作为辅助判断。\n\n---\n\n### 第6周：2026年7月6日—7月10日（听证会超级周）\n\n> 📋 复盘日期：2026-07-13 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-07-06.md` → 一、1周内预测（7/6 ~ 7/12）\n> ⚠️ 本周为听证会超级周（7/7-7/9三日听证会+7/10结果公布），5个交易日。每日均有滚动预测更新+午间/收盘两次验证。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 上证核心区间 | 4000-4150 | 实际3939-4068。下沿被击穿61点，上沿未被触及（差82点） | ❌ 错误 | 听证会恐慌深度被低估——4000支撑在事件前完全失效（7/7-7/8连续两日收于4000下方）。\"4000整数关口有支撑\"在事件驱动周不适用 |\n| 2 | 创业板区间 | 3900-4200 | 3840-4018。下沿被短暂击穿60点 | 🟡 部分正确 | AI/光通信拖累创业板最深至3840。整体区间框架基本有效 | 9% | 📈 持续回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 📉 创历史新低 |\n\n### 本周核心发现\n\n1. **听证会超级周的市场节奏已初步建模：** 完整经历了\"前夜定价→Day 1恐慌→Day 2假反转→Day 3情绪翻转+抢跑→结果公布日利好出尽\"的五段式路径。这是未来类似事件周的可复用模板。\n2. **利好出尽幅度被系统性低估：** 7/10科创50-5.53%远超预测-2%~-3%。根因：市场在7/9+8.41%中深度price-in了\"超预期偏鸽\"，实际\"鸽但不够鸽\"=预期差为负→利好出尽放大至前期涨幅的60-90%。\n3. **\"上午V形≠恐慌结束\"——本周最重要的方法论发现：** 7/8上午V形反弹至4011→下午完全回吐至3971。事件进行中的V形可能是假反转，需成交量萎缩确认。\n4. **产业趋势（P0-2）连续第14次压倒宏观恐慌：** 科创50全周+3.5%，在7/7恐慌日逆势微涨。P0-2应从\"修正措施\"升级为\"第一性原则\"。\n5. **行业预测验证数据缺口持续存在：** 5/18项预测因缺乏全周行业排名数据无法精确验证。\n6. **偏差经验修正有效率73.7%：** 全周10次验证（每日午间+收盘），76条修正中56条改善（73.7%）、16条无效、4条恶化。7/8和7/10收盘出现恶化均与\"下午逆转\"场景相关。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 上证核心区间❌ | 🔴 方向性 | 听证会恐慌深度被低估——4000支撑在事件周完全失效 | 🟡 可部分预见（P2-5已预警） |\n| 科创50上沿严重低估 | 🔴 幅度偏差 | 7/9 CPI+恐慌消退+FOMO三重叠加爆发力缺乏量化 | 🟡 可部分预见（P2-9待建模） |\n| 7/10利好出尽幅度低估 | 🔴 幅度偏差 | 结果预期差因子未建模+多因子叠加系数偏低 | 🟢 可预见（已新增P2-10/P2-11） |\n| 置信度60%偏高 | 🟡 系统性 | 连续第6周偏高，事件周未自动下调 | 🟢 可改进 |\n| 7/7场景概率误判 | 🔴 方向性 | \"事件前恐慌性避险\"场景未建模 | 🟡 可改进 |\n\n### 模型优化建议（本周新增）\n\n1. **事件周 vs 非事件周分离框架：** 1周预测需明确标注\"事件周\"，使用五段式模板（前夜定价→Day1恐慌→Day2假反转/真筑底→Day3情绪翻转→结果公布日利好出尽）替代震荡/趋势二元框架。\n2. **利好出尽幅度公式升级：** 从\"前期涨幅×0.3-0.5\"升级为\"前期涨幅×市场price-in深度系数\"（0.3-0.9）。当市场已price-in\"超预期\"结果时，系数升至0.6-0.9。\n3. **新增\"结果预期差\"因子（P2-10）：** 当事件结果与市场已price-in的预期存在差距时，冲击幅度=预期差×1.5-2.0×前期涨跌幅。\n4. **新增\"下午二次恐慌\"子规则（P2-7子规则）：** 事件进行中的V形反弹需成交量萎缩确认方可视为恐慌结束；若成交量持平或放量→下午可能二次恐慌。\n5. **整数关口有效性增加\"事件周豁免\"：** 事件驱动周（听证会/FOMC/重大数据）整数关口支撑力归零，仅参考技术位。\n6. **宏观数据对冲系数：** PMI>50或CPI<0.2%→事件避险权重从30%降至10%。\n\n---\n\n### 第7周：2026年7月13日—7月17日（九连跌恐慌周）\n\n> 📋 复盘日期：2026-07-20 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-07-13.md` → 一、1周内预测（7/13 ~ 7/18）\n> ⚠️ 本周5个交易日，九连跌恐慌周。每日均有滚动预测更新+午间/收盘两次验证。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 走势形态 | 周一科创50修复+1%~+2%→冲高横盘→周二尾盘避险→周三GDP方向选择→周四-周五WAIC催化科技重拾升势 | 周一全面暴跌（科创50-3.42%）→周二上午暴跌下午V形→周三周四周五连续下跌→九连跌。WAIC催化完全失效 | ❌ 错误 | 周末消化后市场选择确认悲观而非情绪改善；GDP不及预期 险）全部失效。需要建立\"连续暴跌专用框架\"，而非在正常框架上叠加修正。\n3. **区间预测方法论在波动中持续有效：** 尽管7/13周一区间预测全部失败，但7/14-7/17四天滚动区间预测（经过偏差修正后）命中率高达75%。说明区间预测方法论本身可靠，问题在于周一预测的\"初始参数\"设置。\n4. **\"缩量\"在连续暴跌中可能不是\"出清尾声\"而是\"暴风雨前的平静\"：** 7/17上午缩量30%后被误判为恐慌出清接近尾声，实际下午跌停从26暴增至212。\n5. **P2-2多因子冲击模型连续第5-9次偏保守：** 线性叠加模型在极端场景中完全不适用。多因子叠加不是简单的加法，而是乘法甚至指数级放大。\n6. **每日滚动预测显著优于周一固定预测：** 7/14-7/17四天滚动预测中区间命中率75%，显著优于7/13周一预测的0%。这是本周第二重要的方法论发现。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势形态方向完全错误 | 🔴 方向性 | 周末消化方向判断逻辑错误——\"无新增负面≠利好\" | 🟢 可预见（P2-12已建立但未严格执行） |\n| 4个核心区间全部失败 | 🔴 方向性 | 九连跌累计跌幅远超任何预测框架覆盖范围 | 🟡 可部分预见（需建立连续暴跌专用框架） |\n| 半导体/AI方向完全错误 | 🔴 方向性 | 产业趋势权重在连续暴跌中归零 | 🟡 可部分预见（P0-2已预警但未充分应用） |\n| 中小盘方向完全错误 | 🔴 方向性 | 恐慌周中中小盘反而最脆弱而非接力 | 🟡 可部分预见 |\n| 置信度60%严重偏高 | 🟡 系统性 | 连续第7周偏高，未应用场景风险系数 | 🟢 可改进 |\n| P2-2多因子冲击连续偏保守 | 🟡 系统性 | 线性叠加模型在极端场景中失效 | 🟢 可改进（需升级为非线性模型） |\n\n### 本周新增偏差模式\n\n| 编号 | 模式名称 | 核心内容 |\n|:----:|------|------|\n| P2-12 | 周末消化方向确认 | 周末无新增负面≠利好，市场可能选择确认悲观而非情绪改善 |\n| P2-13 | 全天避险升级 | 重大事件前日避险从\"尾盘\"升级为\"全天\"，需区分事件叠加度 |\n| P2-14 | GDP科技放大效应 | GDP数据对科技板块呈3-5倍放大效应，科创50跌幅是上证的14.7倍 |\n| P2-15 | GDP冲击锯齿衰减 | GDP冲击第三日锯齿衰减，但余震不会立即消失 |\n| P0-4 | 连续暴跌临界加速 | 七连跌→八连跌→九连跌，恐慌呈非线性加速而非边际递减 |\n| P2-16 | 跌停连锁反应 | 跌停从26→212暴增7倍，融资盘/杠杆资金强平→跌停连锁 |\n\n### 模型优化建议（本周新增）\n\n1. **建立「连续暴跌专用框架」：** 当连跌天数≥5天+累计跌幅>10%时，自动切换至专用框架，包含：①反弹概率归零（不预测反弹）②支撑位无效（不参考整数关口）③催化权重归零（产业催化和事件催化均失效）④恐慌非线性加速模型。\n2. **周一预测增加「周末消化方向确认」步骤：** 在每个周一预测前，强制回答：①上周五收盘后市场情绪方向？②周末48小时消化后情绪方向？③如果方向相反，使用悲观方向作为基准。\n3. **P2-2多因子模型从「线性叠加」升级为「非线性加速」：** 当因子数量≥4时，冲击系数从+30%升级为+50-80%。当连跌天数≥7天时，额外叠加+30%临界加速系数。\n4. **区分「缩量出清」和「缩量暴风雨前平静」：** 增加判断条件：当连跌天数≥7天+跌停家数≥30+炸板率>30%时，缩量≠出清尾声，而是流动性枯竭的预警信号。\n5. **置信度引入「场景风险系数」：** 当预测场景包含\"九连跌\"类型的极端场景时，置信度自动下调15-20pp。事件周下调10-15pp，连续暴跌周下调20-25pp。\n6. **1周预测增加「极端情景」作为独立预测项：** 不将极端情景作为低概率追加，而是将其作为独立预测项，给出概率、区间和触发条件。\n\n### 累计统计（更新至第7周）\n\n| 指标 | 数值 | 变化 |\n|------|------|------|\n| 总验证批次 | 35 | +10 |\n| ✅ 修正改善 | 179 | +52 |\n| 🟡 修正无效 | 61 | +18 |\n| ❌ 修正恶化 | 29 | +12 |\n| 🆕 新增模式 | 20 | +6 |\n| **修正有效率* let selectedWeeklyMonth = null;

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ── Helper: get all daily dates ──
function getDates() {
  const dates = new Set();
  Object.keys(BRIEFING_DATA).forEach(d => dates.add(d));
  Object.keys(REVIEW_DATA).forEach(d => dates.add(d));
  return [...dates].sort();
}

// ── Helper: month string ──
function monthStr(y, m) { return y + '-' + String(m+1).padStart(2,'0'); }

// ── Calendar ──
function renderCalendar() {
  $('#monthTitle').textContent = `${currentYear}年${currentMonth+1}月`;
  const grid = $('#daysGrid'); grid.innerHTML = '';
  const dates = getDates(); const datesSet = new Set(dates);
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for (let i = 0; i < firstDay; i++) { const el = document.createElement('div'); el.className='day empty'; grid.appendChild(el); }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div'); el.className = 'day'; el.textContent = d;
    if (dateStr === todayStr) el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');
    if (datesSet.has(dateStr)) el.classList.add('has-data');
    el.addEventListener('click', () => { selectDate(dateStr, dates); switchTab('daily'); });
    grid.appendChild(el);
  }
  // Update weekly list when calendar month changes
  updateWeeklyList();
}

// ── Select daily date ──
function selectDate(dateStr, dates) {
  selectedDate = dateStr;
  renderCalendar();
  $('#dateSummary').style.display = 'block';
  $('#selectedDateText').textContent = dateStr;
  const d = new Date(dateStr + 'T00:00:00+08:00');
  $('#selectedWeekday').textContent = WEEKDAYS[d.getDay()];
  renderDailyContent(dateStr);
}

function renderDailyContent(dateStr) {
  const area = $('#contentArea');
  const briefing = BRIEFING_DATA[dateStr] || null;
  const review = REVIEW_DATA[dateStr] || null;
  if (!briefing && !review) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${dateStr} 暂无简报与复盘数据</p></div>`;
    return;
  }
  let html = '<div class="cards">';
  if (briefing) {
    html += `<div class="card open" data-card="briefing">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">🌅</span><span>早间简报 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(briefing)}</div></div>
    </div>`;
  }
  if (review) {
    html += `<div class="card" data-card="review">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">📊</span><span>午间复盘 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(review)}</div></div>
    </div>`;
  }
  html += '</div>';
  area.innerHTML = html;
}

// ── Weekly List (left side) ──
function updateWeeklyList() {
  const m = monthStr(currentYear, currentMonth);
  const weeks = WEEKLY_DATA[m] || [];
  const list = $('#weeklyList'); list.innerHTML = '';
  const count = $('#weeklyCount');
  count.textContent = weeks.length > 0 ? weeks.length + '篇' : '';

  if (weeks.length === 0) {
    const el = document.createElement('li');
    el.className = 'weekly-item';
    el.style.cursor = 'default'; el.style.color = 'var(--text-dim)';
    el.innerHTML = '<span>暂无周复盘</span>';
    list.appendChild(el);
    return;
  }

  weeks.forEach((w, idx) => {
    // Extract week number from content
    const titleMatch = w.content.match(/# 📊 .*?第([一二三四五六七八九十\d]+)周/);
    const title = titleMatch ? '第' + titleMatch[1] + '周' : '周复盘 ' + (idx+1);
    // Extract date range
    const rangeMatch = w.content.match(/(\d{1,2}\/\d{1,2})\s*[~-]\s*(\d{1,2}\/\d{1,2})/);
    const label = rangeMatch ? (rangeMatch[1] + '-' + rangeMatch[2]) : '';
    const li = document.createElement('li');
    li.className = 'weekly-item';
    li.innerHTML = `<span class="dot"></span><span>${title}</span>${label ? '<span class="label">'+label+'</span>' : ''}`;
    li.addEventListener('click', () => {
      $$('.weekly-item').forEach(e => e.classList.remove('active'));
      li.classList.add('active');
      showWeeklyContent(w.content, title);
    });
    list.appendChild(li);
  });
}

function toggleWeeklyPanel() {
  $('#weeklyPanel').classList.toggle('open');
}

// ── Show Weekly Content (switches to daily tab) ──
function showWeeklyContent(content, title) {
  switchTab('daily');
  const area = $('#contentArea');
  const html = `<div class="cards">
    <div class="card open">
      <div class="card-header">
        <div class="card-title"><span class="card-icon">📋</span><span>${title}</span></div>
      </div>
      <div class="card-body" style="max-height:none">
        <div class="card-content">${marked.parse(content)}</div>
      </div>
    </div>
  </div>`;
  area.innerHTML = html;
  selectedDate = null;
  renderCalendar();
  $('#dateSummary').style.display = 'none';
}

// ── Monthly Content ──
function renderMonthlyContent() {
  const area = $('#contentArea');
  const m = monthStr(currentYear, currentMonth);

  // Try monthly data first, then fall back to tracking data
  let content = MONTHLY_DATA[m] || null;
  if (!content) {
    // Extract the month's section from tracking data
    const monthLabel = currentYear + '年' + (currentMonth+1) + '月';
    const idx = TRACKING_DATA.indexOf('### ' + monthLabel);
    if (idx !== -1) {
      // Find next section or end
      const nextIdx = TRACKING_DATA.indexOf('### ', idx + 3);
      content = TRACKING_DATA.substring(idx, nextIdx !== -1 ? nextIdx : undefined);
    }
  }
  if (!content) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${m} 暂无月复盘数据</p></div>`;
    return;
  }
  area.innerHTML = `<div class="monthly-content">${marked.parse(content)}</div>`;
}

// ── Tab Switching ──
function switchTab(tab) {
  currentTab = tab;
  $$('.content-tab').forEach(t => t.classList.toggle('active', t.id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1)));
  if (tab === 'daily') {
    if (selectedDate) renderDailyContent(selectedDate);
    else {
      $('#contentArea').innerHTML = `<div class="placeholder"><div class="icon">📅</div><p>在日历中选择一个日期<br>查看当天的早间简报与午间复盘</p></div>`;
    }
  } else if (tab === 'monthly') {
    renderMonthlyContent();
  }
}

// ── Navigation ──
$('#prevMonth').addEventListener('click', () => {
  currentMonth--; if (currentMonth < 0) { currentMonth=11; currentYear--; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});
$('#nextMonth').addEventListener('click', () => {
  currentMonth++; if (currentMonth > 11) { currentMonth=0; currentYear++; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (currentTab !== 'daily' || !selectedDate) return;
  const dates = getDates(); const idx = dates.indexOf(selectedDate);
  if (e.key === 'ArrowLeft' && idx > 0) { selectDate(dates[idx-1], dates); }
  else if (e.key === 'ArrowRight' && idx < dates.length-1) { selectDate(dates[idx+1], dates); }
});

// ── Init ──
const now = new Date();
currentYear = now.getFullYear();
currentMonth = now.getMonth();
const dates = getDates();
const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
if (dates.includes(todayStr)) selectedDate = todayStr;
renderCalendar();
if (selectedDate) selectDate(selectedDate, dates);
</script>
</body>
</html>
