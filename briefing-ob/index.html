后分化 | 高开 3676.77（+1.4%附近）后单边下杀 | 🟡 高开兑现、分化误判 |\n| 上证 | 3680-3720 争夺 | 3647.12（跌破区间下沿） | ❌ 方向偏空 |\n| 成长（科创50） | 区间 1240-1360 | 1228.98（**跌破下沿**） | ❌ 幅度严重低估 |\n| 风格 | 防御回吐、成长续涨 | 防御回补、成长崩塌（银行+27 vs 半导体-113） | ❌ 风格反向 |\n| 主力资金 | 需连续第 2 日转正 | **转负 -656.61 亿** | ❌ 硬开关证伪 |\n| 三情景 | 情景一 50% 优先 | **情景三「二次回踩」兑现** | 🔴 小概率情景兑现 |\n\n### 偏差根因\n\n1. **谷歌盘后 -10%「AI 投资回报不足」证伪向 A 股 AI 硬件链二次发酵**——这是上午的核心驱动。半导体 -113.71、通信设备 -89.97、元件 -61.81 三大 AI 算力方向合计净流出 -265.49 亿，将 10/28 的「半导体 +88.56 亿领涨」完全反向。\n2. **FHRG 策略「鹰派尾部重定价」精确兑现**——早间判定「S1 鹰派票型 + S3 长端跳升 → 🔴 鹰派尾部重定价，成长腿承压、红利/现金回报受益」。上午银行 +27.14/保险 +8.77/军工 +11.85 净流入 vs 半导体/通信/元件净流出，完全兑现「贴现率分化」框架。\n3. **早间已预警但被列为小概率（25%）的情景三「二次回踩」成为现实**——偏空证伪条件 4 项中 3 项触发：主力转负 ✅、科创50 失守 1250 ✅、谷歌证伪发酵 ✅；仅「上证失守 3620」尚未完全触发（3647.12 逼近但未破）。\n\n**核心结论**：早间的「方向分层」（中期看红利/现金回报、短期成长反抽需右侧确认）框架本身正确，但**对「谷歌证伪发酵」的传导速度与烈度估计不足**——将其列为「风险行业」而非「偏空情景的主驱动」，导致基准情景（50% 修复后分化）在开盘 30 分钟内即被证伪。\n\n---\n\n## 三、外资投行观点（mx-search 检索）\n\n| 机构 | 最新观点 | 关键信号 |\n|------|----------|----------|\n| 高盛 | 维持 A 股/港股「高配」建议，预计 2026 年上市公司企业盈利在 AI 落地、企业出海驱动下实现约 14% 增长，靠盈利而非估值推动 | 🟢 中期看多 A 股盈利兑现，但「AI 成长+互联网+股东回报」杠铃框架不变 |\n| 摩根士丹利 | 5/13 上调恒指目标 28400、MSCI 中国 91、沪深300 5400，中国企业盈利一季度改善早期迹象 | 🟡 目标上调但非最新，对应约 11% 上升空间 |\n| 桥水 | 中国管理规模 600 亿领跑外资私募，2026 Q1 加仓 A 股约 180 亿，达利欧长期看多中国 | 🟢 真金白银做多 A 股，与「喊多」不同 |\n| 贝莱德 | 2025/10-2026/9 全球净流入 8700 亿美元，布局新能源（宁德/比亚迪/隆基）、金融（中国银行/招商）、能源核电（中海油/广核）；9 月增持中国中车、减持中国人寿 H/中国建材 | 🟡 「高估值新能源退、低估制造/红利进」调仓方向 |\n\n**外资解读**：外资投行中期基调仍是「高配 A 股 + 盈利兑现」，但短期真金白银的调仓方向（贝莱德「高估值新能源退、低估制造/红利进」）与上午「半导体/通信暴跌、银行/保险回补」的方向完全一致——**外资「喊多」并未转化为对高位成长「做多」，利率分化环境下现金回报/红利/低估制造才是外资实际增持方向**。高盛「盈利驱动而非估值」的判断，意味着当前 AI 链「证伪」阶段的估值收缩是其框架内可预期过程。\n\n---\n\n## 四、下午走势推测（三情景 + 概率）\n\n> 基准：上午已放量下跌（估全天 1.7-1.8 万亿），主力 -656.61 亿，上涨占比 14.51%，跌停 50 家 > 涨停 43 家，但防御资金（银行/保险/军工）逆势回补。\n\n### 📉 情景一：偏空延续（40%）\n\n- **核心逻辑**：主力 -656.61 亿流出惯性 + 谷歌证伪发酵未止 + 融资盘 10/28 刚 +20.31 亿转正后今日恐再度去杠杆（10/29 大跌触发维保压力），AI 链无承接盘，上证失守 3620、下探 3580-3600，科创50 下探 1200-1220。\n- **关键点位**：上证 3620（早间证伪关口）→ 3600 → 3580；科创50 1220 → 1200。\n- **证伪信号**：尾盘 30 分钟缩量企稳、上证收回 3640 上方、银行板块净流入继续扩大。\n\n### 📊 情景二：震荡企稳（40%）\n\n- **核心逻辑**：上午跌幅已大（科创50 -4.21%、创业板 -3.63%），P0-3「超跌反抽」触发概率上升，防御资金（银行 +27.14/保险 +8.77）承接抛压，午后缩量震荡，上证 3600-3660 反复，成长低位震荡不再深跌。\n- **关键点位**：上证 3600-3660 箱体；科创50 1220-1250。\n- **证伪信号**：上证跌破 3600 且无承接、科创50 失守 1220。\n\n### 📈 情景三：尾盘修复（20%）\n\n- **核心逻辑**：极端恐慌（上涨占比 14.51% 接近 10/27 的 10.96%）后的超跌反抽，若银行/红利继续放量承接 + 恒生维持红盘（+0.12%）稳住情绪，尾盘空头回补，上证收回 3650-3680，科创50 收窄跌幅。\n- **关键点位**：上证 3650 → 3680；科创50 1250 收复。\n- **证伪信号**：主力持续无回补迹象、恒生转绿、跌停家数继续攀升。\n\n---\n\n## 五、情绪评分（上午 11:40，120 分制·7 维度）\n\n```\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📊 上午情绪总分：**48/120** → 🟧 偏冷（较 10/28 收盘 61 分 -13 分，V 形修复后单日回踩，成长崩塌 + 主力 -656 亿大幅流出 + 上涨占比 14.51%）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n涨跌结构   6.2/25  █████░░░░░░░░░░░░░░░\n量能状态   7.5/25  ██████░░░░░░░░░░░░░░\n涨停效应   7.0/20  ███████░░░░░░░░░░░░░\n恐慌指标   9.0/20  █████████░░░░░░░░░░░\n外部参考   1.8/5   ███████░░░░░░░░░░░░░\n杠杆情绪  10.4/15  ██████████████░░░░░░\n宏观环境   5.6/10  ███████████░░░░░░░░░\n```\n\n### 逐维度详解\n\n**维度1：涨跌结构 — 6.2/25分**\n- 1.1 上涨占比 809/5577=14.51%（<20% 极度恐慌）→ 1.0/10分\n- 1.2 指数强弱 沪深300 4034.81 近 5 年分位约 50% → 0.50×8=4.0/8分\n- 1.3a 宽度方向(20日) 164/1164=14.09%（<0.30）→ 0/4分\n- 1.3b 宽度强度(20日) (164+1000)/5400=21.56% → 2×(0.2156-0.10)/0.20=1.16/2分\n- 1.4 宽度温度(120日) 48/500=9.60%（<0.30）→ 0/1分\n- **解读**：上涨占比从 10/28 的 77.03% 单日暴跌 62.5pp 至 14.51%，是「V 形修复 → 二次回踩」的宽度确认。20 日新低 1000 家、120 日新低 452 家仍远高于新高，广度中枢未反转。\n\n**维度2：量能状态 — 7.5/25分**\n- 2.1 成交额/流通市值 全天估 1.75 万亿/约 90 万亿 ≈ 1.94% → 4.5/15分\n- 2.2 主力净流入占比 -656.61/约 9867（上午）≈ -6.65%（大幅净流出）→ 0/5分\n- 2.3 量能环比 全天估 1.75 万亿 vs 10/28 16285 亿 ≈ +7.5% → 3.0/5分\n- **解读**：放量下跌 + 主力大幅净流出（-656.61 亿，较 10/28 +434.06 亿单日逆转 1090 亿），「放量出逃」而非「增量承接」，是二次回踩的典型量价特征。\n\n**维度3：涨停效应 — 7.0/20分**\n- 3.1 涨停占比 35/5400=0.65%（0.5~1% 档）→ 3/12分\n- 3.2 连板高度 4 板 → 4/8分\n- **解读**：涨停从 72→35 家腰斩，连板高度 5→4 板，涨停行业集中在低位补涨（休闲食品/专用设备/家电零部/航运港口），无主线梯队，短线赚钱效应大幅收缩。\n\n**维度4：恐慌指标 — 9.0/20分（反向）**\n- 4.1 跌停占比 10/5400=0.19%（0.1~0.2% 档）→ 6/10分\n- 4.2 炸板率 24/(35+24)=40.68%（40~50% 档）→ 3/10分\n- **解读**：跌停 5→10 家（恐慌回升），腾  维度 | 验证 | 评分 |\n|---|------|------|:----:|\n| 14 | **核心假设：上证守住4000** | 6/8开盘直接跳空击穿，6/9收复，6/10-6/11在4000下方，周五才站上 | ❌ |\n| 15 | **证伪信号：放量跌破3950** | 6/8最低3927+放量，触发证伪信号。但市场选择V型反弹而非继续下跌 | ⚠️ |\n| 16 | **SpaceX上市后反弹** | 6/12+1.12%，科技+航天领涨，\"利空出尽+超跌反弹\"逻辑成立 | ✅ |\n\n---\n\n## 三、本周预测评分汇总\n\n| 指标 | 第2周（6/8-6/12） | 第1周（6/1-6/5） | 变化 |\n|------|:-----------------:|:-----------------:|:----:|\n| 总预测项 | 16项 | 11项 | +5项 |\n| ✅ 完全正确 | 4项（25.0%） | 2项（18.2%） | +6.8pp |\n| 🟡 部分正确 | 6项（37.5%） | 7项（63.6%） | -26.1pp |\n| ❌ 错误 | 5项（31.3%） | 2项（18.2%） | +13.1pp |\n| ✅+🟡 可用率 | **62.5%** | **81.8%** | **-19.3pp** |\n\n**评估：本周可用率大幅退步（81.8%→62.5%）。** 核心原因不是预测框架退化，而是第2周面临的事件复杂度显著高于第1周——非农超预期冲击（第1周已触发，第2周周末发酵）→SpaceX抽血前置（预判时点错误）→美伊全面冲突（黑天鹅）→指数调样（已知但低估影响）。四重不确定性叠加，远超预测框架的覆盖面。\n\n---\n\n## 四、重大偏差根因分析\n\n### 🔴 偏差1：上证核心区间偏乐观53点（最大偏差）\n\n**机制还原：**\n```\n非农17.2万（6/5）→ 6/5下午A股反应(-1.17%)，完成40%消化\n→ 周末48小时发酵(美股续跌+黄金暴跌+社交媒体反刍)\n→ 6/8恐慌集中释放，开3938(-2.21%)，最低3927\n```\n\n**根本原因：** 早间预测模型只计算了\"6/5下午的即时反应\"，低估了周末48小时内负面情绪的二次扩散。\"已消化\"的判断缺乏定量指标（消化了多少？剩余多少？）。\n\n**修正方向：** 事件驱动型的最大冲击 = 当日即时反应 × (1 + 周末发酵系数)。系数参考：首次约0.5-0.8x。\n\n### 🔴 偏差2：量能方向完全错误\n\n**机制还原：** 预测\"周一恐慌抛售后→量能自然萎缩\"，但实际全周持续放量（1万亿→3.2万亿）。根因：①周一恐慌抛售+抄底交织；②周二强反弹放量；③周三SpaceX机构截止日机构调仓放量；④周四美伊冲突引发能源/科技极端博弈放量；⑤周五指数调样+SpaceX上市放量。**每天都有一到两个独立事件驱动放量。**\n\n**修正方向：** \"利空事件周\"的全周量能预测不能简单按\"缩量\"建模，必须考虑每天事件驱动因素。\n\n### 🟡 偏差3：SpaceX抽血时点前置\n\n**机制还原：** 预测\"6/12上市日才是关键\"，但6/10（机构订单截止日）和6/11（定价日）均已提前反映。机构为参与IPO提前调仓→卖科技买SpaceX→A股科技承压。\n\n**修正方向：** IPO事件链标准框架：定价日(xx)→机构截止日(xx)→上市日(xx)→解禁日(xx)，每个节点评估资金面影响方向。\n\n### 🔴 偏差4：美伊冲突黑天鹅\n\n**机制还原：** 6/10晚间美伊停火破裂→6/11凌晨美军空袭伊朗本土→伊朗宣布关闭霍尔木兹海峡→布伦特$95+。此升级速度（24小时内从\"对峙\"到\"全面冲突\"）超出任何预测模型的范围。\n\n**修正方向：** 地缘风险预测不能停留在\"停火破裂/油价上行\"的线性外推，需要预设\"情景升级路径\"（对峙→局部冲突→全面战争）。但即便如此，本次升级速度和烈度仍属黑天鹅级别。\n\n### 🟡 偏差5：4000点支撑判断完全错误\n\n**根本原因：** 跳空低开行情中，整数关口几乎没有支撑力。支撑有效性取决于\"到达方式\"——有序回调有效，跳空低开无效。\n\n**修正方向：** 支撑位有效性评估模型增加\"到达方式\"因子：跳空低开通过将支撑有效性降低70-80%。\n\n---\n\n## 五、模型优化建议\n\n### 假设层面\n\n| 失效假设 | 替代方案 | 紧迫性 |\n|---------|---------|:------:|\n| \"非农/CPI已反映→周一低开有限\" | 事件冲击 = 已反映幅度 + 周末发酵 × 情绪放大系数 | 🔴 高 |\n| \"整数关口有支撑力\" | 支撑位有效性 = f(到达方式, 成交量, 多空对比) | 🟡 中 |\n| \"正常周度量能→缩量\" | 量能趋势预测需分解至每日事件驱动 | 🟡 中 |\n| \"IPO影响只在上市日\" | IPO事件链标准框架（定价→截止→上市→解禁） | 🟡 中 |\n\n### 指标层面\n\n**最有效指标（本周验证）：**\n1. **美股芯片指数（费城半导体）→ A股科技传导：** 6/9费城半导体+5.6%→创业板+3.93%，传导系数0.70（此前低估为0.34）。需建立动态传导系数。\n2. **亚太市场（韩国KOSPI/日经）→ A股情绪：** 6/8韩国-8%熔断→A股恐慌；6/9韩国企稳→A股下午爆发。亚太情绪指数是重要先行指标。\n3. **成交额变化率：** 放量/缩量方向比绝对值更重要。\n\n**噪音指标（本周验证）：**\n1. **整数关口心理支撑（4000点）：** 跳空行情中几乎为零。\n2. **单一价格证伪标准（放量跌破3950）：** 会因抄底资金介入而失效，需叠加结构指标。\n\n### 框架层面\n\n1. **增加\"周末情绪发酵系数\"：** 事件驱动周一的缺口计算中引入修正项。\n2. **IPO事件链标准分析框架：** 将IPO拆分为完整时间轴，逐节点评估资金面影响。\n3. **增加\"美伊情景升级路径\"：** 预设从\"协议谈判→停火破裂→局部冲突→全面战争\"的四级升级路径，每级的传导链和概率分配。\n4. **证伪信号升级为双维度：** 价格阈值（放量跌破X点）+ 结构指标（北向资金趋势、ETF资金流向、涨跌比）。\n\n### 数据层面\n\n1. **新增：美元指数实时数据** 和 **沪金（AU）期货数据** — 非农→美元→黄金→A股权重的传导链缺失。\n2. **新增：布伦特/WTI原油价格监控** — 美伊局势期，油价是核心风险传导指标。\n3. **新增：SpaceX(SPCX)上市后价格监控** — 作为全球科技估值锚，其走势对A股科技板块有持续影响。\n4. **待评估：韩国KOSPI/日经225实时数据** — 亚太情绪先行指标的价值在本周被验证。\n\n---\n\n## 六、下周（6/15-6/19）前瞻提醒\n\n下周关键事件：\n1. **6/15（周一）：** 指数调样正式生效、SPCX首日表现反馈\n2. **6/18（周四）：** **FOMC利率决议（🔴关键）**— 当前市场预期维持利率不变（概率96.3%），但点阵图和经济预期摘要可能带来鹰派/鸽派风险\n3. **6/19（周五）：** 四巫日（股指期货/期权/个股期货/期权四重到期）\n\n**下周重点关注：** FOMC决议是下周最大风险事件，建议周一至周三逐步降低净敞口。美伊局势演变（霍尔木兹海峡是否恢复通行）是第二大不确定性。\n\n---\n\n> 📂 本文档自动生成于每周复盘任务\n> 📊 预测准确率追踪已更新 → `预测准确率追踪.md`\n> 🔄 部署网站: python3 /root/.openclaw/workspace/scripts/deploy-briefing.py"},{"filename":"每周预测复盘-2026-06-22.md","content":"# 📊 每周预测复盘 — 2026年6月第3周（6/15 ~ 6/18）\n\n> 复盘日期：2026-06-22（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-06-15.md` → 一、1周预测（6/15 ~ 6/22）\n> ⚠️ 本周仅4个交易日（6/15-6/18），6/19-6/21端午节休市\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘 | 涨跌幅 | 区间 | 成交额 | 关键特征 |\n|------|----------|--------|------|--------|----------|\n| 6/15（周一） | 4096.47 | +1.61% | 4031→4096 | 3.5万亿 | 美伊停火确认，全面爆发，创业板+5.3% |\n| 6/16（周二） | 4091.89 | -0.11% | 4078→4104 | 2.88万亿 | 分化，大票弱/小票强，锂电+电网领涨 |\n| 6/17（周三） | 4084.54 | -0.18% | 4074→4099 | ~3万亿 | FOMC前T-1观望，缩量窄幅震荡 |\n| 6/18（周四） | 4090.48 | -0.43% | 低开→4090 | 3.31万亿 | FOMC偏鹰落地，科创50+3.84%创历史新高，7成个股下跌 |\n| 6/19-6/21 | — | — | — | — | 端午节休市 |\n\n**本周上证实际区间：4074 ~ 4104**（仅4个交易日）\n**全周走势特征：周一暴涨→周二至周四三连阴（但跌幅极小，累计仅-0.15%）**\n\n---\n\n## 二、逐项验证（基于6/15早间简报「1周内」预测）\n\n### 预测项1：走势形态 — \"前低后高，N型——周初震荡消化+周中FOMC靴子落地+周末反弹\"\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 前低后高，N型：周初震荡消化→周中FOMC→周末反弹 |\n| **实际** | 前高后低：周一暴涨+1.61%→周二至周四三连阴（累计-0.15%） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 核心错误：预测\"周初震荡消化\"但实际周一暴涨+1.61%。美伊停火确认的爆发力被严重低估——6/15不仅没有\"震荡消化\"，反而是全周最高点。N型方向完全相反（预测先低后高，实际先高后低）。但\"周末反弹\"因端午节休市无法验证 |\n\n### 预测项2：上证核心区间 — 3980-4100\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证核心区间 3980-4100 |\n| **实际** | 4074-4104 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 上沿基本命中（预测4100 vs 实际4104，仅差4点）。下沿严重偏差（预测3980 vs 实际4074，偏差94点）。预测过于悲观——对美伊停火的正面冲击估计不足，以为市场还需要\"震荡消化\"，实际直接跳空高开高走。这是连续第3周出现\"区间偏乐观/偏悲观\"问题（第1周偏乐观35点，第2周偏悲观53点，第3周偏悲观94点） |\n\n### 预测项3：上证极端区间 — 3930-4150\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 极端区间 3930-4150 |\n| **实际** | 4074-4104，完全在极端区间内 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 极端区间设计合理，本周实际波动远小于极端区间范围，未触发任何极端情景 |\n\n### 预测项4：6/15日预测 — 4020-4070 震荡偏强\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证4020-4070，震荡偏强 |\n| **实际** | 上证+1.61%收4096.47，大幅超出预测上限 |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 严重低估了美伊停火确认的爆发力。三重利好（逆回购+指数调样+矿产法）+美伊停火情绪共振，市场选择了\"全面爆发\"而非\"震荡偏强\"。预测框架对\"多重利好共振\"的叠加效应缺乏量化模型 |\n\n### 预测项5：6/16日预测 — 4000-4050 偏弱\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证4000-4050，偏弱（日央行加息+宏观数据压力） |\n| **实际** | 上证-0.11%收4091.89，区间4078-4104 |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 区间完全偏离（预测4000-4050 vs 实际4078-4104）。日央行加息对A股的边际影响被高估，市场在6/15暴涨后选择高位窄幅震荡而非回调。预测框架对\"大涨次日\"的行为模式判断有误——大涨次日更常见的是高位震荡而非深度回调 |\n\n### 预测项6：6/17-6/18 — FOMC观望缩量，决议后方向选择\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | FOMC前观望缩量，决议后方向选择 |\n| **实际** | 6/17上证-0.18%缩量窄幅震荡（✅），6/18成交3.31万亿放量（❌缩量判断） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | \"FOMC前观望\"判断正确（6/17窄幅震荡-0.18%）。但\"缩量\"判断错误——6/18成交3.31万亿，较6/17放量。FOMC偏鹰落地后市场不仅没有缩量，反而因科创50暴涨放量。FOMC事件对成交量的影响被低估——决议落地本身就会激发交易（无论偏鸽偏鹰） |\n\n### 预测项7：6/19 — FOMC落地后大概率收阳\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | FOMC落地后大概率收阳 |\n| **实际** | 6/19端午节休市，无法验证 |\n| **评分** | ⚠️ **无法验证** |\n\n### 预测项8：机会行业 — 科创50ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | SpaceX估值锚+中报+指数增配，机会方向 |\n| **实际** | 科创50全周强势：6/15大涨→6/16+0.58%→6/18+3.84%创历史新高 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 方向判断完全正确。科创50是全周最强指数，逻辑（SpaceX估值锚+政策催化+中报预期）全部成立。但涨幅（全周累计约8%+）超出预期 |\n\n### 预测项9：机会行业 — 有色金属/稀土ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 矿产法施行+战略定位，机会方向 |\n| **实际** | 6/15有色大涨（紫金+7.63%），但6/16-6/18有色/贵金属持续回调领跌 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 6/15矿产法生效日确实催化了有色行情，但\"一日游\"特征明显。后续美伊停火→油价暴跌→通胀预期回落→有色承压的逻辑链压倒了矿产法的利好。预测框架未考虑\"地缘风险消退→通胀预期下行→资源品承压\"的二次传导 |\n\n### 预测项10：机会行业 — 红利低波ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | FOMC前防御配置 |\n| **实际** | 6/16红利低波-1.03%，全周被科技全面压制，资金从红利流向科技 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 防御逻辑本身成立（FOMC不确定性下红利确实有防御价值），但科技虹吸效应太强——资金不仅没有从科技流向红利，反而从红利加速抽离涌入科技。防御配置在\"极致结构性行情\"中失效 |\n\n### 预测项11：机会行业 — 消费ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 油价暴跌利好消费 |\n| **实际** | 6/16消费ETF-1.99%，6/17酒ETF-1.64%，全周消费板块持续走弱 |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 方向完全错误。\"油价暴跌→消费成本下降→消费受益\"的逻辑链过于简化。实际市场逻辑是\"科技虹吸→资金从消费/传统板块抽离→消费失血\"。油价下跌的利好被科技吸血的利空完全覆盖。预测框架忽略了资金面的结构性挤压效应 |\n\n### 预测项12：风险行业 — 航天军工ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 地缘溢价消退，\"鱼尾行情\" |\n| **实际** | 6/15军工涨停潮（最后脉冲），6/16起持续回调 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | \"地缘溢价消退\"方向正确，但6/15军工仍有涨停潮——\"鱼尾行情\"的\"鱼尾\"比预判的更长。美伊停火确认当天，军工反而因\"利空出尽\"出现最后一次情绪性拉升 |\n\n### 预测项13：风险行业 — 能源/油气ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 油价高位回落，能源ETF承压 |\n| **实际** | WTI从84.88→73.5美元（-13.4%），能源板块全周承压 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 方向判断准确。美伊停火→油价暴跌的逻辑链完整兑现。跌幅（-13.4%）超出预期但方向正确 |\n\n### 预测项14：风险行业 — 高溢价QDII\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 溢价回归风险 |\n| **实际** | 无QDII爆雷新闻，无法充分验证 |\n| **评分** | ⚠️ **无法验证** |\n\n### 预测项15：置信度 — 标\"中高\"\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 置信度标\"中高\" |\n| **实际** | 18项预测中5项正确（27.8%），6项错误（33.3%） |\n| **评分** | ❌ **过于自信** |\n| **偏差分析** | \"中高\"置信度与27.8%的正确率严重不匹配。核心问题：对美伊停火的爆发力、沃什偏鹰的概率、科技虹吸的强度三个关键变量都估计不足。连续第3周出现置信度偏高问题 |\n\n### 预测项16：核心假设H1 — FOMC维持利率不变\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | FOMC不加息 |\n| **实际** | 利率维持3.50%-3.75%不变 |\n| **评分** | ✅ **正确** |\n\n### 预测项17：核心假设H2 — 沃什表态\"中性偏鸽\"\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 沃什表态中性偏鸽 |\n| **实际** | 沃什偏鹰：点阵图9/18支持年内加息，删除\"宽松偏向\"措辞 |\n| **评分** | ❌ **假设失效** |\n| **偏差分析** | 对沃什政策取向的判断完全错误。市场此前对沃什\"偏鸽\"的共识（基于其学术背景）被FOMC首秀推翻。这是本周最重要的假设失效——不仅影响FOMC当日的判断，还影响了后续\"FOMC后反弹\"的预测逻辑 |\n\n### 预测项18：核心假设H3 — 美伊协议本周内签署\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 美伊协议本周内签署 |\n| **实际** | 6/18正式签署谅解备忘录 |\n| **评分** | ✅ **正确** |\n\n### 预测项19：证伪条件 — 沃什超预期偏鹰暗示7月加息\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 证伪条件：沃什超预期偏鹰→上证或回调至4000以下 |\n| **实际** | 沃什偏鹰触发证伪，但上证仅微跌（-0.43%收4090），未回调至4000以下 |\n| **评分** | 🟡 **证伪触发但结果不符** |\n| **偏差分析** | 证伪条件设计合理（被正确触发），但触发后的市场反应与预测不符——上证并未回调至4000以下。原因：科技主线（科创50+3.84%）的强势完全对冲了FOMC偏鹰对上证的压制。证伪信号需要区分\"对指数的冲击\"和\"对结构的冲击\" |\n\n---\n\n## 三、本周统计\n\n| 指标 | 数值 | vs 第2周 | vs 第1周 |\n|------|------|----------|----------|\n| 总预测项 | 19项 | +3项 | +8项 |\n| ✅ 完全正确 | 5项（26.3%） | +1项 | +3项 |\n| 🟡 部分正确 | 6项（31.6%） | 持平 | -1项 |\n| ❌ 错误 | 6项（31.6%） | +1项 | +4项 |\n| ⚠️ 无法验证 | 2项（10.5%） | +1项 | +1项 |\n| **正确率（✅）** | **26.3%** | +1.3pp | +8.1pp |\n| **可用率（✅+🟡）** | **57.9%** | -4.6pp | -23.9pp |\n\n### 三周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 趋势 |\n|------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 📈 缓慢改善 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 📉 持续下降 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 📈 恶化后持平 |\n\n**核心矛盾：正确率在改善（从18.2%→26.3%），但可用率在恶化（从81.8%→57.9%）。** 说明预测框架在\"精准判断\"上略有进步，但在\"避免大错\"上反而退步。第3周出现了多个方向性错误（走势形态、消费ETF、沃什偏鸽假设），这些\"硬伤\"严重拉低了可用率。\n\n---\n\n## 四、关键错误根因分析\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势形态\"前低后高\"→实际\"前高后低\" | 🔴 方向性错误 | 美伊停火确认的爆发力被系统性低估。预测框架默认\"利好兑现=震荡\"，但实际是\"不确定性消除=风险偏好跳升\" | 🟡 可部分预见——停火方向可预判，但爆发力度不可预判 |\n| 上证核心区间偏悲观94点 | 🔴 大幅偏差 | 同上。对\"不确定性消除\"的正面冲击缺乏量化模型 | 🟡 可改进——需建立\"不确定性消除溢价\"量化框架 |\n| 消费ETF方向完全错误 | 🔴 方向性错误 | \"油价跌→消费受益\"逻辑被\"科技虹吸→消费失血\"逻辑覆盖。资金面结构性挤压效应被忽略 | 🟡 可改进——需在行业预测中增加\"资金虹吸风险\"维度 |\n| 沃什偏鸽假设失效 | 🔴 关键假设错误 | 基于沃什学术背景的\"偏鸽\"共识被FOMC首秀推翻。对\"新人首秀需展示鹰派姿态\"的政治逻辑预判不足 | 🟡 可改进——\"新人首秀\"的政治约束是可分析的因素 |\n| 6/15日预测严重偏低 | 🔴 大幅偏差 | 三重利好共振（逆回购+指数调样+矿产法+美伊停火）的叠加效应被低估 | 🟡 可改进——需建立\"多催化共振\"的叠加效应量化 |\n| 6/16日预测区间完全偏离 | 🔴 区间错误 | \"大涨次日=回调\"的默认假设被打破。大涨次日高位窄幅震荡是另一种常见模式 | 🟢 可预见——大涨次日的两种模式（回调 vs 高位震荡）应在框架中并列为等概率情景 |\n| 置信度\"中高\"过于自信 | 🟡 系统性偏差 | 连续第3周置信度偏高。预测框架缺乏\"不确定性校准\"机制 | 🟢 可改进——建立置信度与历史准确率的动态校准 |\n\n---\n\n## 五、核心假设验证\n\n| 假设 | 内容 | 验证结果 | 影响 |\n|------|------|----------|------|\n| H1 | FOMC维持利率不变 | ✅ 成立 | 正面，但被H2失效对冲 |\n| H2 | 沃什表态\"中性偏鸽\" | ❌ 失效 | 严重负面——导致FOMC后走势判断偏差 |\n| H3 | 美伊协议本周内签署 | ✅ 成立 | 正面，但爆发力被低估 |\n\n**假设成立率：2/3（66.7%）。** H2（沃什偏鸽）的失效是本周预测偏差的最大单一来源——它不仅影响了FOMC当日的判断，还连锁影响了\"FOMC后反弹\"和\"上证区间\"的预测逻辑。\n\n---\n\n## 六、复盘摘要\n\n### 📈 本周预测亮点\n\n1. **科创50ETF方向判断精准：** 全周最强指数，逻辑（SpaceX估值锚+政策催化+中报预期）全部成立。这是连续第3周在科技主线上判断正确。\n2. **能源/油气ETF风险判断准确：** 美伊停火→油价暴跌（WTI-13.4%）的逻辑链完整兑现。\n3. **极端区间设计合理：** 3930-4150的极端区间完全覆盖了实际波动，未触发误报。\n4. **美伊签署时间判断准确：** 预测\"本周内签署\"，6/18正式签署。\n5. **FOMC不加息判断准确：** 利率维持不变。\n\n### 📉 本周预测不足\n\n1. **走势形态方向完全错误：** 预测\"前低后高\"→实际\"前高后低\"。美伊停火确认的爆发力被系统性低估——\"不确定性消除\"带来的风险偏好跳升远超\"利好兑现\"的震荡逻辑。\n2. **上证核心区间偏悲观94点：** 预测3980-4100→实际4074-4104。这是连续第3周出现区间偏差（第1周偏乐观35点、第2周偏悲观53点、第3周偏悲观94点），偏差在扩大而非收敛。\n3. **沃什偏鸽假设完全失效：** 对沃什政策取向的判断错误，导致FOMC相关预测全部偏离。\n4. **消费ETF方向完全错误：** \"油价跌→消费受益\"被\"科技虹吸→消费失血\"完全覆盖。行业预测中忽略了资金面结构性挤压效应。\n5. **置信度连续第3周偏高：** \"中高\"置信度与26.3%正确率严重不匹配。\n\n### 🔑 关键教训\n\n1. **\"不确定性消除\" ≠ \"利好兑现\"：** 这是本周最重要的教训。美伊停火不是普通的\"利好兑现\"，而是持续3个月的\"最大不确定性被系统性解除\"——市场反应是风险偏好跳升而非利好出尽。预测框架需要区分\"已知利好的兑现\"和\"未知风险的消除\"两种完全不同的市场反应模式。\n2. **\"新人首秀\"的政治约束被忽略：** 沃什作为新任美联储主席，首场FOMC必须展示抗通胀决心（政治正确），即使个人倾向偏鸽。预测框架对\"首秀效应\"的政治逻辑缺乏分析。\n3. **科技虹吸效应已成为预测框架的最大盲区：** 连续第3周，科技主线的强度超出预测。消费ETF被科技吸血、红利ETF被科技压制、上证被科技分化——几乎所有\"非科技\"方向的预测都因科技虹吸而偏离。预测框架需要将\"科技虹吸强度\"作为独立变量纳入。\n4. **\"大涨次日\"的行为模式需要细化：** 预测默认\"大涨次日=回调\"，但实际是\"大涨次日=高位窄幅震荡\"。两种模式在A股都常见，预测框架应并列为等概率情景而非默认回调。\n5. **区间预测偏差在扩大而非收敛：** 三周区间偏差分别为35点→53点→94点。这说明框架的\"自适应校准\"机制尚未生效——每次复盘后提出的改进建议，尚未在下周预测中体现为实际改善。\n\n---\n\n## 七、模型优化建议\n\n### 假设层面\n\n1. **新增\"不确定性消除溢价\"假设：** 当持续1个月以上的重大不确定性被系统性解除时，市场反应模式应从\"利好兑现→震荡\"切换为\"风险偏好跳升→全面重定价\"。触发条件：不确定性持续时间>30天 + 消除方式为\"正式协议/官方确认\"（非传闻）。\n2. **新增\"首秀效应\"政治约束：** 当新任央行行长/财长等关键职位首场重大政策会议时，默认其表态偏向\"展示专业性和独立性\"（通常偏鹰），而非其个人学术倾向。该假设需在FOMC前明确标注。\n3. **修正\"大涨次日\"假设：** 将\"大涨次日=回调\"和\"大涨次日=高位震荡\"并列为等概率情景（各50%），根据当日是否有新的催化事件来调整概率。\n\n### 指标层面\n\n4. **新增\"科技虹吸强度指数\"：** 监控科技板块成交占比/全市场成交。当占比>40%时触发\"虹吸预警\"——此时所有非科技方向的预测需下调置信度。当前科技成交占比约45-50%，已处于极端水平。\n5. **新增\"多催化共振系数\"：** 当单日出现≥3个独立催化事件时，市场反应幅度 = 单一催化预期幅度 × (1 + 共振系数)。共振系数初始设为0.3-0.5（即3个催化叠加可放大30-50%）。\n6. **区间预测增加\"自适应校准\"：** 基于前三周偏差（+35、-53、-94），区间预测应在基准模型基础上增加一个\"偏差修正项\"——当前偏差方向为\"偏悲观\"，下周区间应系统性上移。\n\n### 框架层面\n\n7. **置信度与历史准确率动态挂钩：** 前三周正确率分别为18.2%、25.0%、26.3%，可用率分别为81.8%、62.5%、57.9%。当前框架下\"中高\"置信度对应的实际正确率仅约25%——建议规则：正确率<30%时置信度上限为\"中\"，正确率30-50%时上限为\"中高\"，正确率>50%时方可标\"高\"。\n8. **行业预测增加\"资金虹吸风险\"维度：** 每个机会行业标注\"科技虹吸风险等级\"（高/中/低），风险行业标注\"是否可能因科技回调而反弹\"。\n9. **证伪信号增加\"结构性证伪\"维度：** 当前证伪信号仅针对上证指数（价格阈值），但第3周显示——即使上证未触发证伪（未跌破4000），结构性判断（消费/红利方向）已被证伪。建议增加\"结构性证伪信号\"（如科技成交占比突破50%→非科技方向预测自动降级）。\n\n### 数据层面\n\n10. **新增监控指标：** ①科技板块成交占比（日频）②FOMC点阵图变化（会后即时更新）③行业ETF资金流向（周频）④\"不确定性消除\"事件的历史回测数据（如2020年11月大选落定、2022年3月FOMC首次加息等类似事件的市场反应模式）。\n\n---\n\n## 八、三周累计统计\n\n| 指标 | 第1周 | 第2周 | 第3周 | 累计 |\n|------|-------|-------|-------|------|\n| 总预测项 | 11 | 16 | 19 | 46 |\n| ✅ 完全正确 | 2 | 4 | 5 | 11 (23.9%) |\n| 🟡 部分正确 | 7 | 6 | 6 | 19 (41.3%) |\n| ❌ 错误 | 2 | 5 | 6 | 13 (28.3%) |\n| ⚠️ 无法验证 | 0 | 1 | 2 | 3 (6.5%) |\n| **累计正确率** | 18.2% | 21.4% | 23.9% | **23.9%** |\n| **累计可用率** | 81.8% | 71.4% | 65.2% | **65.2%** |\n\n### 三周核心发现\n\n1. **正确率在缓慢改善（18.2%→25.0%→26.3%）：** 预测框架在\"精准判断\"上略有进步，说明复盘→改进的循环在发挥作用。\n2. **可用率在持续恶化（81.8%→62.5%→57.9%）：** 方向性错误在增加，说明框架在\"避免大错\"上反而退步。根因是市场复杂程度在上升（第3周面临美伊停火+FOMC首秀+科技虹吸极致+端午节前多重变量），而框架的复杂度没有同步提升。\n3. **\"科技主线\"是唯一持续正确的判断方向：** 三周来，科创50/半导体方向的判断几乎全部正确。其他方向（消费、红利、周期、价值）的判断频繁出错。这说明预测框架对\"产业趋势驱动\"的方向判断能力强，但对\"风格切换/资金轮动\"的方向判断能力弱。\n4. **置信度问题持续三周未改善：** 第1周标\"高\"、第2周标\"中高\"、第3周标\"中高\"——全部偏高。这是最需要立即修正的系统性偏差。\n\n---\n\n> 📁 下次复盘：2026年6月29日（周一）— 复盘6/22-6/26预测\n> 📊 关联文件：`预测准确率追踪.md`（已同步更新）\n"},{"filename":"每周预测复盘-2026-06-30.md","content":"# 📊 每周预测复盘 — 2026年6月第4周（6/22 ~ 6/26）\n\n> 复盘日期：2026-06-30（周二） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-06-22.md` → 一、1周预测（6/22 ~ 6/28）\n> ⚠️ 本周5个交易日（6/22-6/26）。6/29已进入新一周。\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘/午收 | 涨跌幅 | 特征 |\n|------|-------------|--------|------|\n| 6/22（周一） | 4098（午收） | +0.18% | V形走势，开4093→低4070→午收4098 |\n| 6/23（周二） | 4147（上午） | -0.37% | 科技杀跌，权重护盘，分化严重 |\n| 6/24（周三） | 4096（午收） | -0.25% | 震荡修复，美光财报前观望 |\n| 6/25（周四） | 4125（午收） | +0.36% | 美光Q3极端超预期催化科技大涨 |\n| 6/26（周五） | 4027（收盘） | **-2.26%** | 全面三杀：科技暴跌+权重跟跌+中小盘续跌 |\n\n**全周上证区间：约4000 ~ 4175**\n**全周走势特征：前四天高位震荡（4070-4175）→ 周五三杀暴跌（-2.26%）**\n\n---\n\n## 二、逐项验证（基于6/22早间简报「1周内」预测）\n\n### 核心走势\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|------|\n| 核心走势（基准60%） | 高开1-2%后震荡消化，科技延续强势，上证冲高回落 | 高开仅0.08-0.48%；前四天震荡→周五暴跌 | ❌ 方向错误 |\n| 强势情景（25%） | 科技暴力高开3%+，上证站稳4150 | 未触发 | ❌ 未触发 |\n| 弱势情景（15%） | 利好出尽高开低走 | 周五暴跌最终兑现弱势方向 | 🟡 部分正确 |\n\n### 关键区间\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|------|\n| 核心区间 | 4050-4180 | 约4000-4175，下沿偏差50点 | 🟡 部分正确 |\n| 极端区间 | 4000-4220 | 完全覆盖实际波动 | ✅ 正确 |\n\n### 机会行业\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|------|\n| 半导体/科创板ETF | 科技延续强势 | 创业板全周累计约-2% | ❌ 错误 |\n| AI算力/通信ETF | 科技主线延续 | 周中有脉冲但6/26暴跌领跌 | 🟡 部分正确 |\n| 消费电子ETF | 机会方向 | 全周表现平平 | 🟡 部分正确 |\n| 汽车ETF | 机会方向 | 全周表现一般 | 🟡 部分正确 |\n\n### 风险行业\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|------|\n| 保险/银行ETF | 风险方向 | 6/23权重护盘，6/26跟跌但跌幅小于科技 | ✅ 部分防御有效 |\n| 黄金ETF | 风险方向 | 周中出现反转，被重新列为机会 | 🟡 不确定 |\n| 高溢价科技ETF | 溢价回归风险 | 6/26暴跌→溢价大幅回归 | ✅ 准确 |\n\n### 证伪条件\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|------|\n| 证伪条件① | 6/22上证跌幅>0.5%→利好出尽确认 | 6/22上证+0.18%，未触发 | ✅ 设计合理 |\n| 证伪条件② | 6/22早盘前30分钟成交<5000亿→动能不足 | 数据不足 | ⚠️ 无法验证 |\n\n### 本周统计\n\n| 指标 | 数值 |\n|------|------|\n| 总预测项 | 13项 |\n| ✅ 完全正确 | 2项（15.4%） |\n| 🟡 部分正确 | 6项（46.1%） |\n| ❌ 错误 | 4项（30.8%） |\n| ⚠️ 无法验证 | 1项（7.7%） |\n| **正确率（✅）** | **15.4%** |\n| **可用率（✅+🟡）** | **61.5%** |\n\n---\n\n## 三、本周核心发现\n\n### 📈 预测亮点\n\n1. **极端区间设计持续有效：** 4000-4220的极端区间完全覆盖实际波动（约4000-4175），连续第4周极端区间命中。\n2. **高溢价科技ETF风险判断准确：** 6/26暴跌中溢价大幅回归，溢价回归逻辑兑现。\n3. **证伪条件①设计合理：** \"6/22跌幅>0.5%\"未被触发，避免了误判。\n4. **保险/银行在科技杀跌日发挥防御价值：** 6/23权重护盘逻辑成立。\n\n### 📉 预测不足\n\n1. **核心走势判断方向错误：** 预测\"高开1-2%后震荡消化\"，实际仅高开0.08-0.48%。**根本原因：节前（6/18）科创50已涨3.84%，假期利好已被部分定价。** P0-1规则已建立但未严格执行——在A股已提前上涨时，外盘传导系数应从0.3-0.4进一步下调至0.1-0.2。\n2. **正确率跌至四周新低（15.4%）：** 第1周18.2%→第2周25.0%→第3周26.3%→第4周15.4%。四项权重最大的预测（走势、区间、科技行业、置信度）中有3项错误。\n3. **\"冲高回落\"vs\"高位震荡→暴跌\"的路径误判：** 预测\"冲高回落\"（涨后回调），实际\"高位震荡4天→周五三杀暴跌\"。这是两种完全不同的路径，需增加\"周五+月末共振\"的权重系数。\n4. **科技方向机会判断全周收跌：** 虽周中有脉冲，但周五暴跌覆盖了全周涨幅。6月末资金考核+科技获利了结+听证会前避险的三重压制被低估。\n5. **区间偏差方向反转：** 第3周区间偏悲观94点，第4周区间偏差约50点但方向是偏乐观（实际低于预测下限）。区间预测在方向性上持续不稳定。\n\n### 🔑 关键教训\n\n1. **节前price in是P0-1规则的关键补充：** 当A股在外部催化发生前已上涨时，外部催化的传导系数需进一步下调。新增规则：\"外盘催化前A股已涨超2%→传导系数再减半\"。\n2. **周五+月末共振（P2-4）应被提升至P0级：** 6/26三杀暴跌的主因是科技高位获利了结+月末资金考核+听证会前避险三重叠加，且叠加周五效应。P2-4规则在6/26才被正式新增，应提前应用于每周四/五的预测中。\n3. **预测体系在\"趋势延续周\"表现最好，在\"趋势转换周\"表现最差：** 第1-3周是趋势延续（科技主线），正确率逐步改善；第4周是趋势转换（科技从高位转向暴跌），正确率骤降。需要建立\"趋势转换预警\"机制。\n4. **弱势情景的方向正确但时点完全错误：** 弱势方向（15%概率）最终在周五兑现，但预测为\"周一利好出尽高开低走\"。时点偏差说明\"利好出尽\"的传导时间比预期更长。\n5. **区间偏差方向不稳定：** 第3周偏悲观94点，第4周偏乐观50点。方向摆动说明区间预测缺乏稳定的锚定机制。\n\n---\n\n## 四、模型优化建议\n\n### 假设层面\n1. **新增\"节前price in系数\"：** 当A股在外部催化前已上涨时，传导系数再减半。具体规则：A股提前涨超2%（如6/18科创50+3.84%），外部催化传导系数从0.3-0.4下调至0.1-0.2。\n2. **P2-4（周五+月末共振）升级至P0级：** 每周四/五的预测必须应用此规则，且权重从\"额外因子\"升级为\"核心因子\"。\n3. **新增\"趋势转换预警\"机制：** 当科技成交占比连续3天>40%且上涨天数>3天时，自动触发\"趋势转换预警\"——从\"趋势延续\"模型切换为\"趋势转换\"模型。\n\n### 指标层面\n1. **\"节前price in\"指标最有效：** 6/22高开高估的核心原因是忽略了节前已上涨的事实。此指标应加入每周预测前检查清单。\n2. **科技成交占比仍是最有效的辅助指标：** 连续高位运行后，方向转换概率显著增加。\n3. **\"利好出尽\"的传导时间需量化：** 利好出尽效应在重大催化后可持续3-5天（而非立即兑现），需建立\"催化衰减曲线\"。\n\n### 框架层面\n1. **三情景框架需要增加\"延迟路径\"：** 当弱势情景的概率较低（15%）但方向最终正确时，说明\"低概率≠晚发生\"。需增加\"延迟型弱势\"路径——弱势方向可能延迟3-5天兑现。\n2. **行业预测增加\"全周累计风险\"标注：** 科技方向虽周中有脉冲，但全周收跌。需在行业机会预测中标注\"脉冲vs持续\"属性。\n3. **置信度与近期正确率动态挂钩（第4周确认）：** 第4周正确率15.4%，显著低于第3周的26.3%。下周置信度上限应设为\"低-中\"。\n\n### 数据层面\n1. **增加\"节前持仓成本\"监控：** 监控ETF在节假日前后的资金流向变化，量化price in程度。\n2. **增加\"月末资金面压力\"量化指标：** 监控Shibor、GC007等资金利率在月末的变化。\n3. **增加\"周五效应权重系数\"：** 量化周五相对于其他交易日的波动放大系数。\n\n---\n\n## 五、四周累计统计\n\n| 指标 | 第1周 | 第2周 | 第3周 | 第4周 | 累计 |\n|------|-------|-------|-------|-------|------|\n| 总预测项 | 11 | 16 | 19 | 13 | 59 |\n| ✅ 完全正确 | 2 | 4 | 5 | 2 | 13 (22.0%) |\n| 🟡 部分正确 | 7 | 6 | 6 | 6 | 25 (42.4%) |\n| ❌ 错误 | 2 | 5 | 6 | 4 | 17 (28.8%) |\n| ⚠️ 无法验证 | 0 | 1 | 2 | 1 | 4 (6.8%) |\n| **累计正确率** | 18.2% | 21.4% | 23.9% | 22.0% | **22.0%** |\n| **累计可用率** | 81.8% | 71.4% | 65.2% | 64.4% | **64.4%** |\n\n### 四周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 第4周 | 趋势 |\n|------|-------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 📉 四周新低 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 📈 略回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | ➡️ 持平 |\n\n### 四周正确率排行\n\n**持续正确的预测方向（3-4周均✅或🟡）：**\n1. 极端区间设计 — 4周全中\n2. 证伪条件设计 — 4周全有效\n3. 高溢价风险 — 3周正确\n\n**持续错误的预测方向：**\n1. 核心区间预测 — 4周全部偏差（方向不稳定）\n2. 置信度标注 — 4周全部偏高\n3. 科技行业机会在\"趋势转换周\"错误 — 第4周首次重大错误\n\n**最需要修正的系统性偏差：**\n1. 🔴 核心区间预测4周全偏差，方向不稳定\n2. 🔴 置信度4周偏高\n3. 🔴 趋势转换识别缺失\n4. 🟡 节前price in量化规则缺失\n\n---\n\n*复盘完成时间：2026-06-30 14:42 CST*\n"}],"2026-07":[{"filename":"每周预测复盘-2026-07-06.md","content":"# 📊 每周预测复盘 — 2026年7月第1周（6/29 ~ 7/3）\n\n> 复盘日期：2026-07-06（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-06-29.md` → 一、1周内预测（6/29 ~ 7/3）\n> 本周5个交易日，每日均有滚动预测更新\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘 | 涨跌幅 | 区间 | 成交额 | 关键特征 |\n|------|----------|--------|------|--------|----------|\n| 6/29（周一） | 4034.08 | +0.17% | 4015→4040 | ~2.5万亿(半天) | 探底企稳，大小盘极端分化，上证50+1.63%/科创50+1.97% vs 中证1000-1.81% |\n| 6/30（周二） | 4094.40 | +0.50% | 4070→4098 | 3.27万亿 | PMI 50.3超预期，科技暴涨（科创50+4.27%），上证50逆势-0.23% |\n| 7/1（周三） | 4138.65 | +1.08% | 4088→4143 | ~3.66万亿 | PMI利好延续，周期/价值领涨，科技获利了结（科创50-0.31%），上证突破4130 |\n| 7/2（周四） | 4028.18 | -2.03% | 4043→4094→4028 | ~3.45万亿 | 费城-6.4%恐慌共振，科创50-7.70%创近两年最大单日跌幅，全市场普跌 |\n| 7/3（周五） | 4043.64 | +0.37% | 4027→4074→4044 | ~4万亿 | 非农5.7万爆冷→上午超跌反弹→下午全线回落，科创50收-0.59%翻绿 |\n\n**本周上证实际区间：4028 ~ 4139**\n**本周上证涨跌：约+0.25%（从6/26收盘4034→7/3收盘4044）**\n**全周走势特征：周一企稳→周二周三连涨→周四暴跌→周五弱反弹。典型的\"先扬后抑再弱稳\"，周中波动极大（科创50振幅-7.70%→+2%→-0.59%）**\n\n---\n\n## 二、逐项验证（基于6/29早间简报「1周内」预测）\n\n### 预测项1：走势形态 — \"探底企稳，4000-4050震荡\"\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 周一探底企稳（上证4000-4050区间震荡），周二PMI后选择方向。基准情景（55%）：上证在4000附近获支撑，科技股超卖后技术性修复，但反弹力度受限于听证会前避险情绪 |\n| **实际** | 周一探底企稳4034✅→周二PMI超预期后科技暴涨（科创50+4.27%）→周三继续上行突破4130→周四费城-6.4%恐慌共振暴跌-2.03%→周五弱反弹。全周走势远比\"4000-4050震荡\"剧烈 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 周一\"探底企稳\"判断精准（4034在预测区间内）。但\"4000-4050震荡\"和\"反弹受限于听证会前避险\"两个核心判断被证伪：①PMI超预期（50.3）驱动周二至周三连涨至4139，反弹力度远超\"受限于避险\"；②周四费城-6.4%恐慌共振导致单日-2.03%，波动远非\"震荡\"可比。本周实际是\"震荡\"的极端反面——暴涨暴跌交替。**核心失误：将\"听证会前避险\"作为反弹上限约束，低估了PMI超预期的正面对冲力。** |\n\n### 预测项2：上证核心区间 — 3950-4100\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证核心区间 3950-4100 |\n| **实际** | 4028-4139，上沿超出39点（+0.95%），下沿差78点（偏保守） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 下沿3950设置保守（实际最低4028），安全边际充足。上沿4100被突破39点——PMI超预期+周二至周三连涨推高指数至4139。偏差幅度39点与第4周偏差（50点）基本持平，区间预测的\"偏保守\"倾向持续。但本周偏差方向是\"上沿偏保守\"（前4周多为\"下沿偏乐观\"），偏差方向首次反转。 |\n\n### 预测项3：基准情景（55%概率）— 4000支撑+科技修复+反弹受限\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证4000附近获支撑，科技股超卖后技术性修复，反弹力度受限于听证会前避险情绪 |\n| **实际** | 4000支撑有效（最低4028）✅，科技股修复远超预期（科创50两日+8.62%），反弹力度未被听证会避险限制（周二周三累计涨幅显著） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 三个子判断中2个正确（4000支撑✅、科技修复✅），1个错误（\"反弹受限\"❌）。PMI 50.3三重扩张（制造业+非制造业+综合均回扩张区间）是打破\"听证会避险约束\"的关键变量——宏观数据超预期的正面冲击力覆盖了事件前的避险情绪。 |\n\n### 预测项4：机会行业 — 黄金ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 全周强势：周二+2.16%（全市场唯一大涨品种）、周五+2.32%（全场最强）。降息预期+避险双驱动完美兑现 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 方向+逻辑双正确。黄金ETF是本周最可靠的机会行业判断，在科技暴跌日（周四）提供了有效对冲。 |\n\n### 预测项5：机会行业 — 建筑材料\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 缺乏全周行业排名数据。从有限信息推断：PMI超预期日（6/30-7/1）周期/价值板块走强（中证500+1.00%），建筑材料作为周期板块可能跟随但非领涨。全周表现中性偏弱（周四全市场普跌中大概率跟跌） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 方向逻辑合理（PMI回扩张→周期受益），但建筑材料非本周主线。行业轮动集中在科技（前半周）→恐慌（后半周），建筑材料被边缘化。 |\n\n### 预测项6：机会行业 — 国防军工\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 缺乏全周行业排名数据。美伊局势缓和（7/18第二轮谈判确认）→地缘溢价消退→军工逻辑弱化。推断全周表现中性偏弱 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 预测时美伊6/30会谈前景不明，国防军工作为地缘对冲方向逻辑合理。但美伊局势随后缓和→军工的地缘溢价消退→逻辑被削弱。属于\"假设变化导致方向失效\"类型。 |\n\n### 预测项7：机会行业 — 红利低波\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 防御价值 |\n| **实际** | 上证50在科技暴涨日（6/30）逆势-0.23%，在科技暴跌日（7/2）相对抗跌（-1.53% vs 科创50-7.70%）。全周表现：防御属性在暴跌日有效，但在暴涨日被压制。整体震荡持平 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 防御逻辑方向正确（暴跌日确实体现防御价值），但本周前半段科技暴涨时红利被严重压制。红利低波在\"暴涨暴跌交替\"的极端周中，防御价值只在暴跌日体现，整体回报有限。 |\n\n### 预测项8：风险行业 — 电子（半导体）\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 周二暴涨（科创50+4.27%）→周三分化（科创50-0.31%）→周四暴跌（科创50-7.70%）→周五弱反弹（科创50-0.59%）。全周科创50累计约-2.3%（从约2025→1976），但路径极度动荡 |\n| **评分** | ❌ **错误** |\n| **偏差分析** | **这是本周最严重的预测失误。** 预测半导体为\"风险行业\"，但周二周三半导体暴涨（两日科创50+8.62%），风险判断在前半周被完全证伪。周四暴跌-7.70%虽然最终兑现了风险，但①时点偏差（风险延迟而非即时）、②方向在前半周完全反向、③风险来源不同（预测的\"超买回调\"vs实际的\"费城恐慌共振\"）。**根本错误：将\"超卖修复\"和\"风险行业\"同时列为判断，两者内在矛盾——科技股既然超卖修复，就不应同时是风险行业。** |\n\n### 预测项9：风险行业 — 通信/计算机\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 周四科技暴跌中通信/计算机大概率领跌（光通信受康宁-13.62%映射）。推断全周表现偏弱 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 方向正确。通信/计算机在费城恐慌传导中属于高风险方向（光通信+AI算力），周四暴跌中验证。 |\n\n### 预测项10：风险行业 — 有色金属\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 缺乏全周行业排名数据。美伊局势缓和→油价回落→通胀预期降→有色逻辑弱化。推断全周表现中性偏弱 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 逻辑方向合理但缺乏验证数据。有色在美伊缓和中确实承压，但幅度无法量化判断。 |\n\n### 预测项11：核心假设H1 — 4000整数关口支撑有效\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 4000整数关口支撑有效 |\n| **实际** | 全周最低4028（周四盘中低点），4000未被测试。支撑有效 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 假设成立。4000在本周未被触及，支撑判断准确。但需注意：本周4000未被测试不是因为支撑强，而是因为周一直接企稳在4034+周二PMI利好推高指数→4000根本未被接近。支撑\"有效\"≠支撑\"被验证\"。 |\n\n### 预测项12：核心假设H2 — 周二PMI不出现大幅低于预期\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | PMI不出现大幅低于预期 |\n| **实际** | PMI 50.3（超预期上沿），三重扩张（制造业50.3+非制造业50.2+综合50.6） |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 假设成立，且PMI超预期成为本周前半段反弹的核心驱动力。预测中未充分估计PMI超预期的概率和冲击力（仅将其作为\"不出现大幅低于预期\"的底线假设，而未将其超预期作为积极情景）。 |\n\n### 预测项13：核心假设H3 — 美伊6/30会谈不破裂\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 美伊6/30会谈不破裂 |\n| **实际** | 美伊局势持续缓和，7/18第二轮谈判确认，特朗普称\"伊朗几乎同意一切\" |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 假设成立。美伊缓和是本周宏观背景的稳定因素，但市场关注点被PMI+费城恐慌完全覆盖，美伊因素本周影响有限。 |\n\n### 预测项14：证伪条件① — 上证跌破3950\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证跌破3950→调整为\"继续探底至3900\" |\n| **实际** | 未触发。全周最低4028，距3950有78点安全边际 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 证伪阈值设置合理。3950作为\"恐慌升级\"的触发线，本周未被接近。 |\n\n### 预测项15：证伪条件② — PMI大幅低于预期\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | PMI大幅低于预期→下调反弹预期 |\n| **实际** | 未触发。PMI 50.3超预期 |\n| **评分** | ✅ **正确** |\n| **偏差分析** | 证伪条件设计合理。但缺失\"PMI超预期→上调反弹预期\"的对称证伪条件，属于框架不对称。 |\n\n### 预测项16：置信度 — 65%\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 置信度65%（中高） |\n| **实际** | 走势方向部分正确但幅度严重低估（\"震荡\"变\"暴涨暴跌\"），半导体风险判断前半周完全错误，机会行业中仅黄金ETF精准命中 |\n| **评分** | ❌ **过于自信** |\n| **偏差分析** | 65%置信度与实际表现不匹配。完全正确率仅43.8%（7/16），可用率81.3%虽尚可但关键预测（走势形态、半导体风险）出现重大偏差。置信度应下调至50-55%。 |\n\n---\n\n## 三、本周统计\n\n| 指标 | 数值 | vs 第4周 | vs 第1周 |\n|------|------|----------|----------|\n| 总预测项 | 16项 | +3项 | +5项 |\n| ✅ 完全正确 | 7项（43.8%） | +5项 | +5项 |\n| 🟡 部分正确 | 6项（37.5%） | 持平 | -1项 |\n| ❌ 错误 | 3项（18.8%） | -1项 | +1项 |\n| ⚠️ 无法验证 | 0项（0%） | -1项 | 持平 |\n| **正确率（✅）** | **43.8%** | +28.4pp | +25.6pp |\n| **可用率（✅+🟡）** | **81.3%** | +19.8pp | -0.5pp |\n\n### 五周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 第4周 | 第5周 | 趋势 |\n|------|-------|-------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 📈 创历史新高 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 📈 回到第1周水平 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 📉 创历史新低 |\n\n### ⚠️ 正确率\"虚高\"警示\n\n本周正确率43.8%看似大幅改善，但需审慎解读：\n- **7项✅中4项是\"证伪条件未触发\"类判断**（H1-H3假设+2个证伪条件）——这类判断正确是因为市场未走到极端，而非预测精准\n- **扣除假设/证伪类后，实际预测正确率仅3/9=33.3%**（走势形态、区间、行业判断层面）\n- **最关键的3个预测全部偏差**：走势形态（🟡）、上证区间（🟡）、半导体风险（❌）\n- **本周最成功的预测**：黄金ETF方向（✅）、PMI假设（✅）、4000支撑假设（✅）\n\n---\n\n## 四、滚动预测追踪（每日1周预测演变）\n\n本周每日均有滚动预测更新，追踪其演变过程可揭示预测框架的适应性：\n\n| 日期 | 1周预测方向 | 上证区间 | 关键变化 | 当日vs实际 |\n|------|------------|----------|----------|------------|\n| 6/29 | 探底企稳，4000-4050震荡 | 3950-4100 | 初始预测 | 🟡 方向正确，幅度低估 |\n| 6/30 | 震荡偏多 | 4050-4150 | PMI后上调区间+50点 | ✅ 当日命中 |\n| 7/1 | 震荡分化，科技获利了结 | 4030-4130 | 下调科技预期 | ❌ 上证突破4130 |\n| 7/2 | 震荡偏弱，科技承压 | 4060-4140 | 费城-6.4%冲击 | 🟡 方向正确，幅度低估 |\n| 7/3 | 先弹后稳 | 3980-4120 | 非农爆冷+超跌反弹 | ❌ 反弹后回落翻绿 |\n\n**关键发现：** 滚动预测在\"应对新信息\"上反应迅速（PMI后上调、费城后下调、非农后转反弹），但在\"预判幅度\"上持续偏差。5天中仅6/30完全命中当日走势，其余4天均存在幅度或方向偏差。**框架的\"方向敏感度\"优于\"幅度敏感度\"。**\n\n---\n\n## 五、核心偏差根因分析\n\n### 根因一：PMI超预期冲击力被系统性低估（影响：走势形态、区间上沿、半导体风险判断）\n\n**表现：** 预测\"反弹受限于听证会前避险\"，实际PMI 50.3三重扩张驱动周二至周三连涨至4139。\n\n**深层原因：**\n1. PMI在预测框架中被定位为\"不出现大幅低于预期\"的底线假设，而非\"可能超预期→驱动反弹\"的积极变量\n2. \"听证会前避险\"被赋予过高的约束权重——市场在强宏观数据面前可以暂时忽略事件风险\n3. PMI三重扩张（制造业+非制造业+综合）的共振效应缺乏量化——三重同时回扩张区间的概率和冲击力均被低估\n\n**量化：** 若PMI超预期→反弹上限约束（听证会避险）应自动解除，区间上沿应上调50-80点至4150-4180。实际区间上沿4139验证了此判断。\n\n### 根因二：费城-6.4%恐慌共振无法预判（影响：走势形态、科创50区间、超跌反弹逻辑）\n\n**表现：** 预测\"4000-4050震荡\"，实际周四暴跌-2.03%、科创50-7.70%。\n\n**深层原因：**\n1. 费城-6.4%是周二晚间发生的极端事件（闪迪-14%+康宁-13.62%），在周一早间预测时完全不可预见\n2. 这是典型的\"不可预见黑天鹅\"——预测框架对此类事件的应对策略是\"证伪条件+滚动修正\"，而非\"提前预判\"\n3. 框架的滚动修正响应迅速（7/2早间已将上证区间调整至4060-4140，方向调整为\"震荡偏弱\"），但幅度仍低估（科创50区间2080-2180 vs 实际2054）\n\n**关键判断：** 费城-6.4%不属于预测失误，属于\"不可预见事件\"。真正的失误在于：6/29预测中未设置\"若外部出现重大利空→区间自动下修\"的应急预案。\n\n### 根因三：半导体\"风险行业\"与\"超卖修复\"的内在矛盾（影响：半导体风险判断、机会行业选择）\n\n**表现：** 预测半导体为\"风险行业\"，但周二周三大涨（科创50两日+8.62%），前半周方向完全错误。\n\n**深层原因：**\n1. 6/29预测中同时存在两个相互矛盾的判断：①\"科技股超卖后技术性修复\"（看多）②\"电子/半导体为风险行业\"（看空）\n2. 这两个判断基于不同时间维度——修复是短期（1-3天），风险是中期（1周）。但在\"1周内\"预测中将两者并列，造成了内在逻辑冲突\n3. **核心教训：超卖修复和风险警示不能在同一个时间窗口内共存。** 正确的做法是：短期（1-3天）看修复→中期（3-5天）转风险→在1周预测中应标注时间分段\n\n### 根因四：行业预测数据基础薄弱（影响：建筑材料、国防军工、有色金属验证）\n\n**表现：** 4个机会行业+3个风险行业中，仅黄金ETF（✅）和半导体（❌）有明确验证数据，其余5个行业缺乏全周排名数据。\n\n**深层原因：**\n1. 行业预测缺乏系统性验证数据源——每日复盘仅覆盖宽基ETF和少量行业ETF，无法全面验证行业判断\n2. \"建筑材料\"\"国防军工\"\"有色金属\"等方向的选择逻辑合理但缺乏数据闭环\n3. 行业预测的\"可验证性\"低于指数预测，导致复盘时多项判断落入\"部分正确\"的灰色地带\n\n---\n\n## 六、偏差经验修正效果评估\n\n### 本周修正触发情况\n\n本周5个交易日中，偏差经验库被密集触发（7/2触发7条、7/3触发12条）。修正效果如下：\n\n| 日期 | 触发模式数 | 修正有效率 | 核心表现 |\n|------|:--------:|:--------:|------|\n| 7/2 | 7条 | 57.1%（4/7） | P1-1传导系数精准（0.72在0.6-0.8内）；P0-3超跌反弹修正恶化；P2-2+15%偏保守 |\n| 7/3（午间） | 12条 | 87.5%（7/8） | 上午修正高效；P0-1/P1-1/P1-6/P1-7/P2-4均正确 |\n| 7/3（收盘） | 12条 | 58.3%（7/12） | P0-3从🟡降级至❌；P0-2从✅降级至🟡；全天数据比上午更严苛 |\n\n### 新增偏差模式发现\n\n本周发现两个需要纳入偏差经验库的新模式：\n\n**P1-9：半导体子板块恐慌惯性独立于整体超跌反弹**\n- **发现场景：** 7/3科创50整体反弹+1.05%，但半导体ETF仅+0.15%（几乎零反弹）\n- **核心规律：** 当半导体子板块存在独立利空（闪迪-14%/Burry做空美光）时，半导体的恐慌惯性可独立于科创50整体的超跌反弹逻辑。即使科创50因降息利好反弹，半导体子板块可能因独立利空而继续承压。\n- **修正措施：** 半导体子板块需独立建模。在半导体独立利空存续期间，科创50反弹预测需区分\"半导体权重拖累\"和\"非半导体成分反弹\"。\n\n**P2-6：PMI超预期→\"听证会避险约束\"自动解除**\n- **发现场景：** 6/29预测将\"听证会前避险\"作为反弹上限约束，但PMI 50.3超预期后市场完全忽略听证会风险，连涨两天。\n- **核心规律：** 当宏观数据（PMI/非农/CPI）显著超预期时，事件风险（听证会/FOMC）的约束力在短期内（1-3天）大幅下降。市场在强数据面前选择\"先涨再说\"。\n- **修正措施：** 宏观数据超预期→事件风险约束自动下调50%。若PMI>50.3或非农<8万→听证会避险权重从默认30-40%降至15-20%。\n\n---\n\n## 七、关键教训总结\n\n### 🔑 教训一：超卖修复与风险警示不能在同一个时间窗口共存\n\n6/29预测同时判断\"科技超卖修复\"和\"电子为风险行业\"，导致前半周方向完全错误。正确的做法是在1周预测中标注时间分段：前半周修复→后半周转风险。\n\n**行动项：** 1周预测新增\"时间节奏\"字段，将5天分为前2天+后3天，分别标注方向预期。\n\n### 🔑 教训二：宏观数据超预期可覆盖事件风险约束\n\nPMI 50.3三重扩张后，市场完全忽略\"听证会前避险\"，连续大涨两天。预测框架中\"事件风险约束\"的权重过高，缺乏\"强宏观数据→约束自动解除\"的机制。\n\n**行动项：** 新增P2-6偏差模式，建立\"宏观数据超预期→事件风险约束自动下调\"规则。\n\n### 🔑 教训三：半导体子板块需要独立建模\n\n科创50整体反弹（+1.05%）时半导体ETF几乎零反弹（+0.15%），说明半导体的恐慌惯性可独立于科创50整体。此前将\"半导体/电子\"与\"科创50/科技\"混为一谈是错误做法。\n\n**行动项：** 新增P1-9偏差模式，半导体子板块独立评估。\n\n### 🔑 教训四：行业预测缺乏系统性验证数据\n\n7个行业预测中5个缺乏明确验证数据，导致复盘时多项判断落入\"部分正确\"的灰色地带。行业预测的\"可验证性\"严重不足。\n\n**行动项：** 每日早间简报增加行业ETF涨跌排名表（至少覆盖预测中提到的行业），建立行业预测的数据闭环。\n\n### 🔑 教训五：正确率\"虚高\"需区分假设类与判断类\n\n本周正确率43.8%中，4项来自\"假设成立+证伪未触发\"（这类判断属于底线思维，正确不代表预测精准）。扣除后实际判断正确率仅33.3%。\n\n**行动项：** 准确率追踪表中新增\"假设/证伪类\"与\"方向判断类\"的分类统计。\n\n---\n\n## 八、复盘摘要\n\n### 📈 本周预测亮点\n\n1. **黄金ETF方向精准（✅）：** 全周最强品种，降息预期+避险双驱动完美兑现，连续多周在黄金上判断准确。\n2. **核心假设全部成立（4/4✅）：** 4000支撑、PMI不低、美伊不破裂、证伪条件未触发——底线思维框架有效。\n3. **周一\"探底企稳\"判断精准：** 上证4034在预测区间4000-4050内，方向+点位双正确。\n4. **正确率创历史新高（43.8%）：** 但需注意其中含4项假设/证伪类判断，实际方向判断正确率33.3%。\n5. **滚动修正机制反应迅速：** PMI后上调区间、费城后下调预期、非农后转反弹——框架的\"方向敏感度\"良好。\n\n### 📉 本周预测不足\n\n1. **半导体\"风险行业\"前半周方向完全错误（❌）：** 预测风险但周二周三大涨，内在矛盾（超卖修复vs风险警示）是本周最大失误。\n2. **走势形态严重低估波动幅度：** \"4000-4050震荡\"变\"暴涨暴跌交替\"，对PMI超预期和费城恐慌两个极端的冲击力均估计不足。\n3. **上证区间上沿偏保守39点：** 连续第5周区间偏差（方向首次反转为\"上沿偏保守\"），自适应校准仍未建立。\n4. **置信度65%偏高：** 与实际关键判断的偏差程度不匹配，应下调至50-55%。\n5. **行业预测数据闭环缺失：** 7个行业判断中5个无法精确验证。\n\n### 🔧 模型优化建议（本周新增）\n\n| 优先级 | 优化项 | 具体措施 |\n|:---:|------|------|\n| 🔴 P0 | 1周预测新增\"时间节奏\"字段 | 将5天分为前2天+后3天，分别标注方向预期，解决\"超卖修复vs风险警示\"的内在矛盾 |\n| 🔴 P0 | 新增P1-9偏差模式 | 半导体子板块恐慌惯性独立建模，与科创50整体区分 |\n| 🔴 P0 | 新增P2-6偏差模式 | PMI/非农/CPI超预期→事件风险约束自动下调50% |\n| 🟡 P1 | 每日简报增加行业ETF排名 | 至少覆盖预测中提到的行业，建立行业预测数据闭环 |\n| 🟡 P1 | 准确率统计分类细化 | 区分\"假设/证伪类\"与\"方向判断类\"的正确率 |\n| 🟡 P1 | 置信度校准规则更新 | 含假设类判断时置信度自动降5-10pp |\n| 🟢 P2 | 区间预测引入\"超预期数据缓冲\" | 当PMI/非农等数据超预期时，区间自动扩展±30-50点 |\n\n---\n\n*📊 复盘完成 · 下次复盘：2026年7月13日（周一）*\n*📄 预测来源：预测记录-2026-06-29.md*\n"},{"filename":"每周预测复盘-2026-07-13.md","content":"# 📊 每周预测复盘 — 2026年7月第2周（7/6 ~ 7/10）\n\n> 复盘日期：2026-07-13（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-07-06.md` → 一、1周内预测（7/6 ~ 7/12）\n> 本周5个交易日，听证会超级事件周。每日均有滚动预测更新+午间/收盘两次验证。\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘 | 涨跌幅 | 科创50 | 涨跌幅 | 成交额 | 关键特征 |\n|------|----------|--------|--------|--------|--------|----------|\n| 7/6（周一） | 4041.24 | -0.06% | 1996.10 | +1.04% | 3.09万亿 | 高开V形，科技内部分化（存储芯片涨/AI跌），创业板-1.77% |\n| 7/7（周二） | 3990.24 | -1.26% | 2001.59 | +0.28% | 2.58万亿 | 听证会Day 1，上证恐慌避险，科创50逆势微涨，涨跌639:4534 |\n| 7/8（周三） | 3970.88 | -0.49% | 2016.23 | +0.73% | 2.56万亿 | 上午V形反弹至4011→下午完全回吐，听证会Day 2 |\n| 7/9（周四） | 4036.59 | +1.65% | 2185.83 | **+8.41%** | 2.91万亿 | CPI偏暖+恐慌消退→科创50暴涨，听证会Day 3最后一日 |\n| 7/10（周五） | 3996.16 | -1.00% | 2064.98 | **-5.53%** | 3.39万亿 | 结果公布→利好出尽暴跌，上证重回4000下方 |\n\n**本周上证实际区间：3939（7/8最低） ~ 4068（7/10盘中高点）**\n**本周上证涨跌：4041 → 3996 = -1.1%**\n**本周科创50涨跌：1996 → 2065 = +3.5%**\n**全周走势特征：周一V形分化→周二恐慌避险→周三上午反弹下午回吐→周四暴涨→周五暴跌。典型的\"听证会超级周\"路径：恐慌→反弹→抢跑→利好出尽。**\n\n---\n\n## 二、逐项验证（基于7/6早间预测「1周内」预测）\n\n### 预测项1：上证核心区间 — 4000-4150\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证核心区间 4000-4150 |\n| **实际** | 3939-4068。下沿被击穿61点（7/8最低3939），上沿未被触及（最高仅4068，差82点） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 核心区间双向失效：下沿低估恐慌深度（实际跌破4000后继续下探至3939），上沿高估反弹力度（实际从未触及4100）。本周上证被听证会恐慌压制在4000下方整整两天半（7/7下午-7/9上午），区间预测未充分反映\"事件前避险→4000击穿\"的风险。这是连续第5周核心区间偏差，且方向首次从\"上沿偏保守\"转为\"双向偏离\"。 |\n\n### 预测项2：创业板区间 — 3900-4200\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 创业板 3900-4200 |\n| **实际** | 3840（7/8最低）~ 4018（7/9最高）。下沿被短暂击穿60点 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 下沿在7/8盘中短暂击穿（3840 vs 3900），但整体区间框架基本有效。创业板在听证会期间受AI/光通信拖累最深（7/8最低3840），但7/9反弹至4018。核心区间下沿设置仍偏乐观——听证会恐慌对创业板的冲击超过预期。 |\n\n### 预测项3：科创50区间 — 1920-2100\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 科创50 1920-2100 |\n| **实际** | 1951（7/7最低）~ 2186（7/9最高）。下沿差31点，上沿被大幅突破86点（+4.1%） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 下沿判断精准（1951接近1920，差31点/1.6%），但上沿严重低估。7/9科创50暴涨+8.41%至2186，远超预测上沿2100。核心偏差在于：7/9 CPI偏暖+恐慌消退的叠加效应产生了远超预期的爆发力——这是\"三日听证会后情绪翻转\"的极端场景，预测框架缺乏对此类非线性反应的量化模型。 |\n\n### 预测项4：周一预判 — 科创50 V形走势\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 科创50开盘1930-1960→V形回升至1980-2050→收盘站稳2000概率55% |\n| **实际** | 科创50高开→最低1952→回升至1996收盘。开盘方向错误（预测低开实际高开），但V形形态正确 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 开盘方向被存储芯片三重利好（江波龙暴增6万倍+瑞银Q3涨价32%+三星拟涨20%）完全逆转。预测低开基于\"纳指三连跌+Burry做空\"的外部恐慌传导，但产业基本面利好压倒外部利空。V形形态判断精准——确实走出了急跌→回升的V形。收盘1996接近2000，站稳概率判断基本正确。**教训：产业趋势利好权重在极端场景（如江波龙6万倍级别）应从80%升至90%+。** |\n\n### 预测项5：情景概率\n\n| 情景 | 预测概率 | 预测科创50目标 | 实际 | 评分 |\n|------|:---:|------|------|:--:|\n| 🟢 偏鸽反弹 | 45% | 2050-2150 | 7/9触及2186（超上限36点） | 🟡 |\n| 🟡 中性震荡 | 35% | 1950-2050 | 7/6-7/8在此区间运行 | ✅ |\n| 🔴 偏鹰探底 | 20% | 1850-1950 | 未触发 | ✅ |\n\n**偏差分析：** 偏鸽反弹方向正确（市场最终选择了偏鸽路径），但幅度被严重低估（2186 vs 预测上限2150）。更关键的是：偏鸽反弹45%概率在7/9得到了验证，但7/10的暴跌将一周净涨幅压缩至+3.5%。45%概率的场景在中间兑现了，但预测未包含\"偏鸽反弹后利好出尽\"的双段式路径。\n\n### 预测项6：机会行业 — 存储芯片/半导体设备/科创50ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 科创50全周+3.5%，7/9单日+8.41%领涨全市场。存储芯片景气驱动连续第5日验证 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 方向判断精准。存储芯片/科创50ETF是全周最确定的做多方向——在7/6-7/8市场恐慌期间逆势走强（三连阳），7/9集中爆发。P0-2规则（产业趋势>宏观）连续第14次验证。 |\n\n### 预测项7：机会行业 — 机器人ETF（等回调）\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 等回调后机会方向 |\n| **实际** | 缺乏全周行业排名数据。从有限信息推断：机器人/具身智能在全周科技分化中表现中性——7/9科技暴涨日可能跟随，7/10暴跌日可能跟跌。整体未成为本周主线 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | \"等回调\"的策略建议合理——本周机器人ETF未出现独立行情，等待是正确的。但缺乏精确验证数据。 |\n\n### 预测项8：机会行业 — 黄金ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 7/6：-0.47%。全周数据缺乏精确排名。从7/9-7/10的避险情绪推断：黄金在7/7恐慌日可能走强，7/9暴涨日可能被压制，7/10利好出尽日可能再次走强 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 黄金作为\"听证会避险+降息预期\"双驱动品种，逻辑方向正确。但在听证会超级周中，黄金的避险属性被科创50的产业趋势驱动所掩盖——资金选择了\"产业趋势确定性\"而非\"避险\"。 |\n\n### 预测项9：机会行业 — 券商ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 机会方向 |\n| **实际** | 缺乏全周行业排名数据。7/7-7/8证券板块连跌两日（P1-7验证），7/9-7/10成交放量（2.91万亿/3.39万亿）→券商可能受益。整体表现中性 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 券商ETF的\"放量受益\"逻辑在7/9-7/10成交放量日成立，但前半周（7/7-7/8）证券承压。时点节奏偏差。 |\n\n### 预测项10：风险行业 — AI芯片/光通信\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 7/6确认：AI/光通信拖累创业板-1.77%，与科创50+1.04%形成极端分化。7/7-7/8持续承压。7/9跟随暴涨但幅度弱于存储芯片。7/10暴跌中大概率领跌 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 风险方向判断精准。AI芯片/光通信在听证会期间承受双重压力：①费城半导体传导（康宁-13.62%映射光通信）；②听证会对AI芯片出口管制的政策不确定性。P1-9规则（半导体子板块分化：存储芯片0.1-0.2 vs AI/光通信0.4-0.6）连续验证。 |\n\n### 预测项11：风险行业 — 锂电池上游\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 缺乏全周行业排名数据。锂电上游在7/6-7/8科技分化中可能跟随创业板走弱，7/9跟随反弹但非主线 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 锂电上游的\"听证会不确定性+产能过剩\"双压逻辑合理，但缺乏精确验证数据。 |\n\n### 预测项12：风险行业 — 纯AI概念\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 风险方向 |\n| **实际** | 缺乏全周行业排名数据。7/10暴跌日中纯概念股大概率领跌（无业绩支撑+利好出尽双杀） |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | \"听证会前避险→纯概念最脆弱\"的逻辑成立，但缺乏精确验证。 |\n\n### 预测项13：证伪条件① — 周一科创50收盘<1948\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 若7/6科创50收盘<1948→产业趋势支撑被证伪 |\n| **实际** | 7/6科创50收盘1996，未触发。最低1952，距证伪差4点 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 证伪阈值设置合理——1996接近但不触发，提供了有效的风险边界。1948作为关键技术位被市场验证有效。 |\n\n### 预测项14：证伪条件② — 7/7听证会偏鹰\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 若7/7听证会偏鹰→偏鹰探底情景升级 |\n| **实际** | 7/7听证会Day 1出现鹰派证词→上证走偏鹰路径（-1.26%），但7/9-7/10结果公布后整体偏鸽。证伪条件\"部分触发\"——短期触发了偏鹰避险但最终路径走向偏鸽 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 证伪条件设计合理（区分了Day 1听证和最终结果），但最终结果出现\"鸽但不够鸽\"导致7/10利好出尽——这是证伪框架未覆盖的新场景。 |\n\n### 预测项15：证伪条件③ — 存储芯片不涨反跌\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 若存储芯片不涨反跌→产业趋势逻辑被证伪 |\n| **实际** | 存储芯片全周上涨，未触发证伪 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 存储芯片全周强势验证了P0-2规则。证伪条件未触发=产业趋势逻辑持续有效。 |\n\n### 预测项16：置信度 — 60%\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 置信度60% |\n| **实际** | 多项核心判断偏差（上证区间❌、科创50上沿严重低估、7/10利好出尽幅度严重低估）。60%置信度偏高 |\n| **评分** | ❌ **过于自信** |\n| **偏差分析** | 60%置信度与实际表现不匹配。扣除假设/证伪类判断后，实际方向判断正确率约50%。置信度应标\"中\"（40-50%）。连续第6周置信度偏高。 |\n\n---\n\n## 三、滚动预测逐日验证\n\n### 7/7（周二·听证会Day 1）滚动预测验证\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 场景概率 | 偏鸽70%/偏鹰30% | 上证走偏鹰路径（-1.26%） | ❌ |\n| 上证偏鸽区间 | 4020-4080 | 3990（低于下沿30点） | ❌ |\n| 上证偏鹰区间 | 3950-4020 | 3990（区间内） | ✅ |\n| 科创50偏鸽区间 | 1980-2080 | 2002（区间内） | ✅ |\n| 结构性分化 | 科创50 vs 中小盘分化 | 剪刀差1.54%（科创50+0.28% vs 中证1000-1.48%） | ✅ |\n| 成交量 | 听证会日可能缩量 | 2.58万亿（放量非缩量） | ❌ |\n| 产业趋势>宏观 | 科创50可逆势 | 科创50+0.28%逆势微涨 | ✅ |\n\n**7/7小结：** 场景概率严重误判（70%偏鸽被证伪），但结构性分化判断精准。核心失误：未建模\"事件前恐慌性避险\"场景——市场在听证会Day 1选择恐慌避险而非窄幅震荡等待。\n\n### 7/8（周三·听证会Day 2）滚动预测验证\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 上证区间 | 3950-4020震荡偏弱 | 上午4011→下午3971，区间命中 | 🟡 |\n| 科创50区间 | 1980-2050偏强震荡 | 2064（上午）→2016（收盘）| 🟡 |\n| 恐慌边际递减 | Day 2 < Day 1 | 恐慌仅30分钟后V形反转 | ✅ |\n| 成交量 | 1.8-2.2万亿 | 2.56万亿（偏高） | 🟡 |\n\n**7/8小结：** 上午V形反弹验证了\"恐慌边际递减\"，但下午完全回吐暴露出\"事件进行中的V形可能是假反转\"——这是当日最重要的发现。P2-7规则需新增\"下午二次恐慌\"子规则。\n\n### 7/9（周四·听证会Day 3最终日）滚动预测验证\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 上证区间 | 3940-4020 | 4037（+1.65%，大幅超出） | ❌ |\n| 科创50区间 | 1980-2060 | 2186（+8.41%，远超上沿126点） | ❌ |\n| 偏鸽概率 | 65% | 正确但幅度严重低估 | 🟡 |\n| 尾盘抢跑概率 | 40-50% | 上午CPI后即开始抢跑 | 🟡 |\n| 领涨板块 | 科创50/创业板50 | ✅ 完全正确 | ✅ |\n| 领跌板块 | 中证1000/证券 | 上午中证1000-1.05%，下午逆转+2.24% | 🟡 |\n\n**7/9小结：** 这是本周最大的\"幅度误判\"日。方向判断（偏鸽反弹）正确，但科创50+8.41%的暴涨完全超出任何模型预测。三大根因：①CPI偏暖（权重45%）→上午跳空高开；②听证会Day 3恐慌完全消退（权重30%）→从\"避险等待\"切换至\"FOMO抢跑\"；③CPI二次发酵+政策空间预期（权重25%）→午间机构集中解读后爆发。核心发现：上午有利好数据公布可将抢跑时间从尾盘提前至上午；\"三日恐慌释放→情绪翻转\"的极端场景缺乏量化模型。\n\n### 7/10（周五·听证会结果公布日）滚动预测验证\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 上证区间 | 4000-4100 | 3996（略低于区间下沿4点） | 🟡 |\n| 科创50方向 | 利好出尽-2%~-3% | -5.53%（幅度严重低估） | ❌ |\n| 科创50回落路径 | 冲高后回落 | 2233→2065（-7.55%从高点）方向✅ | 🟡 |\n| 偏鸽概率 | 70-80% | 结果\"鸽但不够鸽\"→暴跌 | ❌ |\n| 成交量 | 2.2-2.6万亿 | 3.39万亿（放量+30-54%） | ❌ |\n| 中证1000 | 超跌修复 | 上午+1.13%→全天-1.25%（证伪） | ❌ |\n\n**7/10小结：** 本周第二大失误。核心偏差：①听证会结果方向误判——市场在7/9+8.41%中深度price-in了\"超预期偏鸽\"，实际结果\"符合偏鸽但无超预期\"=利好出尽；②P2-2多因子叠加严重低估——4因子（利好出尽+技术回调+周五效应+结果预期差）叠加冲击-5.53%，远超修正值+3-5%；③结果预期差作为新增因子未被建模（后续新增P2-10规则）。\n\n---\n\n## 四、本周统计\n\n| 指标 | 数值 | vs 第6周（6/29-7/3） |\n|------|------|-------------------|\n| 总预测项 | 16项 | 持平 |\n| ✅ 完全正确 | 5项（31.3%） | -2项（-12.5pp） |\n| 🟡 部分正确 | 9项（56.3%） | +3项 |\n| ❌ 错误 | 2项（12.5%） | -1项 |\n| ⚠️ 无法验证 | 0项（0%） | 持平 |\n| **正确率（✅）** | **31.3%** | -12.5pp |\n| **可用率（✅+🟡）** | **87.5%** | +6.2pp |\n\n### 扣除假设/证伪类后的实际判断正确率\n\n| 维度 | 数值 |\n|------|------|\n| 总预测项 | 16项 |\n| 假设/证伪类 | 5项（证伪条件①-③、置信度、H1-H3合并） |\n| 方向判断类 | 11项 |\n| 方向判断 ✅ | 3项（27.3%） |\n| 方向判断 🟡 | 6项（54.5%） |\n| 方向判断 ❌ | 2项（18.2%） |\n| **实际判断正确率** | **27.3%** |\n| **实际判断可用率** | **81.8%** |\n\n---\n\n## 五、偏差经验修正效果（本周滚动验证）\n\n### 修正效果汇总\n\n| 日期 | 验证时点 | 修正条数 | ✅改善 | 🟡无效 | ❌恶化 | 有效率 |\n|------|---------|:---:|:---:|:---:|:---:|:---:|\n| 7/6 | 午间 | 12 | 8 | 4 | 0 | 66.7% |\n| 7/6 | 收盘 | 12 | 8 | 4 | 0 | 66.7% |\n| 7/7 | 午间 | 8 | 7 | 1 | 0 | 87.5% |\n| 7/7 | 收盘 | 8 | 7 | 1 | 0 | 87.5% |\n| 7/8 | 午间 | 4 | 3 | 1 | 0 | 75.0% |\n| 7/8 | 收盘 | 6 | 4 | 0 | 2 | 50.0% |\n| 7/9 | 午间 | 7 | 5 | 2 | 0 | 71.4% |\n| 7/9 | 收盘 | 7 | 6 | 1 | 0 | 85.7% |\n| 7/10 | 午间 | 6 | 4 | 2 | 0 | 66.7% |\n| 7/10 | 收盘 | 6 | 4 | 0 | 2 | 50.0% |\n| **全周** | — | **76** | **56** | **16** | **4** | **73.7%** |\n\n### 关键发现\n\n1. **修正有效率73.7%处于健康区间**，但较上周（85.7%收盘）有所下降\n2. **7/8和7/10收盘出现恶化**（各2项❌），均与\"下午逆转\"场景相关——上午修正有效、下午被市场反转\n3. **P0-1（A股自主定价/事件日豁免）连续第5周100%有效**，是当前最可靠的修正规则\n4. **P0-2（产业趋势>宏观）连续第14次验证**，存储芯片景气驱动科创50在听证会全周逆势走强\n5. **新增P2-10（结果预期差冲击）和P2-11（利好出尽结构性→全面性转换）**，填补了7/10暴跌的建模空白\n\n---\n\n## 六、本周核心发现\n\n### 1. 听证会超级周的市场节奏已初步建模\n\n本周完整经历了\"听证会超级周\"的全部阶段：\n\n| 阶段 | 日期 | 市场特征 | 模型状态 |\n|------|------|---------|:--:|\n| 前夜定价 | 7/6 | 产业趋势>恐慌，科创50逆势 | ✅ 已建模（P0-1+P0-2） |\n| Day 1恐慌 | 7/7 | 上证避险-1.26%，科创50抗跌 | ✅ 已建模（P2-7） |\n| Day 2假反转 | 7/8 | 上午V形→下午回吐 | ⚠️ 需新增（P2-7子规则） |\n| Day 3情绪翻转 | 7/9 | CPI催化+FOMO抢跑+8.41% | ⚠️ 需新增（P2-9） |\n| 结果公布日 | 7/10 | 利好出尽-5.53%，结果预期差 | ⚠️ 已新增（P2-10/P2-11） |\n\n**关键缺口：** ①Day 3情绪翻转的量化模型（\"三日恐慌释放后FOMO踩踏\"的幅度测算）；②结果预期差的量化（\"市场已price-in了多少\" vs \"实际结果是多少\"的差值映射至价格冲击）。\n\n### 2. \"利好出尽\"幅度被系统性低估\n\n7/10科创50-5.53%远超预测-2%~-3%，偏差根因：\n- **市场price-in的深度被低估：** 7/9+8.41%不仅反映了\"偏鸽预期\"，更反映了\"超预期偏鸽（如取消部分关税）\"的极端乐观。实际结果\"鸽但不够鸽\"=预期差为负→利好出尽幅度×1.5-2.0\n- **4因子叠加的协同效应被低估：** 利好出尽+技术回调+周五效应+结果预期差，4因子非简单相加而是协同放大\n- **P2-2多因子叠加系数需系统性上调：** 从当前+3-5%上调至+5-8%（当含\"结果预期差\"因子时）\n\n### 3. \"上午V形≠恐慌结束\"\n\n7/8的上午V形反弹至4011→下午完全回吐至3971，是本周最重要的方法论发现：\n- 事件进行中的V形可能是\"假反转\"——卖压在下午缓慢释放而非一次性出清\n- 成交量是关键验证指标：7/8成交2.56万亿持平前日（未萎缩）=持续出货而非集中抛售\n- **新增规则：** 事件进行中（非事件结束后）的V形反弹，需成交量萎缩确认方可视为\"恐慌结束\"\n\n### 4. 产业趋势（P0-2）连续第14次压倒宏观恐慌\n\n科创50在听证会全周逆势走强（+3.5%），在7/7恐慌日（上证-1.26%）微涨+0.28%，在7/8上证再跌时+0.73%。存储芯片景气是当前市场最确定的做多主线。P0-2规则从\"修正措施\"升级为\"第一性原则\"。\n\n### 5. 行业预测验证数据缺口持续存在\n\n16项预测中，至少5项行业预测（机器人ETF、黄金ETF、券商ETF、锂电池上游、纯AI概念）因缺乏全周行业排名数据而无法精确验证。每日早间简报已增加ETF排名表（7/6起），但全周累计排名仍需系统化收集。\n\n---\n\n## 七、关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 上证核心区间❌ | 🔴 方向性 | 听证会恐慌深度被低估——4000支撑在事件前无效 | 🟡 可部分预见（P2-5已预警支撑概率下降） |\n| 科创50上沿严重低估 | 🔴 幅度偏差 | 7/9 CPI+恐慌消退+FOMO的叠加爆发力缺乏量化 | 🟡 可部分预见（P2-9待建模） |\n| 7/10利好出尽幅度低估 | 🔴 幅度偏差 | 结果预期差因子未建模+多因子叠加系数偏低 | 🟢 可预见（已新增P2-10） |\n| 置信度60%偏高 | 🟡 系统性 | 连续第6周偏高，含假设类判断未下调置信度 | 🟢 可改进 |\n| 7/7场景概率误判 | 🔴 方向性 | \"事件前恐慌性避险\"场景未建模 | 🟡 可改进（P2-7子规则） |\n\n---\n\n## 八、模型优化建议\n\n### 假设层面\n\n1. **H-区间：** \"4000整数关口有支撑\"在事件驱动周完全失效（7/7-7/8连续两日收于4000下方）。修改为：事件驱动周（如听证会/FOMC/重大数据公布）的整数关口支撑力归零，仅参考技术位（如3950、3900）。\n2. **H-恐慌：** \"听证会前避险情绪约束反弹\"假设被PMI超预期（第6周）和CPI偏暖（本周）两次打破。修改为：宏观数据超预期可完全覆盖事件避险约束，需建立\"宏观数据对冲系数\"（PMI>50或CPI<0.2%→事件避险权重从30%降至10%）。\n3. **H-利好出尽：** \"利好出尽幅度=前期涨幅×0.3-0.5\"公式在结果预期差场景失效。修改为：当结果不及市场已price-in的预期时，利好出尽幅度=前期涨幅×0.6-0.9（接近完全回吐）。\n\n### 指标层面\n\n4. **最有效指标：** ①科创50与中证1000的日内剪刀差（结构性分化的实时验证，连续2周精准）；②行业ETF资金流向（661亿流入信号→准确预判7/6 V形）；③成交量变化率（放量vs缩量→区分\"恐慌\"和\"恐慌消退\"）。\n5. **噪音指标：** ①外盘前一日的涨跌幅（在事件驱动周完全失效，P0-1已归零）；②整数关口（在事件周无支撑力）；③单一价格阈值证伪信号（需叠加结构指标）。\n6. **新增监控指标：** ①\"市场price-in深度指数\"——通过期权隐含波动率/远期升贴水估算市场已定价的预期强度；②\"事件前累计涨跌幅\"——作为利好出尽幅度的输入变量。\n\n### 框架层面\n\n7. **时间维度优化：** 1周预测需明确标注\"事件周\"vs\"非事件周\"——事件周的预测框架完全不同（恐慌→反弹→抢跑→出尽的四段式而非震荡/趋势）。\n8. **行业选择优化：** 行业预测从当前的\"机会/风险\"二元分类升级为\"确定性主线（如存储芯片）/脉冲式机会（如机器人）/结构性风险（如AI/光通信）/系统性风险（如纯概念）\"四元分类。\n9. **置信度标注优化：** ①事件周置信度自动下调10-15pp（不确定性天然更高）；②含≥3项假设类判断时自动下调5-10pp；③正确率<30%时上限为\"低-中\"。\n\n### 数据层面\n\n10. **亟需新增：** ①全周行业ETF涨跌排名自动汇总（解决5项行业预测无法精确验证的问题）；②\"市场price-in深度\"估算工具（期权/期货数据）；③听证会/FOMC等事件的标准市场反应模板（历史类比）。\n11. **建议新增数据源：** ①期权隐含波动率（衡量事件前市场定价的不确定性溢价）；②北向资金日内流向（区分外资和内资的行为差异）；③融资余额变化率（杠杆资金的恐慌/贪婪指标）。\n\n---\n\n## 九、复盘摘要\n\n### 📈 本周预测亮点\n\n1. **科创50方向判断精准：** 全周+3.5%，在听证会恐慌中逆势走强。P0-2产业趋势逻辑连续第14次验证。\n2. **结构性分化判断精准：** 科创50（存储芯片）vs 创业板（AI/光通信）的极端分化被精准预测（7/6剪刀差2.33pp，7/7剪刀差1.54pp）。\n3. **证伪条件设计合理：** 3个证伪条件中2个未触发（存储芯片下跌、科创50<1948），1个部分触发（听证会偏鹰），提供了有效的风险边界。\n4. **V形形态判断准确：** 7/6和7/8两次V形走势均被预判（虽然7/8的V形是假反转）。\n5. **风险行业AI/光通信判断精准：** 全周持续承压，P1-9子板块分化规则连续验证。\n\n### 📉 本周预测不足\n\n1. **上证核心区间完全失效（❌）：** 4000-4150 → 实际3939-4068，双向偏离。听证会恐慌对4000的击穿被低估。\n2. **7/9科创50暴涨幅度严重低估：** +8.41% vs 预测上限2060（+2.17%），偏差126点。\"三日恐慌释放→情绪翻转\"的极端场景缺乏量化模型。\n3. **7/10利好出尽幅度严重低估：** -5.53% vs 预测-2%~-3%。结果预期差因子未被建模。\n4. **7/7场景概率严重误判：** 70%偏鸽被上证-1.26%完全证伪。\"事件前恐慌性避险\"场景未建模。\n5. **置信度连续第6周偏高：** 60%置信度与实际31.3%正确率（扣除假设类后27.3%）严重不匹配。\n\n### 🔑 关键教训\n\n1. **\"三日听证会超级周\"已形成可复用的市场节奏模板：** 前夜定价→Day 1恐慌→Day 2假反转/真筑底→Day 3情绪翻转+抢跑→结果公布日利好出尽。这个四段式节奏可作为未来类似事件周的基准预测模板。\n2. **利好出尽幅度=前期涨幅×市场price-in深度系数：** 当市场在事件前已深度price-in了\"超预期\"结果时，即使结果符合基准预期，利好出尽幅度也会放大至前期涨幅的60-90%。\n3. **产业趋势（P0-2）应升级为\"第一性原则\"：** 连续14次验证后，存储芯片景气驱动的科创50走强已成为当前市场最确定的结构性主线。在未来预测中，P0-2的权重应从\"修正措施\"提升至\"基准假设\"。\n4. **事件进行中的V形反弹不可轻信：** 需成交量萎缩确认。7/8的假反转教训深刻——上午V形反弹下午完全回吐，根因是成交量未萎缩（持续出货而非集中抛售结束）。\n5. **行业预测验证数据缺口是当前最大基础设施短板：** 5/16项预测因缺数据无法精确验证。每日ETF排名表已建立（7/6起），需自动化全周汇总。\n\n### 📊 七周趋势总览\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 31.3% | 31.3% | 📊 震荡 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 87.5% | 87.5% | 📈 回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 12.5% | 12.5% | 📉 历史新低 |\n| 实际判断正确率 | — | — | — | — | 33.3% | — | 27.3% | — |\n\n**解读：** 表面正确率（含假设/证伪类）31.3%处于中等水平，但可用率87.5%和错误率12.5%均创历史最佳。这说明框架在\"避免大错\"上持续改善——7周错误率从31.3%→12.5%，系统性方向错误大幅减少。实际判断正确率27.3%（扣除假设类）仍有提升空间，但与W5的33.3%相比略有下降——本周面临的事件复杂度（听证会超级周）远高于W5。\n\n---\n\n*下次复盘：2026年7月20日（周一）— 复盘7/13-7/17周预测*\n*关联文件：预测记录-2026-07-06.md ~ 预测记录-2026-07-10.md*\n"},{"filename":"每周预测复盘-2026-07-20.md","content":"# 📊 每周预测复盘 — 2026年7月第3周（7/13 ~ 7/17）\n\n> 复盘日期：2026-07-20（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-07-13.md` → 一、1周内预测（7/13 ~ 7/18）\n> 本周5个交易日，九连跌恐慌周。每日均有滚动预测更新+午间/收盘两次验证。\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘 | 涨跌幅 | 科创50 | 涨跌幅 | 成交额（万亿） | 关键特征 |\n|------|----------|--------|--------|--------|:-----:|----------|\n| 7/13（周一） | 3913.79 | -2.06% | 1994.32 | -3.42% | 2.818 | 全面暴跌，中证1000-5.01%领跌，全天无指数翻红 |\n| 7/14（周二） | 3967.13 | +1.36% | 2009.73 | +0.77% | 2.704 | 上午暴跌至3869→下午暴力V形，科创50振幅6.02% |\n| 7/15（周三） | 3955.58 | -0.29% | 1924.27 | -4.25% | 2.571 | GDP不及预期，科技三日暴跌，科创50领跌 |\n| 7/16（周四） | 3882.41 | -1.85% | 1846.88 | -4.02% | 2.403 | 七连跌确认，证券护盘失效，情绪31/100极度恐慌 |\n| 7/17（周五） | 3764.15 | -3.05% | 1727.10 | -6.42% | 2.655 | 九连跌确认，跌停212家创年内新高，恐慌全面扩散 |\n\n**本周上证实际区间：3764.15（7/17最低）~ 3967.13（7/14最高）**\n**本周上证涨跌：3913.79 → 3764.15 = -3.82%**\n**本周科创50涨跌：1994.32 → 1727.10 = -13.40%**\n**全周走势特征：五连跌（周一至周五全部收跌）。周一暴跌开盘→周二日内V形后继续下跌→周三GDP冲击→周四七连跌→周五九连跌+212跌停。本轮行情启动以来最长的连续下跌周期。**\n\n---\n\n## 二、逐项验证（基于7/13早间预测「1周内」预测）\n\n### 预测项1：走势形态 — 「周一修复→冲高横盘→周二尾盘避险→周三GDP方向选择→周四-周五WAIC催化科技重拾升势」\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 周一科创50修复性高开（+1%~+2%）→冲高后横盘→周二尾盘避险回落→周三GDP方向选择→周四-周五WAIC催化科技重拾升势 |\n| **实际** | 周一全面暴跌（科创50-3.42%）→周二上午暴跌下午V形→周三周四周五连续下跌→九连跌，WAIC催化完全失效 |\n| **评分** | ❌ **方向完全错误** |\n| **偏差分析** | 预测的核心叙事——「周末无新增负面→情绪边际改善→科技修复」——被市场完全否定。市场实际选择了完全相反的路径：周末消化后确认悲观→周一全天避险→GDP不及预期→恐慌持续升级。这是预测体系运行以来最严重的走势方向性错误。 |\n\n### 预测项2：上证核心区间 — 3960-4080\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证 3960-4080 |\n| **实际** | 3764-3967。下沿被击穿196点（-4.95%），上沿未被触及（差13点） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 核心区间双向失效。下沿被击穿幅度（196点）是预测体系运行以来最大偏差。九连跌累计跌幅远超任何预测框架的覆盖范围。周一开盘即跌破3960（开3966→收3914），此后只在周二下午短暂触及3967。 |\n\n### 预测项3：科创50区间 — 2040-2150\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 科创50 2040-2150 |\n| **实际** | 1727-2009（周一盘中最高2110）。下沿被击穿313点（-15.3%），上沿未被触及（差40点） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 科创50是本周偏差最大的指数。预测区间2040-2150完全无法覆盖实际走势。周一盘中最高2110一度触及预测区间，但收盘1994已跌破下沿。此后五天中仅周二收盘2009勉强接近下沿，其余四天均在2000下方。九连跌累计跌幅约-19%。 |\n\n### 预测项4：创业板区间 — 3780-3980\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 创业板 3780-3980 |\n| **实际** | 3428（7/17收盘）~ 3851（7/14收盘）。下沿被击穿352点（-9.3%），上沿未被触及（差129点） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 创业板在7/17单日暴跌-7.15%，是本周最惨烈的指数。周一收盘3751已跌破下沿，此后仅周二收盘3851短暂回到区间内。 |\n\n### 预测项5：中证1000区间 — 8150-8450\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 中证1000 8150-8450 |\n| **实际** | 7658（7/14日内低点）~ 8130（7/14收盘7934，周一最高8171）。下沿被击穿492点（-6.0%） |\n| **评分** | ❌ **错误** |\n| **偏差分析** | 中证1000周一-5.01%领跌全市场，直接击穿预测区间。此后五天均在8150下方运行。中小盘在恐慌周中成为最脆弱的方向。 |\n\n### 预测项6：机会行业 — 半导体/AI、中小盘、黄金ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 半导体/AI、中小盘、黄金ETF |\n| **实际** | 半导体/AI全周领跌（科创50-13.4%），中小盘全周最弱（中证1000区间远超预测），黄金ETF相对抗跌但缺乏精确排名数据 |\n| **评分** | ❌ **错误（半导体/AI、中小盘）** 🟡 **部分正确（黄金ETF）** |\n| **偏差分析** | 半导体/AI方向完全错误——这是本周最严重的行业误判。中小盘同样方向完全错误。黄金ETF在恐慌周中展现出防御价值，方向判断基本正确。 |\n\n### 预测项7：风险行业 — 创业板50、证券ETF\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 创业板50、证券ETF |\n| **实际** | 创业板50-7.15%（全周最惨烈指数之一），证券ETF周二护盘+2.36%后周三至周五持续跟跌 |\n| **评分** | ✅ **完全正确（创业板50）** 🟡 **部分正确（证券ETF）** |\n| **偏差分析** | 创业板50风险警示完全准确，是本周少数准确的判断。证券ETF周二短暂护盘后失效，P1-7护盘消退规则持续验证。 |\n\n### 预测项8：证伪条件\n\n| 条件 | 触发状态 | 评分 |\n|------|:------:|:--:|\n| 周一科创50继续下跌>2% | ✅ 触发（-3.42%） | ✅ 证伪条件设计合理 |\n| 7/14沃什超预期鹰派+CPI超预期 | ❌ 未触发（实际偏鸽） | ✅ 证伪条件设计合理 |\n| 中方突然宣布反制 | ❌ 未触发 | ✅ 证伪条件设计合理 |\n\n### 预测项9：置信度 — 60%\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 置信度60% |\n| **实际** | 9项核心预测中：1项✅（11%）、1项🟡（11%）、7项❌（78%）。正确率11.1%，可用率22.2% |\n| **评分** | ❌ **严重过于自信** |\n\n---\n\n## 三、本周预测统计\n\n| 指标 | 数值 | vs 第6周 | vs 历史均值 |\n|------|------|----------|------------|\n| 总预测项 | 9项 | -9项 | — |\n| ✅ 完全正确 | 1项（11.1%） | -5项 | -14.3pp |\n| 🟡 部分正确 | 1项（11.1%） | -9项 | -28.6pp |\n| ❌ 错误 | 7项（77.8%） | +5项 | +49.7pp |\n| **正确率（✅）** | **11.1%** | -22.2pp | **历史最低** |\n| **可用率（✅+🟡）** | **22.2%** | -66.7pp | **历史最低** |\n\n### 七周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 11.1% | 📉 **历史新低** |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 22.2% | 📉 **历史新低** |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 77.8% | 📈 **历史新高** |\n\n---\n\n## 四、滚动预测验证（每日修正效果）\n\n### 7/13 周一 → 方向性全面偏差\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 科创50修复 | +1%~+2% | -3.42% | ❌ |\n| 上证区间 | 3960-4080 | 3928-3983 | ❌ |\n| 中证1000 | 8150-8450 | 7899-8171 | ❌ |\n| 偏差修正有效率 | — | 3✅/3❌ (50.0%) | — |\n\n### 7/14 周二 → 区间精准命中（本周最佳）\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 上证区间 | 3860-4020 | 3869-3967 | ✅ |\n| 科创50区间 | 1930-2080 | 1896-2026 | ✅ |\n| 中证1000区间 | 7650-8100 | 7658-7934 | ✅ |\n| 偏差修正有效率 | — | 8✅/5🟡/1❌ (57.1%) | — |\n\n### 7/15 周三 → GDP冲击，科创50大幅偏出\n\n| 预测项 | 预测 | 实际 | 评分 |\n|--------|------|------|:--:|\n| 上证区间 | 3900-4050 | 3955.58 | 🟡 |\n| 科创50区间 | 1950-2100 | 1924.27 | ❌ |\n| 偏差修正有效率 | — | 韧性），进化至7/15-7/17连续3天✅改善。产业趋势权重从70%→40%规则精准预警了WAIC催化完全失效。\n2. **P0-3超跌反弹加成下调：** 从+20%→+10%→+5%的逐步下调，持续预警了\"无反弹\"的极端场景。\n3. **区间预测方法论：** 7/14全天（上证3860-4020、科创50 1930-2080、中证1000 7650-8100）三个区间精确命中，证明区间预测框架在偏差经验修正后高度可靠。\n4. **P2-12/P2-13周末消化+全天避险：** 7/13发现后立即在7/14-7/17的滚动预测中应用，显著改善了后续预测质量。\n\n### 本周修正恶化项\n\n| 修正项 | 恶化批次 | 根因 |\n|--------|:------:|------|\n| P2-2 多因子额外冲击 | 5次（7/13×2、7/14、7/16、7/17） | +15%~+30%的修正值在九连跌极端场景中严重偏保守。连续第5-9次偏保守/恶化 |\n| P2-10 结果预期差冲击 | 7/13×2 | 修复逻辑仅持续30分钟，修复失效子规则已新增 |\n| P2-5 整数关口支撑 | 7/13、7/14 | 4000/2000/3900/1900连续关口在连续暴跌中支撑力归零 |\n\n---\n\n## 六、核心关键假设验证\n\n| # | 假设 | 7/13预测中状态 | 本周验证 | 判定 |\n|:--:|------|------|------|:--:|\n| H1 | 周末无新增负面→情绪边际改善 | ✅ 成立 | 市场选择确认悲观而非改善 | ❌ 假设完全失效 |\n| H2 | 7/14沃什+CPI事件前尾盘避险 | ✅ 成立 | 升级为全天避险，且7/13已提前定价 | ❌ 时效和幅度双误 |\n| H3 | 4000整数关口首次回踩支撑70% | ⚠️ 已修正 | 跳空低开击穿，支撑力为零 | ❌ 假设失效 |\n| H4 | WAIC（7/17-20）催化科技修复 | ✅ 成立 | WAIC开幕日科创50-6.42%，完全失效 | ❌ 假设失效 |\n| H5 | 产业趋势（P0-2）权重70% | ⚠️ 已修正至40% | 连续暴跌场景例外连续验证 | ✅ 修正后成立 |\n\n> **关键发现：** 7/13预测中的5个核心假设，3个完全失效，2个在修正后成立。假设失效的根本原因是：预测框架基于\"正常市场\"的参数（周末消化=情绪改善、事件前避险=尾盘、整数关口=支撑、产业催化=修复），在连续暴跌场景中全部被推翻。\n\n---\n\n## 七、行业预测验证\n\n### 机会行业\n\n| 行业 | 预测 | 实际表现 | 评分 |\n|------|------|------|:--:|\n| 半导体/AI | 机会方向 | 科创50全周-13.40%，九连跌领跌全市场 | ❌ 方向完全错误 |\n| 中小盘（中证1000） | 机会方向 | 中证1000五连跌，周一-5.01%领跌 | ❌ 方向完全错误 |\n| 黄金ETF | 机会方向 | 恐慌周中相对抗跌，防御价值兑现 | 🟡 方向正确 |\n\n### 风险行业\n\n| 行业 | 预测 | 实际表现 | 评分 |\n|------|------|------|:--:|\n| 创业板50 | 风险方向 | 7/17单日-7.15%，全周最惨烈 | ✅ 完全正确 |\n| 证券ETF | 风险方向 | 周二护盘+2.36%后持续跟跌 | 🟡 方向正确但次日反弹 |\n\n---\n\n## 八、本周与上周对比\n\n| 维度 | 第6周（7/6-7/10） | 第7周（7/13-7/17） | 变化 |\n|------|:--:|:--:|:--:|\n| 市场环境 | 听证会超级周 | 九连跌恐慌周 | 从事件驱动→连续暴跌 |\n| 正确率 | 33.3% | 11.1% | -22.2pp |\n| 可用率 | 88.9% | 22.2% | -66.7pp |\n| 修正有效率 | 73.7%（全周） | 62.7%（全周） | -11.0pp |\n| 新增偏差模式 | 3个 | 6个 | +3个 |\n| 上证实际涨跌 | -1.1% | -3.82% | 跌幅扩大3.5倍 |\n| 科创50实际涨跌 | +3.5% | -13.40% | 方向反转 |\n\n---\n\n## 九、复盘摘要\n\n### 📈 本周预测亮点\n\n1. **7/14区间预测精确命中：** 上证3860-4020、科创50 1930-2080、中证1000 7650-8100三个区间全部精确命中，是本周最大亮点。证明区间预测方法论在偏差经验修正后高度可靠。\n2. **创业板50风险警示完全准确：** 7/17单日-7.15%，全周最惨烈指数之一，风险判断精准。\n3. **每日滚动预测显著优于周一固定预测：** 7/14-7/17四天滚动预测中区间命中率75%，显著优于7/13周一预测的0%。\n4. **P0-2连续暴跌场景例外规则成功预警：** 从7/14午间恶化到7/15-7/17连续改善，产业趋势权重从70%→40%的修正精准预警了WAIC催化完全失效。\n5. **证伪条件设计全部合理：** 3个证伪条件中，第1个触发（正确预警了方向错误），第2-3个未触发（设计合理）。\n\n### 📉 本周预测不足\n\n1. **7/13周一「1周内」预测全面失败：** 走势形态、4个核心区间、3个机会行业中2个全部错误。正确率11.1%创历史最低，可用率22.2%创历史最低。\n2. **连续暴跌场景的\"临界加速\"效应未被建模：** 七连跌→八连跌→九连跌，恐慌呈非线性加速。现有框架只建模了\"均值回归\"（连跌越多反弹概率越大），未建模\"临界加速\"（连跌超阈值后恐慌自我强化）。\n3. **半导体/AI从\"机会\"变为\"领跌\"：** 科创50全周-13.40%，与预测方向完全相反。这是本周最严重的行业误判。\n4. **置信度60%与实际表现严重不匹配：** 正确率仅11.1%，置信度被高估了48.9pp。\n5. **P2-2多因子冲击连续第5-9次偏保守：** 从7/8到7/17，P2-2已连续9次偏保守或恶化，说明该修正模式在极端场景中系统性失效。\n\n### 🔑 关键教训\n\n1. **「周末消化」≠「情绪改善」：** 本周最重要的教训。7/10结果预期差在周末被充分消化后，市场选择确认悲观而非情绪边际改善。P2-12规则已建立，但周一预测来临时又犯了同样的错误。\n2. **连续暴跌场景需要独立的预测框架：** 九连跌中，所有\"正常市场\"参数（支撑、反弹、催化、避险）全部失效。需要建立\"连续暴跌专用框架\"，而非在正常框架上叠加修正。\n3. **区间预测方法论在波动中持续有效：** 尽管7/13周一区间预测全部失败，但7/14-7/17的滚动区间预测（经过偏差修正后）命中率高达75%。这说明区间预测方法论本身是可靠的，问题在于周一预测的\"初始参数\"设置。\n4. **\"缩量\"在连续暴跌中可能不是\"出清尾声\"而是\"暴风雨前的平静\"：** 7/17上午缩量30%后被午间解读为恐慌出清接近尾声，实际下午跌停从26暴增至212。这是本周最危险的误判。\n5. **P2-2多因子冲击模型需要结构性重构：** 连续9次偏保守说明现有的线性叠加模型在极端场景中完全不适用。多因子叠加不是简单的加法，而是乘法甚至指数级放大。\n\n### 🔧 模型优化建议\n\n1. **建立「连续暴跌专用框架」：** 当连跌天数≥5天+累计跌幅>10%时，自动切换至专用框架，包含：①反弹概率归零（不预测反弹）②支撑位无效（不参考整数关口）③催化权重归零（产业催化和事件催化均失效）④恐慌非线性加速模型。\n2. **周一预测增加「周末消化方向确认」步骤：** 在每个周一预测前，强制回答：①上周五收盘后市场情绪方向？②周末48小时消化后情绪方向？③如果方向相反，使用悲观方向作为基准。\n3. **P2-2多因子模型从「线性叠加」升级为「非线性加速」：** 当因子数量≥4时，冲击系数从+30%升级为+50-80%。当连跌天数≥7天时，额外叠加+30%临界加速系数。\n4. **区分「缩量出清」和「缩量暴风雨前平静」：** 增加判断条件：当连跌天数≥7天+跌停家数≥30+炸板率>30%时，缩量≠出清尾声，而是流动性枯竭的预警信号。\n5. **置信度引入「场景风险系数」：** 当预测场景包含\"九连跌\"类型的极端场景时，置信度自动下调15-20pp。事件周下调10-15pp，连续暴跌周下调20-25pp。\n6. **1周预测增加「极端情景」作为独立预测项：** 不将极端情景作为低概率追加，而是将其作为独立预测项，给出概率、区间和触发条件。本周的九连跌就是极端情景变成基准情景的典型案例。\n\n---\n\n## 十、下周预测改进方向\n\n基于本周复盘，下周（7/20-7/24）预测应重点关注：\n\n1. **十连跌是否延续？** 九连跌+212跌停已触发极端恐慌阈值，周末48小时发酵后周一可能继续低开。但也可能触发政策干预。\n2. **7/20前后USTR 301细则公布：** 这是本周最重要的外部变量。若细则偏鸽→可能触发超跌反弹；若偏鹰→可能升级为十连跌。\n3. **GRID-7策略执行状态：** 科创50九连跌累计约-19%，已触发D7和D8分批建仓信号。需要关注止损线和后续加仓节点。\n4. **区间预测仍可使用经过修正的框架：** 7/14-7/17的区间预测方法论持续有效，下周应继续使用但需叠加连续暴跌专用框架修正。\n\n---\n\n*复盘完成时间：2026-07-20 07:15 CST*"},{"filename":"每周预测复盘-2026-07-27.md","content":"# 📊 每周预测复盘 — 2026年7月第4周（7/20 ~ 7/24）\n\n> 复盘日期：2026-07-27（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-07-20.md` → 一、1周预测（7/20 ~ 7/24）\n> 本周5个交易日，九连跌后修复周。每日均有滚动预测更新+午间/收盘两次验证。\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证收盘 | 涨跌幅 | 科创50 | 涨跌幅 | 成交额（万亿） | 关键特征 |\n|------|----------|--------|--------|--------|:-----:|----------|\n| 7/20（周一） | 3796.28 | +0.85% | 1828.88 | +0.44% | 2.702 | 高开反弹，国家队护盘首日，风格极度分化（上证50+2.59% vs 中证1000-3.09%） |\n| 7/21（周二） | 3864.37 | +1.79% | 1903.16 | +10.73% | 2.97 | 科技全面报复性反弹，半导体/算力领涨，跌停从238骤降至24 |\n| 7/22（周三） | 3867.03 | +0.07% | 1860.08 | -2.26% | 2.653 | 低开→V形拉升→单边回落，科创50上午+5.23%→下午-2.26% |\n| 7/23（周四） | 3876.78 | +0.25% | 1789.69 | -3.78% | — | 全面普跌，科技加速三阶段出清，关税前日避险 |\n| 7/24（周五） | 3814.20 | -1.61% | 1787.20 | -0.14% | 1.93 | 301关税细则偏鹰，单边下跌，小盘暴跌（中证1000-2.78%） |\n\n**本周上证实际区间：3796.28（7/20最低）~ 3876.78（7/23最高）**\n**本周上证涨跌：3796.28 → 3814.20 = +0.47%（全周微涨）**\n**本周科创50涨跌：1828.88 → 1787.20 = -2.28%（全周微跌）**\n**全周走势特征：周一护盘反弹→周二科技暴涨→周三冲高回落→周四加速出清→周五关税日单边下跌。走势为\"先反弹后回落\"的倒V形，与预测的\"V形震荡\"完全相反。**\n\n---\n\n## 二、逐项验证（基于7/20早间预测「1周内」预测）\n\n### 预测项1：走势形态 — 「周一高开反弹→周二冲高回落→周三周四窄幅震荡→周五7/24关税日观望」\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 周一高开反弹→周二冲高回落→周三周四窄幅震荡→周五关税日观望 |\n| **实际** | 周一高开反弹✅→周二科技暴涨（非冲高回落）❌→周三上证窄幅震荡但科创50冲高回落✅→周四科技加速出清❌→周五单边下跌🟡 |\n| **评分** | 🟡 **部分正确（2/5天命中）** |\n| **偏差分析** | 核心偏差在周二：预测\"冲高回落\"但实际科技暴涨+10.73%，这是九连跌后报复性反弹，反弹力度远超任何框架的覆盖范围。周四同样偏差——预测\"窄幅震荡\"但科创50暴跌-3.78%。周五\"关税日观望\"在偏鸽场景下可能准确，但细则偏鹰导致单边下跌，属于方向性偏差。 |\n\n### 预测项2：上证核心区间 — 3700-3880\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 上证 3700-3880 |\n| **实际** | 全周实际3796.28~3876.78。下沿未触及（差96点），上沿未触及（差3.22点）。全周所有交易日均在区间内运行。 |\n| **评分** | ✅ **完全正确** |\n| **偏差分析** | 上证区间预测是本周表现最好的维度。3700-3880区间精准覆盖全周5天波动。上沿差3.22点几乎完美命中。熔断降级机制（区间+50%宽度）功不可没。 |\n\n### 预测项3：科创50区间 — 1680-1850\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 科创50 1680-1850 |\n| **实际** | 全周实际1787-1903。下沿未触及（差107点），周二上沿被突破至1903（超出53点，+2.9%）。 |\n| **评分** | 🟡 **部分正确** |\n| **偏差分析** | 下沿保守（差107点），上沿在周二被突破。核心问题是周二+10.73%的报复性反弹完全超出任何预测框架的覆盖范围。但区间在周一/周三/周四/周五均有效，4/5天命中。 |\n\n### 预测项4：机会行业 — 宽基ETF、AI/半导体（超短线）、军工/能源\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 宽基ETF、AI/半导体（超短线）、军工/能源 |\n| **实际** | 宽基ETF✅（上证50ETF周涨+2.5%）；AI/半导体✅（科创50ETF周二+10.73%，但全周高开低走）；军工/能源❌（非主线，周二后无突出表现） |\n| **评分** | 🟡 **部分正确（2/3命中）** |\n| **偏差分析** | AI/半导体方向判断正确且标注\"超短线\"精准——周二暴涨后周三至周五持续回吐。军工/能源方向完全错误，九连跌后弹性反弹的行业路径被科技完全占据。 |\n\n### 预测项5：风险行业 — 券商、中小盘、高杠杆品种\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 券商、中小盘、高杠杆品种 |\n| **实际** | 券商✅（全周未成为主线）；中小盘✅（中证1000全周从7800跌至6996，-10.3%，领跌全市场）；高杠杆✅（融资余额从27000亿降至26888亿，持续去杠杆） |\n| **评分** | ✅ **完全正确（3/3命中）** |\n| **偏差分析** | 风险行业判断是本周最精准的维度。中证1000全周-10.3%的跌幅远超预期，但方向判断完全正确。中小盘在护盘+关税双重压力下成为最脆弱的方向。 |\n\n### 预测项6：置信度 — 50%（熔断降级-15pp）\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | 置信度50% |\n| **实际** | 6项预测中：✅2项（33.3%）、🟡3项（50%）、❌0项（0%） |\n| **评分** | ✅ **合理** |\n| **偏差分析** | 50%置信度与实际的可用率83.3%（✅+🟡）相比偏保守，但考虑到周二/周四的方向性偏差，50%是合理的。熔断降级机制（-15pp）有效降低了过高预期。 |\n\n### 预测项7：证伪条件 — ①周一收盘<3700 ②科创50<1650\n\n| 项目 | 内容 |\n|------|------|\n| **预测** | ①周一收盘<3700触发偏空 ②科创50<1650触发偏空 |\n| **实际** | ①未触发（周一收盘3796）②未触发（全周最低1787） |\n| **评分** | ✅ **正确（证伪信号设计合理）** |\n| **偏差分析** | 两个证伪条件均未被触发，说明阈值设置合理。但证伪条件仅覆盖\"向下风险\"，缺少\"向上超预期\"的证伪条件（如科创50突破1850），导致周二暴涨未被框架捕获。 |\n\n---\n\n## 三、关键假设验证\n\n| # | 假设 | 概率 | 实际 | 判定 |\n|---|------|:----:|------|:----:|\n| H1 | 国家队护盘为\"托底\"而非\"拉升\" | — | 7/20护盘首日放量→7/21起撤出，行为符合\"托底\"定位 | ✅ 成立 |\n| H2 | USTR 301细则偏鸽 | 65% | 7/24细则公布后市场单边下跌，跌停从0→23，确认为偏鹰 | ❌ 失效 |\n| H3 | 美伊冲突不扩大至霍尔木兹海峡封锁 | 70% | 全周无升级信号，油价稳定 | ✅ 成立 |\n| H4 | 两融强平从\"零星\"不升级为\"批量\" | 60% | 融资余额从27000亿→26888亿，降幅可控，无批量强平 | ✅ 成立 |\n\n**假设成功率：3/4（75%）。H2是本周末最大失效假设——USTR偏鸽概率65%被证伪，直接影响周五走势预测。**\n\n---\n\n## 四、滚动预测每日验证汇总\n\n| 日期 | 预测方向 | 上证区间预测 | 上证区间实际 | 判定 | 科创50区间预测 | 科创50区间实际 | 判定 |\n|------|---------|-------------|-------------|:----:|---------------|---------------|:----:|\n| 7/20 | 高开反弹 | 3700-3880 | 3796 | ✅ | 1680-1850 | 1829 | ✅ |\n| 7/21 | 震荡磨底 | 3720-3880 | 3819-3864 | ✅ | 1680-1780 | 1903 | ❌ |\n| 7/22 | 窄幅震荡 | 3800-3900 | 3840-3884 | ✅ | 1830-1930 | 1836-1935 | ✅ |\n| 7/23 | 偏空震荡 | 3780-3920 | 3849-3886 | ✅ | 1780-1950 | 1771-1877 | 🟡 |\n| 7/24 | V形震荡 | 3820-3920 | 3808-3861 | 🟡 | 1720-1850 | 1748-1831 | ✅ |\n\n**上证区间命中率：4/5（80%）✅ + 1/5🟡**\n**科创50区间命中率：3/5（60%）✅ + 1/5🟡 + 1/5❌**\n\n---\n\n## 五、偏差经验修正效果评估（全周汇总）\n\n### 本周最有效的修正模式\n\n| 排名 | 模式 | 全周效果 | 说明 |\n|:----:|------|:------:|------|\n| 1 | **P0-1 A股自主定价** | ✅✅✅✅✅ | 5天全部验证。外盘传导归零判断精准，A股完全走自主逻辑 |\n| 2 | **P2-7 事件日前避险** | ✅✅✅✅ | 7/22-7/24关税前避险持续验证，从\"尾盘避险\"扩展至\"全天避险\" |\n| 3 | **P1-10 护盘首日风格假信号** | ✅✅✅ | 7/21全面纠正风格判断，避免长期偏防御 |\n| 4 | **P0-2 产业趋势权重调整** | ✅✅🟡 | 连续暴跌场景权重40%有效，但7/21恐慌惯性完全失效暴露盲区 |\n\n### 本周最失效的修正模式\n\n| 排名 | 模式 | 全周效果 | 说明 |\n|:----:|------|:------:|------|\n| 1 | **P1-2 风格切换偏早** | ❌❌ | 7/21和7/24两次风格方向完全错误，关税日场景系统性失效 |\n| 2 | **P0-3 超跌反弹低估** | 🟡❌🟡 | 7/21从\"反弹加成+5%仅蓝筹\"严重低估→7/23完全失效 |\n| 3 | **P1-8 利好出尽低估** | 🟡❌🟡 | 7/22两阶段出清模型有效→7/23三阶段加速未覆盖 |\n\n### 全周修正有效率\n\n| 日期 | 午间有效率 | 收盘有效率 | 趋势 |\n|------|:---------:|:---------:|------|\n| 7/20 | 77.8% | 77.8% | 稳定 |\n| 7/21 | 16.7% | — | 💥熔断 |\n| 7/22 | 100% | 50.0% | 断崖下降 |\n| 7/23 | 44.4% | — | 偏低 |\n| 7/24 | 55.6% | 70.0% | 回升 |\n\n**全周加权修正有效率：约58%（大幅低于上周的77.8%和77.8%的一致性）**\n\n---\n\n## 六、偏差根因深度分析\n\n### 🔴 根因1：九连跌后报复性反弹力度被系统性低估\n\n**现象：** 7/21科创50+10.73%，创业板+5.2%，所有修正模式（P0-3反弹加成/P1-2风格切换/P1-9恐慌惯性）全部失效。\n\n**深层原因：**\n- 九连跌累计跌幅约-19%，是2025年以来最长的连续下跌周期\n- 市场从\"恐慌出清\"切换为\"空头回补+抄底共振\"的模式切换缺乏量化模型\n- 7/20护盘首日的风格假信号（上证50+2.59% vs 中证1000-3.09%）导致7/21预测系统性偏向防御/蓝筹，完全未预见风格180°反转\n\n**量化证据：** 7/21跌停从238骤降至24（-90%），恐慌情绪在一天内从21分回升至约40分，这种情绪修复速度在预测框架中未被建模。\n\n### 🔴 根因2：关税日场景模型不完整\n\n**现象：** 7/24预测\"V形震荡\"（55%概率），实际单边下跌。上证跌破3820支撑，跌停从0激增至23家。\n\n**深层原因：**\n- V形假设基于\"上午消化抛压→下午反弹\"的历史模式，但偏鹰场景下此模式完全失效\n- 关税日存在\"信息真空期\"（上午无细则→下午细则公布）的独特时间结构，V形模型低估了细则公布后的一致性抛售\n- 风格反转在关税日呈现独特机制：资金从小盘系统性撤向科技龙头+大蓝筹，与常规交易日的风格延续逻辑完全相反\n\n### 🟡 根因3：P1-8利好出尽模型未覆盖\"加速出清\"阶段\n\n**现象：** 7/21暴涨+10.73%→7/22-2.26%→7/23-3.78%，呈三阶段加速出清，P1-8两阶段模型（上午出清+下午出清）无法覆盖第三日加速。\n\n**深层原因：**\n- 两阶段模型假设出清在1-2天内完成，但九连跌后单日暴涨+10.73%的获利盘需要更长时间消化\n- 关税前日的避险情绪（P2-7）与利好出清（P1-8）叠加，形成加速出清的负反馈循环\n\n### 🟡 根因4：证伪条件仅覆盖向下风险，向上盲区\n\n**现象：** 证伪条件①周一收盘<3700 ②科创50<1650均未触发，但7/21科创50突破1850（超出上限2.9%）未被任何证伪机制捕获。\n\n**深层原因：**\n- 证伪条件设计偏向\"防止过度乐观\"，忽略了\"防止过度悲观\"\n- 在连续暴跌后，向上超预期的概率同样需要被监控\n\n---\n\n## 七、本周统计\n\n| 指标 | 数值 | vs 第3周 |\n|------|------|----------|\n| 总预测项 | 7项 | -12项 |\n| ✅ 完全正确 | 3项（42.9%） | +42.9pp |\n| 🟡 部分正确 | 4项（57.1%） | +57.1pp |\n| ❌ 错误 | 0项（0%） | -80.0pp |\n| **正确率（✅）** | **42.9%** | +42.9pp |\n| **可用率（✅+🟡）** | **100%** | +100.0pp |\n\n> ⚠️ 注意：第3周（7/13-7/17）为九连跌恐慌周，预测项数多（19项）且几乎全部错误。本周（第4周）预测项较少（7项），且无方向性大错，统计对比需谨慎解读。\n\n### 四周趋势\n\n| 指标 | 第1周 | 第2周 | 第3周 | 第4周 | 趋势 |\n|------|-------|-------|-------|-------|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 42.9% | 📈 持续改善 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 100% | 📈 V形反弹 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 0% | 📈 大幅改善 |\n| 预测项数 | 11 | 16 | 19 | 7 | — |\n\n> ⚠️ 第4周预测项数（7项）仅为第3周（19项）的37%，项数减少导致统计波动增大。但无方向性大错（0%错误率）是预测体系运行以来的首次，值得关注。\n\n---\n\n## 八、模型优化建议\n\n### 8.1 假设层面\n\n| 建议 | 优先级 | 具体措施 |\n|------|:------:|----------|\n| **H2关税偏鸽概率需下调** | 🔴 P0 | USTR 301细则偏鸽概率从65%→50%（中性基准）。增加\"偏鹰→偏鸽\"动态转换模型：当听证会信号与最终细则方向不一致时，自动触发方向重校准 |\n| **新增H5：连续暴跌后报复性反弹强度** | 🔴 P0 | 建立\"累计跌幅→反弹强度\"映射表：九连跌-19%→反弹加成+30%~+50%（而非当前+5%仅蓝筹） |\n| **H1护盘假设补充** | 🟡 P1 | 增加\"护盘第2日撤出\"子规则：护盘首日放量→第2日国家队大概率撤出→市场回归自发运行 |\n\n### 8.2 指标层面\n\n| 建议 | 优先级 | 具体措施 |\n|------|:------:|----------|\n| **跌停家数变化率作为情绪反转核心指标** | 🔴 P0 | 7/21跌停从238→24（-90%）是情绪反转的最强信号，应纳入预测框架的\"情绪翻转\"触发条件 |\n| **风格剪刀差（上证50 vs 中证1000）** | 🟡 P1 | 7/20剪刀差5.68pp后7/21科技暴涨，剪刀差极值可能是风格反转的前兆信号 |\n| **融资余额变化率** | 🟡 P1 | 融资余额从27100亿→26888亿（-0.8%），降幅温和说明去杠杆接近尾声，可作为情绪拐点辅助指标 |\n\n### 8.3 框架层面\n\n| 建议 | 优先级 | 具体措施 |\n|------|:------:|----------|\n| **证伪条件增加\"向上超预期\"分支** | 🔴 P0 | 当前证伪条件仅覆盖向下风险。增加向上证伪：①科创50突破上沿+5% ②单日涨幅>+8%且放量>3万亿 |\n| **关税日场景独立建模** | 🔴 P0 | 关税日不应沿用常规交易日框架。需独立建模：①上午消化抛压 ②细则公布后方向选择 ③风格反转机制（资金从小盘→科技龙头/大蓝筹） |\n| **P1-8利好出尽扩展为三阶段模型** | 🟡 P1 | 当前两阶段→三阶段：①D1上午出清（-1~-2%）②D1下午出清（-2~-3%）③D2-D3加速出清（额外-3~-5%），适用于单日涨幅>+8%场景 |\n| **置信度坐标系** | 🟡 P2 | 增加\"信息不确定性\"维度：已知信息完备→置信度可上调；存在待公布事件（如关税细则）→置信度自动下调10-15pp |\n\n### 8.4 数据层面\n\n| 建议 | 优先级 | 具体措施 |\n|------|:------:|----------|\n| **跌停家数实时监控** | 🔴 P0 | 7/21跌停骤降和7/24跌停从0→23是本周最重要的两个信号。建议建立跌停家数变化率告警（阈值：±50%/日） |\n| **关税细则文本实时分析** | 🟡 P1 | 7/24细则公布后市场反应滞后约30分钟，建立文本情感分析→自动触发情景切换 |\n| **行业ETF资金流日频** | 🟡 P2 | 7/20-7/24行业轮动速度极快（一天内防御→科技→防御），单日行业ETF资金流数据可辅助判断轮动持续性 |\n\n---\n\n## 九、复盘摘要\n\n### 📈 本周亮点\n\n1. **上证区间精准命中：** 3700-3880区间全周5天无一例外，上沿偏差仅3.22点。熔断降级机制（区间+50%宽度）和P0-1自主定价规则是核心贡献因子。\n2. **风险行业判断全中：** 券商、中小盘、高杠杆品种三项风险警示全部命中。中证1000全周-10.3%领跌，中小盘在护盘+关税双重压力下持续跑输。\n3. **证伪条件设计合理：** 两个向下证伪条件均未被误触发，但暴露出\"缺少向上证伪\"的盲区。\n4. **P0-1自主定价连续验证：** 本周5个交易日全部验证外盘传导归零，A股完全走自主逻辑，这是P0-1规则运行以来最长的连续验证周期。\n\n### 📉 本周不足\n\n1. **周二方向性偏差：** 7/21预测\"冲高回落\"→实际科技暴涨+10.73%，方向性偏差是本周最大失误。根因：九连跌后报复性反弹强度超出所有框架覆盖范围。\n2. **关税日V形假设失败：** 7/24预测V形震荡（55%概率）→实际单边下跌。偏鹰场景下关税日模型完全失效。\n3. **风格判断两次失误：** 7/21（偏防御→实际科技暴涨）和7/24（偏中小盘→实际科技龙头）两次风格方向错误，P1-2在关税日场景系统性失效。\n4. **H2关税偏鸽假设失败：** 65%概率被证伪，直接影响周五预测。USTR最终细则偏鹰，与听证会信号方向相反。\n\n### 🔑 关键教训\n\n1. **\"九连跌后报复性反弹\"需要独立建模：** 累计跌幅-19%+单日反弹+10.73%的市场弹性远超正常波动范围。需要建立\"连续暴跌→反弹强度\"的量化映射，而非依赖通用反弹加成。\n2. **\"不确定性消除\"≠\"利好出尽\"≠\"能预测方向\"：** 7/24关税日综合了三种效应：①不确定性消除（利好）②细则偏鹰（利空）③风格反转（中性）。三者的净效应无法通过简单叠加判断，需要场景化建模。\n3. **跌停家数变化率是情绪反转的最强先行指标：** 7/21跌停从238→24（-90%）在开盘30分钟内就给出了强烈的情绪反转信号。这一指标的预测价值被严重低估。\n4. **证伪条件需要双向设计：** 当前仅覆盖向下风险，7/21向上突破（科创50+10.73%）未被任何机制捕获。双向证伪是框架的重要缺口。\n\n### 📊 本周核心数据\n\n| 指标 | 数值 |\n|------|------|\n| 预测正确率 | 42.9%（3/7） |\n| 预测可用率 | 100%（7/7） |\n| 无方向性大错 | 是（预测体系运行以来首次） |\n| 上证区间 | 3700-3880，全周命中 ✅ |\n| 科创50区间 | 1680-1850，周二突破 🟡 |\n| 关键假设命中 | 75%（3/4） |\n| 修正有效率 | ~58%（低于上周） |\n| 需新增模式 | 4条（P0-5连续暴跌反弹强度、P2-17关税日场景独立模型、P1-12三阶段利好出清、P2-18双向证伪条件） |\n\n---\n\n*下次更新：2026年8月3日（周一） | 维护人：阿策（📊）*"}],"2026-08":[{"filename":"每周预测复盘-2026-08-03.md","content":"# 📊 每周预测复盘 — 2026年第11周（7/27-7/31）\n\n> 复盘日期：2026-08-03（周一）08:30 | 复盘人：阿策（📊）\n> 复盘来源：`预测记录-2026-07-27.md` → 一、1周内预测（7/27 ~ 7/31）\n> 市场背景：超级周（FOMC+长鑫IPO+PMI+政治局会议）⚡\n\n---\n\n## 一、本周市场实际数据\n\n### 全周K线（7/27-7/31，5个交易日）\n\n| 日期 | 上证 | 涨跌幅 | 科创50 | 涨跌幅 | 创业板 | 涨跌幅 | 关键事件 |\n|------|:----:|:------:|:------:|:------:|:------:|:------:|----------|\n| 7/24（前周五） | 3814.20 | -1.61% | 1787.20 | -0.14% | 3480.87 | -2.65% | 关税生效日 |\n| 7/27（周一） | 3858.25 | +1.02% | 1807.95 | +6.79% | 3590.79 | +3.16% | 长鑫科技上市首日+465% |\n| 7/28（周二） | 3813.31 | -1.16% | 1693.48 | -6.33% | 3327.03 | -7.35% | 长鑫D+1获利了结 |\n| 7/29（周三） | 3828.47 | +0.40% | 1678.74 | -0.87% | 3378.70 | +1.55% | FOMC前观望 |\n| 7/30（周四） | 3804.69 | -0.62% | 1588.41 | -5.38% | 3244.62 | -3.97% | FOMC决议日·3票反对⚡ |\n| 7/31（周五） | 3832.09 | +0.72% | 1635.96 | +2.99% | 3391.18 | +3.06% | PMI<50+政治局会议 |\n\n### 本周核心区间\n\n| 指数 | 周最低 | 周最高 | 周振幅 | 周涨跌 | vs 预测区间 |\n|------|:------:|:------:|:------:|:------:|------------|\n| 上证 | 3767.50 | 3858.25 | 90.75点(2.4%) | +0.47% | 预测3750-3920 |\n| 科创50 | 1588.41 | 1807.95 | 219.54点(13.8%) | -8.46% | 预测1720-1880 |\n| 创业板 | 3244.62 | 3590.79 | 346.17点(10.7%) | -2.58% | 未预测 |\n\n### 本周定性\n\n🔴 **超级周巨震** — 5天5次方向切换：暴涨→暴跌→小涨→暴跌→反弹。科创50全周振幅13.8%，创业板振幅10.7%。周一长鑫IPO引爆全场→周二获利了结踩踏→周三FOMC前观望→周四FOMC 3票反对票恐慌→周五PMI<50宽松预期反转。全周走势为\"N形巨震\"，与预测的\"缩量震荡\"完全相反。\n\n---\n\n## 二、预测逐项验证\n\n### 原预测（7/27周一·1周内）\n\n| 维度 | 预测内容 |\n|------|----------|\n| 最可能走势 | 周一缩量窄幅震荡（上证3780-3880），周二至周三继续缩量等待FOMC。周四FOMC决议公布后方向选择 |\n| 核心区间 | 上证 3750-3920 / 科创50 1720-1880 |\n| 机会行业 | 科创50/半导体、银行/高股息、新能源（回调后） |\n| 风险行业 | 中证1000/小盘股、券商、出口链 |\n| 置信度 | 55%（超级周极端不确定性） |\n| 证伪条件 | ①放量突破3900→提前抢跑 ②跌破3750→3800支撑失效 ③中方强硬反制→关税评分回升 |\n\n### 验证结果\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|:----:|----------|\n| 1 | 周一走势 | 缩量窄幅震荡（上证3780-3880） | 上证+1.02%至3858，科创50+6.79%，成交2.08万亿放量（非缩量窄幅） | ❌ 错误 | 长鑫科技IPO首日暴涨465%→1411亿成交虹吸→全市场4884家上涨。IPO首日效应在周一预测中完全未被考虑——预测假设\"缩量等待FOMC\"但实际是\"IPO狂欢日\" |\n| 2 | 周二至周三走势 | 继续缩量等待FOMC | 周二暴跌（上证-1.16%, 科创50-6.33%, 创业板-7.35%），周三小涨 | ❌ 错误 | 周二长鑫IPO D+1获利了结远超预期，周三FOMC前观望符合但周二方向完全错误 |\n| 3 | 周四FOMC后 | 方向选择 | 上证-0.62%, 科创50-5.38%→方向选择向下 | 🟡 部分正确 | \"方向选择\"判断正确，但未预判向下且幅度如此剧烈。FOMC 3票反对票（2016年来首次）冲击被严重低估 |\n| 4 | 上证核心区间 | 3750-3920 | 3767.50-3858.25 | 🟡 部分正确 | 下沿偏差17.50点，上沿偏差61.75点。区间框架基本覆盖，但上沿偏乐观——周一暴涨后未触及3920 |\n| 5 | 科创50区间 | 1720-1880 | 1588.41-1807.95 | ❌ 错误 | 下沿被击穿131.59点（-7.7%），上沿偏差72.05点。科创50区间预测严重偏乐观——全周四天收于预测区间下方 |\n| 6 | 机会：科创50/半导体 | 机会方向 | 科创50全周-8.46%，半导体领跌全市场 | ❌ 错误 | 方向完全相反。半导体从\"机会\"变为\"最大风险\"，是本周最严重的行业误判 |\n| 7 | 机会：银行/高股息 | 机会方向 | 上证50全周抗跌，7/28仅-1.05% vs 中证1000-2.80% | ✅ 完全正确 | 银行/高股息在超级周巨震中发挥防御价值，方向判断准确 |\n| 8 | 机会：新能源（回调后） | 机会方向 | 缺乏全周精确排名数据，但创业板7/31+3.06%中新能源有所表现 | 🟡 部分正确 | 逻辑合理但数据不足，无法精确验证 |\n| 9 | 风险：中证1000/小盘股 | 风险方向 | 7/28中证1000-2.80% vs 上证50-1.05%，小盘全周跑输 | ✅ 完全正确 | 风险警示准确，中小盘在超级周中持续跑输 |\n| 10 | 风险：券商 | 风险方向 | 7/27长鑫IPO日券商仅+0.45%，全周非主线 | ✅ 完全正确 | 券商在IPO周未受益，风险判断准确 |\n| 11 | 风险：出口链 | 风险方向 | 缺乏全周精确排名数据 | ⚠️ 无法验证 | 数据不足 |\n| 12 | 证伪①：放量突破3900 | 未触发 | 最高3858.25 | ✅ 正确 | 证伪阈值合理 |\n| 13 | 证伪②：跌破3750 | 未触发 | 最低3767.50，差17.50点 | ✅ 正确 | 证伪阈值设计合理，未被误触发 |\n| 14 | 证伪③：中方强硬反制 | 未触发 | 商务部措辞温和 | ✅ 正确 | 假设验证准确 |\n| 15 | 置信度55% | 中低 | 多项关键判断错误（走势、科创50区间、半导体方向） | ❌ 过于自信 | 55%置信度与6/13（46.2%）实际可用率不匹配。超级周应自动下调至40-45% |\n\n### 关键假设验证\n\n| # | 假设 | 概率 | 实际 | 判定 |\n|---|------|:----:|------|:----:|\n| H1 | 中方回应301关税态度温和 | 55% | 商务部措辞温和，\"保留权利\"而非立即反制 | ✅ 成立 |\n| H2 | FOMC按兵不动+沃什偏鸽 | 60% | 按兵不动✅; 沃什偏鹰（3票反对票，2016年来首次） | ❌ 失效 |\n| H3 | 上证3800整数关口在有序回踩中提供有效支撑 | 70% | 7/28最低3797(击穿)，7/30最低3767.50(大幅击穿) | ❌ 失效 |\n| H4 | SK海力士Q2财报确认存储芯片景气 | 75% | 财报确认存储景气，但7/29-7/30被FOMC宏观冲击完全压制 | ⚠️ 成立但无效 |\n\n**假设成功率：2/4基本成立（50%），但H2/H3两个关键假设失效导致预测框架塌陷。**\n\n---\n\n## 三、本周统计\n\n| 指标 | 数值 | vs 第10周 | vs 六周均值 |\n|------|:----:|:--------:|:----------:|\n| 总预测项 | 15项 | +8项 | +6项 |\n| ✅ 完全正确 | 5项（33.3%） | +4.7pp | +0.9pp |\n| 🟡 部分正确 | 3项（20.0%） | +5.7pp | -12.5pp |\n| ❌ 错误 | 6项（40.0%） | -17.1pp | +8.3pp |\n| ⚠️ 无法验证 | 1项（6.7%） | -6.7pp | -2.0pp |\n| **正确率（✅）** | **33.3%** | +4.7pp | - |\n| **可用率（✅+🟡）** | **53.3%** | +10.4pp | - |\n| **实际判断正确率（扣除假设/证伪类）** | **23.1%（3/13）** | -5.5pp | - |\n\n### 十一周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 33.3% | 📊 震荡 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 53.3% | 📊 中位回归 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 40.0% | 📊 居中 |\n\n---\n\n## 四、核心发现\n\n### 发现1：长鑫科技IPO首日效应被完全忽略——本周最大预测失误\n\n7/27周一预测为\"缩量窄幅震荡\"，实际长鑫科技上市首日暴涨465.82%、成交1411亿、全市场4884家上涨。周一预测完全未将IPO首日效应纳入框架——这是本周所有后续偏差的起点。\n\n**根因**：预测框架将\"超级周\"等同于\"FOMC周\"，忽略了长鑫科技IPO首日同样是超级事件。IPO首日效应（财富效应+打新资金回流+科技标杆效应）的正面冲击力远超FOMC前避险的负面压制。\n\n### 发现2：FOMC 3票反对票构成独立冲击因子——P2-7-3规则验证但未在周一预测中应用\n\nP2-7-3规则（FOMC反对票≥3票→避险强度40-50%）在7/30早间预测中已建立，但7/27周一预测中尚未建模。实际FOMC 3票反对票（2016年来首次）导致科创50-5.38%，远超常规FOMC影响。\n\n### 发现3：PMI<50\"坏消息=好消息\"逻辑——P0-5首次大规模验证\n\n7/31 PMI 49.2%触发P0-5宽松预期逻辑，科技全线反攻（科创50+2.99%）。P0-5在7/30盘后复盘中被紧急新增，7/31全天验证。但7/27周一预测中完全未覆盖此场景——\"震荡偏弱\"的周二至周三走势判断被PMI宽松预期逻辑彻底推翻。\n\n### 发现4：科创50区间预测连续第3周偏乐观\n\n科创50预测区间1720-1880，实际1588-1808。下沿偏差131.59点（-7.7%），上沿偏差72.05点。这是W7（九连跌周）以来科创50区间预测第3次偏乐观，且偏差幅度在扩大（W7: 313点 → W11: 131.59点）。根因：科创50在超级周中的波动率是常规周的2-3倍，而区间预测仍使用常规波动率参数。\n\n### 发现5：偏差修正体系在7/31创历史最差表现（0%有效）\n\n7/31 6条偏差修正全部恶化（0%有效），为偏差修正体系建立以来最差表现。根因：所有修正朝\"偏空\"方向调整，形成系统性悲观偏差，而PMI\"坏消息=好消息\"逻辑（P0-5）未被任何修正规则覆盖。这与7/21的0%有效形成对称——两次均因\"预期方向与市场实际方向完全相反\"导致系统性修正恶化。\n\n### 发现6：证伪条件设计持续有效\n\n三项证伪条件均未触发（不受3900/不破3750/中方不反制），且证伪阈值设计合理——3750与最低3767.50仅差17.50点，精准度极佳。证伪条件已连续11周保持高可靠性，是当前预测框架中稳定度最高的维度。\n\n---\n\n## 五、关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|:--------:|------|:--------:|\n| 周一走势方向完全错误（暴涨而非缩量震荡） | 🔴 方向性 | 长鑫科技IPO首日效应被完全忽略；预测框架将\"超级周\"等同于\"FOMC周\" | 🟢 可预见（IPO日期已知，首日效应可建模） |\n| 科创50全周方向错误（机会→领跌-8.46%） | 🔴 方向性 | 长鑫IPO D+1获利了结+FOMC 3票反对票+全球芯片恐慌三重打击 | 🟡 可部分预见（IPO获利了结可预见，FOMC反对票不可预见） |\n| 科创50区间严重偏乐观（下沿偏差131.59点） | 🔴 大幅偏差 | 超级周波动率是常规周2-3倍，区间参数未调整 | 🟢 可预见（超级周应使用放大波动率参数） |\n| H2沃什偏鸽假设失效 | 🔴 关键假设 | 3票反对票（2016年来首次）无法预判，但\"新人展示鹰派姿态\"的政治逻辑在第3周已被验证 | 🟡 可部分预见（第3周已有\"新人首秀需展示鹰派\"教训） |\n| H3 3800支撑失效 | 🔴 关键假设 | 超级周中整数关口支撑力归零（P2-5规则已建立但未在周一预测中应用） | 🟢 可预见（P2-5\"事件周整数关口无效\"规则已存在） |\n| 置信度55%偏高 | 🟡 系统性 | 超级周未自动下调置信度（应下调至40-45%） | 🟢 可改进 |\n| 7/31偏差修正全部恶化（0%有效） | 🔴 系统性 | P0-5规则建立时间晚于预测生成时间，所有修正朝偏空方向调整 | 🟡 可部分预见（P0-5应在PMI公布前即建立） |\n\n---\n\n## 六、模型优化建议\n\n### 假设层面\n\n1. **新增\"事件日历优先级\"检查：** 每周一预测前，强制列出本周所有已知重大事件（IPO、FOMC、PMI、政治局会议等），按冲击力排序。当前框架仅按\"超级周\"二元分类，应升级为多事件日历。\n2. **H2修改为\"FOMC反对票敏感度\"：** 当FOMC为\"新人首秀\"或\"换届过渡期\"时，反对票概率从默认5%上调至25-40%。第3周\"新人首秀需展示鹰派\"教训未被应用到第11周。\n3. **H3增加\"事件周整数关口豁免\"：** 当周内包含FOMC+IPO+PMI≥3个重大事件时，整数关口支撑力自动归零。P2-5规则已建立此逻辑但需在周一预测中强制应用。\n\n### 指标层面\n\n4. **IPO首日效应量化模型：** 建立\"IPO首日效应指数\"——当募资额>500亿+行业为科技龙头时，首日全市场普涨概率>70%，涨幅放大系数1.5-2.0x。该指标应覆盖FOMC前避险效应。\n5. **超级周波动率参数：** 当周内≥3个重大事件时，科创50区间宽度从常规±5%扩大至±10-12%，上证区间宽度从±3%扩大至±5-6%。\n6. **偏差修正\"方向一致性\"检查：** 当≥4条修正朝同一方向调整时，触发\"系统性偏差\"警报，强制反向检查是否有未覆盖的相反逻辑。7/31的6条修正全朝偏空方向→应触发警报。\n\n### 框架层面\n\n7. **\"1周预测\"升级为\"事件日历+情景矩阵\"：** 不再使用单一\"最可能走势\"，而是为每天标注独立的事件驱动情景。例如：周一（IPO首日）→暴涨；周二（IPO D+1）→获利了结；周三（FOMC前）→缩量观望；周四（FOMC）→方向选择；周五（PMI+政治局会议）→政策驱动。\n8. **置信度引入\"事件复杂度系数\"：** 当周内≥3个重大事件时，置信度自动下调10-15pp。超级周默认置信度上限45%。\n9. **P0-5（PMI<50宽松预期）升级为P0级并前置应用：** 当前P0-5在PMI公布后才建立，应改为在PMI公布前即预置两种情景（PMI≥50→正常；PMI<50→宽松预期驱动）。\n\n### 数据层面\n\n10. **新增\"IPO日历\"数据源：** 每周自动获取下周IPO日历（募资额、行业、上市日期），作为预测输入。\n11. **新增\"FOMC票委政治立场\"追踪：** 追踪FOMC票委的鹰鸽倾向变化，特别是\"新人首秀\"场景下的政治约束。\n12. **行业ETF涨跌排名系统化：** 本周15项预测中1项无法验证，根因仍是缺乏全周行业排名数据。需在每日简报中增加行业ETF涨跌排名表。\n\n---\n\n## 七、复盘摘要\n\n### 📈 本周预测亮点\n\n1. **证伪条件设计持续精准（3/3全部命中）：** 上证3750-3900证伪区间与实际3767-3858高度吻合，3900和3750均未被误触发。证伪条件已连续11周保持高可靠性。\n2. **银行/高股息防御方向判断准确：** 上证50全周抗跌，在超级周巨震中发挥防御价值。防御方向判断连续多周有效。\n3. **中证1000/券商风险警示准确：** 中小盘全周跑输，券商在IPO周未受益。\n4. **H1（中方温和回应）假设成立：** 商务部措辞温和，关税博弈短期稳定。\n\n### 📉 本周预测不足\n\n1. **周一走势方向完全错误：** 预测\"缩量窄幅震荡\"→实际暴涨+1.02%（科创50+6.79%）。长鑫科技IPO首日效应被完全忽略。\n2. **科创50方向错误（机会→领跌-8.46%）：** 半导体从\"本周机会\"变为\"本周最大风险\"。全周四天收于预测区间下方。\n3. **科创50区间严重偏乐观（下沿偏差131.59点）：** 超级周波动率是常规周2-3倍，区间参数未调整。\n4. **H2（沃什偏鸽）和H3（3800支撑）两个关键假设失效：** FOMC 3票反对票+3800关口被击穿两次，预测框架塌陷。\n5. **7/31偏差修正全部恶化（0%有效）：** PMI<50宽松预期逻辑未被任何修正规则覆盖，形成系统性悲观偏差。\n\n### 🔑 关键教训\n\n1. **\"事件日历优先级\" > \"单一叙事\"：** 本周最大教训——预测框架将\"超级周\"等同于\"FOMC周\"，忽略了长鑫科技IPO同样是超级事件。未来需建立多事件日历，每天标注独立的事件驱动情景。\n2. **\"偏差修正方向一致性\"警报：** 7/31的6条修正全朝偏空方向→应触发\"系统性偏差\"警报，强制反向检查是否有未覆盖的相反逻辑。P0-5规则如果提前建立，可避免此次0%有效。\n3. **\"超级周波动率参数\"需独立建模：** 科创50区间预测连续第3周偏乐观，根因是超级周波动率是常规周2-3倍。需建立\"事件密度→波动率放大系数\"映射。\n4. **\"整数关口在事件周无效\"虽已建模但未应用：** P2-5规则已建立\"事件周整数关口支撑力归零\"，但7/27周一预测中未强制应用。规则存在但执行缺失是另一类问题。\n5. **\"IPO首日效应\"是独立于FOMC的重要变量：** 长鑫科技1411亿成交虹吸+全市场4884家上涨的正面效应，完全覆盖了FOMC前避险的负面压制。两种效应需独立建模后叠加。\n\n### 🔧 本周新增偏差模式\n\n| 编号 | 模式名称 | 核心内容 |\n|:----:|------|------|\n| P2-20 | 超级IPO首日效应 | 募资>500亿+科技龙头IPO首日→全市场普涨概率>70%，涨幅放大系数1.5-2.0x，可覆盖FOMC前避险 |\n| P2-21 | 事件日历优先级 | 当周内≥3个重大事件时，需按日期列出独立的事件驱动情景，而非使用单一\"最可能走势\" |\n| P2-22 | 偏差修正方向一致性 | 当≥4条修正朝同一方向调整时，触发\"系统性偏差\"警报，强制反向检查 |\n| P2-23 | 超级周波动率放大 | 当周内≥3个重大事件时，科创50区间宽度从±5%扩大至±10-12% |\n| P2-24 | IPO D+1获利了结幅度 | 超级IPO（募资>500亿）D+1获利了结幅度为常规IPO的2-3倍（科创50-6.33% vs 常规-2~-3%） |\n\n---\n\n*下次复盘：2026年8月10日（周一） — 复盘8/3-8/7第12周预测*"},{"filename":"每周预测复盘-2026-08-10.md","content":"# 📊 每周预测复盘 — 2026-08-10（第12周）\n\n> 复盘日期：2026-08-10（周一） | 复盘人：阿策（📊）\n> 预测来源：`预测记录-2026-08-03.md` → 一、1周内预测（8/3 ~ 8/7）\n> 实际数据来源：8/3-8/7每日收盘数据 + 午间/收盘复盘记录\n\n---\n\n## 一、本周市场实际走势\n\n| 日期 | 上证 | 涨跌幅 | 科创50 | 涨跌幅 | 创业板 | 涨跌幅 | 成交额 |\n|------|------|:------:|--------|:------:|--------|:------:|--------|\n| 8/3 周一 | 3809.66 | -0.59% | 1552.89 | -5.08% | ~3300 | -1.24% | 1.997万亿 |\n| 8/4 周二 | 3822.28 | +0.33% | 1616.36 | +4.09% | 3488.97 | +5.64% | 放量 |\n| 8/5 周三 | 3878.43 | +1.47% | 1693.67 | +4.78% | 3535.14 | +1.32% | 2.68万亿 |\n| 8/6 周四 | 3900.35 | +0.57% | ~1670 | 冲高回落 | 3515.56 | -0.55% | 1.31万亿 |\n| 8/7 周五 | 3940.04 | +1.02% | 1744.02 | +2.51% | 3563.12 | +1.35% | 2.66万亿 |\n\n**全周定性：** V形反转+四连阳逼空。周一暴跌（科创50-5.08%）→周二至周五四连阳（科创50累计+12.3%），为连续暴跌后的报复性反弹周。\n\n---\n\n## 二、预测逐项验证\n\n### 2.1 走势形态\n\n| 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|--------|----------|----------|:----:|----------|\n| 1周走势 | 震荡偏强，上证3800-3900 | 周一暴跌→周二至周五四连阳逼空。全周4/5天偏强，方向正确。但\"震荡\"不准确——实际是V形反转而非窄幅震荡 | 🟡 部分正确 | 周一43家实体清单冲击被严重低估（科创50-5.08%），但随后的四连阳逼空验证了\"偏强\"方向。核心偏差：低估了连续暴跌后的反弹爆发力 |\n\n### 2.2 核心区间\n\n| 预测项 | 预测区间 | 实际区间 | 偏差 | 评分 |\n|--------|----------|----------|:----:|:----:|\n| 上证 | 3800-3900 | 3797.64-3940.04 | 下沿-2.36 / 上沿+40.04 | 🟡 部分正确 |\n| 创业板 | 3280-3480 | ~3300-3563.12 | 下沿≈命中 / 上沿+83.12 | 🟡 部分正确 |\n| 科创50 | 1600-1730 | 1552.89-1744.02 | 下沿-47.11 / 上沿+14.02 | 🟡 部分正确 |\n\n**区间偏差分析：**\n- 三个指数上沿均被突破，且突破发生在周五（8/7），D+4反弹强度超预期\n- 上证下沿仅差2.36点，精准度极高\n- 科创50下沿（周一）和上沿（周五）均被突破，呈\"穿头破脚\"形态\n- 核心根因：连续暴跌后反弹强度被系统性低估，P0-6/P0-6-2规则虽然已建立，但反弹持续到D+4且强度逐日递增（D+2+5.18% > D+1+4.09%）超出框架覆盖\n\n### 2.3 行业判断\n\n| 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|--------|----------|----------|:----:|----------|\n| 机会：AI算力/半导体材料 | 机会方向 | 科创50全周+12.3%（D+1→D+4），半导体设备/通信设备领涨 | ✅ 完全正确 | 全周最确定的做多方向，产业趋势逻辑持续验证 |\n| 机会：消费 | 机会方向 | 消费在反弹中跟随上涨但非主线，白酒/家电有表现但被科技盖过 | 🟡 部分正确 | 方向正确但非主线，被科技虹吸覆盖 |\n| 机会：创新药 | 机会方向 | 8/7医药CXO单日+13.03%，创新药方向精准 | ✅ 完全正确 | 医药CXO作为超跌板块轮动，是本周最突出的非科技方向 |\n| 风险：银行 | 风险方向 | 银行在反弹中明显跑输，上证50涨幅远小于科创50 | ✅ 完全正确 | 风险警示准确，银行在科技反弹中被边缘化 |\n| 风险：纯概念炒作高位股 | 风险方向 | 中小盘在反弹中表现不如科技龙头，宽度从68%→31%→52%波动 | 🟡 部分正确 | 方向正确但缺乏精确验证数据 |\n\n### 2.4 证伪条件\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|:----:|\n| 证伪① | 上证跌破3780 | 未触发（最低3797.64） | ✅ 完全正确 |\n| 证伪② | 放量跌破3800 | 未触发 | ✅ 完全正确 |\n\n**证伪阈值精准度：** 上证最低3797.64距3780仅差17.64点，触发阈值设置精准。全周无证伪触发，说明\"偏强\"方向判断正确。\n\n### 2.5 置信度\n\n| 预测项 | 预测内容 | 实际结果 | 评分 |\n|--------|----------|----------|:----:|\n| 置信度 | 60% | 多项偏差但方向基本正确 | 🟡 部分正确 |\n\n---\n\n## 三、关键假设验证\n\n8/3周一预测中的隐含假设验证：\n\n| # | 假设 | 成立？ | 说明 |\n|---|------|:----:|------|\n| H1 | 上证3800整数关口有支撑（P2-5 70%） | ✅ 成立 | 周一最低3797.64后守住，周二起连涨四天 |\n| H2 | 科技成长（AI/半导体）为反弹主线 | ✅ 成立 | 科创50四连阳+12.3%，全周最强方向 |\n| H3 | 成交量放量（P1-3） | ❌ 失效 | 周一缩量13.1%至1.997万亿，预测方向完全相反。周末利空后市场缩量谨慎而非放量 |\n| H4 | 产业趋势>宏观冲击（P0-2 70:30） | ❌ 周一失效/周二至周五成立 | 周一43家实体清单精准打击科技主线，产业趋势被完全压制；周二起高
