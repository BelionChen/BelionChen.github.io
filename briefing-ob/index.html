| 本周机会/风险行业仅月度层，周度命中率无法精确验证 | 🟡 重要 |\n\n### 6.4 数据层面\n\n| 建议 | 说明 | 优先级 |\n|------|------|:--:|\n| DV-GATE派发信号日度序列 | 主力净流出+放量滞涨+广度，作为避险类修正开关 | 🔴 紧急 |\n| IF贴水/A50期指纳入外部参考 | 期货端悲观升温是转折领先信号（9/24 IF贴水0.18%→1.45%） | 🟡 重要 |\n| 休市日外围快照失真复核 | 9/25午间油价+3.41%失真（收盘-0.92%），休市日外围单点快照需收盘复核（P2-54已记录） | 🟡 重要 |\n\n---\n\n## 七、本周新增偏差模式（已在经验库记录）\n\n| 编号 | 模式名称 | 核心内容 | 首次出现 |\n|:----:|------|------|:--:|\n| P2-49 | V型反转≠连续净流入 | 产业趋势强势脉冲（单日大额净流入）在\"极度拥挤+节前收敛+事件节点\"下，D+1易获利了结换挡，不能线性外推为连续净流入 | 9/21 |\n| P2-50 | 半日资金流不可外推 | 半日主力资金净流入不能线性外推为全天（上午+48.56亿→收盘-30.63亿），需收盘确认 | 9/22 |\n| P2-52 | IF贴水扩大领先偏空 | IF贴水早间0.18%→收盘1.45%，期货端悲观升温是收盘情绪端领先偏空信号 | 9/24 |\n| P2-53 | 休市日港股=节后A股领先信号 | 中秋休市日（南向缺席）港股由外资主导，其下跌是节后A股高估值成长补跌前瞻指标 | 9/25 |\n| P2-54 | 休市日外围快照失真需收盘复核 | 休市日外围大宗/利率单一时点快照易失真（午间布油+3.41%→收盘-0.92%），收盘必须复核 | 9/25 |\n\n> 另固化 P0-2 子规则：**\"事件落地日+高位拥挤时，产业趋势主线不逆势\"**（9/24，连续第4日失误后固化）。\n\n---\n\n## 八、本周统计\n\n### 8.1 核心评分（1周层可验证项）\n\n| 指标 | 数值 | vs 第18周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 4项（方向/上证区间/机会行业/风险行业） | 持平 |\n| ✅ 完全正确 | 1项（25%） | +25pp |\n| 🟡 部分正确 | 3项（75%） | 持平 |\n| ❌ 错误 | 0项（0%） | -25pp |\n| **正确率（✅）** | **25%** | **+25pp** |\n| **可用率（✅+🟡）** | **100%** | **+25pp** |\n| **错误率（❌）** | **0%** | **-25pp** |\n\n> **诚实说明：** 正确率在连续2周0%后回升至25%，错误率清零。**核心改善是\"风险行业\"警示（高位追高主线+高估值成长）从第18周的完全反向翻转为精确命中**——第18周提出的\"高位区分有/无催化\"框架得到正向验证。但**正确率仍仅25%**，核心问题未变：**概率校准连续第3周失当（兑现周收盘的情景二仅30%）+ 格式回归连续第3周未修复（丢失分层/行业/证伪）+ 产业趋势主线（P0-2）连续4日反向**。预测从\"系统性平庸\"初步转向\"结构认知准、概率赋值差\"。\n\n### 8.2 十九周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | W12 | W13 | W14 | W15 | W16 | W17 | W18 | **W19** | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 40.0% | 36.4% | 58.3% | 37.5% | 14.3% | 71.4% | 0% | 0% | **25%** | 📈 回升 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 60.0% | 100% | 83.3% | 62.5% | 42.9% | 100% | 100% | 75% | **100%** | 📈 回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 33.3% | 0% | 8.3% | 37.5% | 57.1% | 0% | 0% | 25% | **0%** | 📉 回落 |\n\n> ⚠️ **趋势解读：** 正确率25%、可用率100%、错误率0%——从W18\"0正确率+25%错误率\"中修复。**核心边际变化：风险行业警示终于命中（W18反向→W19精确）**，验证了\"高位区分有/无催化\"框架。但**正确率仍远低于W16的71.4%峰值**，且**格式回归连续第3周未修复**，是正确率无法回到峰值的第一障碍。**概率校准问题（连续3周兑现情景未获最高概率）已从\"偶发\"固化为\"惯性\"，必须通过恢复结构化模板+概率-结果追踪双管齐下解决。**\n\n---\n\n## 九、复盘摘要\n\n### 📈 亮点\n\n1. **风险行业警示从反向翻转为精确命中（最大改善）**：9/21月度风险行业\"高位追高主线\"+\"高估值成长\"双双命中（9/24半导体-132亿/元件-120.88亿/通信设备-99.19亿/科创50-2.35%/创业板-2.68%领跌）。第18周\"高位科技兑现\"完全反向（半导体V型反转领涨）的教训，本周得到正向修复——\"高位区分有/无催化\"框架验证成立。\n2. **\"买预期冲高→落地利好出尽回吐\"两段式结构精准命中**：9/21预测明确写出\"9/22-23买预期冲高，9/24落地卖出+节前避险\"，与实际走势（前3日高位震荡+9/24单日-1.22%回吐）几乎一致。\n3. **P1-31获利了结错位全周4日连续命中**：9/21半导体二次兑现、9/22医药地产D+1、9/23 AI应用D+1、9/24半导体/元件D+1，4/4全中，是当前最稳定的修正规则。\n4. **H3（利好出尽回吐）与H5（利空放大+节前避险）假设本周首次干净兑现**：假设成立率从20%回升至40%，\"落地卖出\"类假设在事件落地周终于生效。\n\n### 📉 不足\n\n1. **1周预测格式回归连续第3周未修复（最严重）**：三情景模板连续3周丢失分层/行业/证伪5个字段，是正确率无法回到W16峰值的第一障碍。\n2. **概率校准连续第3周失当**：兑现周收盘的情景二（利好出尽回吐）仅30%，主情景（买预期延续）只覆盖前半周。连续3周\"最可能兑现的情景未获最高概率\"。\n3. **产业趋势主线（P0-2）连续4日反向**：半导体权重65%→降权→主线多线→半导体/元件占优，四日载体判断全部反向，在落地日/拥挤日系统性失效。\n4. **收官日方向反向**：9/24\"缩量收官\"（48%）被\"利好出尽回吐\"（32%）证伪，而收官日恰是全周方向定性日。\n\n### 🔑 核心教训\n\n1. **\"恐慌/避险类修正\"需要\"派发信号开关\"**：9/21-22连续第8日反向（买预期普涨中避险失效），9/23-24精确兑现（节前避险+利好出尽回吐）。**转折点是DV-GATE派发信号（主力净流出-598亿+广度骤降43.94%）触发**。避险类修正的有效性开关是资金派发信号，不是宏观利空本身——这是比第18周\"降档开关\"更精确的定位。\n\n2. **事件落地周，\"利好出尽回吐\"应是默认主情景，而非\"买预期延续\"**：连续2周准确描述\"买预期→落地卖出\"节奏，却连续2周把主情景概率押在\"买预期延续\"上。**\"落地卖出\"（P1-8）在事件落地周应设为最高概率情景**，这是修复概率校准的最直接抓手。\n\n3. **产业趋势主线在\"落地日+拥挤日\"不可逆势**：P0-2连续4日反向证明，半导体产业趋势在\"事件落地+高位拥挤+节前收敛\"三重压力下无法逆势，必须加\"落地日+拥挤日禁用\"约束（9/24已固化）。\n\n4. **格式不回归，正确率回不到峰值**：W16的71.4%靠结构化模板拉动，W17-W19连续3周三情景模板下正确率在0%-25%低位徘徊。**结构化1周模板（指数分层+行业+证伪）是预测质量的硬约束，连续3周未修复已从\"偶发\"退化为\"惯性\"，必须立即恢复**。\n\n### 🔧 优先改进项\n\n| 优先级 | 改进项 | 预期效果 |\n|:--:|------|------|\n| 🔴 | 恢复结构化1周预测模板（指数分层+行业+1周层证伪） | 消除连续3周格式回归 |\n| 🔴 | 事件落地周将\"利好出尽回吐\"设为默认主情景 | 修复连续3周概率校准失当 |\n| 🔴 | 恐慌/避险类修正加DV-GATE派发信号开关 | 消除\"连续8日反向→精确兑现\"的漂移 |\n| 🔴 | P0-2产业趋势落地日/拥挤日禁用约束固化 | 修复连续4日主线反向 |\n| 🟡 | DV-GATE派发信号+IF贴水纳入1周预测输入 | 捕捉\"利好出尽回吐\"领先信号 |\n| 🟡 | 节前最后交易日单列高权重\"利好出尽\"情景 | 修复收官日反向 |\n\n---\n\n*复盘完成：2026-09-28 07:30 CST | 下次复盘：2026-10-12（国庆假期后）*\n"}],"2026-10":[{"filename":"每周预测复盘-2026-10-05.md","content":"# 📊 每周预测复盘 — 第20周（2026年9月28日-9月30日）\n\n> 生成时间：2026-10-05 07:30 CST（国庆假期中）| 复盘人：阿策（📊）\n> 预测来源：9/28（周一）预测记录 → 1周内预测（三情景）\n> 数据源：腾讯财经日K（前复权）+ 早间/午间/收盘复盘记录 + 预测准确率追踪 + 预测偏差经验库\n> ⚠️ 特殊说明：本周仅 3 个交易日（9/28-9/30），10/1-7 国庆休市。9/28 的「1周内」预测覆盖\"节后 9/28-30 + 国庆后（10/8）\"，**本次复盘仅验证已完成的 9/28-30 三交易日，国庆后（10/8 节后首日）待下一周期（10/12）验证**。\n\n---\n\n## ⚠️ 开篇提示：周一锚点记录格式回归第4周（但周二起已修复）\n\n第20周周一（9/28）「1周内」预测仍为**三情景模板**（仅上证三情景区间），第17-19周已连续指出的格式回归问题，**在周一锚点记录上第4次复现**——导致验证维度中「科创50区间/创业板区间/1周层机会行业/1周层风险行业/1周层证伪条件」继续缺失。\n\n**但需如实记录一个边际改善**：从 9/29（周二）起，预测记录已**恢复结构化1周模板**（核心区间+机会行业+风险行业+置信度+证伪条件+三情景），连续保持至今。即：格式回归**在周一锚点记录上未修复、在滚动记录上已修复**。周一锚点记录是每周复盘基准，其格式回归仍是正确率无法回到峰值的第一障碍。\n\n---\n\n## 一、本周预测回顾\n\n### 9/28（周一）1周预测原文（三情景·面向 9/28-30 + 国庆后）\n\n| 情景 | 概率 | 上证区间 | 核心逻辑 |\n|------|:----:|----------|----------|\n| 节后首日偏暖高开、缩量震荡、红利/防御+降税受益+AI算力轮动 | 45% | 3880-3960 | 八点共识+休战延长+央行宽松+美股齐涨支撑高开，但节前避险+解禁潮1000亿+D+39高位限制涨幅 |\n| 利好出尽二次回吐+节前派发惯性 | 28% | 3800-3880 | 八点共识\"符合预期\"无增量+解禁潮+节前避险惯性，半导体/元件二次回吐，9/28降税清单\"符合预期\"→9/29二次落地卖出 |\n| 三重共振、资金回流修复 | 27% | 3950-4050 | 三重利好+外资回流+半导体/元件/AI算力超跌反弹，重回3950上方 |\n\n> 加权方向：**偏暖偏多**（情景一45%为主），核心逻辑是\"八点共识+休战延长+央行宽松支撑高开\"。已预警\"利好出尽二次回吐\"（情景二28%）与\"半导体/元件二次回吐\"。\n\n### 本周实际走势（收盘价，前复权）\n\n| 日期 | 上证 | 涨跌 | 备注 |\n|------|:------:|:----:|------|\n| 9/24（前周收） | 3888.37 | — | 基准（中秋前最后交易日） |\n| 9/28（一） | 3823.62 | -1.67% | 利好出尽二次回吐，低开-0.26%后单边下杀，成长崩盘（创业板-4.53%/科创50-4.06%） |\n| 9/29（二） | 3830.45 | +0.18% | 超跌反弹普涨（上涨占比64.23%），主力净流入转正+149.74亿 |\n| 9/30（三） | 3842.19 | +0.31% | 权重护盘+成长杀跌分化（科创50-2.51%），9月PMI 50.1%重返扩张 |\n| **全周变化** | **-1.19%** | | 周区间 3823.62 - 3842.19 |\n\n**关键观察（先行点出）：** 本周是**\"利好出尽崩盘 → 超跌反弹企稳\"的V形结构**。9/28（周一·节后首个交易日）即被\"利好出尽二次回吐\"重击单日-1.67%，成长股剧烈去化（科创50-4.06%、创业板-4.53%），随后9/29-30超跌反弹企稳（+0.18%/+0.31%）。**全周收-1.19%，但结构极度分化——上证温和（权重护盘）vs 科创50 -5.66%/创业板 -4.67%（成长暴跌）**。与第19周\"买预期→落地回吐\"两段式不同，本周是**开盘即崩、随后修复**，主情景（偏暖高开45%）在第一个交易日即被精确反向证伪。\n\n---\n\n## 二、验证结果\n\n### 2.1 走势方向验证（上证）\n\n| 预测 | 实际 | 判定 | 说明 |\n|------|------|:--:|------|\n| 主情景（45%）偏暖高开、缩量震荡 | 9/28低开-0.26%后单边下杀，全周-1.19%，\"利好出尽二次回吐\"主导 | ❌ | 主情景方向反向，情景二（28%）捕捉到\"利好出尽回吐\"路径但未被赋予主概率 |\n\n**说明：** 情景二已明确写出\"八点共识符合预期无增量+半导体/元件二次回吐+9/29二次落地卖出\"——这段与9/28实际走势（利好出尽、成长崩盘）几乎一致。**方向认知能力在情景二中存在**，但主情景（偏暖高开45%）方向反向，且概率赋值第4周失当——兑现的情景二仅28%。这与第19周\"最可能兑现周收盘的情景未被赋予最高概率\"同一根因，但更严重：第19周主情景至少覆盖前半周，本周主情景在第一天即被证伪。\n\n### 2.2 上证区间验证\n\n| 预测区间 | 实际区间 | 判定 | 说明 |\n|----------|----------|:--:|------|\n| 情景一：3880-3960 | 全周未触及（周高3842.19） | ❌ | 完全落空 |\n| 情景二：3800-3880 | 周收盘区间3823.62-3842.19完整落此区间 | ✅ | 28%概率精确覆盖全周 |\n| 情景三：3950-4050 | 全周未触及 | ❌ | 完全落空 |\n\n**说明：** 三情景合并区间（3800-4050）完整覆盖实际周区间（3823.62-3842.19），**区间覆盖能力稳定**，但**概率分配连续第4周失当**——唯一命中周收盘区间的情景二仅28%，主情景一（3880-3960）完全落空。这一\"概率-结果\"倒挂已从\"偶发\"固化为\"惯性\"。\n\n### 2.3 指数分层验证（格式回归缺失项）\n\n| 指数 | 1周预测 | 实际 | 判定 | 说明 |\n|------|---------|------|:--:|------|\n| 科创50 | ❌ 未预测 | 9/28 -4.06%、9/29 +0.86%、9/30 -2.51%，全周-5.66% | ⚪ | 格式回归，1周层无科创50区间 |\n| 创业板 | ❌ 未预测 | 9/28 -4.53%、9/30 -0.23%，全周-4.67% | ⚪ | 格式回归，1周层无创业板区间 |\n\n**核心发现：** 本周结构是**\"指数护盘、成长暴跌\"的极致分化**——上证-1.19% vs 科创50-5.66%/创业板-4.67%。若沿用情景一\"偏暖高开、红利/防御+AI算力轮动\"平铺到成长指数，会**严重低估成长崩盘幅度**。再次证明**指数分层不可预设，必须逐指数独立判断**（与第19周\"成长跑输上证\"同向，但幅度更极端）。\n\n### 2.4 机会行业验证（月度层快照·1周层缺失）\n\n> 由于1周层未给机会行业，此处借用9/28预测**月度预测**的机会行业（低估值红利/银行、医药/生物科技、AI算力/光模块/半导体、降税受益、六张网基建/电力设备、黄金）做周度快照验证，仅作参考、不代表1周预测。\n\n| 推荐行业 | 本周表现（资金/涨跌） | vs 上证(-1.19%) | 判定 |\n|----------|:------:|:------:|:--:|\n| 低估值红利/银行 | 银行9/30 +41.13亿领流入，防御领涨 | 相对跑赢 | ✅ |\n| 医药/生物科技 | 化学制药+30.67/医疗服务+25.54亿（9/30领流入） | 相对跑赢 | ✅ |\n| AI算力/光模块/半导体 | 半导体9/28 -88.02亿、9/30 -125.62亿领跌，科创50 -5.66% | 大幅跑输 | ❌ |\n| 降税受益（家电/化纤） | 降税清单9/28落地，但本周无突出资金表现 | 持平 | 🟡 |\n| 六张网基建/电力设备 | 电力9/29 -10.33亿领流出 | 跑输 | 🟡 |\n| 黄金 | 未单独验证（现货金4183，A股贵金属未突出） | — | ⚪ |\n\n**月度层机会行业命中率：33%（2/6），可用率67%（4/6）**\n\n**说明：** 相对跑赢的是低估值红利/银行、医药/生物科技（防御价值兑现）；AI算力/光模块/半导体大幅跑输——**月度机会行业押注的\"科技主线\"在\"利好出尽+节前避险\"中连续第2周集中兑现**（第19周半导体-132亿、本周半导体-125.62亿）。**防御行业（银行/医药）连续第2周成为唯一稳定收益项，与第18周\"半导体大幅跑赢\"形成镜像，再次印证\"机会行业押注单一科技主线在事件落地周全面失效\"**。\n\n### 2.5 风险行业验证（月度层快照·1周层缺失）\n\n| 警示行业 | 本周表现 | vs 上证(-1.19%) | 判定 |\n|----------|:------:|:------:|:--:|\n| 高位科技、对利率敏感的高估值成长 | 科创50 -5.66%、创业板 -4.67%、半导体-125.62亿/元件-57.98亿领跌 | 大幅跑输 | ✅ |\n| 新能源车/电池 | 中概金龙9/29 -1.55%、10/2 -2.09%，港股10/2 -2.60%映射 | 相对跑输 | 🟡 |\n| 临近解禁高位个股 | 未单独验证 | — | ⚪ |\n\n**风险行业命中率：100%（1/1可验证核心项）**\n\n**说明：** **本周最大亮点——风险警示核心项\"高位科技+高估值成长\"精确命中**（9/28-30科创50/创业板/半导体/元件集中领跌，全周科创50-5.66%）。这是**风险行业警示连续第2周命中**（第19周命中后本周再命中），\"高位区分有/无催化\"框架连续第2周正向验证。**风险行业警示已成为当前最稳定的预测维度**（6月67%、7月67%、8月100%、9月100%、本周100%）。\n\n### 2.6 证伪条件验证（格式缺失项）\n\n| 证伪条件 | 触发情况 | 判定 |\n|----------|:------:|:--:|\n| 1周层证伪条件 | ❌ 未单独提供 | ⚪ 格式回归 |\n\n**说明：** 9/28预测的证伪信号分散在「五、核心待验证变量」（8项），无1周层双向阈值。可作为参考的偏空信号实际触发情况：\n\n| 偏空信号 | 触发情况 | 判定 |\n|----------|:------:|:--:|\n| 富时A50期指暴跌 | ✅ 触发（9/28早盘-1.90%，昨结14286→14015） | ✅ 正确预示下跌（但被忽略） |\n| 主力净流出是否收窄 | ❌ 未收窄（9/28 -798.04亿） | ✅ 正确预示下跌 |\n| 半导体/元件二次回吐 | ✅ 触发（9/28半导体-88.02/元件-56.93亿） | ✅ 正确预示下跌 |\n| 港股企稳（收回24500） | ✅ 企稳（恒指+0.56%收24648.40） | 与A股背离（非系统性） |\n\n**说明：** 偏空信号3项触发（A50暴跌/主力未收窄/半导体回吐），**但早间预测未将A50暴跌信号纳入——这是本周最大盲点**（详见新增P2-55）。港股+0.56%逆势企稳与A股暴跌背离，指向\"非系统性风险、高估值成长去化\"，这一关键结构判断在9/28记录自身收盘复盘中已正确识别。\n\n---\n\n## 三、关键假设验证\n\n从9/28预测中隐含的核心假设：\n\n| 假设 | 内容 | 验证结果 | 说明 |\n|:--:|------|:--:|------|\n| H1 | 八点共识+休战延长+央行宽松构成可交易增量，支撑偏暖高开（情景一45%核心） | ❌ 失效 | 框架性共识无可交易增量，市场用\"兑现卖出\"投票，9/28低开-0.26%后单边下杀 |\n| H2 | 节前避险+解禁潮+D+39高位限制涨幅、缩量震荡 | 🟡 部分成立 | 限制涨幅兑现，但以\"最剧烈二次回吐\"方式而非温和缩量震荡 |\n| H3 | 利好出尽二次回吐（情景二28%） | ✅ 成立 | 9/28 -1.67%精确兑现，周收盘3823.62落情景二区间3800-3880 |\n| H4 | 主力净流出收窄（9/24 -1146.6亿→-300亿内） | ❌ 失效 | 9/28 -798.04亿未收窄，9/29才转正+149.74亿 |\n| H5 | 港股企稳（恒指收回24500上方） | ✅ 成立 | 恒指9/28 +0.56%收24648.40，逆势企稳 |\n\n**假设成立率：40%（2/5），方向可用率：60%（3/5）**\n\n**核心发现：** 假设成立率连续第2周维持40%、方向可用率60%。**H3（利好出尽回吐）与H5（港股企稳）本周成立**——\"落地卖出\"类假设（P1-8）连续第2周干净兑现，验证第19周结论\"事件落地周利好出尽回吐是可靠假设\"。**H1（框架性共识=可交易增量）连续第2周失效**——八点共识与降税清单同属\"框架性/符合预期\"型利好，不构成可交易对冲，这是\"偏暖高开\"主情景被反向证伪的根因。**H4（主力净流出收窄）在节后首日再次失效**，DV-GATE派发信号（主力净流出-798亿+广度16.47%）在9/28未收窄即应触发避险类修正恢复。\n\n---\n\n## 四、全周滚动预测回顾\n\n| 日期 | 预测方向 | 实际方向 | 判定 | 备注 |\n|------|---------|---------|:--:|------|\n| 9/28（一） | 偏暖高开3880-3960（情景一45%） | 3823.62 -1.67% 利好出尽大跌 | ❌ | 主情景方向反向（A50 -1.90%被忽略） |\n| 9/29（二） | 缩量寻底3800-3900（先抑后扬） | 3830.45 +0.18% 超跌反弹 | 🟡 | 方向对（站稳3800），幅度偏弱（实际普涨强于\"先抑\"） |\n| 9/30（三） | 缩量震荡3820-3850（震荡收官45%） | 3842.19 +0.31% 护盘收官 | ✅ | 方向+区间命中（收区间上沿） |\n\n**滚动预测方向正确率：33%（1/3），可用率：67%（2/3）**\n\n**关键观察：** 本周滚动预测呈\"**首日崩、后两日修复**\"——9/28（周一·节后首日）主情景被反向证伪（最大单日误差），9/29-30连续两日方向基本正确（9/30震荡收官45%方向+区间命中）。这与第19周\"收官日反向\"相反：**本周错误集中在唯一的开盘定性日（9/28），而开盘定性日恰是全周方向定性日**。教训：**长假后首个交易日应单列\"利好出尽/跟随外盘\"高权重情景，并强制检查富时A50期指隔夜变动（P2-55）**。\n\n---\n\n## 五、偏差修正效果（全周汇总）\n\n| 日期 | 修正有效率 | 关键发现 |\n|------|:--------:|------|\n| 9/28 周一 | 71.4%（午间+收盘一致） | P1-32+P1-19+P2-55精准预警高位科技去化；P1-8（二次回吐下调）为最大失分；富时A50 -1.90%被忽略为最大盲点 |\n| 9/29 周二 | 20%（午间）/ 偏空失效 | 极端宽度后的超跌反弹被系统性低估（P1-8+P0-3叠加偏空），缩量天花板限制反弹幅度 |\n| 9/30 周三 | 83.3%（午间+收盘一致） | P1-31半导体/元件D+1获利了结第三次精确兑现；P0-2主线判断连续失误为最大失分 |\n\n**核心发现：**\n\n1. **P2-55（富时A50期指=节后开盘最强领先信号）本周最大教训**：9/28早盘富时A50 -1.90%暴跌（昨结14286→14015）是\"节后首日开盘方向\"最强领先信号，但早间预测仅记录9/26的+0.08%而忽略，直接导致主情景\"偏暖高开45%\"被反向证伪。**长假后首个交易日，A50期指的隔夜/早盘变动是第一优先指标**。\n\n2. **P1-31（事件驱动D+1获利了结）连续第3次兑现、已固化**：9/29元件+44.14/半导体+14.79亿领涨→9/30元件-57.98/半导体-125.62亿领跌，\"超跌反弹一日游\"精确命中。教训已固化为\"P1-31触发时主线同步下调半导体权重至机会列表之外\"。\n\n3. **P0-2（产业趋势主线判断）连续第5周失误**：本周半导体/元件再次被押为机会主线，却全周领跌（9/28 -88/-57亿、9/30 -126/-58亿）。产业趋势在\"事件落地+高位拥挤+节前避险\"三重压力下不可逆势，9/24已固化\"落地日+拥挤日禁用\"约束，但本周仍未严格执行。\n\n4. **9/29\"极端宽度超跌反弹\"被低估**：9/28极端宽度（20日新低1779家占31.9%）触发的超跌反弹是强信号，但P1-8+P0-3两项偏空修正叠加导致早间系统性偏空（20%有效率），缩量天花板又限制了反弹幅度。需在\"强反弹信号\"与\"缩量天花板\"间取平衡。\n\n---\n\n## 六、模型优化建议\n\n### 6.1 假设层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| 框架性共识被误判为可交易增量（H1连续2周失效） | 明确区分\"框架性/符合预期型利好\"（八点共识、降税清单\"符合预期\"）与\"可交易增量型利好\"（超预期幅度、真金白银）。前者在落地日不构成对冲，默认走\"兑现卖出\" | 🔴 紧急 |\n| 长假后首日开盘方向盲区（H1失效直接根因） | 长假后首个交易日，强制将富时A50期指隔夜/早盘变动设为第一优先输入（P2-55），并单列\"跟随外盘/利好出尽\"高权重情景 | 🔴 紧急 |\n| 主力净流出收窄假设（H4）节后首日反复失效 | DV-GATE派发信号（主力净流出未收窄+广度骤降）触发即恢复避险类修正，不再等待\"节后回流\"确认 | 🔴 紧急 |\n\n### 6.2 指标层面\n\n| 指标 | 评价 | 建议 |\n|------|:--:|------|\n| 富时A50期指隔夜/早盘变动 | ✅ 新增最有效 | 节后首日开盘方向第一优先指标（9/28 -1.90%被忽略是最大盲点），纳入长假前后必查项 |\n| DV-GATE主力派发信号 | ✅ 最有效 | 主力净流出-798亿（9/28）+广度16.47%，是\"利好出尽回吐\"领先信号，连续第2周验证 |\n| P1-31获利了结错位 | ✅ 最稳定 | 第三次兑现，保留为核心规则，触发时同步下调半导体权重 |\n| 港股逆势信号 | ✅ 有效 | 港股+0.56%逆势（9/28）指向\"非系统性风险、成长去化\"，是A股暴跌结构判别的领先信号 |\n| P0-2产业趋势权重 | ❌ 噪音（落地日） | 连续第5周反向，事件落地日+拥挤日应禁用 |\n\n### 6.3 框架层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| 周一锚点记录格式回归第4周（滚动记录已修复） | 周一锚点记录立即恢复结构化1周模板（指数分层+机会行业+风险行业+1周层双向证伪），与滚动记录格式对齐 | 🔴 紧急 |\n| 概率校准连续第4周失当 | 显式记录\"概率-结果\"追踪，事件落地周将\"利好出尽回吐\"设为最高概率情景 | 🔴 紧急 |\n| 长假后首日定性 | 长假后首个交易日单独标注\"跟随外盘/利好出尽\"高权重情景，而非延续\"偏暖高开\"惯性 | 🔴 紧急 |\n| 机会行业押注单一科技主线连续失效 | 机会行业列表强制加入防御类（银行/医药）对冲项，事件落地周科技主线降至次优 | 🟡 重要 |\n\n### 6.4 数据层面\n\n| 建议 | 说明 | 优先级 |\n|------|------|:--:|\n| 富时A50期指日度序列（含隔夜/早盘） | 作为长假前后开盘方向的第一优先输入，纳入预测必查清单 | 🔴 紧急 |\n| DV-GATE派发信号日度序列 | 主力净流出+放量+广度，作为避险类修正开关 | 🔴 紧急 |\n| 港股节假日交易数据 | 国庆/中秋休市日港股由外资主导，其走势是节后A股高估值成长补跌前瞻指标（P2-53强化） | 🟡 重要 |\n| IF贴水/A50期指纳入外部参考 | 期货端悲观升温是转折领先信号（9/30 IF贴水0.24%→1.3%） | 🟡 重要 |\n\n---\n\n## 七、本周新增偏差模式（已在经验库记录）\n\n| 编号 | 模式名称 | 核心内容 | 首次出现 |\n|:----:|------|------|:--:|\n| P2-55 | 富时A50期指=节后开盘方向最强领先信号 | 长假后首个交易日，A50当月连续（CN00Y）隔夜/早盘变动是判断\"高开vs低开\"的第一优先指标，9/28 -1.90%暴跌被忽略为最大盲点 | 9/28 |\n| P2-56 | 节前最后交易日成长杀跌 | 节前最后一日，前一交易日领涨板块次日上午获利了结，防御+医药占优（9/29元件/半导体领涨→9/30领跌） | 9/30 |\n\n> 另强化 P1-8 子规则：**\"框架性共识（八点共识/降税清单符合预期）不构成可交易对冲，降税清单落地前夜'兑现卖出'惯性主导\"**（9/28，连续第2周）。\n\n---\n\n## 八、本周统计\n\n### 8.1 核心评分（1周层可验证项）\n\n| 指标 | 数值 | vs 第19周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 4项（方向/上证区间/机会行业/风险行业） | 持平 |\n| ✅ 完全正确 | 1项（25%） | 持平 |\n| 🟡 部分正确 | 2项（50%） | -25pp |\n| ❌ 错误 | 1项（25%） | +25pp |\n| **正确率（✅）** | **25%** | **持平** |\n| **可用率（✅+🟡）** | **75%** | **-25pp** |\n| **错误率（❌）** | **25%** | **+25pp** |\n\n> **诚实说明：** 正确率25%持平，但错误率从0%回升至25%、可用率从100%回落至75%。**核心改善：风险行业警示连续第2周精确命中（高位科技/高估值成长→科创50-5.66%领跌）**；**核心恶化：周一（9/28）主情景\"偏暖高开\"被精确反向证伪，方向判断首次在本周出现❌**。核心问题未变：**概率校准连续第4周失当（兑现的情景二仅28%）+ 周一锚点格式回归第4周未修复 + 产业趋势主线（P0-2）连续第5周反向**。富时A50 -1.90%暴跌被忽略（P2-55）是本周最大盲点。\n\n### 8.2 二十周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | W12 | W13 | W14 | W15 | W16 | W17 | W18 | W19 | **W20** | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 40.0% | 36.4% | 58.3% | 37.5% | 14.3% | 71.4% | 0% | 0% | 25% | **25%** | ➖ 持平 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 60.0% | 100% | 83.3% | 62.5% | 42.9% | 100% | 100% | 75% | 100% | **75%** | 📉 回落 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 33.3% | 0% | 8.3% | 37.5% | 57.1% | 0% | 0% | 25% | 0% | **25%** | 📈 回升 |\n\n> ⚠️ **趋势解读：** 正确率25%持平、可用率75%回落、错误率25%回升——本周从第19周\"0错误率\"退回\"1项方向错误\"。核心边际变化：**周一主情景方向反向（首次在本周出现❌方向项）**，根因是富时A50暴跌被忽略+框架性共识被误判。**风险行业警示连续第2周命中**是唯一稳定亮点。正确率仍远低于W16的71.4%峰值，**周一锚点格式回归第4周未修复+概率校准连续第4周失当**是正确率无法回到峰值的第一、第二障碍。\n\n---\n\n## 九、复盘摘要\n\n### 📈 亮点\n\n1. **风险行业警示连续第2周精确命中（最大稳定项）**：9/28月度风险行业\"高位科技+高估值成长\"精确命中（9/28-30科创50-5.66%/创业板-4.67%/半导体-125.62亿/元件-57.98亿领跌）。\"高位区分有/无催化\"框架连续第2周正向验证，风险行业警示已成为当前最稳定预测维度（连续5个月可用率67%-100%）。\n2. **情景二\"利好出尽回吐\"精确捕捉9/28崩盘+全周区间**：情景二（3800-3880）完整覆盖实际周区间3823.62-3842.19，\"半导体/元件二次回吐\"精确命中。\n3. **9/29-30滚动预测恢复**：9/30\"震荡收官45%\"方向+区间命中（收3820-3850上沿），P1-31半导体/元件D+1获利了结第三次精确兑现。\n4. **H3（利好出尽回吐）+H5（港股企稳）连续第2周成立**：假设成立率维持40%，\"落地卖出\"类假设连续第2周干净兑现。\n\n### 📉 不足\n\n1. **9/28主情景\"偏暖高开45%\"被精确反向证伪（本周最严重）**：富时A50 -1.90%暴跌被忽略（最大盲点P2-55），框架性共识（八点共识）被误判为可交易增量，导致节后首日方向判断反向。\n2. **概率校准连续第4周失当**：唯一命中周收盘区间的情景二仅28%，主情景一（3880-3960）完全落空。\n3. **产业趋势主线（P0-2）连续第5周反向**：半导体/元件再次被押为机会主线，却全周领跌。\n4. **周一锚点记录格式回归第4周未修复**：9/28仍三情景模板，丢失分层/行业/证伪5个字段（滚动记录周二起已修复）。\n\n### 🔑 核心教训\n\n1. **长假后首日，富时A50期指是第一优先指标**：9/28早盘A50 -1.90%暴跌是\"节后开盘方向\"最强领先信号，忽略它直接导致主情景反向。长假前后必须强制检查A50隔夜/早盘变动（P2-55），并单列\"跟随外盘/利好出尽\"高权重情景。\n\n2. **框架性共识≠可交易增量**：八点共识、降税清单\"符合预期\"属框架性利好，无可交易增量，落地前夜\"兑现卖出\"惯性主导。事件落地周\"利好出尽回吐\"应设最高概率，而非\"偏暖高开\"（连续第4周教训）。\n\n3. **机会行业押注单一科技主线连续失效**：防御类（银行/医药）连续第2周成为唯一稳定收益项，科技主线在\"事件落地+高位拥挤+节前避险\"中连续第2周领跌。机会行业列表必须强制加入防御对冲项。\n\n4. **格式不回归，正确率回不到峰值**：W16的71.4%靠结构化模板拉动，W17-W20连续4周正确率0%-25%低位徘徊。周一锚点记录的结构化1周模板是预测质量的硬约束，滚动记录已修复但锚点记录仍缺失。\n\n### 🔧 优先改进项\n\n| 优先级 | 改进项 | 预期效果 |\n|:--:|------|------|\n| 🔴 | 长假后首日强制检查富时A50期指（P2-55），单列\"跟随外盘\"高权重情景 | 消除节后首日方向盲区 |\n| 🔴 | 周一锚点记录恢复结构化1周模板 | 消除连续4周格式回归 |\n| 🔴 | 事件落地周将\"利好出尽回吐\"设为默认主情景 | 修复连续4周概率校准失当 |\n| 🔴 | 框架性共识/可交易增量二分法，框架性利好默认\"兑现卖出\" | 修复H1连续2周失效 |\n| 🔴 | P0-2产业趋势落地日/拥挤日禁用约束严格执行 | 修复连续5周主线反向 |\n| 🟡 | 机会行业强制加入防御对冲项（银行/医药） | 避免单一科技主线连续失效 |\n| 🟡 | DV-GATE派发信号+IF贴水+A50期指纳入1周预测输入 | 捕捉\"利好出尽回吐\"领先信号 |\n\n---\n\n*复盘完成：2026-10-05 07:30 CST（国庆假期中）| 下次复盘：2026-10-12（国庆假期后，含10/8节后首日验证）*\n"},{"filename":"每周预测复盘-2026-10-12.md","content":"# 📊 每周预测复盘 — 第21周（2026年10月5日-10月9日）\n\n> 生成时间：2026-10-12 07:20 CST | 复盘人：阿策（📊）\n> 预测来源：10/5（周一）预测记录 → 1周内预测（结构化模板）\n> 数据源：腾讯财经日K（前复权）+ 早间/午间/收盘复盘记录 + 预测准确率追踪 + 预测偏差经验库\n> ⚠️ 特殊说明：本周 A 股仅 2 个交易日（10/8 节后首日、10/9 节后第二日），10/1-7 国庆休市。10/5（周一）的「1周内（10/5-10/9）」预测实际只覆盖 10/8-10/9 两个 A 股交易日，长假尾段（10/5-7）由港股/美股主导方向。**本周为节后首周，是第20周已预告的「10/8 节后首日验证」周期。**\n\n---\n\n## ⚠️ 开篇提示：周一锚点记录格式已回归结构化模板\n\n第21周周一（10/5）「1周内」预测**已恢复完整结构化模板**（核心区间 + 机会行业 + 风险行业 + 置信度 + 证伪条件 + 三情景），并首次补齐三指数分层区间（上证/科创50/创业板）。这是连续 4 周格式回归后的**首次修复**，验证维度得以覆盖全部 7 项（方向/三指数区间/机会行业/风险行业/证伪条件）。格式回归问题在本周已被消除，正确率回升具备结构性前提。\n\n---\n\n## 一、本周预测回顾\n\n### 10/5（周一）1周预测原文（面向 10/5-10/9，A股实为 10/8-10/9）\n\n| 维度 | 预测内容 |\n|------|----------|\n| 最可能走势 | 10/8 节后首日「低开/平开消化港股负向信号 + 政策护航托底」，成长修复拆「算力强/平台弱/存储弱」，出口链受益，权重蓝筹/港股相关面临补跌压力 |\n| 核心区间 | 上证 3760-3860 \\| 科创50 1460-1550 \\| 创业板 3030-3150 |\n| 机会行业 | AI算力/光模块、半导体设备、银行/地产链、降税受益出口链（家电/轻工/玩具）、汽车零部件 |\n| 风险行业 | 港股相关/外资重仓蓝筹、存储模组/HDD、高估值成长、中概/港股ETF、原料药、临近解禁高位个股 |\n| 置信度 | 45%（±5%） |\n| 三情景 | 低开震荡+防御延续+出口链受益 40% / 成长结构性超跌修复（算力强存储弱）32% / 二次探底（港股负向传导+外资减仓放大）28% |\n\n### 本周实际走势（收盘价，前复权）\n\n| 日期 | 上证 | 科创50 | 创业板 | 备注 |\n|------|:------:|:------:|:------:|------|\n| 9/30（节前收） | 3842.19 | 1530.01 | 3135.28 | 基准（长假冻结） |\n| 10/8（四·节后首日） | 3811.90（-0.79%） | 1456.32（-4.82%） | 3036.66（-3.15%） | 低开分化，成长深杀，银行/电力护盘守上证 |\n| 10/9（五·节后第二日） | 3813.79（+0.05%） | 1457.27（+0.07%） | 3043.33（+0.22%） | 上午深杀午后V反，全线翻红 |\n| **全周变化** | **-0.74%** | **-4.75%** | **-2.93%** | 周区间：上证 3754.14-3864.12 |\n\n**关键观察（先行点出）：** 本周是**「上证护盘、成长深杀、尾盘V反」的三段式结构**。10/8（节后首日）上证 -0.79% 温和（银行 +26亿/电力 +27.82亿/煤炭净流入护盘），但成长崩盘（科创50 -4.82%、创业板 -3.15%、半导体 -4.98%）；10/9 上午延续深杀（三指数齐破区间下沿、上涨占比跌破两成19.74%），午后主力资金流转正（-355.45亿→+57.58亿）+港股反弹传导，全线V型翻红。**全周上证仅 -0.74%，但科创50 -4.75%——指数与成长极致分化**，与第20周\"指数护盘、成长暴跌\"结构同向，但本周成长杀跌集中在前一日半、尾盘修复力度更强。\n\n---\n\n## 二、验证结果\n\n### 2.1 走势方向验证（上证）\n\n| 预测 | 实际 | 判定 | 说明 |\n|------|------|:--:|------|\n| 低开/平开消化港股负向信号 + 政策护航托底 | 10/8 开 3838.98（较 9/30 低开 -0.08%），收 -0.79%，银行/电力/煤炭护盘守 3800；10/9 低开下探 3754 后 V 反翻红 | ✅ | 方向正确：低开兑现、上证被护盘托底（全周仅 -0.74%），权重蓝筹补跌压力也兑现 |\n\n**说明：** 上证方向判断精准（低开 + 护盘托底 + 权重补跌）。但**结构判断严重反向**——预测\"成长修复拆算力强/平台弱/存储弱\"，实际成长全线深杀（算力也崩），此偏差在 2.3 指数分层验证中单独计分。**这是本周最大失分项**，将在 2.3 详细剖析。\n\n### 2.2 上证区间验证\n\n| 预测区间 | 实际区间（收盘/盘中） | 判定 | 说明 |\n|----------|----------|:--:|------|\n| 3760-3860 | 收盘 3811.90-3813.79（区间内）；盘中低 3754.14（微破下沿）、高 3864.12（微破上沿） | 🟡 | 收盘精准落在区间内，但盘中上下沿各微破约 4-6 点 |\n\n**说明：** 上证收盘区间（3811.90-3813.79）完整落在 3760-3860 内，**核心区间对收盘价的覆盖精准**。但盘中 10/9 下探 3754.14（微破 3760）、10/8 冲高 3864.12（微破 3860），实际振幅略超预测区间——\"护盘托底\"判断成立，但\"二次探底深度\"（下探至 3754）略被低估。\n\n### 2.3 指数分层验证（本周最大失分项）\n\n| 指数 | 1周预测 | 实际 | 判定 | 说明 |\n|------|---------|------|:--:|------|\n| 上证 | 3760-3860 | 收 3813.79（-0.74%） | 🟡 | 收盘命中区间，盘中微破上下沿 |\n| 科创50 | 1460-1550（方向：成长修复，算力强） | 收 1456.32→1457.27（-4.75%），双双跌破下沿 1460，盘中低 1390 | ❌ | 方向错误（预测修复、实际深杀）+ 收盘跌破区间下沿 |\n| 创业板 | 3030-3150（方向：成长修复） | 收 3036.66→3043.33（-2.93%），收盘勉强在区间下沿，盘中低 2957.32 | 🟡 | 收盘在区间内但方向错误，10/9 午后才 V 反收回 |\n\n**核心发现：** 本周结构仍是**「指数护盘、成长暴跌」的极致分化**——上证 -0.74% vs 科创50 -4.75%/创业板 -2.93%。预测的致命错误在于**对成长股方向的反向判断**：10/5 预测\"成长修复拆算力强/平台弱/存储弱\"（即预期节后成长超跌反弹、内部结构性分化），实际是**成长全线出清、算力带头崩盘**（半导体 -4.98%、CPO/光模块重挫——源杰跌停、\"易中天\"撤离 28亿、长鑫 -7%）。**\"结构性分化（强者恒强）\"预设在第21周彻底失效，被\"全线出清\"取代**。这是第20周\"成长跑输上证\"的深化版——第20周成长至少是\"被杀但内部有差异\"，第21周是\"无差异全线出清\"。\n\n### 2.4 机会行业验证（1周层·结构化模板恢复后首次可完整验证）\n\n| 推荐行业 | 本周表现（资金/涨跌） | vs 上证(-0.74%) | 判定 |\n|----------|:------:|:------:|:--:|\n| AI算力/光模块 | 半导体 -4.98%（净流出132.31亿）、CPO重挫（源杰跌停/易中天撤离28亿） | 大幅跑输 | ❌ |\n| 半导体设备 | 半导体 -4.98% 领跌（净流出132.31亿），元件 -3.63% | 大幅跑输 | ❌ |\n| 银行/地产链 | 10/8 银行 +26亿、电力 +27.82亿净流入，逆势护盘 | 相对跑赢 | ✅ |\n| 降税受益出口链（家电/轻工/玩具） | 未出现在两日领涨/领流入榜单 | 未兑现 | ❌ |\n| 汽车零部件 | 10/9 上午汽车整车 +5.19亿略流入，特斯拉Q3催化未形成主线 | 持平 | 🟡 |\n\n**机会行业命中率：20%（1/5），可用率 40%（2/5）**\n\n**说明：** 本周机会行业**唯一跑赢的是银行/地产链（防御项）**，而押注的**两大科技主线（AI算力/半导体设备）双双大幅跑输**——半导体 -4.98% 领跌、CPO重挫，与第20周\"机会行业押注单一科技主线连续失效\"完全同向。降税受益出口链（家电/轻工/玩具）两日均未兑现领涨，**\"降税落地→出口链受益\"的传导假设再次落空**（利好出尽、资金未流入）。汽车零部件仅持平。**结论：机会行业连续第3周只有防御类（银行）成为稳定收益项，科技主线连续第3周反向。**\n\n### 2.5 风险行业验证（1周层·最大亮点）\n\n| 警示行业 | 本周表现 | vs 上证(-0.74%) | 判定 |\n|----------|:------:|:------:|:--:|\n| 高估值成长 | 科创50 -4.82%、创业板 -3.15%、半导体 -4.98% 领跌 | 大幅跑输 | ✅ |\n| 存储模组/HDD | 存储/半导体链连续杀跌（东芝扩产压制） | 跑输 | ✅ |\n| 港股相关/外资重仓蓝筹 | 港股 10/8 -1.43%、恒生科技 -2.89%，外资重仓承压 | 跑输 | ✅ |\n| 中概/港股ETF | 港股续跌，恒生科技破位 | 跑输 | ✅ |\n| 原料药 | 未单独验证（232药品关税未即时落地） | — | ⚪ |\n| 临近解禁高位个股 | 未单独验证 | — | ⚪ |\n\n**风险行业命中率：100%（4/4可验证核心项）**\n\n**说明：** **本周最大亮点——风险行业警示核心项全线精确命中**（高估值成长→科创50 -4.82%/半导体 -4.98% 领跌；港股相关→恒指 -1.43%/恒生科技 -2.89%；存储/HDD→半导体链杀跌；中概/港股ETF→港股续跌）。**风险行业警示连续第3周精确命中**（第19周、第20周、第21周），已成为当前预测体系**最稳定、最可靠**的维度（6月67%、7月67%、8月100%、9月100%、10月连续3周100%）。\"高位区分有/无催化 + 风险行业负面清单\"框架连续第3周正向验证。\n\n### 2.6 证伪条件验证\n\n| 证伪条件 | 触发情况 | 判定 |\n|----------|:------:|:--:|\n| 偏多证伪（→成长修复落空）：长假剩余港股延续重挫（恒指跌破23500）+ 美债破5.3% + 外资持续减仓 → 节后下探3740下方 | 🟡 部分触发：外资持续减仓✅（主力 -613.94亿）、美债30Y破5.7%新高✅（但10Y未破5.3%）、港股未跌破23500（最低约23785）❌、上证下探至3754（未达3740） | 🟡 |\n| 偏空证伪（→成长修复走强）：港股企稳反弹 + 美债回落5.2%下方 + 纳指/费半企稳 + 主力净流入转正 | 🟡 部分触发：港股10/5-6企稳反弹✅、但美债10Y仅回落至5.22%（未破5.2%下方）、主力净流入未转正（-613.94亿）❌ | 🟡 |\n\n**说明：** 两组证伪条件均为**部分触发、均未干净兑现**——这是本周最大的框架性盲点：**偏空证伪信号（港股10/5-6企稳反弹）确实触发了，但它是一个\"误导性信号\"**。港股反弹让预测逐步上调成长修复概率（10/6置信度升至48%），但节后A股成长照样深杀——**真正驱动节后方向的不是港股，而是美债30Y新高（5.731%）+ 主力巨额流出（-613.94亿）**。**港股作为长假领先信号的权重被高估，美债长端利率 + 主力资金流的权重被低估。**\n\n---\n\n## 三、关键假设验证\n\n从10/5预测中隐含的核心假设：\n\n| 假设 | 内容 | 验证结果 | 说明 |\n|:--:|------|:--:|------|\n| H1 | 港股 -2.60% 负向领先将在长假延续，节后A股低开消化 | 🟡 部分成立 | 低开兑现（10/8 开3838.98），但\"港股延续重挫\"假设错误——港股10/5-6反弹（+0.28%/+1.00%）后才回落，低开实由美债30Y新高+外资减仓驱动 |\n| H2 | 政策护航（央行1.2万亿逆回购+房贷贴息+PSL降息）托底上证 | ✅ 成立 | 上证全周仅 -0.74%，银行/电力/煤炭护盘守3800，政策底兑现 |\n| H3 | 成长超跌修复（算力强/平台弱/存储弱分化） | ❌ 失效 | 全线深杀无分化（科创50 -4.82%、半导体 -4.98%、算力带头崩盘），\"结构性修复\"预设完全反向 |\n| H4 | 降税落地 → 出口链受益（家电/轻工/玩具） | ❌ 失效 | 出口链两日未兑现领涨，\"利好出尽\"主导，资金未流入 |\n| H5 | 权重蓝筹/港股相关补跌 | ✅ 成立 | 港股10/8 -1.43%、恒生科技 -2.89%、外资重仓蓝筹承压 |\n\n**假设成立率：40%（2/5），方向可用率：60%（3/5）**\n\n**核心发现：** 假设成立率维持 40%（与第19、20周持平），但**失效假设的性质发生了关键变化**——前几周失效的是\"框架性共识=可交易增量\"（H1类），本周失效的是**\"成长超跌修复\"（H3）和\"出口链受益\"（H4）两个正向假设**。这意味着预测体系当前的核心短板，已从\"宏观/事件判断偏乐观\"转向**\"成长股方向判断连续反向\"**：H3（成长修复）是本周最大失分根因，连续第2周（第20周 H3\"利好出尽回吐\"虽成立，但成长方向也偏乐观）押注成长反弹失败。**\"深度杀跌后成长会结构性修复\"这一隐含预设，需彻底重构。**\n\n---\n\n## 四、全周滚动预测回顾\n\n| 日期 | 预测方向 | 实际方向 | 判定 | 备注 |\n|------|---------|---------|:--:|------|\n| 10/5（一） | 低开/平开 + 成长修复（算力强） | （假期，A股休市） | ⚪ | 长假冻结，锚点预测 |\n| 10/6（二） | 偏暖对冲，成长修复动能增强（置信度升至48%） | （假期，港股+1.00%续涨） | ⚪ | 港股反弹强化偏多 |\n| 10/7（三） | 偏暖进一步强化，成长修复（置信度49%） | （假期，港股-0.54%收跌，A50转弱） | ⚪ | 港股尾段转弱 |\n| 10/8（四） | 低开分化+结构性调整（上证3800-3880） | 3811.90 -0.79%，成长深杀（科创50 -4.82%） | 🟡 | 方向对（低开分化），成长杀跌深度超预期 |\n| 10/9（五） | 超跌修复博弈（上证3760-3880） | 3813.79 +0.05%，上午深杀午后V反 | 🟡 | 方向偏空（上午深杀），午后V反未预料 |\n\n**滚动预测方向正确率：0/2（两日均🟡），可用率 100%（2/2）**\n\n**关键观察：** 本周滚动预测**两日均为🟡（方向对、但幅度/节奏偏差）**。10/8 方向正确（低开分化）但成长杀跌深度被低估（预测\"打折\"、实际\"崩盘\"）；10/9 早间\"偏空为主\"在上午命中（三指数齐破下沿），但**午后V反（主力资金流转正 + 港股传导）是全天最低概率情景（尾盘修复20%），未被预测**。核心教训：**\"日内恐慌（上午深杀）→ 尾盘修复（午后V反）\"的形态在深度杀跌日反复出现，午间复盘不宜过早将上午弱势外推为全天**（已在10/9收盘复盘中记录，对应P2-58修正）。\n\n---\n\n## 五、偏差修正效果（全周汇总）\n\n| 日期 | 修正有效率 | 关键发现 |\n|------|:--------:|------|\n| 10/8 周四 | 87.5%（午间+收盘一致，7✅/1🟡/0❌） | P0-1/P1-1/P1-19/P2-2/P1-14/P2-7/P1-32 七条修正全部兑现（低开分化+成长打折+防御油气对冲）；P0-3 反弹加成+10%🟡（仍偏高，成长无反弹反深跌） |\n| 10/9 周五 | 62.5%（收盘二次确认，5✅/3🟡/0❌） | P1-9 半导体恐慌惯性\"上午强化→午后衰减\"，午间判定过早被全天证伪（最大教训）；P0-3+P1-14 午后超跌反抽+主力转正双引擎兑现 |\n\n**核心发现：**\n\n1. **修正体系在\"方向\"层持续有效，在\"成长幅度\"层反复失效**：10/8-10/9 两日修正有效率 87.5%→62.5%，方向类修正（P0-1/P1-1/P1-19/P2-2/P1-32）几乎全部兑现；但**P0-3（超跌反弹加成）连续两日偏乐观**——10/8 +10% 偏高（成长无反弹反深跌），10/9 +5% 也仅午后兑现。**\"成长超跌反弹\"的幅度认知是当前修正体系的最薄弱环节。**\n\n2. **P1-14（主力净流入领先）本周表现最稳定**：10/8 主力 -613.94亿未转正→成长深杀；10/9 上午 -355.45亿收窄未达 -250亿→不抢跑正确；10/9 午后 +57.58亿转正→V反。**主力资金流转正是\"成长止跌反弹\"的第一领先信号**，全周精确兑现，应升级为成长方向的最高权重输入。\n\n3. **地缘-油价传导开关（GEO-OIL）完美验证**：霍尔木兹海峡关闭→油价→油气/航运/煤炭领涨（10/8 油气+3.60%、航运+2.48%），同时压制成长（利率传导）。防御/资源对冲价值在利空放大日再次兑现。\n\n---\n\n## 六、模型优化建议\n\n### 6.1 假设层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| H3\"成长超跌修复\"连续第2周反向（本周最大失分） | 深度杀跌环境（连续暴跌+美债长端高位+主力巨额流出）下，**默认\"成长全线出清\"，不再预设\"结构性分化（强者恒强）\"**；待主力资金流转正后再分强弱 | 🔴 紧急 |\n| H4\"降税落地→出口链受益\"连续第2周落空 | 出口链\"利好出尽\"默认概率上调至 50%+，降税落地日出口链获利了结优先于订单传导 | 🔴 紧急 |\n| 港股长假领先信号权重被高估（H1部分失效） | 长假期间港股领先信号\"末段反复\"（P2-57）时，**节后方向以美债长端利率 + 主力资金流为最终锚**，港股仅作辅助参考 | 🔴 紧急 |\n\n### 6.2 指标层面\n\n| 指标 | 评价 | 建议 |\n|------|:--:|------|\n| 主力净流入（P1-14） | ✅ 最有效（全周精确） | 升级为\"成长止跌反弹\"第一领先信号，转正/收窄>50%为成长修复的硬开关 |\n| 美债30Y长端利率 | ✅ 有效（5.731%新高驱动成长杀跌） | 纳入成长方向判断的必查项，30Y 冲高时成长\"修复\"假设禁用 |\n| 富时A50期指（P2-55） | ✅ 有效（10/8低开方向） | 长假后首日继续强制检查 |\n| P0-3超跌反弹加成 | ❌ 噪音（连续两日偏乐观） | 深度杀跌环境下加成归零，改为\"主力转正后+5%\"的条件加成 |\n| 港股单一涨跌 | ❌ 噪音（假期反弹误导） | 降权，仅作辅助参考 |\n\n### 6.3 框架层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| 机会行业押注单一科技主线连续第3周反向 | 机会行业列表**强制加入防御对冲项（银行/红利）并置顶**，科技主线（AI算力/半导体）在\"深度杀跌+美债长端高位\"下降至次优 | 🔴 紧急 |\n| \"成长结构性分化\"预设失效 | 三情景中删除\"成长结构性修复\"这一中性情景，改为\"成长全线出清（主力未转正）/成长超跌反弹（主力转正）\"二选一 | 🟡 重要 |\n| 尾盘V反形态未建模 | 深度杀跌日单列\"日内恐慌→尾盘修复\"高权重子情景（20%→35%），避免午间过早外推全天 | 🟡 重要 |\n| 概率校准（本周改善但仍有残留） | 主情景一（40%）指数层面对（低开震荡+防御），但\"出口链受益\"子判断落空、成长走情景三（28%）；继续\"概率-结果\"追踪 | 🟡 重要 |\n\n### 6.4 数据层面\n\n| 建议 | 说明 | 优先级 |\n|------|------|:--:|\n| 美债30Y长端利率日度序列 | 作为成长方向判断第一外部输入（10/8 5.731%新高是成长杀跌直接驱动） | 🔴 紧急 |\n| 行业资金流\"转正\"时点序列 | 主力净流入转正是成长止跌第一信号，需日内跟踪（上午/午后） | 🔴 紧急 |\n| 出口链订单传导高频指标 | 降税落地后出口链\"利好出尽vs订单传导\"需真实数据区分，避免连续第2周押注落空 | 🟡 重要 |\n\n---\n\n## 七、本周新增偏差模式（待录入经验库）\n\n| 编号 | 模式名称 | 核心内容 | 首次出现 |\n|:----:|------|------|:--:|\n| P2-59 | 深度杀跌期成长\"结构性分化\"预设失效 | 连续暴跌+美债30Y高位+主力巨额流出共振下，成长股不会\"结构性分化（算力强/存储弱）\"，而是全线出清；修复需等主力资金流转正后再分强弱 | 10/8 |\n| P2-60 | 节后方向锚定美债长端+主力资金流 | 长假假期内港股\"企稳反弹\"（偏空证伪信号）是误导性信号，节后A股方向最终由美债30Y新高+主力巨额流出决定，港股单一信号权重应下调 | 10/8 |\n\n> 另强化 P1-14 子规则：**\"主力资金流转正（或收窄>50%且次日转正）是成长止跌反弹的第一硬开关，未转正前不预设成长修复\"**（10/8-10/9 全周验证）。\n\n---\n\n## 八、本周统计\n\n### 8.1 核心评分（1周层可验证项）\n\n| 指标 | 数值 | vs 第20周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 7项（方向/上证区间/科创50区间/创业板区间/机会行业/风险行业/证伪条件） | +3项（格式回归修复） |\n| ✅ 完全正确 | 2项（28.6%） | +3.6pp |\n| 🟡 部分正确 | 4项（57.1%） | +7.1pp |\n| ❌ 错误 | 1项（14.3%） | -10.7pp |\n| **正确率（✅）** | **28.6%** | **+3.6pp** |\n| **可用率（✅+🟡）** | **85.7%** | **+10.7pp** |\n| **错误率（❌）** | **14.3%** | **-10.7pp** |\n\n> **诚实说明：** 正确率 28.6%（回升）、可用率 85.7%（显著回升）、错误率 14.3%（回落）。**核心改善：①周一锚点格式回归首次修复（连续4周问题解决），可评分项从4项增至7项；②风险行业警示连续第3周精确命中（100%）；③上证方向+护盘托底判断精准**。**核心恶化：①成长方向连续第2周反向（科创50区间❌）；②机会行业科技主线连续第3周反向**。核心问题迁移：从\"格式回归+概率校准\"迁移至**\"成长股方向判断\"**——H3\"成长超跌修复\"是当前最大短板。\n\n### 8.2 二十一周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | W12 | W13 | W14 | W15 | W16 | W17 | W18 | W19 | W20 | **W21** | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 40.0% | 36.4% | 58.3% | 37.5% | 14.3% | 71.4% | 0% | 0% | 25% | 25% | **28.6%** | 📈 回升 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 60.0% | 100% | 83.3% | 62.5% | 42.9% | 100% | 100% | 75% | 100% | 75% | **85.7%** | 📈 回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 33.3% | 0% | 8.3% | 37.5% | 57.1% | 0% | 0% | 25% | 0% | 25% | **14.3%** | 📉 回落 |\n\n> ⚠️ **趋势解读：** 正确率 28.6%（W17-W21 区间高位）、可用率 85.7%（回升至健康区）、错误率 14.3%（回落）。**格式回归修复是本周最大结构性改善**——可评分项从4项恢复到7项，可用率回升。**但正确率仍远低于 W16 的 71.4% 峰值**，第一障碍已从\"格式回归\"迁移为**\"成长股方向判断连续反向\"（H3连续第2周失效 + 机会行业科技主线连续第3周反向）**。风险行业警示（连续3周100%）是唯一穿越周期的稳定项。\n\n---\n\n## 九、复盘摘要\n\n### 📈 亮点\n\n1. **风险行业警示连续第3周精确命中（最大稳定项）**：高估值成长（科创50 -4.82%/半导体 -4.98%）、港股相关（恒指 -1.43%/恒生科技 -2.89%）、存储/HDD、中概全部命中。\"高位区分有/无催化 + 风险行业负面清单\"框架连续第3周正向验证，风险行业警示已成为最稳定预测维度（10月连续3周100%）。\n2. **周一锚点记录格式回归首次修复**：10/5 预测恢复完整结构化模板（三指数分层+机会+风险+证伪+三情景），连续4周的格式回归问题消除，可评分项从4项恢复至7项。\n3. **上证方向+护盘托底判断精准**：低开/平开+政策护航托底兑现（上证全周仅 -0.74%，银行/电力/煤炭护盘守3800），权重蓝筹补跌压力兑现。\n4. **P1-14（主力资金流）全周精确兑现**：10/8 主力 -613.94亿未转正→成长深杀；10/9 午后 +57.58亿转正→V反，是成长止跌反弹的第一领先信号。\n\n### 📉 不足\n\n1. **成长方向连续第2周反向（本周最严重）**：预测\"成长修复拆算力强/平台弱/存储弱\"，实际成长全线深杀（科创50 -4.75%、半导体 -4.98%、算力带头崩盘、CPO跌停）。H3\"成长超跌修复\"是本周最大失分根因。\n2. **机会行业押注单一科技主线连续第3周反向**：AI算力/光模块、半导体设备双双大幅跑输（命中率仅20%），唯一跑赢的仍是防御项（银行）。\n3. **证伪条件两组均为\"部分触发\"、误导性信号未被识别**：港股10/5-6企稳反弹（偏空证伪信号）触发后，预测逐步上调成长修复概率，但节后成长照样深杀——真正驱动是美债30Y新高（5.731%）+主力巨额流出（-613.94亿），港股权重被高估。\n4. **尾盘V反形态未建模**：10/9 午后V反（主力转正+港股传导）是全天最低概率情景（20%），午间\"偏空延续45%\"未命中。\n\n### 🔑 核心教训\n\n1. **深度杀跌环境，成长股不会\"结构性分化\"，只会\"全线出清\"**：连续暴跌+美债长端高位+主力巨额流出共振下，\"算力强/存储弱\"的结构性修复预设彻底失效。修复需等主力资金流转正（P1-14硬开关）后再分强弱，未转正前不预设任何成长方向（P2-59）。\n\n2. **节后方向锚定美债长端+主力资金流，而非港股单一信号**：长假期间港股\"企稳反弹\"是误导性信号（P2-60），港股权重下调；美债30Y（5.731%新高）与主力净流出（-613.94亿）才是节后成长杀跌的真正驱动。\n\n3. **主力资金流转正是成长止跌反弹的第一硬开关**：P1-14 全周精确兑现（未转正→深杀，转正→V反），应升级为成长方向的最高权重输入，取代\"超跌反弹加成\"（P0-3连续两日偏乐观）。\n\n4. **格式回归修复是正确率回升的前提**：W21 可评分项恢复至7项、可用率回升至85.7%，证明结构化模板是预测质量的硬约束；但正确率要回到 W16 峰值，还须攻克\"成长方向判断\"这个新障碍。\n\n### 🔧 优先改进项\n\n| 优先级 | 改进项 | 预期效果 |\n|:--:|------|------|\n| 🔴 | 深度杀跌期删除\"成长结构性修复\"预设，改\"全线出清/主力转正后反弹\"二选一 | 修复H3连续第2周失效 |\n| 🔴 | 主力资金流转正设为成长止跌第一硬开关，取代超跌反弹加成 | 修复P0-3连续两日偏乐观 |\n| 🔴 | 机会行业强制置顶防御对冲项（银行/红利），科技主线降至次优 | 修复科技主线连续第3周反向 |\n| 🔴 | 美债30Y长端+主力资金流纳入成长方向第一输入，港股降权 | 消除节后方向误导性信号 |\n| 🟡 | 出口链\"利好出尽\"默认概率上调至50%+ | 修复H4连续第2周落空 |\n| 🟡 | 深度杀跌日单列\"日内恐慌→尾盘修复\"子情景（20%→35%） | 修复尾盘V反未建模 |\n\n---\n\n*复盘完成：2026-10-12 07:20 CST | 下次复盘：2026-10-19（周一）*\n"},{"filename":"每周预测复盘-2026-10-19.md","content":"# 📊 每周预测复盘 — 第22周（2026年10月12日-10月16日）\n\n> 生成时间：2026-10-19 07:20 CST | 复盘人：阿策（📊）\n> 预测来源：10/12（周一）预测记录 → 1周内预测（结构化模板）\n> 数据源：腾讯财经日K（前复权）+ 早间/午间/收盘复盘记录 + 预测准确率追踪 + 预测偏差经验库\n> ⚠️ 特殊说明：本周 A 股 5 个完整交易日（10/12-10/16），无休市。10/12 周一锚点预测首次在「单针探底 + 主力单日转正 + 外资配置转向」三重信号下给出「超跌修复确认」的偏多判断，实际走出「二次探底深化」——**这是第20-21周「成长方向连续反向」的第三次延续，且首次出现上证方向本身反向（前两周至少上证方向正确）**。\n\n---\n\n## ⚠️ 开篇提示：本周为预测体系建立以来的方向性最差周之一\n\n第22周周一（10/12）「1周内」预测给出**偏多修复**判断（置信度 52%，三情景中偏多合计 75%），但全周实际为**单边下跌 + 二次探底**：上证 -2.56%（3813.79→3716.28，10/15 盘中击穿 3700 至 3692.59）、科创50 -6.77%、创业板 -8.90%。**可评分 7 项中 ❌ 4 项、🟡 3 项、✅ 0 项，正确率 0%、错误率 57.1%**——正确率与 W17/W18 并列历史最低，错误率接近 W7/W9/W15 的历史高位。\n\n核心失败并非「框架缺失」，而是**对单日 V 反信号的过度外推**：10/9 单针探底（主力单日转正 +57.58 亿 + 上涨占比 60.58%）被直接升级为「超跌修复确认」，忽略了 P1-14 硬开关要求的「连续转正」尚未满足、以及外资配置转向（P1-32 慢变量）从未落为真金白银。\n\n---\n\n## 一、本周预测回顾\n\n### 10/12（周一）1周预测原文（面向 10/12-10/16）\n\n| 维度 | 预测内容 |\n|------|----------|\n| 最可能走势 | 10/9 单针探底 + 主力转正 + 外资配置转向三重确认后，进入「超跌修复确认」阶段，叠加三季报开启；偏多（主力转正 +57.58 亿、外资低配→中性、中概金龙 2.69%、上涨占比 60.58%、证监会稳预期）vs 偏空（美债 30Y 高位、元件/CPO 惯性未出清、申万口径主力仍 -116.24 亿、达利欧 AI 泡沫论、长下影线需回踩确认） |\n| 核心区间 | 上证 3760-3900 \\| 科创50 1420-1530 \\| 创业板 2970-3130 |\n| 机会行业 | 传媒/AI应用、贵金属/黄金、券商/非银、三季报预增主线、超跌半导体自主可控 |\n| 风险行业 | 元器件/CPO光通信、军工装备、银行/防御红利、高估值成长（AI 泡沫论）、三季报不及预期个股 |\n| 置信度 | 52%（±5%） |\n| 三情景 | 修复确认震荡 40% / 成长超跌反弹走强 35% / 二次探底深化 25% |\n\n### 本周实际走势（收盘价，前复权）\n\n| 日期 | 上证 | 科创50 | 创业板 | 备注 |\n|------|:------:|:------:|:------:|------|\n| 10/9（前收） | 3813.79 | 1457.27 | 3043.33 | 基准 |\n| 10/12（一） | 3797.24（-0.43%） | 1426.72（-2.10%） | 2963.82（-2.61%） | 成长续跌、银行护盘，创业板当日即破 2970 |\n| 10/13（二） | 3800.86（+0.10%） | 1427.18（+0.03%） | 2958.34（-0.18%） | 早盘二次探底 3741.53 后 V 反，元件/通信/军工领涨 |\n| 10/14（三） | 3767.23（-0.88%） | 1380.26（-3.29%） | 2866.76（-3.10%） | 超跌反抽一日游，行业主力 -585.20 亿 |\n| 10/15（四） | 3707.48（-1.59%） | 1359.52（-1.50%） | 2783.17（-2.92%） | 恐慌延续，盘中击穿 3700 至 3692.59，上涨占比 7.76% 冰点 |\n| 10/16（五） | 3716.28（+0.24%） | 1358.65（-0.06%） | 2772.38（-0.39%） | 早盘暴力普涨（上涨占比 88.68%）午后退潮冲高回落 |\n| **全周变化** | **-2.56%** | **-6.77%** | **-8.90%** | 周区间：上证 3692.59-3809.08 |\n\n**关键观察（先行点出）：** 本周是**「周一即破位、周中二次探底、周五弱反弹」的单边下跌结构**。10/12 首日成长即续跌（创业板 -2.61% 跌破 3000、宽基ETF主力 -14.27 亿未转正），直接证伪「超跌修复确认」；10/13 短暂 V 反（行业主力 +79.9 亿单日转正）给了「反抽确认」的假象，10/14 即一日游崩跌（主力 -585.20 亿）；10/15 恐慌延续击穿 3700（上涨占比 7.76% 冰点、主力 -620 亿）；10/16 早盘暴力普涨（88.68%）午后退潮（炸板率 44.55%）冲高回落。**全周成长领跌（创业板 -8.90%、科创50 -6.77%），上证相对抗跌（-2.56%）——「指数护盘、成长深杀」的分化结构第 4 周延续**。\n\n---\n\n## 二、验证结果\n\n### 2.1 走势方向验证（上证）\n\n| 预测 | 实际 | 判定 | 说明 |\n|------|------|:--:|------|\n| 超跌修复确认、偏多、区间震荡（3760-3900） | 全周单边下跌 -2.56%，10/15 击穿 3700，10/16 弱反弹未收复 | ❌ | 方向错误：预测偏多修复，实际二次探底深化。这是第 20-21 周「成长方向反向」的延续，且**首次上证方向本身反向**（前两周至少上证方向正确） |\n\n**说明：** 上证方向判断为本周最大失分项。10/9 单针探底被过度外推为「底部确认」，但 P1-14 硬开关（主力连续转正）在 10/12 当日即被证伪（宽基ETF -14.27 亿），此后主力仅在 10/13 单日转正（+79.9 亿）即回落，10/14-10/15 主力 -585/-620 亿连续巨额流出。\n\n### 2.2 上证区间验证\n\n| 预测区间 | 实际区间 | 判定 | 说明 |\n|----------|----------|:--:|------|\n| 3760-3900 | 收盘 3707.48-3800.86；盘中低 3692.59（破 3760 下沿约 67 点） | ❌ | 下沿 3760 被显著跌破：10/13 盘中破 3750（3741.53），10/14 收盘 3767.23 失守，10/15 收盘 3707.48、盘中 3692.59 |\n\n**说明：** 预测区间 3760-3900 完全位于实际收盘区间（3707.48-3800.86）之上方。周内仅 10/12 早盘一度触及 3809.08（接近但未达 3900 上沿），此后单边下行。**核心区间对本周的覆盖彻底失效**，下沿偏差 67 点、方向与幅度均错。\n\n### 2.3 指数分层验证（三指数全部反向）\n\n| 指数 | 1周预测 | 实际 | 判定 | 说明 |\n|------|---------|------|:--:|------|\n| 上证 | 3760-3900（偏多） | 收 3716.28（-2.56%），盘中低 3692.59 | ❌ | 方向+区间均错 |\n| 科创50 | 1420-1530（成长反弹） | 收 1358.65（-6.77%），10/14 即破 1420，盘中低约 1338 | ❌ | 方向+区间均错 |\n| 创业板 | 2970-3130（成长反弹） | 收 2772.38（-8.90%），10/12 当日即破 2970 | ❌ | 方向+区间均错，且首日即破位 |\n\n**核心发现：** 三指数**全部 ❌**，且科创板/创业板的下沿在周初（10/12-10/14）即被击穿——不是「区间预测偏窄」的技术性偏差，而是**方向判断的彻底反向**。预测「成长超跌反弹走强 35%」为第二大情景，实际成长领跌全周（创业板 -8.90%）。「单针探底→成长修复」的传导假设连续第 3 周彻底失效。\n\n### 2.4 机会行业验证\n\n| 推荐行业 | 本周表现 | vs 上证(-2.56%) | 判定 |\n|----------|:------:|:------:|:--:|\n| 传媒/AI应用 | 文化传媒 10/12 +2.37%、10/14 +14.69 亿逆势护盘，10/16 -36.84 亿退潮 | 前四日相对跑赢 | ✅ |\n| 贵金属/黄金 | 10/16 贵金属 +3.54%（+14.00 亿）逆势领涨，全周避险属性兑现 | 相对跑赢 | ✅ |\n| 券商/非银 | 10/16 证券 -14.76 亿、非银金融 -16.97 亿领跌 | 跑输 | ❌ |\n| 三季报预增主线 | 赣锋锂业 10/16 三季报，电池 -16.92 亿流出，主线未形成 | 未兑现 | ❌ |\n| 超跌半导体自主可控 | 半导体 10/12 -2.73% 领跌、10/14 -83.54 亿领跌，仅 10/16 尾盘转正 | 大幅跑输 | ❌ |\n\n**机会行业命中率：40%（2/5），且命中项均为避险/防御类（传媒、黄金），押注的科技/金融/业绩主线全部落空**\n\n**说明：** 本周机会行业**唯一跑赢的是两个避险方向（传媒、黄金）**，而押注的「超跌半导体自主可控」全周领跌（仅 10/16 尾盘转正 +34.22 亿）。**「超跌半导体自主可控」连续第 4 周作为机会行业推荐失败**——「错杀修复」逻辑在「费半 6 连跌 + AI 泡沫论 + 主力巨额流出」环境下完全失效。券商/非银与三季报主线也未兑现。机会行业的稳定收益项已连续 4 周只有避险/防御类。\n\n### 2.5 风险行业验证（连续第 3 周 100% 后首次显著下滑）\n\n| 警示行业 | 本周表现 | vs 上证(-2.56%) | 判定 |\n|----------|:------:|:------:|:--:|\n| 元器件/CPO光通信 | 元件 10/12 -3.75% 领跌、通信设备 10/14 -44.46 亿领跌 | 跑输 | ✅ |\n| 高估值成长（AI 泡沫论） | 科创50 -6.77%、创业板 -8.90% 领跌 | 大幅跑输 | ✅ |\n| 军工装备 | 军工 10/13 +33.25 亿、10/16 国防军工 +29.34 亿，连续两日主线领涨 | 反向跑赢 | ❌ |\n| 银行/防御红利 | 银行 10/12 +1.99%（+62.52 亿）领涨护盘 | 反向跑赢 | ❌ |\n| 三季报不及预期个股 | 未单独验证 | — | ⚪ |\n\n**风险行业命中率：50%（2/4 可验证），连续 3 周 100% 后首次下滑，军工/银行两项反向**\n\n**说明：** **本周风险行业警示从「稳定项」首次转为「失分项」**——连续 3 周（第19/20/21周）100% 精确命中的风险行业警示，本周仅 50%（2/4）。核心错误：**把「军工装备」和「银行/防御红利」错误列入风险清单**。军工装备成为 10/13、10/16 连续两日主线（主力净流入居前）；银行成为 10/12 领涨护盘主力（+62.52 亿）。**「防御/红利 = 补跌风险」的结构性偏见，在「成长领跌、资金避险」的环境下系统性反向**（详见 6.1 假设层面）。\n\n### 2.6 证伪条件验证\n\n| 证伪条件 | 触发情况 | 判定 |\n|----------|:------:|:--:|\n| 偏多证伪（→修复走强）：周一主力连续第 2 日转正 + 外资配置转向确认 + 上证守住 3795 | 🟡 未触发：10/12 宽基ETF主力 -14.27 亿未转正❌、外资未确认❌、上证收 3797.24 险守 3795✅。偏多证伪未满足 → 修复未走强（此信号方向正确） | ✅ |\n| 偏空证伪（→二次探底）：周一上证跌破 3760 + 主力重回净流出 + 元件/CPO 继续深杀 | 🟡 部分触发：10/12 元件 -3.75% 深杀✅ + 主力净流出✅，10/13 盘中破 3750 触发「跌破 3760」✅ → 最终 10/14-10/15 二次探底深化兑现 | ✅ |\n\n**说明：** 本周证伪条件**本身设计有效**——偏空证伪信号（主力净流出 + 元件深杀 + 跌破 3760）在 10/12-10/13 即逐步触发，最终准确指向「二次探底深化」。**核心问题不在证伪条件，而在主情景概率分配**：偏空证伪信号已触发，但预测仍将「修复确认震荡 40% + 成长反弹 35%」合计 75% 权重压在偏多侧，仅给「二次探底深化」25% 的最低权重。**证伪条件与三情景概率之间脱节**——信号已偏空，概率却未相应上调偏空情景。判定：证伪条件 ✅（方向正确），但权重分配 ❌（见 6.3 框架层面）。\n\n---\n\n## 三、关键假设验证\n\n从 10/12 预测中隐含的核心假设：\n\n| 假设 | 内容 | 验证结果 | 说明 |\n|:--:|------|:--:|------|\n| H1 | 10/9 单针探底 + 主力转正 + 外资转向 = 超跌修复确认（短期底部成立） | ❌ 失效 | 单针探底被证伪：10/12 首日成长即续跌，10/14-10/15 二次探底更深（击穿 3700）。单日 V 反 ≠ 底部确认 |\n| H2 | 外资配置转向（美银低配→中性）→ 增量资金入场托底 | ❌ 失效 | 外资真空期延续（P1-32 连续验证），真金白银未落地，10/12 宽基ETF主力 -14.27 亿反而流出 |\n| H3 | 成长超跌反弹走强（半导体/AI应用领涨） | ❌ 失效 | 成长全线深跌（创业板 -8.90%、科创50 -6.77%），半导体 10/14 领跌 -83.54 亿。连续第 3 周反向 |\n| H4 | 元件/CPO 惯性出清后可修复（错杀） | 🟡 部分成立 | 元件 10/12 继续深杀（惯性✅）、10/13 反抽领涨 +5.03%（修复✅），但 10/14 一日游回落（「回补≠反转」） |\n| H5 | 银行/防御红利面临补跌压力（列风险行业） | ❌ 失效 | 银行反而成为护盘主力（10/12 +62.52 亿领涨），防御红利是避险方向而非风险 |\n\n**假设成立率：0%（0/5），方向可用率：20%（1/5，H4 部分成立）**\n\n**核心发现：** 假设成立率 0%，为预测体系建立以来的**历史最低**（前几周维持在 40% 左右）。失效假设从「部分正向假设」（第20-21周的 H3 成长修复）扩展为「**几乎全部正向假设同时失效**」——底部确认（H1）、外资托底（H2）、成长反弹（H3）、防御补跌（H5）全部反向。**这是单日 V 反信号的「全线过度外推」：把 10/9 一天的反转信号，错误地作为一整周偏多判断的全部依据**，忽视了「连续转正」这一 P1-14 硬开关未被满足的核心事实。\n\n---\n\n## 四、全周滚动预测回顾\n\n| 日期 | 预测方向 | 实际方向 | 判定 | 备注 |\n|------|---------|---------|:--:|------|\n| 10/12（一） | 修复确认震荡偏多（三情景偏多 75%） | 上证 -0.43% 扛跌、成长深跌（创业板 -2.61% 破 3000） | 🟡 | 上证层面守住 3795，但成长走「二次探底」情景三 |\n| 10/13（二） | 弱势震荡探底 + 超跌反抽博弈 | 早盘破 3750 后 V 反（+0.10%），元件/通信/军工反抽 | 🟡 | 反抽提前 + 力度超预期（「需等费半企稳」偏保守） |\n| 10/14（三） | 超跌反抽延续 + 扩散轮动（震荡 45%） | 一日游回落，行业主力 -585 亿 | ❌ | 走最低概率「情景三一日游」，主力连续转正落空 |\n| 10/15（四） | 科技恐慌出清 + 防御相对占优（弱势震荡 45%） | 恐慌延续击穿 3700，防御也失守 | ❌ | 连续第 2 日走最低概率「恐慌延续 25%」 |\n| 10/16（五） | 冰点后广度修复（宽基/价值领先） | 早盘暴力普涨（88.68%）午后冲高回落 | 🟡 | 上涨占比精确命中（60.80%），但风格反向（科技/军工领涨） |\n\n**滚动预测方向正确率：0/5（3🟡/2❌），可用率 60%（3/5）**\n\n**关键观察：** 本周滚动预测**无一日 ✅，且 10/14-10/15 连续两日走「最低概率的恐慌情景」**。核心问题：**三情景概率分配连续 3 日（10/13-10/15）把「震荡/反抽」设为最高概率，而「恐慌延续/二次探底」始终压在 25% 的最低权重，但实际连续 2 日兑现恐慌**。这暴露了「概率分配偏乐观」的系统性惯性（详见 6.3）。10/16 唯一亮点：上涨占比 50-70% 的预测精确命中（实际 60.80%），证明 P1-16-2 宽度修复模型有效。\n\n---\n\n## 五、偏差修正效果（全周汇总）\n\n| 日期 | 修正有效率 | 关键发现 |\n|------|:--------:|------|\n| 10/12 周一 | 42.9%（收盘） | P0-3 超跌反弹加成 +10% 与 P1-14 主力转正已确认双重过度乐观，成长深跌证伪；P0-1/P1-9 惯性未出清兑现 |\n| 10/13 周二 | 80%（收盘） | P1-14 行业主力转正第 4 次验证；P2-61 深杀后主线切换兑现；元件/通信/军工超跌回补 |\n| 10/14 周三 | 28.6%（收盘） | P0-3/P0-2/P1-9/P1-16-2 四重过度乐观，成长崩跌 -585 亿；P1-14 连续转正确认是唯一✅ |\n| 10/15 周四 | 42.9%（收盘） | P1-9/P1-14/P2-2 转正确认✅；P1-2 防御占优❌（P2-62 防御失守=系统性恐慌）；三情景概率连续第 2 日低估恐慌 |\n| 10/16 周五 | 3✅/3🟡/1❌ | P1-9 出清确认 + P1-14 半导体连续转正 + P1-2 不预设防御占优✅；P2-64 科技回补前置过严发现；军工主线漏判 |\n\n**核心发现：**\n\n1. **P1-14（主力资金流）是本周唯一持续正确的修正规则**：连续转正硬开关在 10/13-10/16 精确兑现（10/13 转正→反抽，10/14 转负→崩跌，10/16 半导体连续转正→企稳）。但锚点预测（10/12）未遵守此硬开关——把「单日转正」当作「已转正」。\n\n2. **P0-3（超跌反弹加成）连续第 4-5 日过度乐观，是本周最大系统性噪音**：10/12 +10%、10/14 +15~20%、10/15 +5~10% 连续三次偏乐观，成长无反弹反深跌。应彻底归零改为条件加成。\n\n3. **「防御占优」假设（P1-2）在系统性恐慌中失效**：10/15 电力/煤炭/工业金属也领跌净流出，防御失守（P2-62），证明「成长→防御」的风格切换在恐慌末期会演变为无差别抛售。\n\n4. **军工/国防连续两日成为主线，但预测体系从未捕捉**：10/13 军工 +33.25 亿、10/16 国防军工 +29.34 亿，且 10/16 早间仍把军工列为风险行业。这是「催化盲区」（详见 6.4 数据层面）。\n\n---\n\n## 六、模型优化建议\n\n### 6.1 假设层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| H3「成长超跌反弹」连续第 3 周失效（本周三指数全部反向） | **彻底删除「超跌反弹」作为默认主假设**。成长方向以 P1-14「主力连续 ≥2 日转正」为唯一硬开关，未转正前不预设任何成长方向（含「错杀修复」「自主可控」） | 🔴 紧急 |\n| H1「单日 V 反 = 底部确认」首次系统性失效 | **单日 V 反（主力单日转正 + 上涨占比回升）≠ 底部确认**。底部确认需「主力连续 2 日转正 + 上涨占比 >50% + 跌停家数回落」三信号同时满足，否则维持弱势/二次探底判断 | 🔴 紧急 |\n| H5「防御/红利 = 补跌风险」结构性反向（连续 2 周） | **银行/红利默认为「防御对冲项」而非「风险行业」**。只有当出现 P2-62「防御也失守」（电力/煤炭转净流出领跌）时，才升级为系统性恐慌。军工/国防同理——无明确利空时不应列为风险 | 🔴 紧急 |\n| H2「外资配置转向 → 增量资金入场」连续落空 | **外资「看多/转中性」等慢变量禁止进入 1 周内预测的做多理由**，仅以「ETF 净申购/北向流入」等真金白银（快变量）为准（P1-32 固化） | 🟡 重要 |\n\n### 6.2 指标层面\n\n| 指标 | 评价 | 建议 |\n|------|:--:|------|\n| 主力净流入（P1-14） | ✅ 最有效（全周精确） | 升级为**成长方向的唯一硬开关**；且需区分「行业主力」vs「宽基ETF主力」，两者背离时以宽基ETF为准（10/12 行业/宽基信号背离是锚点误判根因） |\n| 上涨占比/宽度（P1-16） | ✅ 有效（7.76%→88.68%→60.80% 完美刻画） | 宽度修复模型有效，但「修复判定」需连续 2 日（P1-16-2），单日修复不稳固 |\n| P0-3 超跌反弹加成 | ❌ 噪音（连续 4-5 日偏乐观） | **彻底归零**，改为「主力连续 2 日转正后 +5%」的条件加成；未转正前任何反弹加成都属过度外推 |\n| 外资唱多（P1-32） | ❌ 噪音（连续落空） | 降权为噪音，真金白银才是信号 |\n| 费半/外盘传导（P1-1/P1-9） | 🟡 有效但易过度 | 10/16 发现「科技未等费半企稳即自主修复」，科技回补开关放宽为「半导体主力连续 ≥2 日转正」（P2-64） |\n\n### 6.3 框架层面\n\n| 问题 | 建议 | 优先级 |\n|------|------|:--:|\n| 三情景概率分配连续 3 日偏乐观（恐慌连续 2 日落在 25% 最低权重） | **引入「恐慌概率自动上调」规则**：当「费半 ≥5 连跌 + 主力未连续转正 + 放量下跌」三条件同时满足时，「恐慌延续/二次探底」情景概率强制上调至 40%+，打破「震荡最高」的惯性 | 🔴 紧急 |\n| 证伪条件与三情景概率脱节（信号偏空但概率仍偏多） | **证伪条件触发后必须联动下调偏多情景概率**：偏空证伪信号（主力净流出 + 跌破关键位）触发当日，偏多情景权重下调 ≥20pp | 🔴 紧急 |\n| 风险行业清单存在「防御错配」结构性偏见 | 风险行业清单**强制区分「周期/催化风险」与「防御/风格」**：银行/红利/军工等防御方向默认不进风险清单，除非有明确利空催化 | 🔴 紧急 |\n| 单日 V 反后禁止「底部确认」升级 | 锚点预测若建立在「单日 V 反」基础上，需明确标注「未满足连续转正硬开关」，置信度自动下调 ≥10pp | 🟡 重要 |\n\n### 6.4 数据层面\n\n| 建议 | 说明 | 优先级 |\n|------|------|:--:|\n| 军工/国防板块催化监控 | 军工连续 2 周成为主线（10/13/10/16），但预测体系从未捕捉到。需新增国防/军工催化监控（政策、订单、地缘） | 🔴 紧急 |\n| 「行业主力 vs 宽基ETF主力」背离监控 | 10/12 两者信号背离（行业口径 +57.58 亿 vs 宽基ETF -14.27 亿）是锚点误判根因，需每日监控两者背离 | 🔴 紧急 |\n| 费半连跌天数序列 | 费半 6 连跌是本周成长恐慌的直接驱动，需作为「成长恐慌惯性」的量化输入 | 🟡 重要 |\n| 主力连续转正天数序列 | P1-14 硬开关的量化基础，需明确记录「连续转正天数」而非「是否转正」 | 🟡 重要 |\n\n---\n\n## 七、本周新增偏差模式（待录入经验库）\n\n| 编号 | 模式名称 | 核心内容 | 首次出现 |\n|:----:|------|------|:--:|\n| P2-66 | 单日 V 反 ≠ 底部确认 | 单日 V 反（主力单日转正 + 上涨占比回升）后，若「主力连续 ≥2 日转正」未满足，则不是底部确认，而是「反抽后二次探底」。底部确认需「连续转正 + 上涨占比 >50% + 跌停回落」三信号；锚点预测不得将单日反转外推为整周偏多 | 10/12 |\n| P2-67 | 防御红利错配为风险行业 | 成长领跌环境下，「银行/红利/军工」等防御方向是避险资金流向（护盘主力），而非「补跌风险」。把防御方向列入风险清单会在「成长领跌」周系统性反向。防御方向默认不进风险清单，除非 P2-62「防御也失守」触发 | 10/12 |\n\n> 另强化 P1-14 子规则：**「主力连续转正（行业主力 + 宽基ETF主力双口径）是成长止跌反弹的第一硬开关；单日转正 ≠ 已转正，行业/宽基口径背离时以宽基ETF为准」**（10/12-10/16 全周验证）。\n\n---\n\n## 八、本周统计\n\n### 8.1 核心评分（1周层可验证项）\n\n| 指标 | 数值 | vs 第21周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 7项（方向/上证区间/科创50区间/创业板区间/机会行业/风险行业/证伪条件） | 持平 |\n| ✅ 完全正确 | 0项（0%） | -28.6pp |\n| 🟡 部分正确 | 3项（42.9%） | -14.3pp |\n| ❌ 错误 | 4项（57.1%） | +42.9pp |\n| **正确率（✅）** | **0%** | **-28.6pp** |\n| **可用率（✅+🟡）** | **42.9%** | **-42.8pp** |\n| **错误率（❌）** | **57.1%** | **+42.9pp** |\n\n> **诚实说明：** 正确率 0%（与 W17/W18 并列历史最低）、可用率 42.9%（大幅回落）、错误率 57.1%（接近 W7/W9/W15 历史高位）。**核心恶化：①方向 + 三指数区间 4 项全部 ❌（方向首次连上证也反向）；②风险行业警示连续 3 周 100% 后首次下滑至 50%（军工/银行反向）；③机会行业科技主线连续第 4 周失败**。**仅存亮点：①证伪条件本身设计有效（偏空证伪准确指向二次探底）；②10/16 上涨占比 50-70% 精确命中（P1-16-2 宽度模型有效）；③P1-14 主力资金流硬开关全周精确**。核心问题已从「成长方向判断」升级为**「单日反转信号的过度外推 + 三情景概率分配偏乐观」**——这是锚点预测层面的系统性缺陷。\n\n### 8.2 二十二周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | W12 | W13 | W14 | W15 | W16 | W17 | W18 | W19 | W20 | W21 | **W22** | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 40.0% | 36.4% | 58.3% | 37.5% | 14.3% | 71.4% | 0% | 0% | 25% | 25% | 28.6% | **0%** | 📉 触底 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 60.0% | 100% | 83.3% | 62.5% | 42.9% | 100% | 100% | 75% | 100% | 75% | 85.7% | **42.9%** | 📉 大跌 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 33.3% | 0% | 8.3% | 37.5% | 57.1% | 0% | 0% | 25% | 0% | 25% | 14.3% | **57.1%** | 📈 恶化 |\n\n> ⚠️ **趋势解读：** 正确率 0%、可用率 42.9%、错误率 57.1%——三项全部显著恶化，为第 16 周（71.4% 峰值）以来最差周。**核心原因已从「成长方向判断」迁移为「单日 V 反信号的过度外推 + 三情景概率分配偏乐观」两个锚点级缺陷**。第 21 周「格式回归修复」带来的结构性改善被本周的方向性误判完全抵消。风险行业警示（连续 3 周 100%）本周首次下滑至 50%，「防御错配」成为新的结构性偏见。\n\n---\n\n## 九、复盘摘要\n\n### 📈 亮点\n\n1. **P1-14（主力资金流硬开关）全周精确，是唯一穿越周期的稳定指标**：10/13 行业主力转正 +79.9 亿→V 反，10/14 转负 -585 亿→崩跌，10/16 半导体连续第 3 日转正→企稳。「主力连续转正」作为成长止跌第一硬开关，全周精确兑现（含 10/16 半导体 +8.61→+11.39→+34.22 亿三连转正）。\n\n2. **证伪条件本身设计有效**：偏空证伪信号（主力净流出 + 元件深杀 + 跌破 3760）在 10/12-10/13 逐步触发，最终准确指向「二次探底深化」——证伪机制完好，问题在于主情景概率未及时联动。\n\n3. **P1-16-2 宽度修复模型有效**：10/16 上涨占比 50-70% 的预测精确命中（实际 60.80%），验证极端冰点（7.76%）后的宽度 V 形修复模型。\n\n4. **风险行业中的「高估值成长」警示连续第 4 周精确命中**：科创50 -6.77%、创业板 -8.90% 领跌，AI 泡沫论压制成长兑现。\n\n### 📉 不足\n\n1. **方向 + 三指数区间 4 项全部 ❌（历史最严重）**：预测「超跌修复确认、偏多」，实际二次探底深化，上证 -2.56%、科创50 -6.77%、创业板 -8.90%。**首次连上证方向也反向**，前两周至少上证方向正确。\n\n2. **单日 V 反信号被过度外推**：10/9 单针探底（主力单日转正 +57.58 亿）被直接升级为「超跌修复确认」，忽略了「连续转正」硬开关未满足 + 外资慢变量未落地。H1-H5 假设成立率 0%，为历史最低。\n\n3. **三情景概率分配连续 3 日偏乐观**：10/14-10/15 连续两日走「恐慌延续 25%」最低概率情景，但预测始终把「震荡/反抽」设为 45% 最高概率，「概率偏乐观」的系统性惯性暴露。\n\n4. **风险行业警示首次下滑至 50%**：军工装备（连续两日主线）和银行/防御红利（护盘主力）被错误列入风险清单，「防御/红利 = 补跌风险」的结构性偏见反向。\n\n### 🔑 核心教训\n\n1. **单日 V 反 ≠ 底部确认，需三信号硬确认**：主力连续 ≥2 日转正 + 上涨占比 >50% + 跌停家数回落，三者同时满足才是底部确认。10/9 只有「上涨占比回升」一个信号，主力转正仅是单日（宽基ETF 甚至仍 -14.27 亿），底部远未确认（新增 P2-66）。\n\n2. **「错杀修复/自主可控」逻辑在「费半 6 连跌 + AI 泡沫论 + 主力巨额流出」环境下彻底失效**：超跌半导体自主可控连续第 4 周作为机会行业失败。成长方向应以主力资金流（而非估值/催化）为唯一硬开关。\n\n3. **防御/红利不是风险，是避险方向**：成长领跌环境下，资金流向银行/红利（护盘）、传媒/黄金（避险）。把防御方向列入风险清单会在「成长领跌」周系统性反向（新增 P2-67）。「防御失守」需 P2-62 触发才升级为系统性恐慌。\n\n4. **证伪条件需与三情景概率联动**：信号已偏空（主力净流出 + 破位）时，偏空情景概率必须上调，不能维持「震荡最高」的惯性。这是本周「恐慌连续 2 日落在 25% 最低权重」的根因。\n\n### 🔧 优先改进项\n\n| 优先级 | 改进项 | 预期效果 |\n|:--:|------|------|\n| 🔴 | 删除「超跌反弹」默认主假设，成长方向以 P1-14 连续转正为唯一硬开关 | 修复 H3 连续第 3 周失效 + 三指数方向反向 |\n| 🔴 | 单日 V 反 ≠ 底部确认，引入「三信号硬确认」 | 修复 H1 首次系统性失效（锚点误判根因） |\n| 🔴 | 三情景概率「恐慌自动上调」规则（费半连跌+主力未转正+放量） | 修复恐慌连续 2 日落最低概率 |\n| 🔴 | 防御/红利默认不进风险清单，军工/国防新增催化监控 | 修复风险行业警示首次下滑至 50% |\n| 🟡 | 外资慢变量禁止进入 1 周内做多理由，仅认真金白银 | 修复 H2 连续落空 |\n| 🟡 | 证伪条件触发后联动下调偏多情景概率（≥20pp） | 修复信号与概率脱节 |\n\n---\n\n*复盘完成：2026-10-19 07:20 CST | 下次复盘：2026-10-26（周一）*\n"},{"filename":"每周预测复盘-2026-10-26.md","content":"# 📊 每周预测复盘 — 第23周（2026年10月19日-10月23日）\n\n> 生成时间：2026-10-26 10:20 CST（补执行） | 复盘人：阿策（📊）\n> 预测来源：10/19（周一）预测记录 → 1周内预测（覆盖 10/19-10/23）\n> 数据源：早间简报/午间复盘/收盘复盘记录 + 预测准确率追踪 + 预测偏差经验库\n> ⚠️ 补执行说明：原定周一 07:15/08:30 cron 任务「每周预测复盘」连续 8 次超时（600s 默认上限），调度器退避跳过 10/26 触发，本报告由人工补跑。cron 已修复（时间改 08:30、超时提至 1800s）。\n\n---\n\n## ⚠️ 开篇提示：宏观分叉精确命中 + 周内路径剧烈摆动的「复合周」\n\n第23周周一（10/19）「1周内」预测的核心是 **GDP 数据日三叉戟分叉判断**（≥4.5% 权重反抽 / ≈4.4% 防御占优 / <4.3% 二次探底）。实际三季度 GDP **4.5% 精确命中偏乐观分支**（华创/招商 4.5% vs 高盛 4.2%），周一权重/顺周期反抽兑现（上证 +0.39% 站稳 3700、银行 +48.74 亿居首）。但全周路径剧烈摆动：**情景一（周一分化）→ 情景三加强版（10/22 恐慌双杀，创业板 -4.37%、上涨占比 9.59%）→ 情景二加强版（10/23 冰点暴力 V 反，创业板 +4.16%、上涨占比 83.28%）**——单周内依次兑现三个情景，锚点概率 42/33/25 无法承载这种「先崩后 V」的路径切换。\n\n**可评分 7 项中 ✅ 4 项、🟡 3 项、❌ 0 项，正确率 57.1%、错误率 0%**——为第16周（71.4% 峰值）以来次高，且是错误率首次归零的一周。\n\n---\n\n## 一、本周预测回顾\n\n### 10/19（周一）1周预测原文（面向 10/19-10/23）\n\n| 维度 | 预测内容 |\n|------|----------|\n| 最可能走势 | GDP 数据日三线交汇：**若 ≥4.5%（华创/招商）则权重/周期反抽、成长错杀修复；若 ≈4.4%（共识）则弱复苏延续、防御/红利占优；若 <4.3% 则债券/防御/黄金占优、权益二次探底**。港股休市无领先信号，金融街论坛 + 10/20 LPR 提供政策安全垫。核心看 GDP 实际值 + 金融街论坛政策表述 + 费半能否企稳 + 上证 3700/3674 支撑 |\n| 核心区间 | 上证 3650-3800 \\| 科创50 1300-1410 \\| 创业板 2680-2850 |\n| 机会行业 | 黄金/贵金属、军工/军工装备、银行/保险/高股息、半导体/AI算力（需费半企稳+GDP 验证）、三季报超预期主线 |\n| 风险行业 | 文化传媒、电池/锂电、高估值 AI 算力、光模块/CPO、医药 |\n| 置信度 | 45%（±5%，核心变量：①三季度 GDP 实际值 ②金融街论坛政策表述 ③费半能否止跌 ④上证 3700/3674 支撑 ⑤融资余额能否止跌转正） |\n| 三情景 | 低开震荡分化 42% / 利空出尽修复（GDP≥4.5%+科技低开回升+科创50 收复 1400）33% / 双杀二次探底（GDP<4.3%+弃守 3674）25% |\n\n### 本周实际走势（收盘价）\n\n| 日期 | 上证 | 科创50 | 创业板 | 备注 |\n|------|:------:|:------:|:------:|------|\n| 10/16（前收） | 3716.28 | 1358.65 | 2772.38 | 基准 |\n| 10/19（一） | 3730.92（+0.39%） | 1329.19（-2.17%） | 2746.29（-0.94%） | **GDP 4.5% 超预期落地**，权重虹吸二八分化：银行 +48.74 亿居首，上涨占比仅 42.1%，两市 14375 亿 |\n| 10/20（二） | 3735.37（+0.12%） | 1342.42（+1.00%） | 2739.20（-0.26%） | 跷跷板反转：成长修复（科创50 +1.00%）、权重调整，上涨占比 67.77%，炸板率 34.94% 近翻倍 |\n| 10/21（三） | 3713.03（-0.60%） | 1343.28（+0.06%） | 2694.71（-1.62%） | 普跌缩量回踩：电池 -40.40 亿单拖累创业板，上涨占比 37.06%，跌停仅 5 家无恐慌 |\n| 10/22（四） | 3658.03（-1.48%） | 1305.81（-2.79%） | 2576.90（-4.37%） | **情景三加强版恐慌杀跌**：恒生 -3.05%、上涨占比 9.59%、跌停 49 家、20日新低 1822 家、全行业净流出 -679.67 亿，「易中天」（新易盛/中际旭创/天孚通信）崩塌 |\n| 10/23（五） | 3690.48（+0.89%） | 1345.51（+3.04%） | 2684.10（+4.16%） | **情景二加强版冰点 V 反**：盘中最低 3574.27 破 3580 后收回，上涨占比 83.28%、涨停 82 家、主力 +605 亿、半导体 +121.76 亿领涨、两市 19563 亿放量 +4276 亿 |\n\n**全周涨跌（10/16 → 10/23 收盘）**：上证 **-0.69%**（3716.28→3690.48）、科创50 **-0.97%**（1358.65→1345.51）、创业板 **-3.18%**（2772.38→2684.10）。\n\n---\n\n## 二、验证结果\n\n### 2.1 GDP 分叉三叉戟判断（本周核心）✅ 精确命中\n\n| 分叉 | 预测 | 实际 | 判定 |\n|------|------|------|:--:|\n| ≥4.5%（华创/招商偏乐观） | 权重/周期反抽、成长错杀修复 | GDP 4.5% 精确兑现；周一权重反抽兑现（上证 +0.39%、银行 +48.74 亿居首） | ✅ |\n| ≈4.4%（共识） | 弱复苏延续、防御/红利占优 | 未走此分支 | — |\n| <4.3% | 债券/防御/黄金占优、权益二次探底 | 未走此分支；但 10/22 出现「无数据前提的」恐慌双杀 | — |\n\n**说明：** 「宏观数据分叉 → 对应情景」的三叉戟框架首次完整验证，是本周最大亮点。数据日判断不是猜点位，而是「数据值 → 传导路径」的映射，方向性极强。\n\n### 2.2 上证区间验证（3650-3800）✅\n\n| 验证点 | 预测 | 实际 | 判定 |\n|--------|------|------|:--:|\n| 区间 | 3650-3800 | 收盘 3658.03-3735.37 全在区间内 | ✅ |\n| 盘中破位 | — | 10/23 盘中最低 3574.27（击穿下沿 76 点）后收回 | ⚠️ 收盘口径未破，盘中触及 |\n\n### 2.3 科创50 区间验证（1300-1410）✅\n\n| 验证点 | 预测 | 实际 | 判定 |\n|--------|------|------|:--:|\n| 区间 | 1300-1410 | 收盘 1305.81-1345.51 全在区间内 | ✅ |\n| 盘中破位 | — | 10/23 盘中最低 1257.29（击穿 43 点）后收回 | ⚠️ 收盘口径未破 |\n\n### 2.4 创业板区间验证（2680-2850）🟡 周中破位后收回边缘\n\n| 验证点 | 预测 | 实际 | 判定 |\n|--------|------|------|:--:|\n| 区间 | 2680-2850 | 10/22 收盘 2576.90 **破下沿 103 点**；10/23 收 2684.10 回到区间下沿边缘 | 🟡 |\n\n**说明：** 创业板是本周唯一区间失守的指数（10/22 恐慌杀跌 -4.37%），但周五暴力反弹收回边缘——「破位 1 日 + 收回」介于完全正确与部分正确之间，评 🟡。\n\n### 2.5 三情景概率验证（42/33/25）🟡 三个情景依次兑现，路径未预警\n\n| 情景 | 概率 | 兑现情况 | 判定 |\n|------|:--:|------|:--:|\n| 情景一 低开震荡分化 | 42% | 周一（10/19）权重虹吸二八分化兑现；10/20-10/21 震荡延续 | ✅ 前半兑现 |\n| 情景三 双杀二次探底 | 25% | 10/22 恐慌双杀加强版兑现（创业板 -4.37%、下跌占比 90.4%）——但触发前提「GDP<4.3%」错误，GDP 反而 4.5% 超预期 | 🟡 路径兑现、前提错误 |\n| 情景二 利空出尽修复 | 33% | 10/23 迟到 3 天以加强版兑现（创业板 +4.16%、上涨占比 83.28%），但科创50 未收复 1400（收 1345.51） | 🟡 迟到兑现、幅度超预期 |\n\n**说明：** 锚点没有预警「周中恐慌杀跌（10/21-22）→ 周五暴力 V 反（10/23）」的路径切换。10/22 的崩溃日与 10/23 的 V 反日先后出现时，P2-78「冰点广度超跌反弹弹性」尚未登记（10/23 盘后才入库），锚点自然无法预留。**教训：三情景概率应含「路径复合」预留——单周可依次兑现多个情景。**\n\n### 2.6 机会行业验证 ✅ 命中 4/5\n\n| 推荐行业 | 本周表现 | 判定 |\n|----------|:------:|:--:|\n| 银行/保险/高股息 | 10/19 银行 +48.74 亿居首、10/20 银行止跌，GDP 顺周期反抽主线兑现 | ✅ |\n| 黄金/贵金属 | 全周金价高位运行，10/23 贵金属 +4.82 亿流入，避险底仓属性兑现 | ✅ |\n| 半导体/AI算力 | 10/22 血洗（半导体 -47.62 亿）后 10/23 +121.76 亿领涨回补——「需费半企稳+GDP 验证」前提基本兑现，方向迟到但兑现 | ✅ |\n| 三季报超预期主线 | 10/20 消费电子 +28.82 亿成为唯一持续主线，10/23 元件/通信设备回补 | ✅ |\n| 军工/军工装备 | 10/19 后未再成为主线（仅 10/21 IT服务/元件领涨），本周无强兑现 | ⚪ 未兑现 |\n\n**机会行业命中率：80%（4/5）**，且最关键的是「半导体需费半企稳 + GDP 验证」的前提条件设得准——10/22 费半传导反向（P2-74）时半导体如期深杀，10/23 主力回补时如期领涨。\n\n### 2.7 风险行业验证 ✅ 5/5 全命中（连续第 4 周）\n\n| 警示行业 | 本周表现 | 判定 |\n|----------|:------:|:--:|\n| 文化传媒 | 10/22 -39.91 亿流出居前，兑现 | ✅ |\n| 电池/锂电 | 10/21 -40.40 亿单拖累创业板（-1.62%），兑现 | ✅ |\n| 高估值 AI 算力 | 10/22 半导体/元件/通信设备血洗，AI 资本开支证伪传导，兑现 | ✅ |\n| 光模块/CPO | 10/22「易中天」崩塌（新易盛 -12%、中际旭创 -8.76%、天孚通信 -7%+），兑现 | ✅ |\n| 医药 | 化学制药 10/20 -9.21 亿净流出延续（贝莱德减持方向），兑现 | ✅ |\n\n**风险行业命中率：100%（5/5），自第19周起连续第 4 周精确命中**——风险负面清单框架是穿越周期的最稳定正贡献项。\n\n### 2.8 证伪条件验证 ✅\n\n| 证伪条件 | 触发情况 | 判定 |\n|----------|:------:|:--:|\n| 偏多证伪（→修复启动）：GDP≥4.5% + 金融街论坛释放增量政策 + 费半止跌 + 上证收复 3750 | 🟡 部分触发：GDP 4.5%✅、费半 10/19 止跌反弹✅，但上证未收复 3750（周最高 3735.37）❌ → 修复未在周一启动，10/23 才迟到兑现（未收复 3750，仅 3690.48） | ✅ 信号方向正确 |\n| 偏空证伪（→二次探底）：GDP≈4.3% + 纳指传导放大 + 上证弃守 3674 + 融资加速去杠杆 | 🟡 部分触发：GDP 4.5% 前提错❌，但 10/22-23 盘中弃守 3674（最低 3574.27）✅、10/22 融资 -233.64 亿加速去杠杆✅ → 路径触发但前提错误，最终收盘收回 | ✅ 路径预警有效 |\n\n**说明：** 证伪条件设计有效——偏空证伪的「路径部分」（弃守 3674 + 融资去杠杆）在 10/22-23 触发，精准指向「双杀」；但触发前提（GDP<4.3%）被 GDP 4.5% 证伪，说明恐慌杀跌可以脱离宏观前提独立发生（P2-76 全球避险共振）。\n\n---\n\n## 三、关键假设验证\n\n| 假设 | 内容 | 验证结果 | 说明 |\n|:--:|------|:--:|------|\n| H1 | 三季度 GDP ≥4.5%（华创/招商偏乐观） | ✅ 成立 | 实际 4.5%，前三季度累计 4.6%，精确命中 |\n| H2 | GDP 超预期 → 权重/顺周期反抽（银行/高股息） | ✅ 成立 | 周一银行 +48.74 亿居首、上证 +0.39% 站稳 3700 |\n| H3 | 权重反抽同时 → 成长错杀修复（情景二 33%） | 🟡 部分成立 | 周一未兑现（科创50 -2.17%），10/23 迟到 3 天以加强版兑现 |\n| H4 | 费半止跌企稳 → A股科技传导修复 | 🟡 部分成立 | 10/19 纳指 +1.11% 反弹传导延迟；10/22 反而反向崩塌（P2-74），10/23 才强化传导 |\n| H5 | 上证 3700/3674 支撑有效 | 🟡 部分成立 | 收盘口径全周守住（最低 3658.03 高于 3650）；10/22-23 盘中击穿 3674 至 3574.27 后收回 |\n\n**假设完全成立率：40%（2/5），可用率：100%（5/5）**——无一项方向性错误，「GDP 分叉 + 权重反抽」主线假设全周有效，是框架建立以来假设层最好的一周之一。\n\n---\n\n## 四、全周滚动预测回顾\n\n| 日期 | 预测方向 | 实际方向 | 判定 | 备注 |\n|------|---------|---------|:--:|------|\n| 10/19（一）| GDP 分叉三叉戟：≥4.5% 权重反抽 | 权重虹吸二八分化（GDP 4.5% 命中） | ✅ | P2-68 首次完整验证 |\n| 10/20（二）| 权重护盘二八分化延续 48% | 跷跷板反转：成长修复 + 权重调整 | ❌ | P2-70「权重虹吸一次性」次日回摆 |\n| 10/21（三）| 弱修复延续（震荡 45% + 反攻 35%） | 普跌缩量回踩（37.06% 占比） | 🟡 | P2-71/72/73 半日退潮+内部分化 |\n| 10/22（四）| 修复 45% / 反攻 25% / 下探 30% | 情景三加强版恐慌杀跌 | ❌ | P2-74/75/76 外盘传导反向+SDBS 失效+护盘失效 |\n| 10/23（五）| 低开震荡筑底 50% / 反弹 25% / 下探 25% | 超跌反弹 25% 加强版暴力 V 反 | 🟡 | P2-78 冰点反弹弹性低估 |\n\n**全周滚动判定：2✅/2🟡/1❌**。周三后连续两日（10/21-22）未随恐慌升级下调偏多权重，是周中最大惯性；10/23 的 V 反再次验证「冰点反弹弹性」无法单日预测。\n\n---\n\n## 五、偏差修正效果（全周汇总）\n\n| 日期 | 修正有效率 | 判定 |\n|------|:------:|:--:|\n| 10/19 午间 | 83.3%（5✅/0🟡/1❌） | 🟢 |\n| 10/20 收盘 | 16.7%（1✅/1🟡/4❌） | 🔴 |\n| 10/21 午间 | 60.0%（3✅/3🟡/0❌） | 🟢 |\n| 10/22 午间 | 14.3%（1✅/2🟡/4❌） | 🔴 |\n| 10/22 收盘 | 28.6%（2✅/2🟡/3❌） | 🟡 |\n| 10/23 午间 | 50.0%（3✅/3🟡/0❌） | 🟢 |\n| 10/23 收盘 | 50.0%（3✅/3🟡/0❌） | 🟢 |\n\n**全周均值 ≈ 43.3%**，节奏「前高 → 崩溃 → 回升」与市场路径同步：10/19 GDP 分叉日修正效率最高，10/20-10/22 恐慌升级段连续失分，10/23 修复日回升。\n\n---\n\n## 六、模型优化建议\n\n### 6.1 假设层面\n\n1. **【标准化】GDP/宏观数据日「三叉戟分叉框架」入库为模板**：数据发布前先列数据值分叉（≥/≈/< 预期）→ 各分支的传导路径与受益板块，再分配概率。本周 H1/H2/H3 全周有效，是锚点级最可靠判断方式（可复用至 10/27-28 FOMC、11/3 中期选举等数据日）。\n2. **【修正】成长修复传导保留「迟到 3 天 + 单日加强版」可能性**：H3/H4 显示 GDP 超预期 ≠ 成长当日修复，10/22 甚至反向崩塌（P2-74 脆弱位传导失效），10/23 单日反转全部跌幅（P2-78）。成长方向维持 P1-14「主力连续转正」硬开关，不因宏观分叉命中而提前下注。\n\n### 6.2 指标层面\n\n3. **风险行业负面清单 = 最高权重输入**：连续第 4 周 100% 命中（本周 5/5）。传媒/电池/高估值 AI 算力/光模块/医药全部兑现，与 W22「防御错配」教训结合后框架已稳定——防御方向不进风险清单，产业性流出方向（传媒退潮、电池失血、AI 证伪）才是可靠风险项。\n4. **新增监控：维保比例 250% 警戒线**（P2-77）：10/22 融资 -233.64 亿 + 维保 250.76% 逼近警戒，是 10/23 反弹之下最大的尾部风险，纳入每日数据采集清单。\n\n### 6.3 框架层面\n\n5. **【重点】三情景概率增加「路径复合」预留**：本周单周内依次兑现情景一→三→二，锚点概率 42/33/25 无法承载。改进：三情景概率外增加「路径切换条件」栏（如「若出现放量系统性杀跌（P2-76），双杀情景概率上调至 40%+，即使宏观前提未触发」），P2-78 已入库可作为切换触发器。\n6. **区间预测统一标注口径**：「收盘区间 XXX-XXX（收盘口径）+ 盘中容忍位 YYY」——本周上证/科创50 盘中均击穿下沿后收回，收盘口径全中但盘中破位，需显式声明避免「区间失守」误判。\n\n### 6.4 数据层面\n\n7. **融资 T+1 滞后性显式化**：放量系统性杀跌日的去杠杆幅度次日才可见（P2-77），「杠杆企稳」类判断必须预留次日反向修正。\n8. **盘中破位与收盘修复分离评估**：10/23 盘中 3574 vs 收盘 3690.48 振幅达 3.2%，极值日应记录「盘中极值」供路径复盘，避免收盘单点掩盖盘中恐慌。\n\n---\n\n## 七、本周新增偏差模式（已登记经验库）\n\n本周（10/19-10/23）登记 **11 个**新偏差模式（P2-68 ~ P2-78）：\n\n| 编号 | 模式名称 | 登记日 |\n|:----:|------|:--:|\n| P2-68 | 权重虹吸型低广度（GDP 重大数据日放量 ≠ 广度修复） | 10/19 |\n| P2-69 | 半日放量/半日强势 ≠ 全天（上午动能午后退潮） | 10/20 |\n| P2-70 | 权重虹吸是数据日一次性现象，次日易跷跷板回摆 | 10/20 |\n| P2-71 | 成长修复半日衰减（上午流入居首板块午后派发） | 10/21 |\n| P2-72 | 成长修复内部分化：科技硬件强 vs 新能源弱 | 10/21 |\n| P2-73 | 半日接近转正伪信号，午后易大幅逆转 | 10/21 |\n| P2-74 | 外盘单日反弹传导在 A股脆弱位 + 港股暴跌共振下可完全失效甚至反向（双前提） | 10/22 |\n| P2-75 | SDBS「单行业拖累替代」不适用于全市场恐慌性杀跌 | 10/22 |\n| P2-76 | 全球避险共振日，A股成长与港股科技同向杀跌、护盘资金失效 | 10/22 |\n| P2-77 | 放量杀跌次日融资去杠杆加速 + 维保比例骤降 = 恐慌见底未确认 | 10/23 |\n| P2-78 | 冰点广度后的超跌反弹弹性可单日反转全部结构（风格/资金/指数同向逆转） | 10/23 |\n\n---\n\n## 八、本周统计\n\n### 8.1 核心评分（1周层可验证项）\n\n| 指标 | 数值 | vs 第22周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 7项 | 持平 |\n| ✅ 完全正确 | 4项（57.1%） | +57.1pp |\n| 🟡 部分正确 | 3项（42.9%） | 持平 |\n| ❌ 错误 | 0项（0%） | -57.1pp |\n| **正确率（✅）** | **57.1%** | **+57.1pp** |\n| **可用率（✅+🟡）** | **100%** | **+57.1pp** |\n| **错误率（❌）** | **0%** | **-57.1pp** |\n\n> 注：正确率 57.1% 为第16周（71.4% 峰值）以来次高，**错误率 0% 为框架建 6%），\"9月震荡\"判断落空，\"向上突破4100\"方向完全反向 | ❌ **方向错误** | 继8月\"先扬后抑\"方向错误后，季度预测连续第2次方向错误。\"9月震荡\"的横向判断被9/11、9/24、9/28三次破位击穿 |\n\n---\n\n## 三、9月月度预测评分汇总\n\n### 核心维度评分\n\n| 维度 | 项数 | ✅ 完全正确 | 🟡 部分正确 | ❌ 错误 | ⚪ 无法验证 | 正确率 | 可用率 |\n|------|:---:|:----------:|:----------:|:------:|:----------:|:-----:|:-----:|\n| 走势方向 | 1 | 0 | 0 | 1 | 0 | 0% | 0% |\n| 月度节奏 | 1 | 0 | 0 | 1 | 0 | 0% | 0% |\n| 拐点信号 | 1 | 0 | 1 | 0 | 0 | 0% | 100% |\n| 机会行业 | 3 | 0 | 1 | 1 | 1 | 0% | 50% |\n| 风险行业 | 3 | 1 | 2 | 0 | 0 | 33% | 100% |\n| 季度走势 | 1 | 0 | 0 | 1 | 0 | 0% | 0% |\n| **月度合计** | **10** | **1** | **4** | **4** | **1** | **11.1%** | **55.6%** |\n\n> 正确率 = 1/9 = 11.1%（排除1项无法验证）；可用率 = 5/9 = 55.6%；错误率 = 4/9 = 44.4%。\n\n### 6月 vs 7月 vs 8月 vs 9月对比\n\n| 指标 | 6月 | 7月 | 8月 | 9月 | 趋势 |\n|------|:---:|:---:|:---:|:---:|:----:|\n| ✅ 正确率 | 22.7% | 5.3% | 21.4% | 11.1% | 📉 回落 |\n| 🟡 部分正确率 | 63.6% | 5.3% | 71.4% | 44.4% | 📉 回落 |\n| ❌ 错误率 | 9.1% | 89.5% | 7.1% | 44.4% | 📈 回升 |\n| ✅+🟡 可用率 | 86.4% | 10.5% | 92.9% | 55.6% | 📉 回落 |\n\n> **9月月度预测是继7月后第2差的月度表现。** 正确率11.1%（第2低）、可用率55.6%（第2低）、错误率44.4%（第2高）。核心问题是**9/1预测完全没有捕捉到9月下跌月**——方向判断（震荡/向上）与实际（-3.46%下跌）完全反向。相比8月的\"方向正确但精度不足\"（可用率92.9%），9月退化为\"方向错误+精度不足\"。\n\n---\n\n## 四、9月周度复盘汇总\n\n> ⚠️ 说明：9月4次周度复盘覆盖 W16（8/31-9/4）至 W19（9/21-9/24），9/28-9/30 末段3个交易日尚未有周度复盘（下次复盘 10/12）。其中 W17-W19 连续3周出现\"1周预测格式回归\"（结构化模板退化为三情景模板），导致验证项数减少、可用率虚高。\n\n| 指标 | W16 | W17 | W18 | W19 | 累计/加权 |\n|------|:--:|:--:|:--:|:--:|:----:|\n| 周期 | 8/31-9/4 | 9/7-9/11 | 9/14-9/18 | 9/21-9/24 | **9月** |\n| 可评分预测项 | 7 | 4 | 4 | 4 | **19** |\n| ✅ 完全正确 | 5 | 0 | 0 | 1 | **6 (31.6%)** |\n| 🟡 部分正确 | 2 | 4 | 3 | 3 | **12 (63.2%)** |\n| ❌ 错误 | 0 | 0 | 1 | 0 | **1 (5.3%)** |\n| **正确率（✅）** | 71.4% | 0% | 0% | 25% | **31.6%** |\n| **可用率（✅+🟡）** | 100% | 100% | 75% | 100% | **94.7%** |\n| **错误率（❌）** | 0% | 0% | 25% | 0% | **5.3%** |\n\n### 9月周度趋势\n\n| 指标 | W16 | W17 | W18 | W19 | 趋势 |\n|------|:--:|:--:|:--:|:--:|:----:|\n| 正确率 | 71.4% | 0% | 0% | 25% | 📉 月初峰值后崩塌 |\n| 可用率 | 100% | 100% | 75% | 100% | ⚠️ 虚高（格式回归 5点。6/5非农前恐慌+新301关税双重打击超出预期。\n3. **置信度标\"高\"过于自信：** 首周预测缺乏历史数据校准，\"高\"置信度不恰当。\n4. **\"高低切换\"被AI催化打断：** 预测风格从科技向价值切换，但AI催化过于密集，导致6/2-6/3科技全面爆发，切换节奏被延迟而非取消。\n\n#### 🔑 关键教训\n\n1. **\"确定的产业趋势\" > \"不确定的地缘冲击\"：** 6/2伊朗局势→油价暴涨，预测能源领涨，但市场选择了AI产业趋势（GTC等催化），创业板暴涨2.66%。这是本周最重要的市场信号。\n2. **超预期催化共振可覆盖估值约束：** 当多个重大催化同时出现（GTC+费城半导体+6%+谷歌800亿+宇树IPO），\"利好兑现\"和\"高位回调\"的常规框架失效。需要建立量化阈值——当催化强度超阈值时切换为\"趋势延续\"模型。\n3. **事件驱动日下午≠上午：** 6/5非农前，上午上证+0.43%→下午暴跌至-0.74%，典型\"上午拉高、下午砸盘\"诱多形态。午间复盘框架对此类\"事件驱动型下午\"判断不足。\n4. **首周预测不宜标\"高\"置信度：** 缺乏历史数据校准时，置信度应保守。\n\n#### 🔧 模型优化建议（基于本周数据）\n\n1. **建立\"催化强度评分\"机制：** 当AI/科技方向单日出现≥3个重大催化时，自动将\"利好兑现\"框架切换为\"趋势延续\"框架。\n2. **上证区间预测增加\"黑天鹅缓冲\"：** 在核心区间下方增加3%-5%的\"极端事件缓冲带\"（如4050-4150 → 核心区间+3950-4050缓冲带）。\n3. **置信度分级更保守：** 首周/月度切换时置信度默认降一级（高→中，中→低）。\n4. **行业预测增加\"替代方向\"：** 不仅列出机会行业，还应标注\"如果催化超预期，哪些方向可能抢跑\"。\n5. **事件驱动日下午预警：** 当下午有重大数据公布（非农/CPI/FOMC），午间复盘自动增加\"下午极端情景\"（概率虽低但影响大）。\n\n### 2026年5月复盘摘要\n\n> 🚫 无数据。预测体系于6月1日启动，首次月度复盘将在2026年7月1日进行。\n\n---\n\n### 第3周：2026年6月15日—6月18日（仅4个交易日，6/19-6/21端午节休市）\n\n> 📋 复盘日期：2026-06-22 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-06-15.md` → 一、1周预测（6/15 ~ 6/22）\n> ⚠️ 本周仅4个交易日（6/15-6/18），6/19-6/21端午节休市。实际验证窗口为4天。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 走势形态 | 前低后高，N型——周初震荡消化+周中FOMC靴子落地+周末反弹 | 前高后低：周一暴涨+1.61%→周二至周四三连阴（累计仅-0.15%） | ❌ 错误 | 美伊停火确认的爆发力被系统性低估；\"不确定性消除\"≠\"利好兑现\"，市场选择了风险偏好跳升 |\n| 2 | 上证核心区间 | 3980-4100 | 实际4074-4104，下沿偏差94点，上沿偏差4点 | 🟡 部分正确 | 上沿基本命中（仅差4点），但下沿严重偏悲观。对\"不确定性消除\"的正面冲击缺乏量化 |\n| 3 | 上证极端区间 | 3930-4150 | 实际4074-4104，完全在极端区间内 | ✅ 正确 | 极端区间设计合理，覆盖了实际波动 |\n| 4 | 6/15日预测 | 4020-4070 震荡偏强 | 上证+1.61%收4096.47，大幅超出预测上限 | ❌ 错误 | 三重利好（逆回购+调样+矿产法）+美伊停火四重共振，叠加效应被系统性低估 |\n| 5 | 6/16日预测 | 4000-4050 偏弱 | 上证-0.11%收4091.89，区间4078-4104 | ❌ 错误 | 区间完全偏离；\"大涨次日=回调\"的默认假设被打破，实际是高位窄幅震荡 |\n| 6 | 6/17-6/18 FOMC | 观望缩量，决议后方向选择 | 6/17缩量窄幅✅，6/18放量3.31万亿❌缩量判断 | 🟡 部分正确 | FOMC决议落地本身就会激发交易（无论偏鸽偏鹰），\"缩量\"判断过于绝对 |\n| 7 | 6/19 FOMC后 | 大概率收阳 | 6/19端午节休市，无法验证 | ⚠️ 无法验证 | — |\n| 8 | 机会：科创50ETF 科技全面压制。预测框架需要将\"科技虹吸强度\"作为独立变量。\n4. **\"大涨次日\"假设需要修正：** 默认\"大涨次日=回调\"，但实际\"大涨次日=高位窄幅震荡\"同样常见。两种模式应并列为等概率情景。\n5. **区间偏差在扩大而非收敛：** 三周区间偏差：35点→53点→94点。自适应校准机制尚未生效。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势形态方向完全错误 | 🔴 方向性 | 美伊停火\"不确定性消除\"的爆发力被系统性低估 | 🟡 可部分预见 |\n| 上证核心区间偏悲观94点 | 🔴 大幅偏差 | 同上 | 🟡 可改进 |\n| 沃什偏鸽假设失效 | 🔴 关键假设 | \"新人首秀需展示鹰派姿态\"的政治逻辑被忽略 | 🟡 可改进 |\n| 消费ETF方向完全错误 | 🔴 方向性 | 资金面结构性挤压效应（科技虹吸→消费失血）被忽略 | 🟡 可改进 |\n| 6/15日预测严重偏低 | 🔴 大幅偏差 | 四重利好共振的叠加效应被低估 | 🟡 可改进 |\n| 6/16日预测区间完全偏离 | 🔴 区间错误 | \"大涨次日=回调\"默认假设被打破 | 🟢 可预见 |\n| 置信度连续第3周偏高 | 🟡 系统性 | 缺乏\"不确定性校准\"机制 | 🟢 可改进 |\n\n### 2026年6月第3周（6/15-6/18）复盘摘要\n\n> 📅 生成时间：2026-06-22 08:00 CST\n\n#### 📈 本周预测亮点\n\n1. **科创50ETF方向判断精准：** 全周最强指数，连续第3周在科技主线上判断正确。\n2. **能源/油气ETF风险判断准确：** 美伊停火→油价暴跌-13.4%的逻辑链完整兑现。\n3. **美伊签署时间判断准确：** 预测\"本周内签署\"，6/18正式签署。\n4. **FOMC不加息判断准确：** 利率不变。\n\n#### 📉 本周预测不足\n\n1. **走势形态方向完全错误：** 预测\"前低后高\"→实际\"前高后低\"。美伊停火确认的爆发力被系统性低估。\n2. **上证核心区间偏悲观94点：** 连续第3周区间偏差，且偏差在扩大（35→53→94）。\n3. **沃什偏鸽假设完全失效：** 对\"新人首秀\"的政治约束缺乏分析。\n4. **消费ETF方向完全错误：** 科技虹吸效应覆盖了所有非科技方向。\n5. **置信度连续第3周偏高：** \"中高\"置信度与26.3%正确率严重不匹配。\n\n#### 🔑 关键教训\n\n1. **\"不确定性消除\"≠\"利好兑现\"：** 持续3个月的最大不确定性被系统性解除→市场反应是风险偏好跳升，而非利好出尽。\n2. **\"新人首秀\"的政治约束：** 沃什首场FOMC必须展示抗通胀决心，即使个人倾向偏鸽。\n3. **科技虹吸效应已成为预测框架最大盲区：** 所有非科技方向的预测都因此偏离。\n4. **区间预测偏差在扩大而非收敛：** 自适应校准机制需要立即建立。\n\n#### 🔧 模型优化建议\n\n1. **新增\"不确定性消除溢价\"假设：** 当持续>30天的不确定性被正式解除时，切换到\"风险偏好跳升\"模型。\n2. **新增\"科技虹吸强度指数\"：** 当科技成交占比>40%时，所有非科技方向预测自动降级。\n3. **新增\"多催化共振系数\"：** ≥3个独立催化叠加时，市场反应幅度放大30-50%。\n4. **置信度与历史准确率动态挂钩：** 正确率<30%时置信度上限为\"中\"。\n5. **区间预测增加\"自适应校准\"：** 基于前三周偏差方向和幅度，自动修正下周区间。\n6. **证伪信号升级为\"价格+结构\"双维度：** 增加结构性证伪信号（如科技成交占比>50%）。\n\n---\n\n### 第11周：2026年7月27日—7月31日（超级周复盘摘要）\n\n> 📅 生成时间：2026-08-03 08:30 CST\n\n#### 📈 本周预测亮点\n\n1. **证伪条件设计持续精准（3/3全部命中）：** 上证3750-3900证伪区间与实际3767-3858高度吻合，连续11周保持高可靠性。\n2. **银行/高股息防御方向判断准确：** 上证50全周抗跌，在超级周巨震中发挥防御价值。防御方向判断连续多周有效。\n3. **中证1000/券商风险警示准确：** 中小盘全周跑输，券商在超级IPO周未受益。\n4. **H1（中方温和回应）假设成立：** 商务部措辞温和，关税博弈短期稳定。\n\n#### 📉 本周预测不足\n\n1. **周一走势方向完全错误：** 预测\"缩量窄幅震荡\"→实际暴涨+1.02%（科创50+6.79%）。长鑫科技IPO首日465%暴涨效应被完全忽略。\n2. **科创50方向错误（机会→领跌-8.46%）：** 半导体从\"本周机会\"变为\"本周最大风险\"，全周四天收于预测区间下方。\n3. **科创50区间严重偏乐观（下沿偏差131.59点）：** 超级周波动率是常规周2-3倍，区间参数未调整。\n4. **H2（沃什偏鸽）和H3（3800支撑）两个关键假设失效：** 3票反对票+3800关口被击穿两次。\n5. **7/31偏差修正全部恶化（0%有效）：** P0-5规则建立时间晚于预测生成时间，所有修正朝偏空方向调整。\n\n#### 🔑 关键教训\n\n1. **\"事件日历优先级\" > \"单一叙事\"：** 预测框架将\"超级周\"等同于\"FOMC周\"，忽略了长鑫科技IPO同样是超级事件。未来需建立多事件日历，每天标注独立事件驱动情景。\n2. **\"偏差修正方向一致性\"警报：** 7/31的6条修正全朝偏空方向→应触发\"系统性偏差\"警报。P0-5规则如果提前建立，可避免此次0%有效。\n3. **\"超级周波动率参数\"需独立建模：** 科创50区间预测连续第3周偏乐观，根因是超级周波动率是常规周2-3倍。\n4. **\"整数关口在事件周无效\"虽已建模但未应用：** P2-5规则已建立但7/27周一预测中未强制应用。规则存在但执行缺失。\n5. **\"IPO首日效应\"是独立于FOMC的重要变量：** 长鑫科技1411亿成交虹吸+全市场4884家上涨的正面效应，完全覆盖了FOMC前避险。\n\n#### 🔧 模型优化建议\n\n1. **新增\"事件日历优先级\"检查：** 每周一预测前强制列出本周所有重大事件，按冲击力排序。\n2. **H2修改为\"FOMC反对票敏感度\"：** 新人首秀场景反对票概率从5%上调至25-40%。\n3. **IPO首日效应量化模型：** 募资>500亿+科技龙头→首日全市场普涨概率>70%。\n4. **超级周波动率参数：** 科创50区间宽度从±5%扩大至±10-12%。\n5. **偏差修正\"方向一致性\"检查：** 当≥4条修正朝同一方向时触发警报。\n6. **P0-5（PMI<50宽松预期）升级为P0级并前置应用。**\n\n---\n\n## 📊 长期模型迭代建议\n\n> 📅 首次更新：2026-06-08（第1周复盘后）\n> 📅 第二次更新：2026-06-15（第2周复盘后）\n> 📅 第三次更新：2026-06-22（第3周复盘后）\n> 📅 第四次更新：2026-07-01（月度复盘后）\n> 📅 第五次更新：2026-07-06（第5周复盘后）\n> ⚠️ 数据积累5周（75项预测），结论置信度逐步提升。\n\n### 基于首月数据（4周，59项预测）的迭代建议\n\n#### 🔴 最可靠维度（应加大权重）\n\n| 排名 | 维度 | 准确率 | 建议 |\n|:---:|------|:-----:|------|\n| 1 | **极端区间设计** | 4周全中 ✅ | 核心区间持续偏差时，极端区间可作为替代参考区间 |\n| 2 | **证伪条件设计** | 4周全有效 ✅ | 维持\"价格+结构\"双维度，新增\"证伪触发后情景\" |\n| 3 | **核心假设判断** | 月度50%正确 ✅ | 宏观假设（美伊、FOMC、中报）方向判断准确，应保持 |\n| 4 | **黄金ETF方向** | 4/5周正确 ✅ | 降息+避险双驱动逻辑稳定，是当前框架中最可靠的方向判断。第5周再次精准命中 |\n| 5 | **高溢价风险** | 3/3周可验证 ✅ | 持续关注，月末/暴跌日溢价回归风险高 |\n| 6 | **核心假设判断** | 第5周4/4全部成立 ✅ | 宏观假设（美伊、PMI、整数关口）底线思维框架有效。但需区分\"假设成立\"与\"预测精准\" |\n\n#### 🟡 中等可靠维度（需优化）\n\n| 排名 | 维度 | 问题 | 优化方向 |\n|:---:|------|------|---------|\n| 6 | **行业机会判断** | 方向对但时点/幅度偏差大 | 增加\"催化强度评分\"，区分\"主线\"和\"脉冲\" |\n| 7 | **月度三段式节奏** | 方向框架对但时间划分不精确 | 增加\"外部事件扰动系数\"，允许节奏偏移1-3天 |\n| 8 | **行业风险判断** | 1项方向错误，1项时效有限 | 建立\"风险窗口期\"概念，标注时间约束 |\n\n#### 🔴 最不可靠维度（需降权或改进）\n\n| 排名 | 维度 | 准确率 | 问题 | 建议 |\n|:---:|------|:-----:|------|------|\n| 9 | **核心区间预测** | 4周全偏差 ❌ | 方向不稳定，偏差35-94点 | ①降低置信度权重 ②引入自适应校准 ③极端区间作主要参考 |\n| 10 | **置信度标注** | 4周偏高 ❌ | 与实际正确率差10-20pp | ①与历史正确率动态挂钩 ②正确率<30%时上限\"低-中\" ③>50%方可标\"高\" |\n| 11 | **趋势转换识别** | 第4周重大失误 ❌ | 无法识别科技从强势到暴跌的转换 | 建立\"趋势转换预警\"机制（科技成交占比>40%且上涨>3天→自动触发） |\n\n#### 💡 假设调整\n\n| 假设 | 当前状态 | 调整建议 | 优先级 |\n|------|---------|---------|:-----:|\n| H1: 整数关口有支撑 | 失效2次（4000击穿） | 区分\"有序回调\"和\"跳空低开\"，后者支撑力降为0 | 🔴 高 |\n| H2: 周末情绪仅消化40% | 失效（实际发酵60-80%） | 建立\"周末情绪发酵系数\"0.5-0.8x | 🔴 高 |\n| H3: \"高位=风险\" | 失效（AI催化覆盖） | 建立\"催化强度评分\"，超阈值时切换为趋势延续模型 | 🔴 高 |\n| H4: 利好出尽立即兑现 | 失效（延迟3-5天） | 建立\"催化衰减曲线\"——利好出尽效应可持续3-5天 | 🟡 中 |\n| H5: 科技虹吸→防御弱 | 部分有效 | 科技虹吸双向性——科技强时防御弱但科技暴跌时防御也跟跌 | 🟡 中 |\n| H6: 月度区间=周区间合成 | 偏差累积 | 月度区间=周区间最大最小值+缓冲带（±50-80点） | 🟡 中 |\n\n#### 📊 置信度校准规则（基于5周数据）\n\n- ✅ 正确率>50% → 标\"高\"\n- 🟡 正确率30-50% → 标\"中高\"\n- ⚠️ 正确率20-30% → 标\"中\"\n- ❌ 正确率<20% → 标\"低\"\n- ⚠️ **第5周新增规则：** 当预测中包含≥3项\"假设/证伪类\"判断时，置信度自动下调5-10pp（假设类判断拉高正确率但不代表预测精准）\n- ⚠️ **第5周新增规则：** 区分\"表面正确率\"和\"实际判断正确率\"——复盘时单独统计扣除假设类后的方向判断正确率\n\n#### 🔧 框架结构性调整\n\n1. **增加\"催化强度评分\"模块** — ≥3个重大催化同时出现时，自动从\"均值回归\"切换为\"趋势延续\"模型\n2. **建立\"趋势转换预警\"机制** — 科技成交占比>40%且上涨天数>3天时触发预警\n3. **核心区间预测引入\"自适应校准\"** — 基于上月偏差方向和幅度自动修正本月区间\n4. **P2-4（周五+月末共振）升级至P0级** — 月末最后一周必须应用此规则\n5. **置信度与历史准确率动态挂钩** — 每次预测前检查近4周正确率，动态调整置信度上限\n6. **建立\"脉冲vs主线\"区分标准** — 行业预测中标注\"脉冲式机会\"和\"持续性主线\"\n7. **证伪信号增加\"二次确认\"机制** — 单一价格阈值触发后，等待24小时结构指标确认再执行切换\n8. **【第5周新增】1周预测新增\"时间节奏\"字段** — 将5天分为前2天+后3天，分别标注方向预期。解决\"超卖修复vs风险警示\"在同一时间窗口内矛盾的问题\n9. **【第5周新增】半导体子板块独立建模（P1-9）** — 不再将\"半导体/电子\"与\"科创50/科技\"混为一谈。半导体恐慌惯性可独立于科创50整体超跌反弹\n10. **【第5周新增】宏观数据超预期→事件风险约束自动下调（P2-6）** — PMI>50.3或非农<8万时，听证会/FOMC避险约束权重从默认30-40%降至15-20%\n11. **【第5周新增】行业预测增加数据闭环** — 每日早间简报增加行业ETF涨跌排名表，覆盖预测中提到的行业，确保复盘时可精确验证\n12. **【第5周新增】正确率统计分类细化** — 区分\"假设/证伪类\"与\"方向判断类\"的正确率，避免假设类判断拉高表面正确率\n\n> 首次有效迭代建议将在积累至少3个月数据后（约2026年9月1日）提供更可靠的校准参数。\n> 当前（1个月数据）已可提供方向性建议，但具体参数（发酵系数、虹吸阈值等）仍需更多数据校准。\n\n---\n\n### | 25.0% | 26.3% | 15.4% | 📉 四周新低 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 📈 略回升 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | ➡️ 持平 |\n\n### 本周核心发现\n\n1. **节前price in+高开高估是本周最大失误：** 6/22预测高开1-2%，实际仅0.08-0.48%。节前（6/18）科创50已涨3.84%，假期利好已被部分定价，外盘传导系数仅约0.1。这是P0-1（A股免疫力低估）的变种——在A股已提前上涨的情况下，外盘催化传导系数应进一步下调至0.1-0.2。\n2. **正确率跌至四周新低（15.4%）：** 核心走势判断错误+区间偏差+科技行业方向错误，三项权重最大的预测全部出错。正确率从第3周的26.3%骤降至15.4%，说明预测体系在\"非趋势延续周\"（震荡→暴跌转换）中表现最差。\n3. **\"冲高回落\"vs\"高位震荡→暴跌\"的区分：** 预测\"冲高回落\"（涨后回调），实际\"高位震荡4天→周五三杀暴跌\"。这是两种完全不同的路径，需增加\"周五+月末共振\"的权重系数。\n4. **科技虹吸效应的两面性：** 前半周科技虹吸压制防御板块，周五科技三杀时防御板块同样跟跌。科技虹吸的保护/杀伤是双向的，不能简单认为\"科技强=防御弱\"。\n5. **P2-4（周五+月末共振）成为本周最重要的偏差因素：** 6/26的\"三杀\"（科技暴跌+权重跟跌+中小盘续跌）被P2-4规则精准捕获——该规则在6/26的预测记录中被正式新增，但这是复盘后的总结，未能提前预警。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势判断（高开1-2%） | 🔴 方向性 | 节前price in + 外盘传导系数高估 | 🟢 可预见（P0-1规则已建立但未严格执行） |\n| 科技ETF全周下跌 | 🔴 方向性 | 周五三杀覆盖了前四天的科技脉冲 | 🟡 可部分预见（月末+科技高位+听证会前避险） |\n| 区间下沿偏差50点 | 🔴 大幅偏差 | 6/26暴跌击穿4050支撑 | 🟡 可部分预见（P2-4规则应提前应用） |\n| 保险/银行风险误判 | 🟡 次要 | 防御板块实际未大跌 | 🟢 可改进（区分\"风险行业\"和\"防御失效\"） |\n| 黄金判断反转 | 🟡 次要 | 周中从风险重新列为机会 | 🟢 可改进（黄金在月末避险中表现不同） |\n\n\n\n---\n\n### 第5周：2026年6月29日—7月3日\n\n> 📋 复盘日期：2026-07-06 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-06-29.md` → 一、1周内预测（6/29 ~ 7/3）\n> ⚠️ 本周5个交易日。6/29-6/30在6月目录，7/1-7/3在7月目录。全周波动极大（暴涨暴跌交替）。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 走势形态 | 探底企稳，4000-4050震荡。基准(55%)：4000支撑+科技修复+反弹受限于听证会避险 | 周一探底企稳4034✅→周二PMI超预期连涨至4139→周四费城-6.4%暴跌-2.03%→周五弱反弹。全周暴涨暴跌交替而非震荡 | 🟡 部分正确 | PMI超预期打破\"听证会避险约束\"；费城-6.4%恐慌共振无法预判。\"震荡\"变为\"暴涨暴跌\" |\n| 2 | 上证核心区间 | 3950-4100 | 4028-4139，上沿超出39点（+0.95%），下沿偏保守78点 | 🟡 部分正确 | PMI超预期推高指数至4139。下沿安全边际充足。偏差方向首次反转为\"上沿偏保守\" |\n| 3 | 基准情景(55%) | 4000支撑+科技修复+反弹受限 | 4000支撑✅+科技修复✅+反弹受限❌（PMI打破约束） | 🟡 部分正确 | 3个子判断中2正确1错误。\"听证会避险约束\"被PMI超预期打破 |\n| 4 | 机会：黄金ETF | 机会方向 | 周二+2.16%（全市场唯一大涨）、周五+2.32%（全场最强）。全周强势 | ✅ 完全正确 | 降息预期+避险双驱动完美兑现。连续多周黄金判断准确 |\n| 5 | 机会：建筑材料 | 机会方向 | 缺乏全周排名数据。PMI日周期板块走强但建筑材料非主线 全忽略\"听证会前避险\"连涨两天。需建立\"宏观数据超预期→事件风险约束自动下调\"规则（新增P2-6）。\n3. **半导体子板块需要独立建模：** 7/3科创50反弹+1.05%但半导体ETF仅+0.15%，恐慌惯性独立于整体超跌反弹。需新增P1-9偏差模式。\n4. **黄金ETF连续多周判断准确：** 黄金是当前框架中最可靠的方向判断，降息+避险双驱动逻辑稳定。\n5. **行业预测缺乏系统性验证数据：** 7个行业判断中5个无法精确验证。需在每日简报中增加行业ETF排名表。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 半导体风险前半周方向错误 | 🔴 方向性 | \"超卖修复\"与\"风险行业\"内在矛盾 | 🟢 可预见（框架逻辑冲突） |\n| 走势形态严重低估波动 | 🔴 幅度偏差 | PMI超预期+费城恐慌两个极端均被低估 | 🟡 费城不可预见，PMI可改进 |\n| 置信度65%偏高 | 🟡 系统性 | 含假设类判断时未下调置信度 | 🟢 可改进 |\n| 上证区间上沿偏保守39点 | 🟡 幅度偏差 | PMI超预期冲击力缺乏量化 | 🟢 可改进（P2-6规则） |\n\n\n\n---\n\n### 第2周：2026年6月8日—6月12日\n\n> 📋 复盘日期：2026-06-15 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-06-08.md` → 一、1周预测（6/8 ~ 6/14）\n> ⚠️ 本周是预测体系第2周运行，数据积累仍有限。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 上证核心区间 | 3980-4080 | 实际3927-4060，核心区间下沿偏差53点，上沿偏差20点 | ❌ 错误 | 非农冲击周末48小时发酵→周一跳空击穿4000至3927；低估周末恐慌积累的放大效应 |\n| 2 | 上证极端区间 | 3930-4120 | 实际最低3927.85，差2.15点 | 🟡 部分正确 | 极端区间下沿差2点，基本命中，证明极端区间设计合理 |\n| 3 | 走势判断 | 非农冲击低开→4000争夺→SpaceX定价前震荡→上市后反弹 | 周一暴跌→周二强反弹→周三回调→周四地缘冲击→周五反弹 | 🟡 部分正确 | 框架方向正确但过程更剧烈；4000点争夺判断完全错误（直接击穿无争夺） |\n| 4 | 量能趋势 | 缩量至2.3-2.6万亿 | 实际持续放量：6/8约1万亿→6/11 3.2万亿→6/12约3.2万亿 | ❌ 错误 | 方向完全相反。恐慌抛售+抄底博弈+地缘冲击三重驱动持续放量 |\n| 5 | 风格方向 | 红利+电力+半导体强，出口链+概念科技弱 | 红利/电力/能源防御有效；半导体波动极大（6/9+3.93%→6/10-2.70%）；出口链持续走弱 | 🟡 部分正确 | 方向框架正确但半导体双向弹性被低估，未预判到极端波动 |\n| 6 | 机会：红利低波ETF | 防御价值凸显 | 全周抗跌，防御价值充分体现 | ✅ 正确 | 方向判断准确，防御配置在震荡市中有效 |\n| 7 | 机会：电力/煤炭ETF | 防御+夏季用电 | 全周偏强，6/11-6/12能源板块因美伊冲突暴涨 | ✅ 正确 | 方向判断准确，美伊冲突强化了能源逻辑 |\n| 8 | 机会：黄金ETF | 短线超跌反弹 | 黄金暴跌3.25%+（非农→美元走强→黄金承压） | ❌ 错误 | 方向完全相反。非农超预期→加息预期升温→美元走强→黄金暴跌 |\n| 9 | 机会：半导体设备ETF | 中报业绩最确定 | 6/9强反弹(+3.93%)，6/10回调(-2.70%)，6/12冲高回落，全周波动极大 | 🟡 部分正确 | 方向对但时机难以把握，高弹性双向杀伤；早间预测时机偏早 |\n| 10 | 风险：出口链ETF | 关税+美伊双重压制 | 持续走弱，深证全周弱于上证 | ✅ 正确 | 关税博弈+美伊冲突双重压制，判断准确 |\n| 11 | 风险：高估值概念科技ETF | 中报季前承压 | 科技板块整体承压（除6/9强反弹日），6/11-6/12科技走弱 | 🟡 部分正确 | 方向正确但6/9强反弹日干扰了判断 |\n| 12 | 风险：有色金属ETF | 方向不明 | 6/12能源/有色暴涨（布伦特$95+，美伊冲突驱动） | ❌ 错误 | 美伊冲突→霍尔木兹海峡关闭→ 分析需覆盖完整链条。\n4. **4000点支撑判断完全错误：** 直接跳空击穿，毫无抵抗。跳空行情中整数关口几乎无支撑力，仅在有序回调中有效。\n5. **黄金ETF超跌反弹逻辑失败：** 非农→美元走强→黄金承压的传导链在早间模型中缺失。\n\n#### 🔑 关键教训\n\n1. **\"明牌利空≠利空\"效应在第2周得到验证：** 6/12的四重冲击（SpaceX+美伊+指数调样+世界杯）全部是已知事件，市场在低开后选择提前定价后的反弹。\"已知利空出尽\"的交易逻辑在弱势市中同样有效。\n2. **美伊冲突从\"对峙\"到\"全面冲突\"的升级速度远超预期：** 6/10-6/11两天内从停火破裂→美军空袭伊朗本土→霍尔木兹海峡关闭。地缘风险预测需要在框架中设计\"情景升级路径\"而非固定假设。\n3. **IPO事件链分析需要完整覆盖：** 定价日→机构截止日→上市日→解禁日，每个节点都可能产生实质性影响。仅关注上市日过于片面。\n4. **整数关口有效性取决于到达方式：** 有序回调中4000是有效支撑，跳空低开中4000瞬间击穿。需要区分\"到达方式\"对支撑有效性的影响。\n\n#### 🔧 模型优化建议\n\n1. **建立\"周末情绪发酵系数\"：** 事件驱动的缺口幅度 = 当日已有反应的幅度 × (1 + 周末发酵系数)。首日发酵系数设为0.5-0.8x（周一跳空常态化校正）。\n2. **增加\"美元-黄金-A股权重\"传导链监控：** 非农→美元指数→黄金价格→A股权重资源股（中石油/紫金矿业等）→指数影响。该链在6/8-6/9完整演绎了一次。\n3. **IPO事件链分析框架标准化：** 将IPO事件分解为定价日×机构截止日×上市日×解禁日的完整时间轴，标注每个节点的资金面影响方向。\n4. **证伪信号升级为\"价格+结构\"双维度：** 单一价格阈值（如放量跌破3950）会因抄底资金介入而失效。需叠加结构指标（如ETF资金流向、北向资金、涨跌比趋势）作为辅助判断。\n\n---\n\n### 第6周：2026年7月6日—7月10日（听证会超级周）\n\n> 📋 复盘日期：2026-07-13 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-07-06.md` → 一、1周内预测（7/6 ~ 7/12）\n> ⚠️ 本周为听证会超级周（7/7-7/9三日听证会+7/10结果公布），5个交易日。每日均有滚动预测更新+午间/收盘两次验证。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 上证核心区间 | 4000-4150 | 实际3939-4068。下沿被击穿61点，上沿未被触及（差82点） | ❌ 错误 | 听证会恐慌深度被低估——4000支撑在事件前完全失效（7/7-7/8连续两日收于4000下方）。\"4000整数关口有支撑\"在事件驱动周不适用 |\n| 2 | 创业板区间 | 3900-4200 | 3840-4018。下沿被短暂击穿60点 | 🟡 部分正确 | AI/光通信拖累创业板最深至3840。整体区间框架基本有效 |\n| 3 | 科创50区间 | 1920-2100 | 1951-2186。上沿被大幅突破86点（+4.1%） | 🟡 部分正确 | 7/9 CPI偏暖+恐慌消退→科创50+8.41%暴涨至2186。三日恐慌释放后的情绪翻转爆发力缺乏量化模型 |\n| 4 | 周一预判（V形） | 科创50低开→V形回升→收盘站稳2000(55%) | 高开（预测错误）→最低1952→V形回升→收1996 | 🟡 部分正确 | 开盘方向被存储芯片三重利好逆转（预测低开实际高开），但V形形态精准。产业趋势利好权重应从80%升至90%+ |\n| 5 | 情景：偏鸽反弹(45%) | 科创50 2050-2150 | 7/9触及2186（超上限36点），方向正确但幅度低估 | 🟡 部分正确 | 偏鸽方向正确但未预判\"偏鸽反弹→利好出尽\"的双段式路径 |\n| 6 | 情景：中性震荡(35%) | 科创50 1950-2050 | 7/6-7/8在此区间运行 | ✅ 完全正确 | 前半周节奏判断准确 |\n| 7 | 情景：偏鹰探底(20%) | 科创50 1850-1950 | 未触发 | ✅ 完全正确 | 偏鹰情景概率设置合理 |\n| 8 | 机会：存储芯片/科创50ETF | 机会方向 | 科创50全周+3.5%，7/9单日+8.41%领涨全市场 | ✅ 完全正确 | P0-2产业趋势逻辑连续第14次 6条无效、4条恶化。7/8和7/10收盘出现恶化均与\"下午逆转\"场景相关。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 上证核心区间❌ | 🔴 方向性 | 听证会恐慌深度被低估——4000支撑在事件周完全失效 | 🟡 可部分预见（P2-5已预警） |\n| 科创50上沿严重低估 | 🔴 幅度偏差 | 7/9 CPI+恐慌消退+FOMO三重叠加爆发力缺乏量化 | 🟡 可部分预见（P2-9待建模） |\n| 7/10利好出尽幅度低估 | 🔴 幅度偏差 | 结果预期差因子未建模+多因子叠加系数偏低 | 🟢 可预见（已新增P2-10/P2-11） |\n| 置信度60%偏高 | 🟡 系统性 | 连续第6周偏高，事件周未自动下调 | 🟢 可改进 |\n| 7/7场景概率误判 | 🔴 方向性 | \"事件前恐慌性避险\"场景未建模 | 🟡 可改进 |\n\n### 模型优化建议（本周新增）\n\n1. **事件周 vs 非事件周分离框架：** 1周预测需明确标注\"事件周\"，使用五段式模板（前夜定价→Day1恐慌→Day2假反转/真筑底→Day3情绪翻转→结果公布日利好出尽）替代震荡/趋势二元框架。\n2. **利好出尽幅度公式升级：** 从\"前期涨幅×0.3-0.5\"升级为\"前期涨幅×市场price-in深度系数\"（0.3-0.9）。当市场已price-in\"超预期\"结果时，系数升至0.6-0.9。\n3. **新增\"结果预期差\"因子（P2-10）：** 当事件结果与市场已price-in的预期存在差距时，冲击幅度=预期差×1.5-2.0×前期涨跌幅。\n4. **新增\"下午二次恐慌\"子规则（P2-7子规则）：** 事件进行中的V形反弹需成交量萎缩确认方可视为恐慌结束；若成交量持平或放量→下午可能二次恐慌。\n5. **整数关口有效性增加\"事件周豁免\"：** 事件驱动周（听证会/FOMC/重大数据）整数关口支撑力归零，仅参考技术位。\n6. **宏观数据对冲系数：** PMI>50或CPI<0.2%→事件避险权重从30%降至10%。\n\n---\n\n### 第7周：2026年7月13日—7月17日（九连跌恐慌周）\n\n> 📋 复盘日期：2026-07-20 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-07-13.md` → 一、1周内预测（7/13 ~ 7/18）\n> ⚠️ 本周5个交易日，九连跌恐慌周。每日均有滚动预测更新+午间/收盘两次验证。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 走势形态 | 周一科创50修复+1%~+2%→冲高横盘→周二尾盘避险→周三GDP方向选择→周四-周五WAIC催化科技重拾升势 | 周一全面暴跌（科创50-3.42%）→周二上午暴跌下午V形→周三周四周五连续下跌→九连跌。WAIC催化完全失效 | ❌ 错误 | 周末消化后市场选择确认悲观而非情绪改善；GDP不及预期+九连跌恐慌呈非线性加速 |\n| 2 | 上证核心区间 | 3960-4080 | 3764-3967。下沿被击穿196点（-4.95%），偏差幅度创历史最大 | ❌ 错误 | 九连跌累计跌幅远超预测框架覆盖范围。周一开盘即破3960，此后仅周二下午短暂触及3967 |\n| 3 | 科创50区间 | 2040-2150 | 1727-2009（周一盘中最高2110）。下沿被击穿313点（-15.3%） | ❌ 错误 | 科创50全周-13.40%，九连跌累计-19%。周一盘中最高2110一度触及预测区间，但收盘1994已跌破下沿 |\n| 4 | 创业板区间 | 3780-3980 | 3428-3851。下沿被击穿352点（-9.3%） | ❌ 错误 | 7/17单日-7.15%创本周最大跌幅，创业板恐慌从结构性扩散至全面性 |\n| 5 | 中证1000区间 | 8150-8450 | 7658-8130（周一最高8171）。下沿被击穿492点（-6.0%） | ❌ 错误 | 周一-5.01%领跌全市场，中小盘在恐慌周中成为最脆弱方向 |\n| 6 | 机会：半导体/AI | 机会方向 | 科创50全周-13.40%，九连跌领跌全市场 | ❌ 错误 | 方向完全相反。半导体/AI从\"机会\"变为\"领跌\"，是本周最严重的行业误判 |\n| 7 | 机会：中小盘 | 机会方向 | 中 🟡 可部分预见（需建立连续暴跌专用框架） |\n| 半导体/AI方向完全错误 | 🔴 方向性 | 产业趋势权重在连续暴跌中归零 | 🟡 可部分预见（P0-2已预警但未充分应用） |\n| 中小盘方向完全错误 | 🔴 方向性 | 恐慌周中中小盘反而最脆弱而非接力 | 🟡 可部分预见 |\n| 置信度60%严重偏高 | 🟡 系统性 | 连续第7周偏高，未应用场景风险系数 | 🟢 可改进 |\n| P2-2多因子冲击连续偏保守 | 🟡 系统性 | 线性叠加模型在极端场景中失效 | 🟢 可改进（需升级为非线性模型） |\n\n### 本周新增偏差模式\n\n| 编号 | 模式名称 | 核心内容 |\n|:----:|------|------|\n| P2-12 | 周末消化方向确认 | 周末无新增负面≠利好，市场可能选择确认悲观而非情绪改善 |\n| P2-13 | 全天避险升级 | 重大事件前日避险从\"尾盘\"升级为\"全天\"，需区分事件叠加度 |\n| P2-14 | GDP科技放大效应 | GDP数据对科技板块呈3-5倍放大效应，科创50跌幅是上证的14.7倍 |\n| P2-15 | GDP冲击锯齿衰减 | GDP冲击第三日锯齿衰减，但余震不会立即消失 |\n| P0-4 | 连续暴跌临界加速 | 七连跌→八连跌→九连跌，恐慌呈非线性加速而非边际递减 |\n| P2-16 | 跌停连锁反应 | 跌停从26→212暴增7倍，融资盘/杠杆资金强平→跌停连锁 |\n\n### 模型优化建议（本周新增）\n\n1. **建立「连续暴跌专用框架」：** 当连跌天数≥5天+累计跌幅>10%时，自动切换至专用框架，包含：①反弹概率归零（不预测反弹）②支撑位无效（不参考整数关口）③催化权重归零（产业催化和事件催化均失效）④恐慌非线性加速模型。\n2. **周一预测增加「周末消化方向确认」步骤：** 在每个周一预测前，强制回答：①上周五收盘后市场情绪方向？②周末48小时消化后情绪方向？③如果方向相反，使用悲观方向作为基准。\n3. **P2-2多因子模型从「线性叠加」升级为「非线性加速」：** 当因子数量≥4时，冲击系数从+30%升级为+50-80%。当连跌天数≥7天时，额外叠加+30%临界加速系数。\n4. **区分「缩量出清」和「缩量暴风雨前平静」：** 增加判断条件：当连跌天数≥7天+跌停家数≥30+炸板率>30%时，缩量≠出清尾声，而是流动性枯竭的预警信号。\n5. **置信度引入「场景风险系数」：** 当预测场景包含\"九连跌\"类型的极端场景时，置信度自动下调15-20pp。事件周下调10-15pp，连续暴跌周下调20-25pp。\n6. **1周预测增加「极端情景」作为独立预测项：** 不将极端情景作为低概率追加，而是将其作为独立预测项，给出概率、区间和触发条件。\n\n### 累计统计（更新至第7周）\n\n| 指标 | 数值 | 变化 |\n|------|------|------|\n| 总验证批次 | 35 | +10 |\n| ✅ 修正改善 | 179 | +52 |\n| 🟡 修正无效 | 61 | +18 |\n| ❌ 修正恶化 | 29 | +12 |\n| 🆕 新增模式 | 20 | +6 |\n| **修正有效率** | **66.5%** | -1.4pp |\n\n\n| 7/21（午间复盘） | P0-2/P0-3/P1-2/P1-7/P1-9/P2-2/P2-5/P2-7/P2-15 | 9条修正：0✅/3🟡/6❌（0%）。核心根因：7/20护盘首日风格假信号（P1-10）导致早间预测系统性偏向防御/蓝筹，9条修正中有6条朝错误方向调整。P1-10单日虹吸被误读为风格切换，修正有效率0%为体系运行以来最低。新增P1-10（护盘首日风格假信号） |\n| 7/21（收盘确认） | P0-2/P0-3/P1-2/P1-7/P1-9/P2-2/P2-5/P2-7/P2-15 | 全天二次确认：0✅/3🟡/6❌（0%），与午间完全一致。P1-10全天验证强化（科创50+10.73%/创业板+7.05% vs 上证50仅+2.39%）。P0-3需新增子规则：连续暴跌≥9天→反弹加成上调至+30%~+50%。P1-9需新增阈值：连续暴跌≥7天→恐慌惯性自动失效。全天修正有效率0%创历史新低 |\n| 7/22（午间复盘） | P0-1/P0-3/P1-8/P1-9/P1-10/P2-7 | 6条修正：5✅/1🟡/0❌（100%，5/5已确认项）。P1-8利好出尽精确命中科创50开盘-1.49%（修正区间-1~-2%内）。P1-9恐慌惯性自动失效连续第2日验证（半导体+5.23%）。P1-10风格假信号修正后 8/31偏差修正奏效：** \"产业趋势降权70%→40%\"\"利好出尽60-70%\"\"利空冲击×2.0-3.0\"三条修正精准预判科技回调，是本周改善的根因。\n\n#### 📉 本周预测不足\n\n1. **科技指数区间下沿被击穿：** 科创50（1580→1577.36）、创业板（3300→3286.55）双双破位，\"震荡偏弱\"被错误平铺到无护盘的科技指数。\n2. **周一V形反转被误读为趋势转强：** 8/31收红+0.86%导致9/1错误转多，追涨被杀，滚动预测前两日方向全错。\n3. **9/3指数标签错误：** 沪深300水平（4500-4580）误标为上证指数。\n4. **9/4午间修正14.3%为本月最低：** 六条偏空修正集体失效，D+21获利了结被高估为一轮调整起点。\n\n#### 🔑 关键教训\n\n1. **指数分层是当前最核心短板：** 上证（银行护盘+3.79%）跌幅温和-0.56%，科创50（无护盘）大跌-5.10%，两者幅度相差近10倍，必须分层预测。\n2. **8/31修正机制在反弹D+18以上有效：** 偏差经验库的修正方向正确，问题在科技幅度的定量刻度。\n3. **周一V形反转是\"诱多陷阱\"而非\"趋势转强\"：** D+15以上周一收红+科技V形翻红应触发P1-41\"诱多\"预警。\n4. **行业判断已找到D+18阶段的正确映射：** \"防御（银行/食品饮料）>科技（半导体/AI）\"本周100%兑现。\n\n#### 🔧 优先改进项\n\n1. **【紧急】建立指数分层预测框架** —— 上证（权重护盘）vs 科创50/创业板（无护盘）分开给方向+幅度\n2. **【紧急】科技指数获利了结期下沿下移** —— 科创50下沿1580→1500-1520档\n3. **【紧急】P1-41周一V形反转诱多预警** —— 降低滚动预测首日方向错误\n4. **【重要】指数标签一致性校验（P1-39）** —— 消除沪深300/上证混淆\n5. **【重要】行业资金流向+炸板率纳入复盘固定字段** —— 强化风险行业验证\n6. **【建议】固化\"防御>科技\"D+18阶段行业映射表** —— 维持行业判断改善势头\n\n#### 本周统计\n\n| 指标 | 数值 | vs 第15周 |\n|------|:----:|:--------:|\n| 总预测项 | 7项 | 持平 |\n| ✅ 完全正确 | 5项（71.4%） | +57.1pp |\n| 🟡 部分正确 | 2项（28.6%） | 持平 |\n| ❌ 错误 | 0项（0%） | -57.1pp |\n| **正确率（✅）** | **71.4%** | **+57.1pp** |\n| **可用率（✅+🟡）** | **100%** | **+57.1pp** |\n| **错误率（❌）** | **0%** | **-57.1pp** |\n\n#### 十六周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | W12 | W13 | W14 | W15 | **W16** | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 57.1% | 33.3% | 28.6% | 40.0% | 36.4% | 58.3% | 37.5% | 14.3% | **71.4%** | 📈 新高 |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 85.7% | 33.3% | 42.9% | 60.0% | 100% | 83.3% | 62.5% | 42.9% | **100%** | 📈 新高 |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 14.3% | 66.7% | 57.1% | 33.3% | 0% | 8.3% | 37.5% | 57.1% | **0%** | 📉 新低 |\n\n#### 本周新增偏差模式\n\n| 编号 | 模式名称 | 核心内容 |\n|:----:|------|------|\n| P2-26 | 权重护盘指数分层 | 上证（ 放大类修正（P1-19/P2-2/P2-7）本期最大收益**：正确放大了D+28高位+CPI+FOMC+美股三连跌的共振下行，避免低估暴跌。\n- 🔴 **\"防御占优\"类修正（P1-2/P0-2）方向性错误**：系统性降仓期防御板块也补跌，仅\"相对抗跌\"而非\"领涨/托底\"——早间据此锚定\"上证窄幅震荡\"是最大失误。\n- 🟡 **P1-26 幅度严重不足**：极端低位反弹修正至35-45%仍远高于实际6.29%，需将极端低位反弹阈值进一步下调至<15%。\n- 🆕 **新增认知「防御护盘失效」**：D+28高位+事件日共振时，\"防御护盘托底\"假设应降级为\"防御相对抗跌\"，不可作为上证窄幅震荡锚（对应P2-45）。\n\n---\n\n### 第17周（9/7-9/11）复盘摘要\n\n> 📅 生成时间：2026-09-14 07:30 CST\n\n#### 📈 本周预测亮点\n\n1. **AI算力/通信+5.63%精准领涨**：月度层机会行业最强项，P0-2产业趋势（光模块/通信）再次验证，全周唯一大幅跑赢方向（vs 上证-1.07%）。\n2. **偏空情景（25%）区间命中**：三情景中偏空3830-3920区间精准命中周收盘3888.11，方向框架覆盖能力仍在。\n3. **利空放大类修正（P1-19/P2-2/P2-7）周五精确兑现**：放量崩跌-1.18%被提前放大预测，9/10修正有效率85.7%为本周最佳。\n4. **高估值科技风险警示准确**：科创50-1.52%、半导体-1.64%均跑输上证。\n\n#### 📉 本周预测不足\n\n1. **1周预测格式回归（最严重）**：结构化模板退化为三情景，丢失科创50/创业板区间、机会/风险行业、证伪条件4字段，复盘降级为2项核心可验+2项月度层快照。\n2. **核心情景概率分配失当**：40%给\"偏弱震荡\"，实际\"偏空下行\"(25%)兑现，连续3周高位低估破位概率。\n3. **宽度领先信号被忽视**：上涨占比从53%一路恶化到6.29%，是周五破位最强领先信号，全程未触发偏空概率上调。\n4. **\"政策托底/防御护盘\"假设连续2周失效**：H2（3900支撑）失效、H5（权重护盘）先成后失。\n\n#### 🔑 关键教训\n\n1. **格式是预测质量的载体**：W16的71.4%靠结构化模板（指数分层+行业+证伪）拉动；三情景模板只要求给上证方向，质量随之崩解。周五必须恢复结构化1周模板。\n2. **\"偏弱震荡\"是高位陷阱词**：W15(14.3%)/W17(0%)都在D+24+把\"偏弱震荡\"设最高概率后被打脸。高位\"偏弱震荡\"默认概率砍至≤25%，让位\"偏空下行\"。\n3. **宽度比指数更早揭示真相**：上涨占比持续恶化比上证点位早3天预警破位，1周预测输入必须纳入宽度序列。\n4. **防御≠护盘、宽松≠托底**：防御在恐慌期只\"抗跌\"不\"托底\"，流动性在技术高位只\"缓冲\"不\"反转\"，两者必须降级。\n\n#### 🔧 优先改进项\n\n1. **【紧急】恢复结构化1周预测模板** —— 指数分层+行业+证伪条件\n2. **【紧急】高位\"偏空下行\"概率下限≥30%，\"偏弱震荡\"砍至≤25%**\n3. **【紧急】宽度（上涨占比）纳入1周预测输入，\"<35%连续2日\"强制触发偏空**\n4. **【紧急】\"防御护盘/政策托底\"降级为\"相对抗跌/缓冲垫\"**\n5. **【重要】出口链ETF标准化对标** —— 补齐风险行业验证空白\n6. **【重要】证伪条件回归1周层，双向阈值**\n\n#### 本周统计\n\n| 指标 | 数值 | vs 第16周 |\n|------|:----:|:--------:|\n| 可评分预测项 | 4项 | -3项（格式回归） |\n| ✅ 完全正确 | 0项（0%） | -71.4pp |\n| 🟡 部分正确 | 4项（100%） | +71.4pp |\n| ❌ 错误 | 0项（0%） | 持平 |\n| **正确率（✅）** | **0%** | **-71.4pp** |\n| **可用率（✅+🟡）** | **100%** | 持平 |\n| **错误率（❌）** | **0%** | 持平 |\n\n> 注：4项全部\"部分正确\"——无完全正确、无完全错误。核心问题是概率校准失当（40%给偏弱震荡）+格式回归（丢失分层与证伪），而非方向全错。\n\n#### 十七周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | W8 | W9 | W10 | W11 | 重 65% | 半导体短期回吐、汽车/医药接力，趋势未破坏 | 🟡 |\n| P1-19 反弹高位利空放大 | 利空 ×1.5-2.0 | A股仅 -0.36%，利空未放大 | ❌ |\n| P1-16 反弹D+3宽度恶化 | 追高降权 | 20日新高/新低比 13.6%→37.1% 反而修复 | ❌ |\n\n**9/17 午间修正有效率：62.5%（5✅/1🟡/2❌）——较 9/16 的 14.3% 大幅改善，获利了结类修正首次全面兑现。**\n\n**核心结论：** 早间在\"鹰派点阵图 + 美股跳水 + 科技抢跑后回吐\"背景下，核心情景一（低开消化鹰派、科技回吐、区间 3850-3900）命中。**获利了结类修正（P1-31/P1-8）、利好出尽（P2-17）、技术博弈（P2-5）、外盘传导（P0-1）全部有效**，是连续多日来\"抢跑回吐\"逻辑首次正确兑现，验证\"9/16 抢跑 → 9/17 落地后 D+1 回吐\"节奏判断。反向项：P1-19 利空未放大（自主定价缓冲）、P1-16 宽度未恶化（新高/新低比反而修复，属\"跌指数修结构\"）。**关键认知更新：高位科技回吐的当日，20 日新高/新低比从 13.6% 修复至 37.1%——单日回吐 ≠ 趋势破坏，与 9/16\"单日普涨 ≠ 趋势反转\"形成镜像，两条共同指向\"用 20 日宽度而非单日涨跌判断趋势\"。**\n\n---\n\n## 🧪 偏差修正效果追踪 — 2026-09-18 午间复盘\n\n| 规则 | 修正措施 | 上午实际 | 判定 |\n|------|----------|----------|:----:|\n| P0-1/P1-1 外盘传导 | 传导系数 0.2-0.3 | 美10Y回落 + A股强反弹，传导未放大 | ✅ |\n| P1-8 利好出尽 | 9/24前\"买预期\" | 降税买预期确实升温 | ✅ |\n| P0-2 产业趋势>宏观 | 权重 65%→55% 降权 | 半导体 +236亿 V型反转，产业趋势重启 | ❌ |\n| P1-31 获利了结错位 | 已兑现一轮、后续压力 30-40% | 半导体二次回吐未发生，反而回流 | ❌ |\n| P1-19 反弹高位利空放大 | 利空冲击 ×1.5-2.0 | 利空未放大，反而普涨修复 | ❌ |\n| P2-4/P2-7 周五+节前效应 | 缩量谨慎、避险 +15-20% | 放量上涨、无避险 | ❌ |\n| P2-5 技术博弈 | 3860/3840支撑、3900压力 | 直接收复3900至3916，3900压力失效 | 🟡 |\n\n**9/18 午间修正有效率：28.6%（2✅/1🟡/4❌）——恐慌类修正连续第 5 日反向，产业趋势类降权是本次最大误判。**\n\n**核心结论：** 早间核心情景一「回吐余震」完全落空，实际是情景二「修复反弹」的加速兑现。最大系统性偏差：高盛产业逻辑 + 国内极宽松 + 美 10Y 回落三重背景下，早间仍系统性高估「回吐/避险持续性」，与 9/16「恐慌类修正连续反向」如出一辙。**P0-2 产业趋势降权（65%→55%）是本轮最致命误判——半导体 V 型反转证明「单日回吐 ≠ 趋势破坏」，产业趋势权重应恢复至 60-65% 而非降权。** 与 9/16、9/17 的教训形成闭环：**当产业趋势主线（半导体/科技）出现单日回吐时，应视为「获利了结错位」而非「趋势反转」，产业趋势权重不应降权，反而应在「回吐止血 + 20 日宽度修复」确认后恢复高权重。**\n\n---\n\n## 🧪 偏差修正效果追踪 — 2026-09-18 收盘复盘（全天二次确认）\n\n| 规则 | 修正措施 | 全天实际 | 判定 |\n|------|----------|----------|:----:|\n| P0-1/P1-1 外盘传导 | 传导系数 0.2-0.3 | 美10Y回落 + 全天普涨，传导未放大 | ✅ |\n| P1-8 利好出尽 | 9/24前\"买预期\" | 降税买预期全天兑现 | ✅ |\n| P0-2 产业趋势>宏观 | 权重 65%→55% 降权 | 半导体 +226.60亿 V型反转，产业趋势全天重启 | ❌ |\n| P1-31 获利了结错位 | 已兑现一轮、后续压力 30-40% | 半导体二次回吐未发生，反而全线回流 | ❌ |\n| P1-19 反弹高位利空放大 | 利空冲击 ×1.5-2.0 | 利空未放大，反而全天普涨修复 | ❌ |\n| P2-4/P2-7 周五+节前效应 | 缩量谨慎、避险 +15-20% | 放量上涨、无避险 | ❌ |\n| P2-5 技术博弈 | 3860/384
