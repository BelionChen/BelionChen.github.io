let currentYear, currentMonth;
let selectedDate = null;
let currentTab = 'daily'; // 'daily' | 'monthly'
let selectedWeeklyMonth = null;

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ── Helper: get all daily dates ──
function getDates() {
  const dates = new Set();
  Object.keys(BRIEFING_DATA).forEach(d => dates.add(d));
  Object.keys(REVIEW_DATA).forEach(d => dates.add(d));
  return [...dates].sort();
}

// ── Helper: month string ──
function monthStr(y, m) { return y + '-' + String(m+1).padStart(2,'0'); }

// ── Calendar ──
function renderCalendar() {
  $('#monthTitle').textContent = `${currentYear}年${currentMonth+1}月`;
  const grid = $('#daysGrid'); grid.innerHTML = '';
  const dates = getDates(); const datesSet = new Set(dates);
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for (let i = 0; i < firstDay; i++) { const el = document.createElement('div'); el.className='day empty'; grid.appendChild(el); }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div'); el.className = 'day'; el.textContent = d;
    if (dateStr === todayStr) el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');
    if (datesSet.has(dateStr)) el.classList.add('has-data');
    el.addEventListener('click', () => { selectDate(dateStr, dates); switchTab('daily'); });
    grid.appendChild(el);
  }
  // Update weekly list when calendar month changes
  updateWeeklyList();
}

// ── Select daily date ──
function selectDate(dateStr, dates) {
  selectedDate = dateStr;
  renderCalendar();
  $('#dateSummary').style.display = 'block';
  $('#selectedDateText').textContent = dateStr;
  const d = new Date(dateStr + 'T00:00:00+08:00');
  $('#selectedWeekday').textContent = WEEKDAYS[d.getDay()];
  renderDailyContent(dateStr);
}

function renderDailyContent(dateStr) {
  const area = $('#contentArea');
  const briefing = BRIEFING_DATA[dateStr] || null;
  const review = REVIEW_DATA[dateStr] || null;
  if (!briefing && !review) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${dateStr} 暂无简报与复盘数据</p></div>`;
    return;
  }
  let html = '<div class="cards">';
  if (briefing) {
    html += `<div class="card open" data-card="briefing">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">🌅</span><span>早间简报 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(briefing)}</div></div>
    </div>`;
  }
  if (review) {
    html += `<div class="card" data-card="review">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">📊</span><span>午间复盘 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(review)}</div></div>
    </div>`;
  }
  html += '</div>';
  area.innerHTML = html;
}

// ── Weekly List (left side) ──
function updateWeeklyList() {
  const m = monthStr(currentYear, currentMonth);
  const weeks = WEEKLY_DATA[m] || [];
  const list = $('#weeklyList'); list.innerHTML = '';
  const count = $('#weeklyCount');
  count.textContent = weeks.length > 0 ? weeks.length + '篇' : '';

  if (weeks.length === 0) {
    const el = document.createElement('li');
    el.className = 'weekly-item';
    el.style.cursor = 'default'; el.style.color = 'var(--text-dim)';
    el.innerHTML = '<span>暂无周复盘</span>';
    list.appendChild(el);
    return;
  }

  weeks.forEach((w, idx) => {
    // Extract week number from content
    const titleMatch = w.content.match(/# 📊 .*?第([一二三四五六七八九十\d]+)周/);
    const title = titleMatch ? '第' + titleMatch[1] + '周' : '周复盘 ' + (idx+1);
    // Extract date range
    const rangeMatch = w.content.match(/(\d{1,2}\/\d{1,2})\s*[~-]\s*(\d{1,2}\/\d{1,2})/);
    const label = rangeMatch ? (rangeMatch[1] + '-' + rangeMatch[2]) : '';
    const li = document.createElement('li');
    li.className = 'weekly-item';
    li.innerHTML = `<span class="dot"></span><span>${title}</span>${label ? '<span class="label">'+label+'</span>' : ''}`;
    li.addEventListener('click', () => {
      $$('.weekly-item').forEach(e => e.classList.remove('active'));
      li.classList.add('active');
      showWeeklyContent(w.content, title);
    });
    list.appendChild(li);
  });
}

function toggleWeeklyPanel() {
  $('#weeklyPanel').classList.toggle('open');
}

// ── Show Weekly Content (switches to daily tab) ──
function showWeeklyContent(content, title) {
  switchTab('daily');
  const area = $('#contentArea');
  const html = `<div class="cards">
    <div class="card open">
      <div class="card-header">
        <div class="card-title"><span class="card-icon">📋</span><span>${title}</span></div>
      </div>
      <div class="card-body" style="max-height:none">
        <div class="card-content">${marked.parse(content)}</div>
      </div>
    </div>
  </div>`;
  area.innerHTML = html;
  selectedDate = null;
  renderCalendar();
  $('#dateSummary').style.display = 'none';
}

// ── Monthly Content ──
function renderMonthlyContent() {
  const area = $('#contentArea');
  const m = monthStr(currentYear, currentMonth);

  // Try monthly data first, then fall back to tracking data
  let content = MONTHLY_DATA[m] || null;
  if (!content) {
    // Extract the month's section from tracking data
    const monthLabel = currentYear + '年' + (currentMonth+1) + '月';
    const idx = TRACKING_DATA.indexOf('### ' + monthLabel);
    if (idx !== -1) {
      // Find next section or end
      const nextIdx = TRACKING_DATA.indexOf('### ', idx + 3);
      content = TRACKING_DATA.substring(idx, nextIdx !== -1 ? nextIdx : undefined);
    }
  }
  if (!content) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${m} 暂无月复盘数据</p></div>`;
    return;
  }
  area.innerHTML = `<div class="monthly-content">${marked.parse(content)}</div>`;
}

// ── Tab Switching ──
function switchTab(tab) {
  currentTab = tab;
  $$('.content-tab').forEach(t => t.classList.toggle('active', t.id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1)));
  if (tab === 'daily') {
    if (selectedDate) renderDailyContent(selectedDate);
    else {
      $('#contentArea').innerHTML = `<div class="placeholder"><div class="icon">📅</div><p>在日历中选择一个日期<br>查看当天的早间简报与午间复盘</p></div>`;
    }
  } else if (tab === 'monthly') {
    renderMonthlyContent();
  }
}

// ── Navigation ──
$('#prevMonth').addEventListener('click', () => {
  currentMonth--; if (currentMonth < 0) { currentMonth=11; currentYear--; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});
$('#nextMonth').addEventListener('click', () => {
  currentMonth++; if (currentMonth > 11) { currentMonth=0; currentYear++; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (currentTab !== 'daily' || !selectedDate) return;
  const dates = getDates(); const idx = dates.indexOf(selectedDate);
  if (e.key === 'ArrowLeft' && idx > 0) { selectDate(dates[idx-1], dates); }
  else if (e.key === 'ArrowRight' && idx < dates.length-1) { selectDate(dates[idx+1], dates); }
});

// ── Init ──
const now = new Date();
currentYear = now.getFullYear();
currentMonth = now.getMonth();
const dates = getDates();
const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
if (dates.includes(todayStr)) selectedDate = todayStr;
renderCalendar();
if (selectedDate) selectDate(selectedDate, dates);
</script>
