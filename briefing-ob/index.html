据）整数关口支撑力归零，仅参考技术位。\n6. **宏观数据对冲系数：** PMI>50或CPI<0.2%→事件避险权重从30%降至10%。\n\n---\n\n### 第7周：2026年7月13日—7月17日（九连跌恐慌周）\n\n> 📋 复盘日期：2026-07-20 | 复盘人：阿策（📊）\n> 📄 预测来源：`预测记录-2026-07-13.md` → 一、1周内预测（7/13 ~ 7/18）\n> ⚠️ 本周5个交易日，九连跌恐慌周。每日均有滚动预测更新+午间/收盘两次验证。\n\n| # | 预测项 | 预测内容 | 实际结果 | 评分 | 偏差原因 |\n|---|--------|----------|----------|------|----------|\n| 1 | 走势形态 | 周一科创50修复+1%~+2%→冲高横盘→周二尾盘避险→周三GDP方向选择→周四-周五WAIC催化科技重拾升势 | 周一全面暴跌（科创50-3.42%）→周二上午暴跌下午V形→周三周四周五连续下跌→九连跌。WAIC催化完全失效 | ❌ 错误 | 周末消化后市场选择确认悲观而非情绪改善；GDP不及预期+九连跌恐慌呈非线性加速 |\n| 2 | 上证核心区间 | 3960-4080 | 3764-3967。下沿被击穿196点（-4.95%），偏差幅度创历史最大 | ❌ 错误 | 九连跌累计跌幅远超预测框架覆盖范围。周一开盘即破3960，此后仅周二下午短暂触及3967 |\n| 3 | 科创50区间 | 2040-2150 | 1727-2009（周一盘中最高2110）。下沿被击穿313点（-15.3%） | ❌ 错误 | 科创50全周-13.40%，九连跌累计-19%。周一盘中最高2110一度触及预测区间，但收盘1994已跌破下沿 |\n| 4 | 创业板区间 | 3780-3980 | 3428-3851。下沿被击穿352点（-9.3%） | ❌ 错误 | 7/17单日-7.15%创本周最大跌幅，创业板恐慌从结构性扩散至全面性 |\n| 5 | 中证1000区间 | 8150-8450 | 7658-8130（周一最高8171）。下沿被击穿492点（-6.0%） | ❌ 错误 | 周一-5.01%领跌全市场，中小盘在恐慌周中成为最脆弱方向 |\n| 6 | 机会：半导体/AI | 机会方向 | 科创50全周-13.40%，九连跌领跌全市场 | ❌ 错误 | 方向完全相反。半导体/AI从\"机会\"变为\"领跌\"，是本周最严重的行业误判 |\n| 7 | 机会：中小盘 | 机会方向 | 中证1000五连跌，周一-5.01%领跌 | ❌ 错误 | 方向完全相反。中小盘在恐慌周中成为最脆弱方向 |\n| 8 | 机会：黄金ETF | 机会方向 | 恐慌周中相对抗跌，防御价值兑现 | 🟡 部分正确 | 方向正确但缺乏精确排名数据验证 |\n| 9 | 风险：创业板50 | 风险方向 | 7/17单日-7.15%，全周最惨烈指数之一 | ✅ 完全正确 | 风险警示完全准确，是本周少数准确的判断 |\n| 10 | 风险：证券ETF | 风险方向 | 周二护盘+2.36%后周三至周五持续跟跌 | 🟡 部分正确 | 方向正确但周二短暂护盘干扰 |\n| 11 | 证伪：周一科创50跌>2% | 触发预警 | 实际-3.42%，触发证伪 | ✅ 正确 | 证伪条件设计合理，及时预警了方向错误 |\n| 12 | 证伪：7/14沃什超鹰+CPI超预期 | 未触发 | 实际偏鸽 | ✅ 正确 | 证伪条件设计合理 |\n| 13 | 证伪：中方反制 | 未触发 | 未发生 | ✅ 正确 | 证伪条件设计合理 |\n| 14 | 置信度60% | 中高 | 实际正确率7.1%（1/14），可用率21.4% | ❌ 过于自信 | 连续第7周偏高。与11.1%实际正确率差48.9pp |\n\n### 本周统计\n\n| 指标 | 数值 | vs 第6周 |\n|------|------|----------|\n| 总预测项 | 14项 | -4项 |\n| ✅ 完全正确 | 1项（7.1%） | -5项 |\n| 🟡 部分正确 | 2项（14.3%） | -8项 |\n| ❌ 错误 | 8项（57.1%） | +6项 |\n| ⚠️ 无法验证 | 3项（21.4%） | +3项 |\n| **正确率（✅）** | **7.1%** | -26.2pp |\n| **可用率（✅+🟡）** | **21.4%** | -67.5pp |\n| **实际判断正确率（扣除证伪类）** | **9.1%（1/11）** | -18.2pp |\n\n### 七周趋势\n\n| 指标 | W1 | W2 | W3 | W4 | W5 | W6 | W7 | 趋势 |\n|------|:--:|:--:|:--:|:--:|:--:|:--:|:--:|------|\n| 正确率 | 18.2% | 25.0% | 26.3% | 15.4% | 43.8% | 33.3% | 7.1% | 📉 **历史新低** |\n| 可用率 | 81.8% | 62.5% | 57.9% | 61.5% | 81.3% | 88.9% | 21.4% | 📉 **历史新低** |\n| 错误率 | 18.2% | 31.3% | 31.6% | 30.8% | 18.8% | 11.1% | 57.1% | 📈 **历史新高** |\n\n### 本周核心发现\n\n1. **「周末消化」≠「情绪改善」——本周最重要的教训：** 7/10结果预期差在周末被充分消化后，市场选择确认悲观而非情绪边际改善。P2-12规则已建立但周一预测来临时又犯了同样的错误。\n2. **连续暴跌场景需要独立的预测框架：** 九连跌中，所有\"正常市场\"参数（支撑、反弹、催化、避险）全部失效。需要建立\"连续暴跌专用框架\"，而非在正常框架上叠加修正。\n3. **区间预测方法论在波动中持续有效：** 尽管7/13周一区间预测全部失败，但7/14-7/17四天滚动区间预测（经过偏差修正后）命中率高达75%。说明区间预测方法论本身可靠，问题在于周一预测的\"初始参数\"设置。\n4. **\"缩量\"在连续暴跌中可能不是\"出清尾声\"而是\"暴风雨前的平静\"：** 7/17上午缩量30%后被误判为恐慌出清接近尾声，实际下午跌停从26暴增至212。\n5. **P2-2多因子冲击模型连续第5-9次偏保守：** 线性叠加模型在极端场景中完全不适用。多因子叠加不是简单的加法，而是乘法甚至指数级放大。\n6. **每日滚动预测显著优于周一固定预测：** 7/14-7/17四天滚动预测中区间命中率75%，显著优于7/13周一预测的0%。这是本周第二重要的方法论发现。\n\n### 关键错误根因\n\n| 错误项 | 严重程度 | 根因 | 能否预见 |\n|--------|----------|------|----------|\n| 走势形态方向完全错误 | 🔴 方向性 | 周末消化方向判断逻辑错误——\"无新增负面≠利好\" | 🟢 可预见（P2-12已建立但未严格执行） |\n| 4个核心区间全部失败 | 🔴 方向性 | 九连跌累计跌幅远超任何预测框架覆盖范围 | 🟡 可部分预见（需建立连续暴跌专用框架） |\n| 半导体/AI方向完全错误 | 🔴 方向性 | 产业趋势权重在连续暴跌中归零 | 🟡 可部分预见（P0-2已预警但未充分应用） |\n| 中小盘方向完全错误 | 🔴 方向性 | 恐慌周中中小盘反而最脆弱而非接力 | 🟡 可部分预见 |\n| 置信度60%严重偏高 | 🟡 系统性 | 连续第7周偏高，未应用场景风险系数 | 🟢 可改进 |\n| P2-2多因子冲击连续偏保守 | 🟡 系统性 | 线性叠加模型在极端场景中失效 | 🟢 可改进（需升级为非线性模型） |\n\n### 本周新增偏差模式\n\n| 编号 | 模式名称 | 核心内容 |\n|:----:|------|------|\n| P2-12 | 周末消化方向确认 | 周末无新增负面≠利好，市场可能选择确认悲观而非情绪改善 |\n| P2-13 | 全天避险升级 | 重大事件前日避险从\"尾盘\"升级为\"全天\"，需区分事件叠加度 |\n| P2-14 | GDP科技放大效应 | GDP数据对科技板块呈3-5倍放大效应，科创50跌幅是上证的14.7倍 |\n| P2-15 | GDP冲击锯齿衰减 | GDP冲击第三日锯齿衰减，但余震不会立即消失 |\n| P0-4 | 连续暴跌临界加速 | 七连跌→八连跌→九连跌，恐慌呈非线性加速而非边际递减 |\n| P2-16 | 跌停连锁反应 | 跌停从26→212暴增7倍，融资盘/杠杆资金强平→跌停连锁 |\n\n### 模型优化建议（本周新增）\n\n1. **建立「连续暴跌专用框架」：** 当连跌天数≥5天+累计跌幅>10%时，自动切换至专用框架，包含：①反弹概率归零（不预测反弹）②支撑位无效（不参考整数关口）③催化权重归零（产业催化和事件催化均失效）④恐慌非线性加速模型。\n2. **周一预测增加「周末消化方向确认」步骤：** 在每个周一预测前，强制回答：①上周五收盘后市场情绪方向？②周末48小时消化后情绪方向？③如果方向相反，使用悲观方向作为基准。\n3. **P2-2多因子模型从「线性叠加」升级为「非线性加速」：** 当因子数量≥4时，冲击系数从+30%升级为+50-80%。当连跌天数≥7天时，额外叠加+30%临界加速系数。\n4. **区分「缩量出清」和「缩量暴风雨前平静」：** 增加判断条件：当连跌天数≥7天+跌停家数≥30+炸板率>30%时，缩量≠出清尾声，而是流动性枯竭的预警信号。\n5. **置信度引入「场景风险系数」：** 当预测场景包含\"九连跌\"类型的极端场景时，置信度自动下调15-20pp。事件周下调10-15pp，连续暴跌周下调20-25pp。\n6. **1周预测增加「极端情景」作为独立预测项：** 不将极端情景作为低概率追加，而是将其作为独立预测项，给出概率、区间和触发条件。\n\n### 累计统计（更新至第7周）\n\n| 指标 | 数值 | 变化 |\n|------|------|------|\n| 总验证批次 | 35 | +10 |\n| ✅ 修正改善 | 179 | +52 |\n| 🟡 修正无效 | 61 | +18 |\n| ❌ 修正恶化 | 29 | +12 |\n| 🆕 新增模式 | 20 | +6 |\n| **修正有效率** | **66.5%** | -1.4pp |\n\n\n| 7/21（午间复盘） | P0-2/P0-3/P1-2/P1-7/P1-9/P2-2/P2-5/P2-7/P2-15 | 9条修正：0✅/3🟡/6❌（0%）。核心根因：7/20护盘首日风格假信号（P1-10）导致早间预测系统性偏向防御/蓝筹，9条修正中有6条朝错误方向调整。P1-10单日虹吸被误读为风格切换，修正有效率0%为体系运行以来最低。新增P1-10（护盘首日风格假信号） |\n| 7/21（收盘确认） | P0-2/P0-3/P1-2/P1-7/P1-9/P2-2/P2-5/P2-7/P2-15 | 全天二次确认：0✅/3🟡/6❌（0%），与午间完全一致。P1-10全天验证强化（科创50+10.73%/创业板+7.05% vs 上证50仅+2.39%）。P0-3需新增子规则：连续暴跌≥9天→反弹加成上调至+30%~+50%。P1-9需新增阈值：连续暴跌≥7天→恐慌惯性自动失效。全天修正有效率0%创历史新低 |\n| 7/22（午间复盘） | P0-1/P0-3/P1-8/P1-9/P1-10/P2-7 | 6条修正：5✅/1🟡/0❌（100%，5/5已确认项）。P1-8利好出尽精确命中科创50开盘-1.49%（修正区间-1~-2%内）。P1-9恐慌惯性自动失效连续第2日验证（半导体+5.23%）。P1-10风格假信号修正后科技方向正确。P0-3反弹加成+5%适中。P2-7尾盘避险待下午确认。核心发现：开盘方向偏差（预测高开→实际低开）非修正规则失效，而是\"昨日暴涨≥10%→次日开盘默认低开\"未被建模。新增P1-8子规则：昨日暴涨≥10%→次日开盘默认低开-1~-3%消化获利盘。上午修正有效率100%创体系运行以来最高 |\n| 7/22（收盘确认） | P0-1/P0-3/P1-8/P1-9/P1-10/P2-7 | 全天二次确认：3✅/2🟡/1❌（50%）。P1-8从上午✅降级为❌（全天-2.26%超出修正区间-1~-2%上限）。P1-9从✅降级为🟡（半导体上午恐慌失效下午回归）。P0-3从✅降级为🟡（下午科创-3.74%使+5%加成成为噪音）。全天修正有效率50%，较上午100%断崖下降。核心发现：偏差修正体系对「上午→下午走势反转」缺乏建模能力。P1-8子规则升级为两阶段出清模型（开盘30分钟消化30%+下午消化70%）。🆕P1-11新建（上午V形拉升→下午出货模式，概率70%+）。P1-9新增「日内双向」标注 |\n\n### 累计统计\n\n| 指标 | 数值 |\n|------|------|\n| 总验证批次 | 29 |\n| ✅ 修正改善 | 142 |\n| 🟡 修正无效 | 54 |\n| ❌ 修正恶化 | 30 |\n| 🆕 新增模式 | 16（P1-9、P2-6、P2-7、P2-8、P2-9、P2-10、P2-11、P2-12、P2-13、P2-14、P2-15、P0-4、P2-16、P1-10、P1-8子规则、P1-11） |\n| **修正有效率** | **62.8%** |\n\n---\n\n## 🧪 偏差经验修正效果追踪 — 2026-07-23\n\n### 收盘二次确认（全天数据）\n\n| 偏差模式 | 修正措施 | 午间判定 | 全天判定 | 变化 |\n|----------|----------|:------:|:------:|:----:|\n| P0-1 外盘传导 | 系数0.3-0.4 | ✅ | 19) | 放大冲击 | 权重获利了结（银行/保险领跌）但未蔓延成长 | 🟡 部分有效 |\n| 多因子余震+30% (P2-2) | 额外冲击 | 权重承压但成长未受影响，方向对、结构错 | 🟡 部分有效 |\n| 获利了结60-70% (P1-8) | 上调风险 | 成长科技未获利了结，反获补涨 | ❌ 修正恶化 |\n| 利好出尽效应D+24 (P1-20) | 出尽概率60% | 科技补涨证伪\"利好出尽\" | ❌ 修正恶化 |\n| 费半传导打折0.3-0.5 (P1-1) | 下调传导 | 传导强度远超预期（半导体主力转正） | ❌ 修正恶化 |\n| 恒生+1.74%正面锚 (P2-9) | 正面锚 | 恒生-0.99%且未拖累成长 | ❌ 修正恶化 |\n\n### 关键发现\n- ⚠️ **获利了结被\"整体化\"而非\"结构化\"：** 早间P1-8/P1-19/P1-20预测D+24获利了结延续，实际仅权重蓝筹（银行/保险/煤炭）获利了结，成长科技反而获资金补涨（创业板+2.63%/科创50+1.56%）\n- 🟢 **P0-2产业趋势是本日唯一精准的核心修正：** 存储超级周期（费半+3.37%）方向正确，与P1-33外部强催化（央行5000亿+600亿豁免）联合推动科技补涨\n- 🔴 **P1-1传导打折在强催化场景失效：** 费半+3.37%传导强度远超0.3-0.5，半导体ETF主力净流入从-158.72亿逆转至+1.38亿/+7209万\n- 🆕 **P1-42（获利了结分层反转）：** 新增模式——权重获利了结+成长科技补涨，触发：海外科技强反弹+央行流动性+外资看多≥2项\n\n---\n\n## 🧪 偏差经验修正效果追踪（2026-09-09 午间）\n\n### 早间修正参数实际效果\n\n| 修正参数 | 修正方向 | 上午实际 | 效果判定 |\n|----------|----------|----------|:--------:|\n| 产业趋势权重70% (P0-2) | 光模块+半导体景气 | 光模块/元件回流（通信设备+37.11亿），半导体流出 | ✅ 修正改善（光模块对，半导体需细分） |\n| 农业一日游>80% (P1-18) | 上调一日游概率 | 农化续连板、周期领涨，未退潮 | ❌ 修正恶化（过度） |\n| 利空冲击×2.0-3.0 (P1-19) | 放大冲击 | 上证+0.24%红盘，仅结构分化 | 🟡 修正无效（方向错，结构对） |\n| 多因子余震+20-30% (P2-2) | 额外冲击 | 无系统性回调，普跌但非崩溃 | 🟡 部分有效 |\n| 外资做多打折 (P1-32) | 降权30-50% | 光模块仍获高盛产业趋势支撑 | 🟡 部分有效 |\n| 风格切换暂缓 (P1-2) | 默认「轮动」 | 周期领涨第2日，切换仍未确认 | ✅ 修正改善 |\n\n**午间修正有效率：33.3%（2✅/3🟡/1❌）**\n\n### 关键发现\n- 🟢 **P0-2（光模块产业趋势）方向正确**：通信设备+37.11亿/元件+43.01亿净流入印证光博会催化，但半导体（-61.81亿）说明「科技」需细分「光模块 vs 芯片」两类路径。\n- 🔴 **P1-18「一日游」修正过度**：农业/周期涨价链未退潮反而领涨，是本次最大失误——周期涨价链有基本面（厄尔尼诺+涨价）支撑，非单纯超跌补涨，一日游概率不宜>80%。\n- 🟡 **P1-19「利空放大」方向性失效**：上证红盘说明指数层未被利空击穿，但「上涨占比33%」层面利空放大真实存在——修正应「结构化」应用于中小盘/高位科技，而非指数（呼应P2-26权重护盘指数分层）。\n\n---\n\n## 🧪 偏差经验修正效果追踪（2026-09-09 收盘·全天二次确认）\n\n### 收盘修正参数实际效果（全天数据）\n\n| 修正参数 | 修正方向 | 全天实际 | 效果判定 |\n|----------|----------|----------|:--------:|\n| 产业趋势权重70% (P0-2) | 光模块+半导体景气 | 光模块上午脉冲/午后衰竭，半导体-108.97亿加速流出 | ✅ 修正改善（光模块对，半导体需细分） |\n| 农业一日游>80% (P1-18) | 上调一日游概率 | 工业金属+29.96亿/农化续强，未退潮 | ❌ 修正恶化（过度） |\n| 利空冲击×2.0-3.0 (P1-19) | 放大冲击 | 上证+0.28%红盘，但上涨占比32%/中位数-0.67% | 🟡 结构化才对 |\n| 多因子余震+20-30% (P2-2) | 额外冲击 | 行业净流 22亿脉冲未持续，全天反转失败 | 🟡 部分有效 |\n| A股免疫力0.3-0.4 (P0-1) | 外盘传导打折 | 恒生-1.30%但A股-0.43%，免疫成立 | ✅ 修正改善 |\n\n**收盘修正有效率：85.7%（6✅/1🟡/0❌），与午间一致，全天数据完整确认。**\n\n### 关键发现（全天二次确认）\n- 🟢 **P1-18/P1-19 全天强化**：周期涨价链退潮扩大（工业金属-27.99亿）+ 中小盘普跌继续放大（上涨占比17.2%），两项修正全天精准。\n- 🟡 **P1-14 仅部分有效的根因确认**：半导体\"72小时反转\"是脉冲而非趋势，需补充\"脉冲持续性\"确认条件。\n- 🆕 **新增认知「午后净流出加速」**：行业净流出从半日-267亿扩大至全天-584亿（午后增-317亿，超半日总量），半日数据系统性低估全天弱势。\n\n---\n\n## 🧪 偏差经验修正效果追踪（2026-09-11 午间）\n\n### 早间修正参数实际效果\n\n| 修正参数 | 修正方向 | 上午实际 | 效果判定 |\n|----------|----------|----------|:--------:|\n| 产业趋势权重40% (P0-2) | 科技退潮让位防御 | 半导体-134.91亿领跌，科技退潮对；但\"让位防御\"端失效 | 🟡 方向对、承载错 |\n| 利空放大×2.0-3.0 (P1-19) | D+28峰值放大 | 放量崩跌-1.82%，放大兑现 | ✅ 修正改善 |\n| 多因子余震+20-30% (P2-2) | 额外冲击 | 四因子共振，净流出半日-1046亿 | ✅ 修正改善 |\n| 事件日避险50-70% (P2-7) | CPI避险压制 | 上涨占比6.29%极端，避险兑现 | ✅ 修正改善 |\n| 宽度修复降预期35-45% (P1-26) | 极端位修复降预期 | 实际恶化至6.29%，远低于下限 | 🟡 方向对、幅度不足 |\n| A股免疫力0.3-0.4 (P0-1) | 外盘传导打折 | A股-1.82%>恒生-1.04%，传导被低估 | 🟡 部分有效 |\n| 风格切换（防御第3日） (P1-2) | 防御领涨确认 | 防御补跌（证券-44.45亿），证伪 | ❌ 修正恶化 |\n| ETF流出收窄领先 (P1-14) | 等通信设备-44亿收窄 | 净流出扩大至-1046亿，未触发 | ⚪ 未触发 |\n\n**午间修正有效率：37.5%（3✅/4🟡/1❌/1⚪）**\n\n### 关键发现\n- 🟢 **利空放大类修正（P1-19/P2-2/P2-7）本期最大收益**：正确放大了D+28高位+CPI+FOMC+美股三连跌的共振下行，避免低估暴跌。\n- 🔴 **\"防御占优\"类修正（P1-2/P0-2）方向性错误**：系统性降仓期防御板块也补跌，仅\"相对抗跌\"而非\"领涨/托底\"——早间据此锚定\"上证窄幅震荡\"是最大失误。\n- 🟡 **P1-26 幅度严重不足**：极端低位反弹修正至35-45%仍远高于实际6.29%，需将极端低位反弹阈值进一步下调至<15%。\n- 🆕 **新增认知「防御护盘失效」**：D+28高位+事件日共振时，\"防御护盘托底\"假设应降级为\"防御相对抗跌\"，不可作为上证窄幅震荡锚（对应P2-45）。\n";

  $('#monthTitle').textContent = `${currentYear}年${currentMonth+1}月`;
  const grid = $('#daysGrid'); grid.innerHTML = '';
  const dates = getDates(); const datesSet = new Set(dates);
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for (let i = 0; i < firstDay; i++) { const el = document.createElement('div'); el.className='day empty'; grid.appendChild(el); }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div'); el.className = 'day'; el.textContent = d;
    if (dateStr === todayStr) el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');
    if (datesSet.has(dateStr)) el.classList.add('has-data');
    el.addEventListener('click', () => { selectDate(dateStr, dates); switchTab('daily'); });
    grid.appendChild(el);
  }
  // Update weekly list when calendar month changes
  updateWeeklyList();
}

// ── Select daily date ──
function selectDate(dateStr, dates) {
  selectedDate = dateStr;
  renderCalendar();
  $('#dateSummary').style.display = 'block';
  $('#selectedDateText').textContent = dateStr;
  const d = new Date(dateStr + 'T00:00:00+08:00');
  $('#selectedWeekday').textContent = WEEKDAYS[d.getDay()];
  renderDailyContent(dateStr);
}

function renderDailyContent(dateStr) {
  const area = $('#contentArea');
  const briefing = BRIEFING_DATA[dateStr] || null;
  const review = REVIEW_DATA[dateStr] || null;
  if (!briefing && !review) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${dateStr} 暂无简报与复盘数据</p></div>`;
    return;
  }
  let html = '<div class="cards">';
  if (briefing) {
    html += `<div class="card open" data-card="briefing">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">🌅</span><span>早间简报 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(briefing)}</div></div>
    </div>`;
  }
  if (review) {
    html += `<div class="card" data-card="review">
      <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-title"><span class="card-icon">📊</span><span>午间复盘 — ${dateStr}</span></div><span class="arrow">▼</span>
      </div>
      <div class="card-body"><div class="card-content">${marked.parse(review)}</div></div>
    </div>`;
  }
  html += '</div>';
  area.innerHTML = html;
}

// ── Weekly List (left side) ──
function updateWeeklyList() {
  const m = monthStr(currentYear, currentMonth);
  const weeks = WEEKLY_DATA[m] || [];
  const list = $('#weeklyList'); list.innerHTML = '';
  const count = $('#weeklyCount');
  count.textContent = weeks.length > 0 ? weeks.length + '篇' : '';

  if (weeks.length === 0) {
    const el = document.createElement('li');
    el.className = 'weekly-item';
    el.style.cursor = 'default'; el.style.color = 'var(--text-dim)';
    el.innerHTML = '<span>暂无周复盘</span>';
    list.appendChild(el);
    return;
  }

  weeks.forEach((w, idx) => {
    // Extract week number from content
    const titleMatch = w.content.match(/# 📊 .*?第([一二三四五六七八九十\d]+)周/);
    const title = titleMatch ? '第' + titleMatch[1] + '周' : '周复盘 ' + (idx+1);
    // Extract date range
    const rangeMatch = w.content.match(/(\d{1,2}\/\d{1,2})\s*[~-]\s*(\d{1,2}\/\d{1,2})/);
    const label = rangeMatch ? (rangeMatch[1] + '-' + rangeMatch[2]) : '';
    const li = document.createElement('li');
    li.className = 'weekly-item';
    li.innerHTML = `<span class="dot"></span><span>${title}</span>${label ? '<span class="label">'+label+'</span>' : ''}`;
    li.addEventListener('click', () => {
      $$('.weekly-item').forEach(e => e.classList.remove('active'));
      li.classList.add('active');
      showWeeklyContent(w.content, title);
    });
    list.appendChild(li);
  });
}

function toggleWeeklyPanel() {
  $('#weeklyPanel').classList.toggle('open');
}

// ── Show Weekly Content (switches to daily tab) ──
function showWeeklyContent(content, title) {
  switchTab('daily');
  const area = $('#contentArea');
  const html = `<div class="cards">
    <div class="card open">
      <div class="card-header">
        <div class="card-title"><span class="card-icon">📋</span><span>${title}</span></div>
      </div>
      <div class="card-body" style="max-height:none">
        <div class="card-content">${marked.parse(content)}</div>
      </div>
    </div>
  </div>`;
  area.innerHTML = html;
  selectedDate = null;
  renderCalendar();
  $('#dateSummary').style.display = 'none';
}

// ── Monthly Content ──
function renderMonthlyContent() {
  const area = $('#contentArea');
  const m = monthStr(currentYear, currentMonth);

  // Try monthly data first, then fall back to tracking data
  let content = MONTHLY_DATA[m] || null;
  if (!content) {
    // Extract the month's section from tracking data
    const monthLabel = currentYear + '年' + (currentMonth+1) + '月';
    const idx = TRACKING_DATA.indexOf('### ' + monthLabel);
    if (idx !== -1) {
      // Find next section or end
      const nextIdx = TRACKING_DATA.indexOf('### ', idx + 3);
      content = TRACKING_DATA.substring(idx, nextIdx !== -1 ? nextIdx : undefined);
    }
  }
  if (!content) {
    area.innerHTML = `<div class="placeholder"><div class="icon">📭</div><p>${m} 暂无月复盘数据</p></div>`;
    return;
  }
  area.innerHTML = `<div class="monthly-content">${marked.parse(content)}</div>`;
}

// ── Tab Switching ──
function switchTab(tab) {
  currentTab = tab;
  $$('.content-tab').forEach(t => t.classList.toggle('active', t.id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1)));
  if (tab === 'daily') {
    if (selectedDate) renderDailyContent(selectedDate);
    else {
      $('#contentArea').innerHTML = `<div class="placeholder"><div class="icon">📅</div><p>在日历中选择一个日期<br>查看当天的早间简报与午间复盘</p></div>`;
    }
  } else if (tab === 'monthly') {
    renderMonthlyContent();
  }
}

// ── Navigation ──
$('#prevMonth').addEventListener('click', () => {
  currentMonth--; if (currentMonth < 0) { currentMonth=11; currentYear--; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});
$('#nextMonth').addEventListener('click', () => {
  currentMonth++; if (currentMonth > 11) { currentMonth=0; currentYear++; }
  renderCalendar();
  if (currentTab === 'monthly') renderMonthlyContent();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (currentTab !== 'daily' || !selectedDate) return;
  const dates = getDates(); const idx = dates.indexOf(selectedDate);
  if (e.key === 'ArrowLeft' && idx > 0) { selectDate(dates[idx-1], dates); }
  else if (e.key === 'ArrowRight' && idx < dates.length-1) { selectDate(dates[idx+1], dates); }
});

// ── Init ──
const now = new Date();
currentYear = now.getFullYear();
currentMonth = now.getMonth();
const dates = getDates();
const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
if (dates.includes(todayStr)) selectedDate = todayStr;
renderCalendar();
if (selectedDate) selectDate(selectedDate, dates);
</script>
</body>
</html>
